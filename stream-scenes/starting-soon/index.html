<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Starting Soon</title>
<style>
  @font-face { font-family: "SG"; src: url("space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "SG"; src: url("space-grotesk-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "UB"; src: url("unbounded-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  :root { --cyan: #35e7ff; --mag: #ff3ea5; --ink: #eef1ff; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; background: #05040f; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  .ov { position: absolute; opacity: 0; will-change: transform, opacity; font-family: "SG", sans-serif; color: var(--ink); }
  #pill { left: 96px; top: 84px; display: flex; align-items: center; gap: 16px; padding: 14px 26px 14px 22px; border-radius: 999px;
          border: 1px solid rgba(255,255,255,.16); background: linear-gradient(90deg, rgba(255,62,165,.16), rgba(53,231,255,.06));
          backdrop-filter: blur(8px); font-weight: 600; font-size: 22px; letter-spacing: .22em; }
  #pill i { width: 12px; height: 12px; border-radius: 50%; background: #ff2f6d; box-shadow: 0 0 18px #ff2f6d; display: block; }
  #brand { right: 96px; top: 92px; font-family: "UB", sans-serif; font-size: 22px; letter-spacing: .28em; text-align: right; }
  #brand b { color: var(--cyan); font-weight: 700; }
  #tag { left: 0; right: 0; top: 958px; display: flex; justify-content: center; align-items: center; gap: 34px;
         font-weight: 500; font-size: 26px; letter-spacing: .5em; text-indent: .5em; }
  #tag span.l { height: 1px; width: 160px; background: linear-gradient(90deg, transparent, var(--cyan)); transform-origin: right; }
  #tag span.r { height: 1px; width: 160px; background: linear-gradient(90deg, var(--mag), transparent); transform-origin: left; }
  .cn { position: absolute; width: 54px; height: 54px; opacity: 0; border-color: rgba(238,241,255,.55); border-style: solid; border-width: 0; }
  .cn.tl { left: 48px; top: 40px; border-left-width: 2px; border-top-width: 2px; }
  .cn.tr { right: 48px; top: 40px; border-right-width: 2px; border-top-width: 2px; }
  .cn.bl { left: 48px; bottom: 40px; border-left-width: 2px; border-bottom-width: 2px; }
  .cn.br { right: 48px; bottom: 40px; border-right-width: 2px; border-bottom-width: 2px; }
  #fallback { position: absolute; inset: 0; display: none; place-items: center; font-family: "UB", sans-serif; font-size: 96px;
              color: var(--ink); text-align: center; background: radial-gradient(circle at 50% 45%, #1d1150, #05040f 70%); }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage">
  <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  <div id="pill" class="ov"><i></i>LIVE IN A MOMENT</div>
  <div id="brand" class="ov">AYMN<b>GAMES</b>.ONLINE</div>
  <div id="tag" class="ov"><span class="l"></span>THE GAMES ARE ABOUT TO BEGIN<span class="r"></span></div>
  <div id="fallback">STREAM<br>STARTING SOON</div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
