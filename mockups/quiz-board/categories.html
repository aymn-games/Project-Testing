<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--a:#7c3aed;--a2:#00c2ff;--pink:#ff4dff;--gold:#ffc83d;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;font-family:Cairo,sans-serif;color:#fff;direction:rtl;
background:radial-gradient(900px 500px at 80% -10%,rgba(124,58,237,.45),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(0,194,255,.25),transparent 60%),linear-gradient(160deg,#0b0820,#1c1240)}
.screen{display:none;width:100%;height:100%;padding:24px 30px;flex-direction:column;gap:16px}.screen.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:30px}.logo span{background:linear-gradient(90deg,var(--a2),var(--pink));-webkit-background-clip:text;color:transparent}
.h{font-weight:900;font-size:26px}.sub{opacity:.7;font-size:15px}
/* card */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1}
.big.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.35),0 0 34px rgba(255,200,61,.3)}
.big .badge{position:absolute;top:12px;left:12px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#2a1a00;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.big:not(.sel){filter:saturate(.75) brightness(.8)}
.big:not(.sel) .badge{display:none}
.card{position:relative;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#120c2a;
 border:2px solid rgba(255,255,255,.10);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.card .art{flex:1;position:relative}
.card .art{overflow:hidden}.card .art svg{overflow:visible;position:absolute;inset:0;width:100%;height:100%}
.card .meta{padding:12px 12px 14px;text-align:center;background:linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.35));border-top:1px solid rgba(255,255,255,.08)}
.card .t{font-weight:900;font-size:20px;line-height:1.3}
.card .n{font-size:13px;opacity:.65;font-weight:600}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.35),0 14px 34px rgba(255,200,61,.25)}
.card .badge{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#2a1a00;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card:not(.sel) .badge{display:none}
.card.dim{filter:saturate(.5) brightness(.75)}
.bar{display:flex;justify-content:space-between;align-items:center}
.btn{background:linear-gradient(90deg,var(--a),var(--pink));border-radius:14px;padding:12px 38px;font-weight:900;font-size:20px;box-shadow:0 8px 24px rgba(124,58,237,.45)}
.count{font-weight:900;font-size:20px}.count b{color:var(--gold)}
/* sheet of big cards */
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.big{border-radius:24px;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.1)}
.big svg{position:absolute;inset:0;width:100%;height:100%}
.big .lbl{position:absolute;bottom:0;right:0;left:0;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.big .lbl b{font-size:22px;font-weight:900}.big .lbl span{font-size:13px;opacity:.75}
/* single export */
#solo{display:none;width:600px;height:600px}
body.solo{width:600px;height:600px;background:none}
body.solo #solo{display:block}
/* board headers */
.board{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.ch{height:118px;border-radius:16px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.15)}
.ch svg{position:absolute;inset:0;width:100%;height:100%}
.ch .ct{position:absolute;bottom:0;left:0;right:0;text-align:center;font-weight:900;font-size:17px;padding:16px 4px 5px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.tl{flex:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.tl.e{color:#7ee2a8}.tl.m{color:var(--gold)}.tl.h{color:#ff7a8f}
.tl.wb{background:rgba(47,140,255,.35);border-color:#2f8cff;color:#fff;font-size:15px}
.tl.wr{background:rgba(255,77,109,.35);border-color:#ff4d6d;color:#fff;font-size:15px}
.team{display:flex;align-items:center;gap:12px;padding:6px 18px;border-radius:16px;border:2px solid;min-width:240px;justify-content:space-between}
.team.b{border-color:#2f8cff;background:linear-gradient(90deg,rgba(47,140,255,.28),rgba(47,140,255,.05));box-shadow:0 0 0 4px rgba(255,200,61,.6)}
.team.r{border-color:#ff4d6d;background:linear-gradient(90deg,rgba(255,77,109,.28),rgba(255,77,109,.05))}
.team .nm{font-weight:800;font-size:18px}.team .s{font-weight:900;font-size:28px}
</style></head><body>

<section class="screen" id="s1">
 <div class="top"><div><div class="h">اختاروا 6 فئات</div><div class="sub">كل فئة: 2 سهل (200) · 2 متوسط (400) · 2 صعب (600)</div></div><div class="logo">لوحة <span>التحدي</span></div></div>
 <div class="grid" id="g1" style="gap:18px"></div>
 <div class="bar"><div class="count">المختار: <b>4</b> / 6</div><div class="btn" style="opacity:.45">ابدأ اللعب ◀</div></div>
</section>

<section class="screen" id="s2">
 <div class="top"><div class="h">صور الفئات — أسلوب موحّد</div><div class="logo">لوحة <span>التحدي</span></div></div>
 <div class="sheet" id="g2"></div>
</section>

<section class="screen" id="s3">
 <div class="top">
  <div class="team b"><div class="nm">🔵 الفريق الأزرق</div><div class="s">1,400</div></div>
  <div class="logo">لوحة <span>التحدي</span></div>
  <div class="team r"><div class="nm">🔴 الفريق الأحمر</div><div class="s">1,000</div></div>
 </div>
 <div class="board" id="g3"></div>
</section>

<div id="solo"></div>

<script>
const CATS=[
 {k:'flags',t:'أعلام الدول',n:'195 سؤال',c1:'#38bdf8',c2:'#1e3a8a',dk:'#0c4a6e'},
 {k:'games',t:'تحدي الألعاب',n:'120 سؤال',c1:'#c084fc',c2:'#3b0764',dk:'#4c1d95'},
 {k:'prophets',t:'قصص الأنبياء',n:'204 سؤال',c1:'#34d399',c2:'#064e3b',dk:'#065f46'},
 {k:'spl',t:'الدوري السعودي',n:'300 سؤال',c1:'#4ade80',c2:'#14532d',dk:'#166534'},
 {k:'wc',t:'كأس العالم',n:'300 سؤال',c1:'#fbbf24',c2:'#7c2d12',dk:'#92400e'},
 {k:'crests',t:'الشعارات الكروية',n:'300 سؤال',c1:'#fb7185',c2:'#4c0519',dk:'#881337'},
];
const spark=(x,y,s,o=1)=>`<path transform="translate(${x} ${y})" opacity="${o}" fill="#fff" d="M0,-${s}Q0,0 ${s},0Q0,0 0,${s}Q0,0 -${s},0Q0,0 0,-${s}z"/>`;
function frame(c,id,inner){return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" overflow="visible" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c.c1}"/><stop offset="1" stop-color="${c.c2}"/></linearGradient>
 <radialGradient id="sp${id}" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="w${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe4f0"/></linearGradient>
 <linearGradient id="gd${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
 <pattern id="dt${id}" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#fff" opacity=".13"/></pattern>
 <filter id="sh${id}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect x="-300" y="-300" width="800" height="800" fill="${c.c2}"/><rect x="-300" y="-60" width="800" height="320" fill="url(#bg${id})"/>
<rect x="-300" y="-300" width="800" height="800" fill="url(#dt${id})"/>
<circle cx="100" cy="95" r="80" fill="url(#sp${id})"/>
<circle cx="100" cy="95" r="62" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="3 5"/>
<ellipse cx="100" cy="166" rx="52" ry="8" fill="#000" opacity=".25"/>
<g filter="url(#sh${id})">${inner}</g>
${spark(34,40,7)}${spark(170,58,5,.8)}${spark(160,150,6,.7)}${spark(44,140,4,.6)}
</svg>`}
const ART={
flags:(c,i)=>`
 <circle cx="100" cy="118" r="46" fill="url(#w${i})"/>
 <path d="M70,96c10-8 22-6 28 2s-2 16 6 22-4 18-14 16-14-12-22-12-14-10-8-18 4-6 10-10z" fill="${c.c1}" opacity=".9"/>
 <path d="M118,92c8-2 18 4 20 12s-6 10-4 18-8 14-14 10-2-12-8-16-6-20 6-24z" fill="${c.c1}" opacity=".9"/>
 <path d="M54,118h92M100,72v92M62,96q38,10 76,0M62,140q38,-10 76,0" stroke="${c.dk}" stroke-opacity=".25" stroke-width="1.6" fill="none"/>
 <ellipse cx="100" cy="118" rx="22" ry="46" fill="none" stroke="${c.dk}" stroke-opacity=".25" stroke-width="1.6"/>
 <rect x="66" y="34" width="3.5" height="56" rx="1.7" fill="#e2e8f0"/>
 <path d="M69.5,36q14,-6 28,0t28,0v24q-14,6 -28,0t-28,0z" transform="rotate(-14 69 36)" fill="#ef4444"/>
 <path d="M69.5,44q14,-6 28,0t28,0v8q-14,6 -28,0t-28,0z" transform="rotate(-14 69 36)" fill="#fff"/>
 <rect x="128" y="44" width="3.5" height="48" rx="1.7" fill="#e2e8f0"/>
 <path d="M131.5,46q11,-5 22,0t22,0v20q-11,5 -22,0t-22,0z" transform="rotate(10 131 46)" fill="${c.dk}"/>
 <circle cx="152" cy="58" r="5" fill="#fde047" transform="rotate(10 131 46)"/>`,
games:(c,i)=>`
 <path d="M44,104c0-20 15-32 33-32h46c18,0 33,12 33,32l8,32c4,16 -12,25 -23,16l-15-14h-52l-15,14c-11,9 -27,0 -23-16z" fill="url(#w${i})"/>
 <path d="M70,94h10v-10h10v10h10v10h-10v10h-10v-10h-10z" fill="${c.dk}"/>
 <circle cx="132" cy="88" r="7" fill="#22c55e"/><circle cx="146" cy="102" r="7" fill="#ef4444"/>
 <circle cx="118" cy="102" r="7" fill="#3b82f6"/><circle cx="132" cy="116" r="7" fill="#f59e0b"/>
 <circle cx="88" cy="128" r="9" fill="#cbd5e1"/><circle cx="114" cy="128" r="9" fill="#cbd5e1"/>
 <circle cx="88" cy="128" r="5" fill="${c.dk}"/><circle cx="114" cy="128" r="5" fill="${c.dk}"/>
 <rect x="58" y="42" width="8" height="8" fill="#fff" opacity=".9"/><rect x="66" y="34" width="6" height="6" fill="#fff" opacity=".6"/>
 <rect x="138" y="40" width="8" height="8" fill="url(#gd${i})"/><rect x="148" y="48" width="5" height="5" fill="#fff" opacity=".7"/>`,
prophets:(c,i)=>`
 <path d="M58,172V96a42,42 0 0 1 84,0V172" fill="${c.dk}" opacity=".55" stroke="url(#gd${i})" stroke-width="3"/>
 <path d="M70,172V100a30,30 0 0 1 60,0V172" fill="none" stroke="#fde68a" stroke-opacity=".35" stroke-width="1.5"/>
 <path d="M100,104C86,94 66,94 52,100v40c14-6 34-6 48,4z" fill="url(#w${i})"/>
 <path d="M100,104C114,94 134,94 148,100v40c-14-6 -34-6 -48,4z" fill="#eef2f7"/>
 <path d="M60,108q16-5 32,0M60,116q16-5 32,0M60,124q16-5 32,0M108,108q16-5 32,0M108,116q16-5 32,0M108,124q16-5 32,0" stroke="${c.dk}" stroke-opacity=".35" stroke-width="1.6" fill="none"/>
 <path d="M54,142L100,170L146,142L140,138L100,162L60,138z" fill="url(#gd${i})"/>
 <path d="M70,160L100,142L130,160" stroke="url(#gd${i})" stroke-width="5" fill="none" stroke-linecap="round"/>
 <path d="M150,40a14,14 0 1 0 10,24a11,11 0 1 1 -10,-24z" fill="url(#gd${i})"/>
 <line x1="46" y1="20" x2="46" y2="40" stroke="#fde68a" stroke-width="1.5"/>
 <path d="M40,40h12l3,6v14l-3,6h-12l-3,-6v-14z" fill="url(#gd${i})"/><rect x="41" y="47" width="10" height="12" rx="2" fill="#fff7d6"/>`,
spl:(c,i)=>`
 <path d="M28,128L50,92h100l22,36z" fill="${c.dk}"/>
 <path d="M36,128L54,98h92l18,30z" fill="#22c55e"/>
 <path d="M100,98v30M60,113h80" stroke="#fff" stroke-opacity=".6" stroke-width="1.4"/><ellipse cx="100" cy="113" rx="12" ry="5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.4"/>
 <rect x="40" y="38" width="3" height="56" fill="#e2e8f0"/><rect x="157" y="38" width="3" height="56" fill="#e2e8f0"/>
 <rect x="32" y="30" width="20" height="10" rx="2" fill="url(#w${i})"/><rect x="149" y="30" width="20" height="10" rx="2" fill="url(#w${i})"/>
 <path d="M42,40L80,100H56z M158,40L120,100H144z" fill="#fff" opacity=".18"/>
 <circle cx="100" cy="138" r="28" fill="url(#w${i})"/>
 <path d="M100,124l11,8-4,13h-14l-4-13z" fill="${c.dk}"/>
 <path d="M100,110v14M111,132l15-4M107,145l9,12M93,145l-9,12M89,132l-15-4" stroke="${c.dk}" stroke-width="2"/>
 <path d="M72,132l6-8M128,132l-6-8M86,163l4-6M114,163l-4-6" stroke="${c.dk}" stroke-width="5" stroke-linecap="round"/>`,
wc:(c,i)=>`
 <path d="M64,44h72v22c0,26 -16,42 -36,44c-20,-2 -36,-18 -36,-44z" fill="url(#gd${i})"/>
 <path d="M64,52c-18,0 -24,8 -22,18c3,14 16,20 26,22" stroke="url(#gd${i})" stroke-width="7" fill="none"/>
 <path d="M136,52c18,0 24,8 22,18c-3,14 -16,20 -26,22" stroke="url(#gd${i})" stroke-width="7" fill="none"/>
 <path d="M76,50h10v26c0,10 4,18 10,22c-14,-2 -20,-14 -20,-26z" fill="#fff" opacity=".35"/>
 <rect x="94" y="108" width="12" height="20" fill="url(#gd${i})"/>
 <path d="M80,128h40l6,16h-52z" fill="url(#gd${i})"/>
 <rect x="68" y="144" width="64" height="18" rx="3" fill="${c.dk}"/>
 <rect x="80" y="150" width="40" height="6" rx="2" fill="#fde68a" opacity=".8"/>
 <path d="M100,62l3.5,7 7.5,1-5.5,5 1.5,7.5-7-3.8-7,3.8 1.5-7.5-5.5-5 7.5-1z" fill="#fff"/>`,
crests:(c,i)=>`
 <g transform="rotate(-16 64 100)"><path d="M64,62L90,70V96C90,114 78,126 64,132C50,126 38,114 38,96V70z" fill="${c.dk}" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><path d="M50,74v40M64,72v54M78,74v40" stroke="#fff" stroke-opacity=".25" stroke-width="5"/></g>
 <g transform="rotate(16 136 100)"><path d="M136,62L162,70V96C162,114 150,126 136,132C122,126 110,114 110,96V70z" fill="${c.dk}" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><circle cx="136" cy="96" r="12" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="4"/></g>
 <path d="M100,46L138,58V96C138,124 120,142 100,152C80,142 62,124 62,96V58z" fill="url(#w${i})"/>
 <path d="M100,54L130,63V96C130,118 116,133 100,142C84,133 70,118 70,96V63z" fill="none" stroke="url(#gd${i})" stroke-width="3"/>
 <text x="100" y="118" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="54" fill="${c.dk}">?</text>
 <path d="M100,30l3.5,7 7.5,1-5.5,5 1.5,7.5-7-3.8-7,3.8 1.5-7.5-5.5-5 7.5-1z" fill="url(#gd${i})"/>`
};
const svgFor=(c,i)=>frame(c,i,ART[c.k](c,i));
const sel={flags:1,spl:2,wc:3,games:4};
document.getElementById('g1').innerHTML=CATS.map((c,i)=>`<div class="big ${sel[c.k]?'sel':''}">${svgFor(c,'a'+i)}<div class="badge">${sel[c.k]||''}</div><div class="lbl"><b>${c.t}</b><span>${c.n}</span></div></div>`).join('');
document.getElementById('g2').innerHTML=CATS.map((c,i)=>`<div class="big">${svgFor(c,'b'+i)}<div class="lbl"><b>${c.t}</b><span>${c.n}</span></div></div>`).join('');
const tiles=[['e','e','m','m','h','h']];
document.getElementById('g3').innerHTML=CATS.map((c,i)=>`<div class="col"><div class="ch">${svgFor(c,'c'+i)}<div class="ct">${c.t}</div></div>`+
 [200,200,400,400,600,600].map((p,j)=>{const cls=p==200?'e':p==400?'m':'h';const w=(i*7+j*3)%11==0?'wb':(i*5+j)%13==0?'wr':'';return `<div class="tl ${w||cls}">${w?(w=='wb'?'🔵 ':'🔴 ')+p:p}</div>`}).join('')+`</div>`).join('');
const h=location.hash.slice(1)||'s1';
if(h.startsWith('solo-')){document.body.className='solo';const i=+h.split('-')[1];document.getElementById('solo').innerHTML=svgFor(CATS[i],'s'+i).replace('preserveAspectRatio','width="600" height="600" preserveAspectRatio');}
else document.getElementById(h).classList.add('on');
</script></body></html>
