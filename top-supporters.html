<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توب الداعمين — منصة ألعاب أيمن</title>
<meta name="description" content="قائمة أفضل داعمي منصة ألعاب أيمن.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0e0e16; --surface: #150c26; --surface-2: #1c1233;
        --border: rgba(124, 58, 237, 0.28); --text: #ffffff; --text-muted: #b9aed1;
        --accent: #7c3aed; --accent-2: #00c2ff; --accent-pink: #ff4dff;
        --accent-gradient: linear-gradient(90deg, #7c3aed, #ff4dff);
        --gold-gradient: linear-gradient(90deg, #ffc857, #ff8a3d);
        --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
    a { text-decoration: none; color: inherit; }
    header.topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 32px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2em; }
    .brand-logo { height: 44px; width: auto; display: block; }
    .home-link {
        border: 1px solid var(--border); border-radius: 999px; padding: 8px 18px;
        font-weight: 700; font-size: 0.9em; color: var(--text-muted);
    }
    .home-link:hover { color: var(--text); border-color: var(--accent); }

    main { max-width: 720px; margin: 0 auto; padding: 48px 24px 60px; }

    .top-header { text-align: center; margin-bottom: 28px; }
    .top-icon { font-size: 3em; margin-bottom: 10px; }
    h1 {
        font-size: 2em; font-weight: 800; margin: 0 0 12px;
        background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .top-intro { color: var(--text-muted); line-height: 1.8; }

    /* ---- [0.45.14] تبويبات "الأعلى دعماً" / "أحدث الداعمين" ---- */
    .top-tabs {
        display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 999px; padding: 5px; margin: 0 0 22px; max-width: 340px; margin-inline: auto;
    }
    .top-tab-btn {
        flex: 1; border: none; background: transparent; color: var(--text-muted); cursor: pointer;
        font-family: inherit; font-weight: 700; font-size: 0.92em; padding: 10px 14px; border-radius: 999px;
        transition: background .18s ease, color .18s ease;
    }
    .top-tab-btn.active { background: var(--accent-gradient); color: #fff; }
    .top-tab-panel { display: none; }
    .top-tab-panel.active { display: block; }

    .top-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .top-row {
        display: flex; align-items: center; gap: 14px;
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px 18px; transition: transform .15s ease, border-color .15s ease;
    }
    .top-row:hover { transform: translateY(-1px); border-color: var(--accent); }
    .top-row--1 { border-color: rgba(255, 200, 87, 0.6); box-shadow: 0 0 24px rgba(255, 200, 87, 0.15); background: linear-gradient(90deg, rgba(255,200,87,0.08), var(--surface) 40%); }
    .top-row--2 { border-color: rgba(200, 200, 210, 0.5); background: linear-gradient(90deg, rgba(200,200,210,0.08), var(--surface) 40%); }
    .top-row--3 { border-color: rgba(205, 140, 90, 0.5); background: linear-gradient(90deg, rgba(205,140,90,0.08), var(--surface) 40%); }

    .top-rank { font-size: 1.5em; min-width: 36px; text-align: center; font-weight: 800; color: var(--text-muted); flex-shrink: 0; }

    .top-avatar {
        width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
        border: 2px solid var(--border); background: var(--surface-2);
    }
    .top-avatar--placeholder {
        display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff;
        background: var(--accent-gradient);
    }

    .top-info { flex: 1; min-width: 0; }
    .top-name { font-weight: 800; font-size: 1.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-meta { color: var(--text-muted); font-size: 0.85em; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-amount { font-weight: 800; font-size: 1.1em; color: var(--accent-pink); white-space: nowrap; flex-shrink: 0; }

    .top-empty {
        text-align: center; color: var(--text-muted); background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; line-height: 1.9;
    }
    .top-empty a { color: var(--accent-2); text-decoration: underline; }

    .top-cta { text-align: center; margin-top: 32px; }
    .top-cta a {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--accent-gradient); color: #fff; font-weight: 800;
        padding: 12px 28px; border-radius: 999px;
    }

    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85em; }
</style>
</head>
<body>

<header class="topbar">
    <a href="index.html" class="brand"><img src="logo.png" alt="ألعاب أيمن" class="brand-logo"></a>
    <a href="index.html" class="home-link">الرئيسية</a>
</header>

<main>
    <div class="top-header">
        <div class="top-icon">🏆</div>
        <h1>توب الداعمين</h1>
        <p class="top-intro">شكراً لكل من دعم منصة ألعاب أيمن — هذي قائمة الداعمين.</p>
    </div>

    <div class="top-tabs">
        <button type="button" class="top-tab-btn active" data-top-tab="top">🏆 الأعلى دعماً</button>
        <button type="button" class="top-tab-btn" data-top-tab="recent">🕒 أحدث الداعمين</button>
    </div>

    <div class="top-tab-panel active" data-top-panel="top">
        <ul class="top-list" id="top-supporters-list">
            <li class="top-empty">جارٍ التحميل…</li>
        </ul>
    </div>
    <div class="top-tab-panel" data-top-panel="recent">
        <ul class="top-list" id="recent-supporters-list">
            <li class="top-empty">جارٍ التحميل…</li>
        </ul>
    </div>

    <div class="top-cta">
        <a href="support.html">💜 ادعم المنصة أنت كمان</a>
    </div>
</main>

<footer>© منصة ألعاب أيمن — جميع الحقوق محفوظة</footer>

<script src="auth/auth-client.js"></script>
<script>
(function () {
    'use strict';

    var MEDALS = ['🥇', '🥈', '🥉'];

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    function formatAmount(amount) {
        var n = Number(amount) || 0;
        return (n % 1 === 0 ? n.toString() : n.toFixed(2)) + ' دولار';
    }

    // [0.45.14] صورة البروفايل لو الداعم مربوط بحساب فعلي (s.linked)،
    // وإلا دائرة بالحرف الأول من الاسم كبديل — راجع
    // backend/supporters/supporters-service.js (decorateRow/listTop).
    function avatarHtml(s) {
        if (s.linked && s.avatarBase64) {
            return '<img class="top-avatar" src="' + escapeHtml(s.avatarBase64) + '" alt="">';
        }
        var initial = (s.name || '؟').trim().charAt(0).toUpperCase();
        return '<div class="top-avatar top-avatar--placeholder">' + escapeHtml(initial) + '</div>';
    }

    function formatRelativeDate(timestamp) {
        try { return new Date(timestamp).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return ''; }
    }

    var topListEl = document.getElementById('top-supporters-list');
    var recentListEl = document.getElementById('recent-supporters-list');
    var hasAuthClient = window.AGPAuth && typeof window.AGPAuth.getTopSupporters === 'function';

    function loadTop() {
        if (!hasAuthClient) return;
        window.AGPAuth.getTopSupporters().then(function (result) {
            var supporters = (result && result.success && result.supporters) || [];
            if (!supporters.length) {
                topListEl.innerHTML = '<li class="top-empty">لسا ما فيه داعمون — <a href="support.html">كن أول داعم للمنصة! 🎉</a></li>';
                return;
            }
            topListEl.innerHTML = supporters.map(function (s, index) {
                var rank = index + 1;
                var rowClass = rank <= 3 ? ' top-row--' + rank : '';
                var rankDisplay = rank <= 3 ? MEDALS[rank - 1] : '#' + rank;
                var donationsLabel = s.donationsCount === 1 ? 'دعم واحد' : (s.donationsCount + ' مرات دعم');
                return '<li class="top-row' + rowClass + '">' +
                    '<div class="top-rank">' + rankDisplay + '</div>' +
                    avatarHtml(s) +
                    '<div class="top-info"><div class="top-name">' + escapeHtml(s.name) + '</div>' +
                    '<div class="top-meta">' + donationsLabel + '</div></div>' +
                    '<div class="top-amount">' + formatAmount(s.totalAmount) + '</div>' +
                    '</li>';
            }).join('');
        }).catch(function () {
            topListEl.innerHTML = '<li class="top-empty">تعذّر تحميل قائمة الداعمين حالياً.</li>';
        });
    }

    function loadRecent() {
        if (!hasAuthClient || typeof window.AGPAuth.getRecentSupporters !== 'function') return;
        window.AGPAuth.getRecentSupporters(30).then(function (result) {
            var supporters = (result && result.success && result.supporters) || [];
            if (!supporters.length) {
                recentListEl.innerHTML = '<li class="top-empty">لسا ما فيه داعمون — <a href="support.html">كن أول داعم للمنصة! 🎉</a></li>';
                return;
            }
            recentListEl.innerHTML = supporters.map(function (s) {
                var meta = s.message ? escapeHtml(s.message) : formatRelativeDate(s.created_at);
                return '<li class="top-row">' +
                    avatarHtml(s) +
                    '<div class="top-info"><div class="top-name">' + escapeHtml(s.name) + '</div>' +
                    '<div class="top-meta">' + meta + '</div></div>' +
                    '<div class="top-amount">' + formatAmount(s.amount) + '</div>' +
                    '</li>';
            }).join('');
        }).catch(function () {
            recentListEl.innerHTML = '<li class="top-empty">تعذّر تحميل قائمة الداعمين حالياً.</li>';
        });
    }

    // تبديل التبويبات — نفس فكرة profile.html (.pp-tabs) لكن نسخة محلية
    // بسيطة خاصة بهذي الصفحة (لا اعتمادية بينهما).
    var tabButtons = document.querySelectorAll('.top-tab-btn');
    var recentLoaded = false;
    for (var i = 0; i < tabButtons.length; i++) {
        tabButtons[i].addEventListener('click', function () {
            var target = this.getAttribute('data-top-tab');
            for (var j = 0; j < tabButtons.length; j++) tabButtons[j].classList.remove('active');
            this.classList.add('active');
            var panels = document.querySelectorAll('.top-tab-panel');
            for (var k = 0; k < panels.length; k++) {
                panels[k].classList.toggle('active', panels[k].getAttribute('data-top-panel') === target);
            }
            if (target === 'recent' && !recentLoaded) {
                recentLoaded = true;
                loadRecent();
            }
        });
    }

    if (hasAuthClient) loadTop();
    else topListEl.innerHTML = '<li class="top-empty">تعذّر تحميل قائمة الداعمين حالياً.</li>';
}());
</script>
</body>
</html>
