<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن — AGP</title>
<link rel="stylesheet" href="dashboard-core/css/style.css">
<link rel="stylesheet" href="auth/auth.css">
</head>
<body class="auth-checking">

<header class="topbar">
    <div class="topbar-brand">
        <span class="topbar-logo topbar-logo--img"><img src="logo.png" alt="ألعاب أيمن"></span>
        <span class="topbar-title">لوحة الأدمن</span>
    </div>
    <div class="auth-topbar-account">
        <a class="btn btn-sm" href="dashboard-core/index.html">لوحة التحكم</a>
        <span class="badge" id="account-role">—</span>
        <span class="stat-value" id="account-username">—</span>
        <button class="btn btn-sm" id="btn-account-logout">تسجيل خروج</button>
    </div>
</header>

<div class="main" style="padding: var(--space-5);">

    <div class="auth-message" id="admin-message"></div>

    <section class="panel panel-wide">
        <div class="panel-head">
            <h2><svg class="icon-sm" aria-hidden="true"><use href="#icon-users"/></svg>المستخدمون والستريمرز</h2>
            <button class="btn btn-sm" id="btn-refresh-users"><svg class="icon-sm" aria-hidden="true"><use href="#icon-refresh"/></svg>تحديث</button>
        </div>
        <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>المعرّف</th>
                    <th>اسم المستخدم</th>
                    <th>البريد الإلكتروني</th>
                    <th>الدور</th>
                    <th>تيك توك</th>
                    <th>الـID العام</th>
                    <th>البثوث</th>
                    <th>الهدايا (القيمة)</th>
                    <th>صلاحية الألعاب</th>
                </tr>
            </thead>
            <tbody id="admin-users-table-body">
                <tr><td class="table-empty" colspan="9">جارٍ التحميل…</td></tr>
            </tbody>
        </table>
        </div>
    </section>

</div>

<svg style="display:none" aria-hidden="true">
    <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/>
        <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14.5 20c.2-2.8 2.2-5 4.8-5.3"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 018-8 8 8 0 017.4 5"/><polyline points="19 3 19 9 13 9"/>
    </symbol>
</svg>

<script src="auth/auth-client.js"></script>
<script>
'use strict';

/**
 * لوحة أدمن مستقلة تماماً (خارج AGP.* وخارج dashboard-core.js). محمية
 * بـ AGPAuth.requireAdmin — تحوّل لصفحة الدخول لغير المسجّلين، ولصفحة
 * الدخول أيضاً لأي مستخدم دوره ليس 'admin' (لا صفحة "غير مصرَّح" منفصلة
 * حالياً؛ كافٍ لهذه المرحلة).
 */
(function () {
    var KNOWN_PERMISSION_KEYS = ['can_run_games'];

    var messageEl = document.getElementById('admin-message');
    var tbody = document.getElementById('admin-users-table-body');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'auth-message auth-message--visible auth-message--' + type;
    }

    function escapeHtml(value) {
        var div = document.createElement('div');
        div.textContent = value === null || value === undefined ? '' : String(value);
        return div.innerHTML;
    }

    // زي escapeHtml بس يعالج علامات الاقتباس كمان — لازم لاستخدام قيمة
    // داخل attribute (value="...") بدل نص عادي، حتى لو الـID فيه ".
    function escapeAttr(value) {
        return escapeHtml(value).replace(/"/g, '&quot;');
    }

    function renderUsers(users) {
        if (!users.length) {
            tbody.innerHTML = '<tr><td class="table-empty" colspan="9">لا يوجد مستخدمون بعد.</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(function (u) {
            var permCells = KNOWN_PERMISSION_KEYS.map(function (key) {
                var checked = u.permissions && u.permissions[key] ? 'checked' : '';
                return '<input type="checkbox" data-user-id="' + u.id + '" data-permission-key="' + key + '" ' + checked + '>';
            }).join('');

            var inputStyle = 'width:110px;padding:5px 7px;background:var(--bg);border:1px solid var(--border-light);' +
                'border-radius:var(--radius-sm);color:var(--text);font-size:12px;font-family:inherit;';

            return '<tr>' +
                '<td>' + u.id + '</td>' +
                '<td>' + escapeHtml(u.username) + '</td>' +
                '<td>' + escapeHtml(u.email) + '</td>' +
                '<td><span class="badge">' + escapeHtml(u.role) + '</span>' +
                    (u.is_streamer ? ' <span title="طلب أن يكون ستريمر وقت التسجيل">🎙️</span>' : '') +
                '</td>' +
                '<td>' + escapeHtml(u.tiktok_username) + (u.tiktok_verified ? ' ✅' : '') + '</td>' +
                '<td class="mono">' +
                    '<input type="text" style="' + inputStyle + '" value="' + escapeAttr(u.custom_id) + '" data-user-id="' + u.id + '" data-custom-id-input>' +
                    ' <button class="btn btn-sm" data-user-id="' + u.id + '" data-save-custom-id>حفظ</button>' +
                    ' <a class="btn btn-sm" href="profile.html?id=' + encodeURIComponent(u.custom_id || '') + '" target="_blank">عرض</a>' +
                '</td>' +
                '<td>' + u.stats.total_broadcasts + '</td>' +
                '<td>' + u.stats.total_gifts + ' (' + u.stats.total_gifts_value + ')</td>' +
                '<td>' + permCells + '</td>' +
                '</tr>';
        }).join('');

        Array.prototype.forEach.call(tbody.querySelectorAll('input[type=checkbox]'), function (checkbox) {
            checkbox.addEventListener('change', function () {
                var userId = Number(checkbox.getAttribute('data-user-id'));
                var permissionKey = checkbox.getAttribute('data-permission-key');
                checkbox.disabled = true;
                window.AGPAuth.adminSetPermission(userId, permissionKey, checkbox.checked)
                    .then(function (result) {
                        if (!result.success) {
                            showMessage('تعذّر تحديث الصلاحية: ' + (result.error || 'unknown'), 'error');
                            checkbox.checked = !checkbox.checked; // تراجع بصري لو فشل الحفظ
                        }
                    })
                    .finally(function () { checkbox.disabled = false; });
            });
        });

        // الأدمن يعدّل الـID العام لأي مستخدم — يحفظ نص الحقل المجاور
        // بضغطة واحدة عبر /api/admin/custom-id (يشمل نفسه كمان).
        Array.prototype.forEach.call(tbody.querySelectorAll('[data-save-custom-id]'), function (button) {
            button.addEventListener('click', function () {
                var userId = Number(button.getAttribute('data-user-id'));
                var input = tbody.querySelector('input[data-custom-id-input][data-user-id="' + userId + '"]');
                var newId = (input.value || '').trim();
                if (!newId) { showMessage('اكتب ID قبل الحفظ.', 'error'); return; }

                button.disabled = true;
                window.AGPAuth.adminSetCustomId(userId, newId).then(function (result) {
                    if (result.success) {
                        showMessage('تم تحديث الـID.', 'success');
                        loadUsers(); // إعادة تحميل حتى يتحدّث رابط "عرض" بالقيمة الجديدة
                    } else {
                        showMessage('تعذّر الحفظ: ' + (result.error || 'unknown') + (result.error === 'custom_id_taken' ? ' (هذا الـID مستخدَم لحساب آخر)' : ''), 'error');
                    }
                }).finally(function () { button.disabled = false; });
            });
        });
    }

    function loadUsers() {
        tbody.innerHTML = '<tr><td class="table-empty" colspan="9">جارٍ التحميل…</td></tr>';
        window.AGPAuth.adminListUsers().then(function (result) {
            if (!result.success) {
                showMessage('تعذّر تحميل قائمة المستخدمين.', 'error');
                return;
            }
            renderUsers(result.users);
        });
    }

    document.getElementById('btn-refresh-users').addEventListener('click', loadUsers);
    document.getElementById('btn-account-logout').addEventListener('click', function () {
        window.AGPAuth.logout().then(function () { window.location.href = 'login.html'; });
    });

    window.AGPAuth.requireAdmin('login.html').then(function (user) {
        if (!user) return;
        document.body.classList.remove('auth-checking');
        document.getElementById('account-username').textContent = user.username;
        document.getElementById('account-role').textContent = user.role;
        loadUsers();
    });
}());
</script>
</body>
</html>
