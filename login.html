<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — AGP</title>

<!--
  ==========================================================================
  AGP LOGIN PAGE — نفس تصميم signup.html/profile.html البصري (تصميم
  مرجعي معتمد). ملف ذاتي الاكتفاء، لا اعتماد على dashboard-core/css/
  style.css أو auth/auth.css.

  الوظيفة كما هي: نفس AGPAuth.login/loginWithGoogle تماماً. **ملاحظة
  صادقة**: التصميم المرجعي يعرض حقل "بريد إلكتروني أو اسم مستخدم"
  ورابط "نسيت كلمة المرور؟" — الخادم الحالي (auth-service.login) يقبل
  البريد الإلكتروني فقط (لا دخول باسم المستخدم)، ولا يوجد نظام استرجاع
  كلمة مرور فعلي (لا خدمة بريد مُعدَّة). لتفادي اختراع وظيفة غير
  موجودة: حقل الدخول هنا "البريد الإلكتروني" فقط (يطابق الخادم فعلياً)،
  ورابط "نسيت كلمة المرور" يعرض ملاحظة "قريباً" بدل الادّعاء بأنه يعمل.
  خانة "تذكرني" عنصر واجهة بحت (الجلسة أصلاً تُحفَظ محلياً ٣٠ يوماً
  بغض النظر عنها) — لا تُرسِل أي شيء للخادم.
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-primary: #1A0F1F;
        --bg-secondary: #2D1340;
        --purple: #7B2CBF;
        --pink: #FF6EC7;
        --pink-light: #FF9CF1;
        --text-primary: #FFFFFF;
        --text-secondary: #B38BC7;
        --card-bg: #3A1A4D;
        --gradient: linear-gradient(90deg, #7B2CBF, #FF6EC7);
        --card-border: rgba(255, 110, 199, 0.35);
        --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 110, 199, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 55%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .au-wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 16px 48px;
    }

    .au-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
    }
    .au-brand-logo { height: 38px; width: auto; display: block; }
    .au-back-link {
        display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary);
        font-size: 0.88em; font-weight: 700; margin-bottom: 14px;
    }
    .au-back-link:hover { color: var(--text-primary); }

    .au-card {
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: rgba(45, 19, 64, 0.65);
        box-shadow: var(--card-shadow);
        padding: 28px 24px;
    }

    .au-title {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 6px;
    }
    .au-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        text-align: center;
        margin: 0 0 20px;
    }

    .au-message {
        display: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
    }
    .au-message--visible { display: block; }
    .au-message--error { background: rgba(255, 110, 199, 0.12); color: var(--pink-light); border: 1px solid var(--card-border); }
    .au-message--ok { background: rgba(158, 247, 194, 0.1); color: #9ef7c2; border: 1px solid rgba(158, 247, 194, 0.3); }

    .au-field { margin-bottom: 16px; }
    .au-field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
    }
    .au-input-wrap { position: relative; }
    .au-input-wrap .au-icon {
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        font-size: 14px;
        color: var(--text-secondary);
        pointer-events: none;
    }
    .au-input-wrap input {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        padding: 0 44px 0 44px;
        font-size: 14px;
        font-family: inherit;
    }
    .au-input-wrap input::placeholder { color: var(--text-secondary); opacity: 0.7; }
    .au-input-wrap input:focus { outline: none; border-color: var(--pink); }
    .au-input-wrap .au-eye-toggle {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 15px;
        padding: 4px;
    }

    .au-row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--text-secondary);
        margin-bottom: 20px;
    }
    .au-remember { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .au-remember input { accent-color: var(--pink); }
    .au-forgot-link { background: none; border: none; color: var(--text-secondary); font-family: inherit; font-size: 12.5px; cursor: pointer; padding: 0; }
    .au-forgot-link:hover { color: var(--pink-light); }
    .au-forgot-note { font-size: 11.5px; color: var(--pink-light); margin-top: -12px; margin-bottom: 16px; display: none; }
    .au-forgot-note.is-visible { display: block; }

    .au-btn {
        width: 100%;
        height: 48px;
        border-radius: 14px;
        border: none;
        font-family: inherit;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
    }
    .au-btn--primary {
        background: var(--gradient);
        color: #fff;
        box-shadow: 0 0 14px rgba(255, 110, 199, 0.25);
    }
    .au-btn--primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .au-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 12.5px;
        margin: 18px 0;
    }
    .au-divider::before, .au-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--card-border);
    }

    .au-google-wrap { display: flex; justify-content: center; }
    .au-google-btn {
        width: 100%;
        min-height: 44px;
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        justify-content: center;
    }

    .au-footer {
        text-align: center;
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 18px;
    }
    .au-footer a { color: var(--pink-light); font-weight: 600; }
    .au-footer a:hover { text-decoration: underline; }

    .au-perks {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 26px;
        text-align: center;
    }
    .au-perks div { font-size: 11.5px; color: var(--text-secondary); line-height: 1.6; }
    .au-perks .au-perk-icon { font-size: 18px; margin-bottom: 4px; }

    @media (max-width: 420px) {
        .au-card { padding: 22px 16px; }
        .au-perks { grid-template-columns: 1fr 1fr 1fr; }
    }
</style>
</head>
<body>

<div class="au-wrap">
    <a href="index.html" class="au-back-link">→ الرئيسية</a>
    <a href="index.html" class="au-brand">
        <img src="logo.png" alt="ألعاب أيمن" class="au-brand-logo">
    </a>

    <div class="au-card">
        <h1 class="au-title">تسجيل الدخول</h1>
        <p class="au-subtitle">مرحباً بعودتك! سجّل دخولك للمتابعة</p>

        <div class="au-message" id="auth-message"></div>

        <form id="login-form">
            <div class="au-field">
                <label for="email">البريد الإلكتروني</label>
                <div class="au-input-wrap">
                    <span class="au-icon">✉️</span>
                    <input type="email" id="email" required autocomplete="email" placeholder="اكتب بريدك الإلكتروني">
                </div>
            </div>

            <div class="au-field" style="margin-bottom:10px;">
                <label for="password">كلمة المرور</label>
                <div class="au-input-wrap">
                    <span class="au-icon">🔒</span>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="اكتب كلمة المرور">
                    <button type="button" class="au-eye-toggle" data-toggle-for="password">👁</button>
                </div>
            </div>

            <div class="au-row-between">
                <label class="au-remember">
                    <input type="checkbox" id="remember-me">
                    تذكرني
                </label>
                <button type="button" class="au-forgot-link" id="forgot-password-btn">نسيت كلمة المرور؟</button>
            </div>
            <div class="au-forgot-note" id="forgot-password-note">ميزة استرجاع كلمة المرور قريباً — تواصل مع الأدمن حالياً لإعادة تعيينها.</div>

            <button type="submit" class="au-btn au-btn--primary" id="login-submit">تسجيل الدخول</button>
        </form>

        <div class="au-divider">أو</div>

        <div class="au-google-wrap">
            <div class="au-google-btn" id="google-signin-btn"></div>
        </div>

        <div class="au-footer">
            ما عندك حساب؟ <a href="signup.html">أنشئ حساب جديد</a>
        </div>
    </div>

    <div class="au-perks">
        <div><div class="au-perk-icon">🛡️</div>آمن وموثوق</div>
        <div><div class="au-perk-icon">🎮</div>تجربة ممتعة</div>
        <div><div class="au-perk-icon">👥</div>مجتمع نشط</div>
    </div>
</div>

<script src="auth/auth-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';

/**
 * منطق الدخول — نفس AGPAuth.login/loginWithGoogle بالضبط، لم يتغيّر
 * شيء بالتدفق سوى شكل الحقول. راجع docs/CHANGELOG.md.
 */
(function () {
    var GOOGLE_CLIENT_ID = '777683353907-hkemaaft5t7mktgtjvlf47ptuqk93qbg.apps.googleusercontent.com';

    var messageEl = document.getElementById('auth-message');
    var form = document.getElementById('login-form');
    var submitBtn = document.getElementById('login-submit');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'au-message au-message--visible au-message--' + type;
    }

    // اللوحة حصراً لحساب الأدمن — أي حساب آخر يروح لبروفايله العام
    // بدل اللوحة. راجع AGPAuth.canAccessDashboard وdocs/CHANGELOG.md.
    function goAfterAuth(user) {
        if (AGPAuth.canAccessDashboard(user)) {
            window.location.href = 'dashboard-core/index.html';
        } else {
            window.location.href = 'profile.html?id=' + encodeURIComponent((user && user.custom_id) || '');
        }
    }

    // [0.45.6] لو صاحب الحساب لسا ما اختار نوع حسابه إجبارياً (حصراً
    // حسابات جوجل جديدة كلياً — راجع choose-account-type.html)، نحوّله
    // هناك بدل لوحته مباشرة، أياً كانت طريقة اكتشاف الجلسة الصالحة.
    function goAfterAuthOrChoice(user) {
        if (AGPAuth.needsAccountTypeChoice(user)) {
            window.location.href = 'choose-account-type.html';
            return;
        }
        goAfterAuth(user);
    }

    // لو Token محلي موجود وصالح فعلاً، لا داعي لعرض نموذج الدخول من جديد.
    if (AGPAuth.getToken()) {
        AGPAuth.me().then(function (result) {
            if (result.success) goAfterAuthOrChoice(result.user);
        });
    }

    Array.prototype.forEach.call(document.querySelectorAll('.au-eye-toggle'), function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.getAttribute('data-toggle-for'));
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });

    // لا نظام استرجاع كلمة مرور فعلياً حالياً — نعرض ملاحظة صريحة بدل
    // رابط لا يعمل. راجع الملاحظة الصادقة أعلى الملف.
    document.getElementById('forgot-password-btn').addEventListener('click', function () {
        document.getElementById('forgot-password-note').classList.toggle('is-visible');
    });

    // [0.45.6] device_locked: بيانات الدخول صحيحة لكن هذا حساب ستريمر
    // معتمد مربوط بجهاز آخر مسبقاً (راجع backend/auth/auth-service.js:
    // checkDeviceLock) — رسالة واضحة بدل "بيانات الدخول غير صحيحة" المضلِّلة.
    var LOGIN_ERROR_LABELS = {
        device_locked: 'هذا الحساب (ستريمر معتمد) مربوط بجهاز آخر مسبقاً. تواصل مع الأدمن لإعادة تعيين الجهاز المسموح.'
    };

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitBtn.disabled = true;
        AGPAuth.login(document.getElementById('email').value.trim(), document.getElementById('password').value)
            .then(function (result) {
                if (result.success) {
                    goAfterAuthOrChoice(result.user);
                    return;
                }
                showMessage(LOGIN_ERROR_LABELS[result.error] || 'بيانات الدخول غير صحيحة.', 'error');
            })
            .catch(function () {
                showMessage('تعذّر الوصول للخادم. حاول مرة أخرى.', 'error');
            })
            .finally(function () { submitBtn.disabled = false; });
    });

    // Google Identity Services — تهيئة الزر لو السكربت وصل ونجح تحميله
    // (لا يوقف عمل الصفحة إطلاقاً لو فشل تحميل سكربت جوجل نفسه).
    window.addEventListener('load', function () {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) return;

        window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: function (response) {
                AGPAuth.loginWithGoogle(response.credential).then(function (result) {
                    if (result.success) {
                        goAfterAuthOrChoice(result.user);
                        return;
                    }
                    showMessage(LOGIN_ERROR_LABELS[result.error] || ('تعذّر الدخول عبر جوجل: ' + (result.error || 'unknown')), 'error');
                });
            }
        });

        window.google.accounts.id.renderButton(
            document.getElementById('google-signin-btn'),
            { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', width: 320 }
        );
    });
}());
</script>
</body>
</html>
