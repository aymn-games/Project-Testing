<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — AGP</title>
<link rel="stylesheet" href="dashboard-core/css/style.css">
<link rel="stylesheet" href="auth/auth.css">
</head>
<body class="auth-body">

<div class="panel auth-card">
    <div class="auth-brand">
        <span class="topbar-logo">AGP</span>
    </div>
    <h1 class="auth-title">تسجيل الدخول للوحة الستريمر</h1>

    <div class="auth-message" id="auth-message"></div>

    <form id="login-form">
        <div class="field">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">دخول</button>
    </form>

    <div class="auth-divider">أو</div>

    <div class="auth-google-btn" id="google-signin-btn"></div>

    <div class="auth-footer">
        ما عندك حساب؟ <a href="signup.html">أنشئ حساب ستريمر جديد</a>
    </div>
</div>

<script src="auth/auth-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';

/**
 * صفحة دخول مستقلة تماماً عن AGP.* (راجع auth/auth-client.js). لو في
 * جلسة صالحة أصلاً، تحوّل مباشرة للوحة بدل عرض النموذج من جديد.
 */
(function () {
    var GOOGLE_CLIENT_ID = '777683353907-hkemaaft5t7mktgtjvlf47ptuqk93qbg.apps.googleusercontent.com';

    var messageEl = document.getElementById('auth-message');
    var form = document.getElementById('login-form');
    var submitBtn = document.getElementById('login-submit');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'auth-message auth-message--visible auth-message--' + type;
    }

    function goToDashboard() {
        window.location.href = 'dashboard-core/index.html';
    }

    // لو Token محلي موجود وصالح فعلاً، لا داعي لعرض نموذج الدخول من جديد.
    if (AGPAuth.getToken()) {
        AGPAuth.me().then(function (result) {
            if (result.success) goToDashboard();
        });
    }

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitBtn.disabled = true;
        AGPAuth.login(document.getElementById('email').value.trim(), document.getElementById('password').value)
            .then(function (result) {
                if (result.success) {
                    goToDashboard();
                    return;
                }
                showMessage('بيانات الدخول غير صحيحة.', 'error');
            })
            .catch(function () {
                showMessage('تعذّر الوصول للخادم. حاول مرة أخرى.', 'error');
            })
            .finally(function () { submitBtn.disabled = false; });
    });

    // Google Identity Services — تهيئة الزر لو السكربت وصل ونجح تحميله
    // (لا يوقف عمل الصفحة إطلاقاً لو فشل تحميل سكربت جوجل نفسه).
    window.addEventListener('load', function () {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) return;

        window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: function (response) {
                AGPAuth.loginWithGoogle(response.credential).then(function (result) {
                    if (result.success) {
                        goToDashboard();
                        return;
                    }
                    showMessage('تعذّر الدخول عبر جوجل: ' + (result.error || 'unknown'), 'error');
                });
            }
        });

        window.google.accounts.id.renderButton(
            document.getElementById('google-signin-btn'),
            { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', width: 320 }
        );
    });
}());
</script>
</body>
</html>
