<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختر نوع حسابك — AGP</title>

<!--
  ==========================================================================
  [0.45.6] صفحة جديدة كلياً — خطوة إجبارية بعد أول تسجيل دخول بجوجل لحساب
  جديد كلياً على المنصة. السبب: قبل هذا الإصدار، أي تسجيل عبر جوجل كان
  يُنشئ حساب "لاعب" صامتاً بدون أي اختيار من صاحب الحساب (خلافاً لنموذج
  التسجيل العادي بكلمة مرور اللي فيه بطاقتا لاعب/استريمر صريحتان —
  signup.html). هذه الصفحة تسد الفجوة: تُفرَض فقط لو
  AGPAuth.needsAccountTypeChoice(user) === true (راجع auth/auth-client.js
  وbackend/auth/auth-service.js: chooseAccountType) — لا تظهر أبداً لحساب
  اختار نوعه أصلاً (كل الحسابات القديمة، وكل تسجيل بكلمة مرور عادي).

  ⚠️ نفس التنويه دائماً: اختيار "استريمر" هنا **طلب أولي فقط** — لا يمنح
  صلاحية تشغيل الألعاب تلقائياً (can_run_games تبقى قرار الأدمن دائماً من
  admin.html)، تماماً مثل بطاقتي لاعب/استريمر بصفحة signup.html العادية.

  نفس الهوية البصرية المرجعية المستخدمة بـlogin.html/signup.html/
  profile.html (ملف ذاتي الاكتفاء، لا اعتماد على dashboard-core/css/
  style.css أو auth/auth.css).
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-primary: #1A0F1F;
        --bg-secondary: #2D1340;
        --purple: #7B2CBF;
        --pink: #FF6EC7;
        --pink-light: #FF9CF1;
        --text-primary: #FFFFFF;
        --text-secondary: #B38BC7;
        --card-bg: #3A1A4D;
        --gradient: linear-gradient(90deg, #7B2CBF, #FF6EC7);
        --card-border: rgba(255, 110, 199, 0.35);
        --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 110, 199, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 55%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .au-wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 16px 48px;
    }

    .au-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
    }
    .au-brand-logo { height: 38px; width: auto; display: block; }

    .au-card {
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: rgba(45, 19, 64, 0.65);
        box-shadow: var(--card-shadow);
        padding: 28px 24px;
    }

    .au-title {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin: 0 0 6px;
    }
    .au-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
        text-align: center;
        margin: 0 0 24px;
        line-height: 1.7;
    }

    .au-message {
        display: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
    }
    .au-message--visible { display: block; }
    .au-message--error { background: rgba(255, 110, 199, 0.12); color: var(--pink-light); border: 1px solid var(--card-border); }

    .au-type-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .au-type-card {
        cursor: pointer;
        border-radius: 12px;
        border: 1.5px solid var(--card-border);
        background: rgba(255, 255, 255, 0.03);
        padding: 18px 10px;
        text-align: center;
        transition: border-color .15s, box-shadow .15s;
        position: relative;
    }
    .au-type-card input { position: absolute; opacity: 0; pointer-events: none; }
    .au-type-card .au-type-icon { font-size: 26px; margin-bottom: 8px; }
    .au-type-card .au-type-label { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .au-type-card .au-type-desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.6; }
    .au-type-card.is-selected {
        border-color: var(--pink);
        box-shadow: 0 0 14px rgba(255, 110, 199, 0.25);
        background: rgba(255, 110, 199, 0.06);
    }

    .au-hint { font-size: 11.5px; color: var(--text-secondary); margin: 10px 0 20px; line-height: 1.7; text-align: center; }

    .au-btn {
        width: 100%;
        height: 48px;
        border-radius: 14px;
        border: none;
        font-family: inherit;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
    }
    .au-btn--primary {
        background: var(--gradient);
        color: #fff;
        box-shadow: 0 0 14px rgba(255, 110, 199, 0.25);
    }
    .au-btn--primary:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 420px) {
        .au-card { padding: 22px 16px; }
        .au-type-options { grid-template-columns: 1fr; }
    }
</style>
</head>
<body class="auth-checking">

<div class="au-wrap">
    <a href="index.html" class="au-brand">
        <img src="logo.png" alt="ألعاب أيمن" class="au-brand-logo">
    </a>

    <div class="au-card">
        <h1 class="au-title">مرحباً بك 👋</h1>
        <p class="au-subtitle">قبل ما تكمل، اختر نوع حسابك — تقدر تغيّر رأيك لاحقاً من الأدمن.</p>

        <div class="au-message" id="auth-message"></div>

        <form id="choice-form">
            <div class="au-type-options">
                <label class="au-type-card" id="type-card-player">
                    <input type="radio" name="account-type" value="player" checked>
                    <div class="au-type-icon">🎮</div>
                    <div class="au-type-label">لاعب</div>
                    <div class="au-type-desc">للعب والتفاعل في الألعاب</div>
                </label>
                <label class="au-type-card" id="type-card-streamer">
                    <input type="radio" name="account-type" value="streamer">
                    <div class="au-type-icon">📡</div>
                    <div class="au-type-label">استريمر</div>
                    <div class="au-type-desc">لبث الألعاب والتفاعل مع الجمهور</div>
                </label>
            </div>
            <div class="au-hint">
                اختيار "استريمر" طلب أولي فقط — حسابك يبقى بصلاحيات لاعب حتى
                يوافق الأدمن على تفعيل صلاحية تشغيل الألعاب.
            </div>

            <button type="submit" class="au-btn au-btn--primary" id="choice-submit">متابعة</button>
        </form>
    </div>
</div>

<script src="auth/auth-client.js"></script>
<script>
'use strict';

/**
 * [0.45.6] راجع تعليق أعلى الملف. لا شيء هنا يُنشئ جلسة جديدة — يعتمد
 * على جلسة موجودة أصلاً (Google login نجح فعلاً قبل الوصول لهذه الصفحة).
 */
(function () {
    var messageEl = document.getElementById('auth-message');
    var form = document.getElementById('choice-form');
    var submitBtn = document.getElementById('choice-submit');

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'au-message au-message--visible au-message--' + type;
    }

    // اللوحة حصراً لحساب الأدمن — أي حساب آخر يروح لبروفايله العام.
    // نفس دالة goAfterAuth بـlogin.html/signup.html بالضبط.
    function goAfterAuth(user) {
        if (AGPAuth.canAccessDashboard(user)) {
            window.location.href = 'dashboard-core/index.html';
        } else {
            window.location.href = 'profile.html?id=' + encodeURIComponent((user && user.custom_id) || '');
        }
    }

    var typeCards = [document.getElementById('type-card-player'), document.getElementById('type-card-streamer')];
    function refreshTypeCards() {
        typeCards.forEach(function (card) {
            card.classList.toggle('is-selected', card.querySelector('input').checked);
        });
    }
    typeCards.forEach(function (card) {
        card.querySelector('input').addEventListener('change', refreshTypeCards);
    });
    refreshTypeCards();

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        var wantsStreamer = document.getElementById('type-card-streamer').querySelector('input').checked;
        submitBtn.disabled = true;
        AGPAuth.chooseAccountType(wantsStreamer)
            .then(function (result) {
                if (!result.success) {
                    showMessage('تعذّر حفظ اختيارك. حاول مرة أخرى.', 'error');
                    submitBtn.disabled = false;
                    return;
                }
                return AGPAuth.refreshUser().then(function (user) {
                    goAfterAuth(user || AGPAuth.getCachedUser());
                });
            })
            .catch(function () {
                showMessage('تعذّر الوصول للخادم. حاول مرة أخرى.', 'error');
                submitBtn.disabled = false;
            });
    });

    // محمية بجلسة صالحة فقط (requireAuth) — لو الحساب اختار نوعه أصلاً
    // (وصل هنا برابط مباشر يدوياً مثلاً)، نكمله لوجهته العادية فوراً بدل
    // عرض شاشة اختيار لا داعي لها.
    AGPAuth.requireAuth('login.html').then(function (user) {
        if (!user) return;
        if (!AGPAuth.needsAccountTypeChoice(user)) {
            goAfterAuth(user);
            return;
        }
        document.body.classList.remove('auth-checking');
    });
}());
</script>
</body>
</html>
