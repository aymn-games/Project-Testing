<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أونو - الإعدادات</title>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #7c3aed;
    --violet2: #d878ff;
    --input-border: #3a2a55;
    --card-border: #4b3070;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zain', sans-serif;
    background: radial-gradient(circle at 50% 0%, #1b0f2e 0%, #0d0714 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--violet2), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    font-size: 14px;
    color: #a89bc4;
    margin-top: 4px;
  }
  .tabs {
    display: flex;
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--input-border);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    font-family: 'Zain', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #a89bc4;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all .2s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--violet), #5b21b6);
    color: #fff;
    box-shadow: 0 0 16px rgba(124,58,237,.5);
  }
  .panel {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 18px;
    display: none;
    backdrop-filter: blur(10px);
  }
  .panel.active { display: block; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 14px;
    color: #c9bde3;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .field input[type=text] {
    width: 100%;
    padding: 13px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    color: #fff;
    font-family: 'Zain', sans-serif;
    font-size: 16px;
    outline: none;
  }
  .field input[type=text]:focus { border-color: var(--violet2); }
  .segment {
    display: flex;
    gap: 8px;
  }
  .segment button {
    flex: 1;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid var(--input-border);
    background: rgba(255,255,255,0.03);
    color: #c9bde3;
    font-family: 'Zain', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
  }
  .segment button.active {
    background: linear-gradient(135deg, var(--violet), #5b21b6);
    border-color: var(--violet2);
    color: #fff;
  }
  .counter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 8px 14px;
  }
  .counter button {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .counter .val {
    font-size: 20px;
    font-weight: 800;
    min-width: 90px;
    text-align: center;
  }
  .hint {
    font-size: 12px;
    color: #8a7ba8;
    margin-top: 6px;
    text-align: center;
  }
  .primary-btn {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--violet2), var(--violet));
    color: #fff;
    font-family: 'Zain', sans-serif;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 6px;
    box-shadow: 0 4px 20px rgba(124,58,237,.4);
  }
  .primary-btn:active { transform: scale(.98); }
</style>
</head>
<body>

<div class="header">
  <h1>أونو</h1>
  <p>قسم ألعاب الدسكورد</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('create')">إنشاء غرفة</button>
  <button class="tab-btn" onclick="showTab('join')">الدخول لغرفة</button>
</div>

<!-- إنشاء غرفة -->
<div class="panel active" id="panel-create">
  <div class="field">
    <label>اسمك</label>
    <input type="text" id="create-name" placeholder="اكتب اسمك هنا">
  </div>

  <div class="field">
    <label>طريقة استخدام هذا الجهاز</label>
    <div class="segment">
      <button class="active" id="mode-player" onclick="setDeviceMode('player')">ألعب من هذا الجهاز</button>
      <button id="mode-display" onclick="setDeviceMode('display')">تحويله لشاشة عرض</button>
    </div>
  </div>

  <div class="field">
    <label>نوع اللعب</label>
    <div class="segment">
      <button class="active" id="play-solo" onclick="setPlayMode('solo')">فردي</button>
      <button id="play-team" onclick="setPlayMode('team')">فرق</button>
    </div>
  </div>

  <div class="field" id="count-field">
    <label id="count-label">عدد اللاعبين</label>
    <div class="counter">
      <button onclick="changeCount(-1)">−</button>
      <span class="val" id="count-val">4</span>
      <button onclick="changeCount(1)">+</button>
    </div>
    <p class="hint" id="count-hint">من 2 إلى 10 لاعبين</p>
  </div>

  <button class="primary-btn">إنشاء غرفة</button>
</div>

<!-- دخول لغرفة -->
<div class="panel" id="panel-join">
  <div class="field">
    <label>اسمك</label>
    <input type="text" placeholder="اكتب اسمك هنا">
  </div>
  <div class="field">
    <label>رقم الغرفة</label>
    <input type="text" placeholder="مثال: 4821">
  </div>
  <button class="primary-btn">دخول للغرفة</button>
</div>

<script>
let deviceMode = 'player';
let playMode = 'solo';
let soloCount = 4;
let teamCount = 2;

function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.currentTarget.classList.add('active');
}

function setDeviceMode(mode) {
  deviceMode = mode;
  document.getElementById('mode-player').classList.toggle('active', mode === 'player');
  document.getElementById('mode-display').classList.toggle('active', mode === 'display');
}

function setPlayMode(mode) {
  playMode = mode;
  document.getElementById('play-solo').classList.toggle('active', mode === 'solo');
  document.getElementById('play-team').classList.toggle('active', mode === 'team');
  updateCounterUI();
}

function updateCounterUI() {
  const label = document.getElementById('count-label');
  const hint = document.getElementById('count-hint');
  const val = document.getElementById('count-val');
  if (playMode === 'solo') {
    label.textContent = 'عدد اللاعبين';
    hint.textContent = 'من 2 إلى 10 لاعبين';
    val.textContent = soloCount;
  } else {
    label.textContent = 'عدد الفرق';
    hint.textContent = 'كل فريق لاعبان — بحد أقصى 5 فرق';
    val.textContent = teamCount + ' فرق (' + (teamCount*2) + ' لاعبين)';
  }
}

function changeCount(delta) {
  if (playMode === 'solo') {
    soloCount = Math.min(10, Math.max(2, soloCount + delta));
  } else {
    teamCount = Math.min(5, Math.max(1, teamCount + delta));
  }
  updateCounterUI();
}

updateCounterUI();
</script>

</body>
</html>
