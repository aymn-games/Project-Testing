  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2)\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;z-index:1\">\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px clamp(14px,4vw,52px);border-bottom:1px solid rgba(255,255,255,.07);background:rgba(6,6,10,.7);backdrop-filter:blur(16px);position:sticky;top:0;z-index:50\">\n    <a href=\"index.html\" style=\"display:flex;align-items:center;flex:none\">\n      <img src=\"00d630df-bc57-4a04-ad4f-cda36c3142a3\" alt=\"ألعاب أيمن\" style=\"display:block;height:44px;width:auto\">\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:clamp(10px,2vw,22px);font-size:14.5px;color:#a79fbb;flex-wrap:wrap\">\n      <a href=\"index.html\" style=\"color:#a79fbb;transition:color .25s\" style-hover=\"color:#ffffff\">الرئيسية<\u002Fa>\n      <a href=\"games.html\" style=\"color:#a79fbb;transition:color .25s\" style-hover=\"color:#ffffff\">الألعاب<\u002Fa>\n      <a href=\"index.html#community\" style=\"color:#a79fbb;transition:color .25s\" style-hover=\"color:#ffffff\">التواصل<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"padding:clamp(34px,5vw,64px) clamp(14px,4vw,52px) clamp(18px,2.5vw,26px);text-align:center\">\n    <div style=\"max-width:760px;margin:0 auto\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border:1px solid rgba(178,140,245,.32);background:rgba(122,63,212,.09);font-size:12.5px;color:#c6b4f2;border-radius:999px\">الصفحات التعريفية<\u002Fdiv>\n      <h1 style=\"margin:20px 0 0;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,46px);line-height:1.35;color:#f4f2fb\">{{ docTitle }}<\u002Fh1>\n      <p style=\"margin:14px auto 0;max-width:560px;font-size:15.5px;line-height:1.95;color:#968ea4\">{{ docIntro }}<\u002Fp>\n      <div style=\"display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:#8f88a3\">\n        <span style=\"padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)\">آخر تحديث: {{ updated }}<\u002Fspan>\n        <span style=\"padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)\">مدة القراءة: {{ readTime }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 clamp(14px,4vw,52px)\">\n    <sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ d.select }}\" style=\"padding:11px 20px;cursor:pointer;border-radius:999px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:14px;font-weight:600;transition:background .3s,color .3s,border-color .3s;border:1px solid {{ d.border }};background:{{ d.bg }};color:{{ d.fg }}\">{{ d.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:clamp(14px,2vw,22px);max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(14px,4vw,52px) clamp(56px,8vw,96px)\">\n\n    <aside style=\"flex:1 1 260px;min-width:min(100%,260px);position:sticky;top:96px;padding:20px;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(26,23,42,.92),rgba(9,9,15,.96))\">\n      <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:15px;font-weight:700;color:#f4f2fb\">محتويات الصفحة<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:14px\">\n        <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <a href=\"{{ t.href }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:13.5px;color:#a79fbb;transition:background .2s,color .2s\" style-hover=\"background:rgba(255,255,255,.05);color:#f4f2fb\">\n            <span style=\"flex:none;width:22px;font-size:12px;color:#7a3fd4\">{{ t.num }}<\u002Fspan>{{ t.label }}\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)\">\n        <div style=\"font-size:12.5px;line-height:1.9;color:#8f88a3\">عندك سؤال عن هذي الصفحة؟<\u002Fdiv>\n        <a href=\"index.html#community\" style=\"display:block;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid rgba(178,140,245,.35);background:rgba(122,63,212,.12);color:#c6b4f2;font-size:13px;text-align:center;transition:background .25s,color .25s\" style-hover=\"background:rgba(122,63,212,.26);color:#ffffff\">تواصل معنا<\u002Fa>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"flex:3 1 480px;min-width:min(100%,320px);display:flex;flex-direction:column;gap:14px;animation:{{ paneAnim }}\">\n      <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <article id=\"{{ s.id }}\" style=\"padding:clamp(18px,2.4vw,28px);border-radius:22px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(26,23,42,.9),rgba(9,9,15,.95));scroll-margin-top:110px\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(178,140,245,.35);background:rgba(122,63,212,.12);font-size:13px;color:#c6b4f2\">{{ s.num }}<\u002Fspan>\n            <span style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:clamp(17px,2.2vw,21px);font-weight:700;line-height:1.5;color:#f4f2fb\">{{ s.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:15px;line-height:2.05;color:#b9b2c9;text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px\">\n            <sc-for list=\"{{ s.points }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:start;gap:11px;font-size:14px;line-height:1.95;color:#c3bad6\">\n                <span style=\"flex:none;width:6px;height:6px;margin-top:11px;background:#b28cf5;transform:rotate(45deg)\"><\u002Fspan>{{ p }}\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ s.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:14px 16px;border-radius:14px;border:1px dashed rgba(178,140,245,.3);background:rgba(122,63,212,.06);font-size:13.5px;line-height:1.95;color:#c6b4f2\">{{ s.note }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Farticle>\n      <\u002Fsc-for>\n\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:22px clamp(18px,2.4vw,26px);border-radius:22px;border:1px solid rgba(178,140,245,.28);background:linear-gradient(135deg,rgba(58,36,104,.7),rgba(11,10,18,.94))\">\n        <div>\n          <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:17px;font-weight:700;color:#f4f2fb\">محتاج توضيح أكثر؟<\u002Fdiv>\n          <p style=\"margin:8px 0 0;max-width:460px;font-size:14px;line-height:1.9;color:#968ea4\">فريق الدعم متاح، وأي تحديث على هذي الصفحة ننشره مع تاريخه.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"index.html#community\" style=\"padding:13px 26px;border-radius:999px;background:#7a3fd4;color:#f3ecff;font-weight:600;font-size:14.5px;transition:background .25s,transform .25s\" style-hover=\"background:#9a6cf0;color:#f3ecff;transform:translateY(-2px)\">راسل الدعم<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <footer style=\"padding:clamp(30px,4vw,46px) clamp(14px,4vw,52px) 30px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px\">\n    <img src=\"00d630df-bc57-4a04-ad4f-cda36c3142a3\" alt=\"ألعاب أيمن\" style=\"display:block;height:42px;width:auto;opacity:.9\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#8f88a3\">\n      <sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <a href=\"#\" sc-camel-on-click=\"{{ d.select }}\" style=\"color:#8f88a3;transition:color .25s\" style-hover=\"color:#b28cf5\">{{ d.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"font-size:12.5px;color:#5f677a\">© ٢٠٢٦ ألعاب أيمن<\u002Fspan>\n  <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { doc: \"terms\", tick: 0 };\n\n  setDoc(d) {\n    if (d !== this.state.doc) this.setState(s => ({ doc: d, tick: (s.tick || 0) + 1 }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const ar = (n) => String(n).replace(/[0-9]/g, d => \"٠١٢٣٤٥٦٧٨٩\"[d]);\n\n    const docs = {\n      terms: {\n        label: \"شروط الاستخدام\",\n        title: \"شروط الاستخدام\",\n        intro: \"القواعد اللي تنظّم استخدامك للمنصة وألعابها، مكتوبة بلغة واضحة وبدون تعقيد.\",\n        updated: \"١ سبتمبر ٢٠٢٦\", readTime: \"٤ دقائق\",\n        sections: [\n          { title: \"قبول الشروط\", body: \"باستخدامك للمنصة تكون موافق على هذي الشروط. إذا ما كنت موافق، ما تقدر تستخدم الخدمة.\", points: [\"الاستخدام متاح لكل الأعمار مع موافقة ولي الأمر لمن هم أقل من ١٨.\", \"أي تحديث على الشروط ينشر في هذي الصفحة مع تاريخه.\"] },\n          { title: \"الحساب ومسؤوليتك عنه\", body: \"حسابك مسؤوليتك، وأنت المسؤول عن كل نشاط يصدر منه.\", points: [\"ممنوع مشاركة بيانات الدخول مع أي شخص.\", \"بلّغنا فوراً عند أي استخدام غير مصرّح لحسابك.\", \"المعلومات المسجّلة لازم تكون صحيحة ومحدّثة.\"] },\n          { title: \"الاستخدام المقبول\", body: \"المنصة مساحة ترفيهية للجميع، وفيه تصرفات ما نسمح بها.\", points: [\"ممنوع الغش أو استخدام برامج تعديل النتائج.\", \"ممنوع الإساءة أو التحريض أو نشر محتوى مخالف.\", \"ممنوع محاولة تعطيل الخدمة أو اختراقها.\"], note: \"مخالفة هذي البنود قد تؤدي لإيقاف الحساب بدون إشعار مسبق.\" },\n          { title: \"المحتوى والملكية\", body: \"الألعاب والتصاميم والشعارات مملوكة للمنصة، أما المحتوى اللي تنشره أنت يبقى لك.\", points: [\"تمنحنا حق عرض محتواك داخل المنصة فقط.\", \"أفكار الألعاب المشاركة تُنسب لأصحابها في صفحة شركاء الإبداع.\"] },\n          { title: \"الاشتراكات والمدفوعات\", body: \"المنصة مفتوحة بدون اشتراك شهري إلزامي.\", points: [\"أي خدمة مدفوعة مستقبلاً تُعلن بسعرها بوضوح قبل الشراء.\", \"الهدايا والدعم تُعالج عبر مزوّدي الدفع بشروطهم.\"] },\n          { title: \"إيقاف الخدمة والتعديلات\", body: \"نحتفظ بحق تعديل أو إيقاف أي ميزة، مع إشعار مسبق عند الإمكان.\", points: [\"قد نغيّر الألعاب المتاحة أو نضيف ألعاب جديدة.\", \"استمرارك في الاستخدام بعد التعديل يعني موافقتك عليه.\"] }\n        ]\n      },\n      privacy: {\n        label: \"سياسة الخصوصية\",\n        title: \"سياسة الخصوصية\",\n        intro: \"وش نجمع من بياناتك، ليش نجمعه، وكيف تتحكم فيه.\",\n        updated: \"١ سبتمبر ٢٠٢٦\", readTime: \"٥ دقائق\",\n        sections: [\n          { title: \"البيانات اللي نجمعها\", body: \"نجمع الحد الأدنى اللي يشغّل الخدمة.\", points: [\"بيانات الحساب: الاسم، البريد، اسم المستخدم.\", \"بيانات اللعب: الجولات، النقاط، الإنجازات.\", \"بيانات تقنية: نوع الجهاز والمتصفح لأغراض الأداء.\"] },\n          { title: \"كيف نستخدم البيانات\", body: \"نستخدم البيانات لتشغيل المنصة وتحسين التجربة.\", points: [\"حفظ تقدّمك ونقاطك وترتيبك.\", \"منع الغش والحسابات المزيفة.\", \"إشعارات الخدمة والتحديثات المهمة.\"], note: \"ما نبيع بياناتك لأي طرف ثالث، ولا نستخدمها لإعلانات مستهدفة.\" },\n          { title: \"الربط مع المنصات الأخرى\", body: \"عند ربط حسابك بمنصة بث، نستلم فقط البيانات اللازمة للربط.\", points: [\"اسم المستخدم العام والصورة.\", \"بيانات التفاعل المطلوبة لتشغيل اللعبة على بثك.\", \"تقدر تلغي الربط في أي وقت من صفحة حسابك.\"] },\n          { title: \"ملفات تعريف الارتباط\", body: \"نستخدم الكوكيز لحفظ جلستك وتفضيلاتك.\", points: [\"كوكيز أساسية لتسجيل الدخول.\", \"كوكيز تحليلية مجمّعة بدون هوية شخصية.\"] },\n          { title: \"حقوقك في بياناتك\", body: \"بياناتك لك، وتقدر تتحكم فيها.\", points: [\"طلب نسخة من بياناتك.\", \"تصحيح أي معلومة غير دقيقة.\", \"حذف حسابك وبياناتك بشكل نهائي.\"] },\n          { title: \"حماية البيانات ومدة الحفظ\", body: \"نحفظ البيانات مشفّرة ولمدة الحاجة فقط.\", points: [\"الوصول محدود لفريق مصرّح له.\", \"تُحذف بيانات الحساب المحذوف خلال ٣٠ يوم.\"] }\n        ]\n      },\n      rules: {\n        label: \"قواعد المجتمع\",\n        title: \"قواعد المجتمع\",\n        intro: \"كيف نحافظ على جو نظيف وممتع للجميع داخل الألعاب والبثوث.\",\n        updated: \"١ سبتمبر ٢٠٢٦\", readTime: \"٣ دقائق\",\n        sections: [\n          { title: \"الاحترام أولاً\", body: \"الاختلاف طبيعي، والإساءة ما لها مكان.\", points: [\"ممنوع السخرية من الأشخاص أو الفئات.\", \"ممنوع التهديد أو التحريض على أي شخص.\"] },\n          { title: \"اللعب النظيف\", body: \"الفوز يكون بمهارتك، مو بالاستغلال.\", points: [\"ممنوع استغلال الأخطاء البرمجية.\", \"ممنوع التنسيق المسبق للنتائج.\"], note: \"الغش المتكرر يؤدي لحذف النقاط والإطارات المكتسبة.\" },\n          { title: \"المحتوى داخل البث\", body: \"الألعاب تظهر لجمهور واسع، فالمحتوى لازم يكون مناسب.\", points: [\"ممنوع المحتوى المخالف للأنظمة أو للأعراف.\", \"احترم قوانين المنصة اللي تبث عليها.\"] },\n          { title: \"الإبلاغ والعقوبات\", body: \"أي مخالفة تُراجع من فريق المجتمع.\", points: [\"بلّغ عن أي سلوك مخالف من داخل اللعبة.\", \"العقوبات تتدرّج من تنبيه إلى إيقاف دائم.\"] }\n        ]\n      },\n      about: {\n        label: \"عن المنصة\",\n        title: \"عن المنصة\",\n        intro: \"منصة ألعاب تفاعلية لصنّاع المحتوى وجمهورهم، بروح وبصمة سعودية.\",\n        updated: \"١ سبتمبر ٢٠٢٦\", readTime: \"٢ دقيقة\",\n        sections: [\n          { title: \"وش نسوي\", body: \"نصنع ألعاب يشارك فيها الجمهور مباشرة من بث صانع المحتوى، بدون تحميل أي تطبيق.\", points: [\"ألعاب سريعة تشتغل من المتصفح.\", \"تفاعل مباشر عبر التعليقات والهدايا.\"] },\n          { title: \"ليش غيّرنا المعادلة\", body: \"ما جينا نربطك باشتراكات شهرية. المنصة مفتوحة لك، والهدف تنبسط بلا قيود.\", points: [\"كل الألعاب متاحة للجميع.\", \"الدعم اختياري، مو شرط للعب.\"] },\n          { title: \"المجتمع شريكنا\", body: \"أفكار كثيرة من اللاعبين والستريمرز صارت ألعاب فعلية على المنصة.\", points: [\"أصحاب الأفكار تلقاهم في صفحة شركاء الإبداع.\", \"باب الأفكار مفتوح دائماً عبر التواصل.\"] }\n        ]\n      }\n    };\n\n    const cur = docs[s.doc];\n    const keys = [\"terms\", \"privacy\", \"rules\", \"about\"];\n\n    return {\n      docs: keys.map(k => ({\n        label: docs[k].label,\n        bg: s.doc === k ? \"#7a3fd4\" : \"rgba(255,255,255,.04)\",\n        fg: s.doc === k ? \"#f3ecff\" : \"#a79fbb\",\n        border: s.doc === k ? \"#7a3fd4\" : \"rgba(255,255,255,.12)\",\n        select: () => this.setDoc(k)\n      })),\n      docTitle: cur.title,\n      docIntro: cur.intro,\n      updated: cur.updated,\n      readTime: cur.readTime,\n      paneAnim: (((s.tick || 0) % 2) === 0 ? \"l-riseA\" : \"l-riseB\") + \" .45s cubic-bezier(.22,1,.36,1) both\",\n      toc: cur.sections.map((sec, i) => ({\n        num: ar(i + 1), label: sec.title, href: \"#sec-\" + s.doc + \"-\" + i\n      })),\n      sections: cur.sections.map((sec, i) => ({\n        id: \"sec-\" + s.doc + \"-\" + i,\n        num: ar(i + 1),\n        title: sec.title,\n        body: sec.body,\n        points: sec.points || [],\n        hasNote: !!sec.note,\n        note: sec.note || \"\"\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
