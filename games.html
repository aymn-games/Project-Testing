document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<script>
(function(){
  var REAL_GAMES = [{"id": "codenames", "title": "🕵️ كود نيمز (Codenames)", "desc": "فريقان (أحمر وأزرق) وسباي ماستر لكل فريق يشوف خريطة الكلمات السرية عبر رابط QR خاص بجواله. يعطي السباي ماستر تلميحًا بكلمة واحدة ورقم، والفريق يخمّن الكلمات.", "cover": "codenames-cover.png", "href": "games/codenames/index.html"}, {"id": "photo-challenge", "title": "🖼️ تحدي الصور (Photo Challenge)", "desc": "فريقان يتنافسان بكلمة مفتاحية منفصلة لكل فريق. كل جولة تظهر صورة تحدي، وأول لاعب يكتب الإجابة الصحيحة بالشات يسجّل نقطة لفريقه.", "cover": "photo-challenge-cover.png", "href": "games/photo-challenge/index.html"}, {"id": "khazna", "title": "🔐 الخزنة (Khazna)", "desc": "كل جولة تدور عجلة وتحدد لاعب مستهدف، وتطلع ساعات مرقّمة من الخزنة. اكتب أرقام الساعات بالترتيب بالشات برسالة وحدة.", "cover": "khazna-cover.png", "href": "games/khazna/index.html"}, {"id": "team-war", "title": "⚔️ حرب الفريقين (Team War)", "desc": "فريقان (أزرق وأحمر) يتنافسان بالنقاط. المشاهدين ينضمون بكومنت مباشر بكلمة فريقهم، وكل لاعب بدوره يكتب رقم مربع بالشات ليفتحه.", "cover": "team-war-cover.png", "href": "games/team-war/index.html"}, {"id": "elimination-roulette", "title": "🎡 روليت الإقصاء (Elimination Roulette)", "desc": "عجلة تدور وتتوقف عند أحد اللاعبين، فيختار رقم لاعب آخر يقصيه من شات البث.", "cover": "elimination-roulette-cover.png", "href": "games/elimination-roulette/index.html"}, {"id": "tribe-roulette", "title": "🏹 روليت القبائل (Tribe Roulette)", "desc": "عجلة تختار لاعباً يدوّر عليه الدور، فتظهر له قبائل تخفي خلفها بقية اللاعبين — يختار رقم قبيلة من الشات ليقصي من خلفها.", "cover": "tribe-roulette-cover.png", "href": "games/tribe-roulette/index.html"}, {"id": "russian-roulette", "title": "🔫 روليت الروسي (Russian Roulette)", "desc": "عجلة أو بكرة سكرول تختار لاعباً يدوّر عليه الدور، فيختار رقم لاعب آخر من شات البث يستهدفه.", "cover": "russian-roulette-cover.png", "href": "games/russian-roulette/index.html"}, {"id": "fruit-roulette", "title": "🍉 روليت الفواكه (Fruit Roulette)", "desc": "عجلة تدور وتتوقف عند أحد اللاعبين، فيفتح صندوقاً من أربعة بكتابة رقمه في شات البث. ثلاثة صناديق آمنة تحتوي فاكهة، وواحد أو أكثر يخفي مفاجأة.", "cover": "fruit-roulette-cover.png", "href": "games/fruit-roulette/index.html"}, {"id": "musical-chairs", "title": "🎵 الكراسي الموسيقية (Musical Chairs)", "desc": "تدور الأفاتارات حول حلقة الكراسي، وفجأة تتوقف الموسيقى وتظهر أرقام على كل كرسي. أول وحد يكتب الرقم الصحيح يفوز.", "cover": "musical-chairs-cover.png", "href": "games/musical-chairs/index.html"}, {"id": "word-categories", "title": "🔤 اسم و حيوان و نبات و جماد و بلاد", "desc": "حرف عربي عشوائي كل جولة، واللاعبون يكتبون إجاباتهم بشات البث خلال وقت محدد. بعد انتهاء الوقت يراجع المضيف كل إجابة ويقبلها.", "cover": "word-categories-cover.png", "href": "games/word-categories/index.html"}, {"id": "top-ten", "title": "🏆 خمّن العشرة", "desc": "سؤال واحد كل جولة وعشرة صناديق مرتبة من الأهم للأقل أهمية — الصندوق رقم 1 يساوي 10 نقاط وينزل تدريجياً.", "cover": "top-ten-cover.png", "href": "games/top-ten/index.html"}];
  var REAL_HREFS = REAL_GAMES.map(function(g){ return g.href; });

  function isAlreadyReal(grid){
    if (!grid) return false;
    var links = grid.querySelectorAll('a');
    if (links.length !== REAL_GAMES.length) return false;
    for (var i = 0; i < links.length; i++){
      if (REAL_HREFS.indexOf(links[i].getAttribute('href')) === -1) return false;
    }
    return true;
  }

  function findGrid(){
    var covers = document.querySelectorAll('div[style*="aspect-ratio"]');
    if (!covers.length) return null;
    var wrapper = covers[0].parentElement;
    return wrapper ? wrapper.parentElement : null;
  }

  var applying = false;
  var observer;

  function rebuild(){
    if (applying) return;
    var grid = findGrid();
    if (!grid || isAlreadyReal(grid)) return;
    applying = true;
    if (observer) observer.disconnect();

    grid.innerHTML = '';
    REAL_GAMES.forEach(function(g){
      var card = document.createElement('div');
      card.style.cssText = 'display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(32,28,51,.85),rgba(11,10,18,.94));box-shadow:0 30px 60px -46px rgba(0,0,0,1);';

      var cover = document.createElement('div');
      cover.style.cssText = 'position:relative;aspect-ratio:16/10;background-size:cover;background-position:center;background-color:#171228;background-image:url(\'' + g.cover + '\');';
      card.appendChild(cover);

      var body = document.createElement('div');
      body.style.cssText = 'display:flex;flex-direction:column;flex:1;padding:20px 20px 18px;';

      var titleSpan = document.createElement('span');
      titleSpan.style.cssText = 'font-family:\'Noto Kufi Arabic\',sans-serif;font-size:18px;font-weight:700;color:#f4f2fb;display:block;';
      titleSpan.textContent = g.title;
      body.appendChild(titleSpan);

      var desc = document.createElement('p');
      desc.style.cssText = 'margin:10px 0 0;font-size:14px;line-height:1.85;color:#968ea4;';
      desc.textContent = g.desc;
      body.appendChild(desc);

      var ctaRow = document.createElement('div');
      ctaRow.style.cssText = 'margin-top:auto;padding-top:18px;';
      var cta = document.createElement('a');
      cta.href = g.href;
      cta.textContent = 'العب الآن';
      cta.style.cssText = 'display:inline-block;padding:10px 20px;border-radius:999px;background:#7a3fd4;border:1px solid #7a3fd4;color:#f3ecff;font-size:13.5px;font-weight:600;transition:transform .25s;';
      cta.addEventListener('mouseenter', function(){ cta.style.transform = 'translateY(-2px)'; });
      cta.addEventListener('mouseleave', function(){ cta.style.transform = 'none'; });
      ctaRow.appendChild(cta);
      body.appendChild(ctaRow);

      card.appendChild(body);
      grid.appendChild(card);
    });

    var allDivs = Array.prototype.slice.call(document.querySelectorAll('div'));
    var countLabel = allDivs.find(function(d){ return /لعبة معروضة/.test(d.textContent || '') && d.textContent.length < 30; });
    if (countLabel) countLabel.textContent = 'الألعاب الـ 11 الحقيقية بالمنصة';
    var filterRows = allDivs.filter(function(d){
      return d.children.length >= 4 && Array.prototype.every.call(d.children, function(c){ return c.tagName === 'BUTTON'; });
    });
    filterRows.forEach(function(row){ row.style.display = 'none'; });

    applying = false;
    if (observer) observer.observe(document.body, { childList: true, subtree: true });
  }

  observer = new MutationObserver(function(){
    clearTimeout(window.__rgTimer);
    window.__rgTimer = setTimeout(rebuild, 150);
  });
  observer.observe(document.body, { childList: true, subtree: true });

  setTimeout(rebuild, 300);
  setTimeout(rebuild, 1200);
  setTimeout(rebuild, 3000);
})();
</script>

<script>
  // [أداء حرج] نفس السبب اللي شخّصناه بـ index.html: هيدر sticky مع
  // backdrop-filter:blur() + طبقات خلفية متحركة مموَّهة (g-aurora،
  // g-pulse) — كل تمرير يجبر المتصفح يعيد رسم البلور، وهذا يسبب تهنيج
  // ملموس بالتمرير. نفس الإصلاح: نوقف الحركات الزخرفية، ونستبدل بلور
  // الهيدر بخلفية شبه معتمة بدون بلور.
  function applyGamesPerfFix(){
    var AMBIENT_ANIMS = ['g-aurora', 'g-pulse'];
    Array.prototype.slice.call(document.querySelectorAll('*')).forEach(function(e){
      if (e.dataset.ambientDisabled) return;
      var animName = getComputedStyle(e).animationName;
      if (AMBIENT_ANIMS.indexOf(animName) !== -1) {
        e.style.animation = 'none';
        e.dataset.ambientDisabled = '1';
      }
    });
    var header = document.querySelector('header');
    if (header && !header.dataset.perfFixed) {
      header.dataset.perfFixed = '1';
      header.style.backdropFilter = 'none';
      header.style.webkitBackdropFilter = 'none';
      header.style.background = 'rgba(10,9,16,.92)';
    }
  }
  // [إصلاح باگ حقيقي] نفس دالة الأداء كانت تُستدعى مرتين فقط بتوقيت
  // ثابت — لو تأخر تركيب الصفحة الحقيقية أكثر من هالوقت ما تنطبق أبداً.
  // نكررها كل ٣٠٠ مللي ثانية لمدة ٩ ثوانٍ تقريباً؛ الدالة نفسها محمية
  // بـdataset فلا تكلفة إضافية بعد أول نجاح.
  var __perfTries = 0;
  var __perfTimer = setInterval(function(){
    __perfTries++;
    applyGamesPerfFix();
    if (__perfTries >= 30) clearInterval(__perfTimer);
  }, 300);

  // [هيدر الجوال] نفس إصلاح index.html — تحت 900px نلفّ الهيدر، وتحت
  // 480px نستبدل nav وزر الحساب بزر ثلاث شرطات يفتح قائمة منسدلة.
  function applyHeaderResponsive(){
    var w = window.innerWidth;
    var isNarrow = w <= 900;
    var isMobile = w <= 480;

    var header = document.querySelector('header');
    if (header) {
      if (isNarrow) {
        header.style.flexWrap = 'wrap';
        header.style.justifyContent = 'center';
        header.style.rowGap = '12px';
        header.style.borderRadius = '26px';
        header.style.padding = '14px 16px';
      } else {
        header.style.flexWrap = '';
        header.style.justifyContent = 'space-between';
        header.style.rowGap = '';
        header.style.borderRadius = '999px';
        header.style.padding = '12px 20px 12px 14px';
      }
    }

    var nav = document.querySelector('nav');
    if (nav) {
      nav.style.columnGap = '35px';
      nav.style.rowGap = isNarrow ? '10px' : '35px';
      if (isNarrow) {
        nav.style.order = '3';
        nav.style.width = '100%';
        nav.style.flexWrap = 'wrap';
        nav.style.justifyContent = 'center';
      } else {
        nav.style.order = '';
        nav.style.width = '';
        nav.style.flexWrap = '';
        nav.style.justifyContent = '';
      }
    }

    if (!header || !nav) return;

    var accountLink = Array.prototype.slice.call(header.children).find(function(e){
      return e.tagName === 'A' && e !== nav.parentElement && header.children[0] !== e &&
        Array.prototype.indexOf.call(header.children, e) > Array.prototype.indexOf.call(header.children, nav);
    });
    var burger = header.querySelector('[data-burger]');

    if (isMobile) {
      nav.style.display = 'none';
      if (accountLink) accountLink.style.display = 'none';
      if (!burger) {
        burger = document.createElement('button');
        burger.setAttribute('data-burger', '1');
        burger.setAttribute('aria-label', 'القائمة');
        burger.style.cssText = 'flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(178,140,245,.35);background:rgba(122,63,212,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;order:2;';
        for (var bi = 0; bi < 3; bi++) {
          var line = document.createElement('span');
          line.style.cssText = 'display:block;width:18px;height:2px;background:#c6b4f2;border-radius:2px;transition:transform .25s,opacity .25s;';
          burger.appendChild(line);
        }
        header.appendChild(burger);
        burger.addEventListener('click', function(){
          var panel = document.querySelector('[data-mobile-panel]');
          var open = panel && panel.style.display !== 'none';
          if (open) {
            panel.style.display = 'none';
            burger.children[0].style.transform = '';
            burger.children[1].style.opacity = '1';
            burger.children[2].style.transform = '';
            return;
          }
          if (!panel) {
            panel = document.createElement('div');
            panel.setAttribute('data-mobile-panel', '1');
            panel.style.cssText = 'margin-top:10px;border-radius:20px;border:1px solid rgba(178,140,245,.25);background:linear-gradient(180deg,#1a1526,#0d0b14);box-shadow:0 24px 60px -30px rgba(122,63,212,.6);overflow:hidden;pointer-events:auto;position:relative;z-index:61;';
            header.insertAdjacentElement('afterend', panel);
          }
          panel.innerHTML = '';
          Array.prototype.slice.call(nav.querySelectorAll('a')).forEach(function(a){
            var clone = a.cloneNode(true);
            clone.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:15px 20px;color:#e7e9ee;text-decoration:none;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;';
            panel.appendChild(clone);
          });
          if (accountLink) {
            var ctaWrap = document.createElement('div');
            ctaWrap.style.cssText = 'padding:14px;';
            var ctaClone = accountLink.cloneNode(true);
            ctaClone.style.cssText = 'display:block;text-align:center;padding:13px;border-radius:999px;background:linear-gradient(135deg,#7a3fd4,#b28cf5);color:#f3ecff;font-weight:600;font-size:14.5px;';
            ctaWrap.appendChild(ctaClone);
            panel.appendChild(ctaWrap);
          }
          panel.style.display = 'block';
          burger.children[0].style.transform = 'translateY(6px) rotate(45deg)';
          burger.children[1].style.opacity = '0';
          burger.children[2].style.transform = 'translateY(-6px) rotate(-45deg)';
        });
      }
    } else {
      nav.style.display = 'flex';
      if (accountLink) accountLink.style.display = 'inline-flex';
      if (burger) burger.remove();
      var existingPanel = document.querySelector('[data-mobile-panel]');
      if (existingPanel) existingPanel.remove();
    }
  }
  window.addEventListener('resize', applyHeaderResponsive);
  var __hdrTries = 0;
  var __hdrTimer = setInterval(function(){
    __hdrTries++;
    applyHeaderResponsive();
    if (__hdrTries >= 30) clearInterval(__hdrTimer);
  }, 300);

  // [مطابقة الهيدر مع الرئيسية] نفس منطق patchLinks بـindex.html —
  // زر الحساب يتبدّل حسب حالة تسجيل الدخول، ورابط "دعم المنصة" يتحول
  // لرابط creators.sa خارجي مع استنساخ رابط "الإطارات". كانت هذي
  // الصفحة بدون أي من هالمنطق أصلاً (زر الحساب رابطه #catalog، ولا
  // يوجد رابط شركاء الإبداع أو الإطارات إطلاقاً).
  function patchGamesLinks(){
    var cachedUser = null;
    try { cachedUser = window.AGPAuth && window.AGPAuth.getCachedUser ? window.AGPAuth.getCachedUser() : null; } catch (e) {}
    var isLoggedIn = Boolean(cachedUser && cachedUser.custom_id);
    var accountLink = Array.prototype.slice.call(document.querySelectorAll('header a'))
      .find(function(a){ var t = (a.textContent || '').trim(); return t === 'حسابي' || t === 'إنشاء حساب أو تسجيل الدخول'; });
    if (accountLink) {
      if (isLoggedIn) {
        accountLink.textContent = 'حسابي';
        accountLink.setAttribute('href', 'profile.html?id=' + encodeURIComponent(cachedUser.custom_id));
      } else {
        accountLink.textContent = 'إنشاء حساب أو تسجيل الدخول';
        accountLink.setAttribute('href', 'login.html');
      }
    }

    var supportLink = Array.prototype.slice.call(document.querySelectorAll('nav a'))
      .find(function(a){ return a.textContent.trim() === 'دعم المنصة'; });
    if (supportLink && !supportLink.dataset.patched) {
      supportLink.setAttribute('href', 'https://creators.sa/aymngame');
      supportLink.setAttribute('target', '_blank');
      supportLink.dataset.patched = '1';
      if (!document.querySelector('nav a[data-frames-link]')) {
        var framesLink = supportLink.cloneNode(true);
        framesLink.textContent = 'الإطارات';
        framesLink.setAttribute('href', 'https://aymngames.zid.store/');
        framesLink.setAttribute('target', '_blank');
        framesLink.setAttribute('data-frames-link', '1');
        supportLink.parentNode.insertBefore(framesLink, supportLink.nextSibling);
      }
    }
  }
  var __linkTries = 0;
  var __linkTimer = setInterval(function(){
    __linkTries++;
    patchGamesLinks();
    if (__linkTries >= 30) clearInterval(__linkTimer);
  }, 300);

  // [اتصال حقيقي بالبث] استبدلنا بطاقة "اتصل بالبث" التفاعلية المزيَّفة
  // (كانت تقبل أي نص غير فارغ وتضبط conn:true فوراً بلا أي تحقق) بنسخة
  // ساكنة (راجع القالب) يديرها هذا الكود مباشرة عبر نفس بروتوكول
  // WebSocket الحقيقي المستخدَم فعلياً بلوحة التحكم
  // (adapters/agp-tiktok-adapter.js + backend/platforms/tiktok/tiktok-connector.js
  // + backend/websocket/ws-server.js) — الخادم الخلفي هو من يتحقق فعلياً
  // عبر مكتبة tiktok-live-connector أن الحساب يبث الآن قبل أي رد
  // 'connected'؛ أي يوزر عشوائي أو غير مباشر يرجع 'error' فوراً بلا أي
  // إعادة محاولة تلقائية (نفس سلوك الموصِّل الحقيقي). هذه الصفحة لا
  // تحمّل سلسلة سكربتات AGP.* أصلاً، فبدل استيرادها كاملة لميزة مستقلة
  // لا تحتاج جلسة/لوبي، نكلّم نفس نقطة الخادم مباشرة ببروتوكول مطابق
  // تماماً لما توثّقه تلك الملفات.
  var BACKEND_WS_URL = 'wss://project-testing-akds.onrender.com';
  var connectSocket = null;
  var connectState = 'idle'; // idle | connecting | connected | error
  var connectUsername = '';
  var connectErrorMsg = '';

  function ensureConnectStyles(){
    if (document.getElementById('agp-connect-styles')) return;
    var style = document.createElement('style');
    style.id = 'agp-connect-styles';
    style.textContent = '@keyframes agpConnectPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}';
    document.head.appendChild(style);
  }

  function closeConnectSocketSilently(){
    if (connectSocket) {
      var s = connectSocket;
      connectSocket = null;
      s.onopen = null; s.onmessage = null; s.onerror = null; s.onclose = null;
      try { s.close(); } catch (e) {}
    }
  }

  function renderConnectUI(){
    var card = document.querySelector('[data-connect-card]');
    if (!card) return;
    var dot = card.querySelector('[data-connect-dot]');
    var note = card.querySelector('[data-connect-note]');
    var controls = card.querySelector('[data-connect-controls]');
    if (!dot || !note || !controls) return;

    var palette = {
      idle:       { bg: '#5f5a70', glow: 'none', border: 'rgba(255,255,255,.09)' },
      connecting: { bg: '#f5a623', glow: '0 0 10px 2px rgba(245,166,35,.55)', border: 'rgba(245,166,35,.35)' },
      connected:  { bg: '#22c55e', glow: '0 0 10px 2px rgba(34,197,94,.55)', border: 'rgba(34,197,94,.35)' },
      error:      { bg: '#ef4444', glow: '0 0 10px 2px rgba(239,68,68,.45)', border: 'rgba(239,68,68,.35)' }
    };
    var p = palette[connectState] || palette.idle;
    dot.style.background = p.bg;
    dot.style.boxShadow = p.glow;
    dot.style.animation = connectState === 'connecting' ? 'agpConnectPulse 1s ease-in-out infinite' : 'none';
    card.style.borderColor = p.border;

    var noteText = {
      idle: 'اكتب يوزر البث عشان نتحقق منه ونربط الألعاب فيه',
      connecting: 'جاري التحقق من إن الحساب يبث الآن...',
      connected: 'متصل الآن ببث @' + connectUsername + ' ✓',
      error: connectErrorMsg || 'تعذر التحقق من البث'
    };
    note.textContent = noteText[connectState] || noteText.idle;
    note.style.color = connectState === 'error' ? '#f5a3a3' : (connectState === 'connected' ? '#8fe3af' : '#968ea4');

    controls.innerHTML = '';

    if (connectState === 'connected') {
      var badge = document.createElement('span');
      badge.textContent = '@' + connectUsername;
      badge.style.cssText = 'padding:8px 14px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#8fe3af;font-size:13.5px;font-weight:600;';
      var disconnectBtn = document.createElement('button');
      disconnectBtn.type = 'button';
      disconnectBtn.textContent = 'قطع الاتصال';
      disconnectBtn.style.cssText = 'padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#e7e9ee;font-size:13.5px;font-weight:600;cursor:pointer;';
      disconnectBtn.addEventListener('click', disconnectFromBackend);
      controls.appendChild(badge);
      controls.appendChild(disconnectBtn);
      return;
    }

    if (connectState === 'connecting') {
      var connectingBtn = document.createElement('button');
      connectingBtn.type = 'button';
      connectingBtn.disabled = true;
      connectingBtn.textContent = 'جاري الاتصال...';
      connectingBtn.style.cssText = 'padding:9px 20px;border-radius:999px;border:1px solid rgba(245,166,35,.35);background:rgba(245,166,35,.12);color:#f5c98a;font-size:13.5px;font-weight:600;cursor:progress;opacity:.9;';
      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'إلغاء';
      cancelBtn.style.cssText = 'padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#968ea4;font-size:13px;cursor:pointer;';
      cancelBtn.addEventListener('click', function(){
        closeConnectSocketSilently();
        connectState = 'idle';
        renderConnectUI();
      });
      controls.appendChild(connectingBtn);
      controls.appendChild(cancelBtn);
      return;
    }

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'يوزر التيك توك (بدون @)';
    input.setAttribute('dir', 'ltr');
    input.setAttribute('autocomplete', 'off');
    input.style.cssText = 'flex:1 1 160px;min-width:140px;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#f4f2fb;font-size:13.5px;outline:none;';

    var submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'nl-btn-glossy';
    submitBtn.textContent = 'اتصال';
    submitBtn.style.cssText = 'padding:9px 20px;border-radius:999px;border:none;background:linear-gradient(135deg,#7a3fd4,#b28cf5);color:#f3ecff;font-size:13.5px;font-weight:700;cursor:pointer;';
    submitBtn.addEventListener('click', function(){ handleConnectSubmit(input.value); });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); handleConnectSubmit(input.value); }
    });

    controls.appendChild(input);
    controls.appendChild(submitBtn);
    input.focus();
  }

  function handleConnectSubmit(rawValue){
    var username = (rawValue || '').trim().replace(/^@+/, '');
    if (!username) {
      connectState = 'error';
      connectErrorMsg = 'اكتب يوزر البث أولاً';
      renderConnectUI();
      return;
    }
    if (!/^[a-zA-Z0-9._]{2,24}$/.test(username)) {
      connectState = 'error';
      connectErrorMsg = 'صيغة اليوزر غير صحيحة';
      renderConnectUI();
      return;
    }
    connectToBackend(username);
  }

  function connectToBackend(username){
    connectUsername = username;
    connectErrorMsg = '';
    connectState = 'connecting';
    renderConnectUI();

    closeConnectSocketSilently();
    try {
      connectSocket = new WebSocket(BACKEND_WS_URL);
    } catch (e) {
      connectState = 'error';
      connectErrorMsg = 'تعذر فتح الاتصال بالخادم';
      renderConnectUI();
      return;
    }

    connectSocket.onopen = function(){
      if (connectState !== 'connecting' || !connectSocket) return;
      connectSocket.send(JSON.stringify({
        type: 'connect',
        payload: { platform: 'tiktok', username: username, followersOnly: false },
        timestamp: Date.now()
      }));
    };

    connectSocket.onmessage = function(event){
      var envelope;
      try { envelope = JSON.parse(event.data); } catch (e) { return; }
      if (!envelope || !envelope.type || !envelope.payload) return;

      if (envelope.type === 'status') {
        var status = envelope.payload.status;
        if (status === 'connecting') {
          connectState = 'connecting';
          renderConnectUI();
        } else if (status === 'connected') {
          connectState = 'connected';
          renderConnectUI();
        } else if (status === 'error') {
          connectState = 'error';
          connectErrorMsg = envelope.payload.message || 'الحساب غير موجود أو غير مباشر الآن — تأكد إنه يبث فعلاً';
          closeConnectSocketSilently();
          renderConnectUI();
        } else if (status === 'disconnected') {
          connectState = 'idle';
          connectUsername = '';
          closeConnectSocketSilently();
          renderConnectUI();
        }
      } else if (envelope.type === 'error') {
        connectState = 'error';
        connectErrorMsg = envelope.payload.message || 'حدث خطأ أثناء الاتصال بالخادم';
        closeConnectSocketSilently();
        renderConnectUI();
      }
    };

    connectSocket.onerror = function(){
      if (connectState === 'connecting' || connectState === 'connected') {
        connectState = 'error';
        connectErrorMsg = 'تعذر الوصول لخادم البث، حاول مرة ثانية';
        renderConnectUI();
      }
    };

    connectSocket.onclose = function(){
      connectSocket = null;
      if (connectState === 'connecting' || connectState === 'connected') {
        connectState = 'error';
        connectErrorMsg = 'انقطع الاتصال بالخادم';
        renderConnectUI();
      }
    };
  }

  function disconnectFromBackend(){
    if (connectSocket && connectSocket.readyState === 1) {
      try {
        connectSocket.send(JSON.stringify({ type: 'disconnect', payload: { platform: 'tiktok' }, timestamp: Date.now() }));
      } catch (e) {}
    }
    closeConnectSocketSilently();
    connectState = 'idle';
    connectUsername = '';
    connectErrorMsg = '';
    renderConnectUI();
  }

  function initConnectWidget(){
    var card = document.querySelector('[data-connect-card]');
    if (!card) return;
    var controls = card.querySelector('[data-connect-controls]');
    if (!controls || controls.dataset.wired === '1') return;
    controls.dataset.wired = '1';
    ensureConnectStyles();
    renderConnectUI();
  }
  var __connectTries = 0;
  var __connectTimer = setInterval(function(){
    __connectTries++;
    initConnectWidget();
    if (__connectTries >= 30) clearInterval(__connectTimer);
  }, 300);
</script>
</body>
