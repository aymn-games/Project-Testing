<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Goal Widget — أداة الهدف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap">
    <link rel="stylesheet" href="goal.css">
</head>
<body>
    <!--
        أداة هدف للبث (Browser Source لـ OBS). كل الإعدادات من الرابط —
        الشرح الكامل بـ README.md بنفس المجلد.
    -->
    <div class="goal" id="goal" role="status" aria-live="polite">
        <span class="goal-status" id="goal-status" title="حالة الاتصال"></span>
        <div class="goal-head">
            <div class="goal-title" id="goal-title">الهدف</div>
            <div class="goal-percent" id="goal-percent">0%</div>
        </div>
        <!-- شكل القلب (?style=heart): يتعبّى بالماء حسب نسبة الهدف -->
        <div class="goal-heart" aria-hidden="true">
            <svg viewBox="-6 -6 212 186">
                <defs>
                    <clipPath id="goal-heart-clip"><path d="M100 170 C40 125 0 95 0 55 C0 22 25 0 55 0 C75 0 92 12 100 28 C108 12 125 0 145 0 C175 0 200 22 200 55 C200 95 160 125 100 170 Z"/></clipPath>
                    <linearGradient id="goal-water-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" class="goal-water-stop-a"/>
                        <stop offset="1" class="goal-water-stop-b"/>
                    </linearGradient>
                </defs>
                <path class="goal-heart-empty" d="M100 170 C40 125 0 95 0 55 C0 22 25 0 55 0 C75 0 92 12 100 28 C108 12 125 0 145 0 C175 0 200 22 200 55 C200 95 160 125 100 170 Z"/>
                <g clip-path="url(#goal-heart-clip)">
                    <g class="goal-water" id="goal-water">
                        <path class="goal-wave goal-wave-back" d="M0 0 Q25 -7 50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V200 H0 Z"/>
                        <path class="goal-wave goal-wave-front" d="M0 0 Q25 -7 50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V200 H0 Z"/>
                        <circle class="goal-bubble" cx="70" cy="178" r="3.5"/>
                        <circle class="goal-bubble" cx="105" cy="178" r="2.5"/>
                        <circle class="goal-bubble" cx="130" cy="178" r="4"/>
                        <circle class="goal-bubble" cx="88" cy="178" r="2"/>
                    </g>
                </g>
                <path class="goal-heart-outline" d="M100 170 C40 125 0 95 0 55 C0 22 25 0 55 0 C75 0 92 12 100 28 C108 12 125 0 145 0 C175 0 200 22 200 55 C200 95 160 125 100 170 Z"/>
            </svg>
            <div class="goal-heart-text">
                <span class="goal-heart-pct" id="goal-heart-pct">0%</span>
                <bdi class="goal-heart-value" id="goal-heart-value"></bdi>
            </div>
        </div>
        <div class="goal-bar">
            <div class="goal-fill" id="goal-fill"></div>
            <div class="goal-bar-text" id="goal-bar-text"></div>
        </div>
        <div class="goal-foot" id="goal-foot">
            <span id="goal-remaining"></span>
            <span id="goal-last"></span>
        </div>
    </div>

    <script src="goal-core.js"></script>
    <script src="goal.js"></script>
</body>
</html>
