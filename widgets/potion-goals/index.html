<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potion Goals — قوارير الأهداف</title>
<!--
    قوارير الأهداف السحرية (Potion Bottle Goals) — ملف واحد، Browser Source لـ OBS.
    الخلفية شفافة بالكامل (بدون كرت)، فتركب على البث مباشرة.

    الإعدادات من الرابط (رقم القارورة 1 أو 2 أو 3):
      current1=55&target1=100     القيمة الحالية والهدف
      label1=Cheer Goal           اسم الهدف تحت القارورة
      color1=ff3fa4               لون السائل والتوهج (بدون #)
      shape1=round|vial|heart     شكل القارورة
      count=3                     عدد القوارير المعروضة (1–3)
      display=both|percent|fraction   طريقة عرض الرقم
      size=200                    عرض القارورة بالبكسل
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Tajawal:wght@700;800&display=swap">
<style>
    :root {
        --potion-size: 200px;          /* عرض القارورة */
        --potion-gap: 28px;            /* المسافة بين القوارير */
        --potion-font: 'Fredoka', 'Tajawal', system-ui, sans-serif;
        --potion-text: #ffffff;
        --potion-glass: rgba(255, 255, 255, .07);
        --potion-cork-1: #c98a55;
        --potion-cork-2: #7a4a26;
        --potion-wave-speed: 2.8s;
        --potion-fill-time: 1.8s;      /* مدة ارتفاع/نزول السائل */
    }

    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;        /* بدون خلفية */
        overflow: hidden;
        font-family: var(--potion-font);
        color: var(--potion-text);
        -webkit-font-smoothing: antialiased;
    }

    .shelf {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: var(--potion-gap);
        padding: 24px 16px;
    }

    .potion {
        --c: #ff3fa4;                  /* لون القارورة (يتحدد لكل وحدة) */
        width: var(--potion-size);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: potion-in .8s cubic-bezier(.2, .9, .3, 1.2) both;
    }
    .potion:nth-child(2) { animation-delay: .12s; }
    .potion:nth-child(3) { animation-delay: .24s; }

    .potion svg { display: block; width: 100%; height: auto; overflow: visible; }

    /* الزجاج */
    .glass-fill { fill: var(--potion-glass); }
    .glass-line {
        fill: none;
        stroke: var(--c);
        stroke-width: 9;               /* نصفه يظهر (الداخل مخفي بالقناع) */
        stroke-linejoin: round;
    }
    .glow {
        filter:
            drop-shadow(0 0 4px var(--c))
            drop-shadow(0 0 12px var(--c))
            drop-shadow(0 0 26px color-mix(in srgb, var(--c) 55%, transparent));
    }
    .shine { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 5; stroke-linecap: round; }
    .shine.soft { stroke: rgba(255, 255, 255, .25); stroke-width: 3; }

    /* الفلّينة والحافة */
    .cork { fill: url(#cork-grad); }
    .cork-line { fill: none; stroke: rgba(0, 0, 0, .25); stroke-width: 1.5; }
    .rim { fill: color-mix(in srgb, var(--c) 35%, #ffffff); }

    /* السائل */
    .liquid { transition: transform var(--potion-fill-time) cubic-bezier(.22, 1, .36, 1); }
    .wave-front { animation: wave var(--potion-wave-speed) linear infinite; }
    .wave-back {
        opacity: .5;
        animation: wave-back calc(var(--potion-wave-speed) * 1.7) linear infinite;
    }
    .surface-glow { fill: rgba(255, 255, 255, .35); animation: wave var(--potion-wave-speed) linear infinite; }
    .bubble { fill: rgba(255, 255, 255, .6); animation: bubble 4.6s ease-in infinite; }
    .bubble:nth-of-type(2) { animation-delay: 1.1s; animation-duration: 5.4s; }
    .bubble:nth-of-type(3) { animation-delay: 2.3s; animation-duration: 3.9s; }
    .bubble:nth-of-type(4) { animation-delay: 3.4s; animation-duration: 6.2s; }
    .bubble:nth-of-type(5) { animation-delay: .6s;  animation-duration: 5s; }

    /* الغيوم حول قاعدة القارورة الأسطوانية */
    .clouds { filter: drop-shadow(0 0 8px var(--c)) drop-shadow(0 0 18px color-mix(in srgb, var(--c) 50%, transparent)); }
    .cloud { fill: color-mix(in srgb, var(--c) 22%, #ffffff); animation: cloud 5s ease-in-out infinite; }

    /* النص تحت القارورة */
    .label {
        margin-top: 10px;
        font-size: calc(var(--potion-size) * .1);
        font-weight: 700;
        letter-spacing: .5px;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 8px var(--c), 0 2px 6px rgba(0, 0, 0, .75);
    }
    .value {
        margin-top: 2px;
        font-size: calc(var(--potion-size) * .135);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 10px var(--c), 0 0 22px var(--c), 0 2px 6px rgba(0, 0, 0, .75);
    }
    .value small { font-size: .62em; opacity: .85; margin-inline-start: 6px; }

    .potion.is-full svg { animation: full-pulse 1.6s ease-in-out infinite; }

    @keyframes wave      { from { transform: translateX(0); }      to { transform: translateX(-100px); } }
    @keyframes wave-back { from { transform: translate(-100px, -5px); } to { transform: translate(0, -5px); } }
    @keyframes bubble {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: 1; }
        100% { transform: translateY(-190px); opacity: 0; }
    }
    @keyframes cloud { 0%, 100% { translate: 0 0; } 50% { translate: 6px -5px; } }
    @keyframes potion-in { from { opacity: 0; transform: translateY(18px) scale(.94); } }
    @keyframes full-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    @media (prefers-reduced-motion: reduce) {
        .potion, .wave-front, .wave-back, .surface-glow, .bubble, .cloud, .potion.is-full svg { animation: none; }
    }
</style>
</head>
<body>
<!-- تدرّج الفلّينة مشترك بين كل القوارير -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="cork-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="var(--potion-cork-2)" style="stop-color:var(--potion-cork-2)"/>
            <stop offset=".45" stop-color="var(--potion-cork-1)" style="stop-color:var(--potion-cork-1)"/>
            <stop offset="1" stop-color="var(--potion-cork-2)" style="stop-color:var(--potion-cork-2)"/>
        </linearGradient>
    </defs>
</svg>

<main class="shelf" id="shelf"></main>

<script>
(function () {
    'use strict';

    var q = new URLSearchParams(location.search);
    function param(name, def) { var v = q.get(name); return v === null || v === '' ? def : v; }
    function num(v, def) { var n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : def; }

    /*
     * أشكال القوارير (إحداثيات الرسم 0..200 × 0..300).
     *   parts  : أجزاء جسم الزجاج (اتحادها = داخل القارورة، ويُرسم حدّها الخارجي بس).
     *   bottom/top : مدى السائل (0% عند bottom و100% عند top).
     *   shine  : لمعات الزجاج.
     */
    var HEART = 'M100 170 C40 125 0 95 0 55 C0 22 25 0 55 0 C75 0 92 12 100 28 ' +
                'C108 12 125 0 145 0 C175 0 200 22 200 55 C200 95 160 125 100 170 Z';
    var SHAPES = {
        round: {
            parts: ['<rect x="84" y="44" width="32" height="84"/>',
                    '<circle cx="100" cy="195" r="85"/>'],
            neckTop: 44, bottom: 280, top: 104,
            shine: ['<path class="shine" d="M40 165 A64 64 0 0 1 66 128"/>',
                    '<path class="shine soft" d="M36 200 A64 64 0 0 0 46 228"/>']
        },
        vial: {
            parts: ['<rect x="86" y="44" width="28" height="70"/>',
                    '<rect x="56" y="100" width="88" height="182" rx="40"/>'],
            neckTop: 44, bottom: 282, top: 104, smoke: true,
            shine: ['<path class="shine" d="M72 136 V232"/>',
                    '<path class="shine soft" d="M72 246 V258"/>']
        },
        heart: {
            parts: ['<rect x="86" y="44" width="28" height="96"/>',
                    '<path transform="translate(10 112) scale(.9)" d="' + HEART + '"/>'],
            neckTop: 44, bottom: 265, top: 116,
            shine: ['<path class="shine" d="M34 148 C26 162 30 182 44 198"/>',
                    '<path class="shine soft" d="M152 132 C162 134 168 140 170 148"/>']
        }
    };

    /* موجة بعرض فترتين+ (كل فترة 100) — تنزاح 100 فتبان مستمرة بلا قطع. */
    var WAVE = 'M-100 0 Q-75 -7 -50 0 T0 0 T50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V340 H-100 Z';

    var DEFAULTS = [
        { label: 'Cheer Goal',    color: 'ff3fa4', shape: 'round' },
        { label: 'Sub Goal',      color: '3ff0ff', shape: 'vial'  },
        { label: 'Donation Goal', color: '8b3dff', shape: 'heart' }
    ];

    var display = param('display', 'both');
    if (param('size', '')) { document.documentElement.style.setProperty('--potion-size', num(param('size'), 200) + 'px'); }
    if (param('gap', ''))  { document.documentElement.style.setProperty('--potion-gap', num(param('gap'), 28) + 'px'); }

    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function fmt(n) { return Math.abs(n - Math.round(n)) > .004 ? n.toFixed(2) : String(Math.round(n)); }

    function build(i) {
        var d = DEFAULTS[i - 1];
        var shape = SHAPES[param('shape' + i, d.shape)] || SHAPES[d.shape];
        var color = param('color' + i, d.color);
        if (/^[0-9a-f]{3,8}$/i.test(color)) { color = '#' + color; }
        var cfg = {
            label: param('label' + i, d.label),
            current: Math.max(0, num(param('current' + i, 0), 0)),
            target: Math.max(0, num(param('target' + i, 100), 100))
        };
        var id = 'p' + i, parts = shape.parts.join('');

        var bubbles = [62, 92, 118, 136, 80].map(function (x, k) {
            return '<circle class="bubble" cx="' + x + '" cy="' + (300 - k * 6) + '" r="' + [3.5, 2.5, 4, 2, 3][k] + '"/>';
        }).join('');
        // غيوم ناعمة حول قاعدة القارورة الأسطوانية (shape: vial).
        var cloud = function (x, y, k) {
            return '<g class="cloud" style="animation-delay:' + k + 's" transform="translate(' + x + ' ' + y + ')">' +
                '<circle cx="0" cy="0" r="16"/><circle cx="20" cy="-10" r="20"/>' +
                '<circle cx="42" cy="-2" r="16"/><rect x="-16" y="-2" width="74" height="18" rx="9"/></g>';
        };
        var smoke = shape.smoke ? '<g class="clouds">' + cloud(14, 278, 0) + cloud(128, 286, 1.4) + '</g>' : '';

        var el = document.createElement('section');
        el.className = 'potion';
        el.style.setProperty('--c', color);
        el.innerHTML =
            '<svg viewBox="0 0 200 300" role="img" aria-label="' + esc(cfg.label) + '">' +
              '<defs>' +
                '<clipPath id="' + id + '-clip">' + parts + '</clipPath>' +
                // قناع يخفي نصف الخط الداخلي، فيبقى حدّ الاتحاد الخارجي بس (بدون خط بين الرقبة والجسم)
                '<mask id="' + id + '-mask" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="380">' +
                  '<rect x="-40" y="-40" width="280" height="380" fill="#fff"/>' +
                  '<g fill="#000">' + parts + '</g>' +
                '</mask>' +
                '<linearGradient id="' + id + '-liq" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0" style="stop-color:color-mix(in srgb, ' + color + ' 55%, #ffffff)"/>' +
                  '<stop offset=".35" style="stop-color:' + color + '"/>' +
                  '<stop offset="1" style="stop-color:color-mix(in srgb, ' + color + ' 55%, #120020)"/>' +
                '</linearGradient>' +
              '</defs>' +
              '<rect class="glass-fill" x="0" y="0" width="200" height="300" clip-path="url(#' + id + '-clip)"/>' +
              '<g clip-path="url(#' + id + '-clip)">' +
                '<g class="liquid" style="transform:translateY(' + (shape.bottom + 12) + 'px)">' +
                  '<path class="wave-back" fill="url(#' + id + '-liq)" d="' + WAVE + '"/>' +
                  '<path class="wave-front" fill="url(#' + id + '-liq)" d="' + WAVE + '"/>' +
                  '<path class="surface-glow" d="M-100 0 Q-75 -7 -50 0 T0 0 T50 0 T100 0 T150 0 T200 0 T250 0 T300 0 T350 0 T400 0 V3 H-100 Z"/>' +
                  bubbles +
                '</g>' +
              '</g>' +
              '<g class="glow"><g class="glass-line" mask="url(#' + id + '-mask)">' + parts + '</g></g>' +
              shape.shine.join('') +
              smoke +
              '<rect class="rim" x="78" y="' + (shape.neckTop - 6) + '" width="44" height="10" rx="5"/>' +
              '<rect class="cork" x="85" y="' + (shape.neckTop - 30) + '" width="30" height="28" rx="6"/>' +
              '<path class="cork-line" d="M89 ' + (shape.neckTop - 20) + ' H111 M89 ' + (shape.neckTop - 11) + ' H111"/>' +
            '</svg>' +
            '<div class="label">' + esc(cfg.label) + '</div>' +
            '<div class="value"></div>';

        var liquid = el.querySelector('.liquid');
        var valueEl = el.querySelector('.value');

        /* يرفع/ينزل السائل بسلاسة ويعدّ الرقم تدريجياً. */
        var shown = 0;
        function set(current, target) {
            if (current != null) { cfg.current = Math.max(0, current); }
            if (target != null) { cfg.target = Math.max(0, target); }
            var pct = cfg.target > 0 ? cfg.current / cfg.target * 100 : 0;
            var lvl = Math.min(100, pct);
            var y = shape.bottom + 12 - (shape.bottom + 12 - shape.top) * lvl / 100;
            requestAnimationFrame(function () { liquid.style.transform = 'translateY(' + y.toFixed(2) + 'px)'; });
            el.classList.toggle('is-full', pct >= 100 && cfg.target > 0);

            var from = shown, to = cfg.current, t0 = performance.now(), dur = 1600;
            (function step(now) {
                var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
                shown = from + (to - from) * e;
                var p = cfg.target > 0 ? Math.floor(shown / cfg.target * 100) : 0;
                var frac = fmt(shown) + '/' + fmt(cfg.target);
                valueEl.innerHTML = display === 'percent' ? p + '%'
                    : display === 'fraction' ? frac
                    : p + '%<small>' + frac + '</small>';
                if (k < 1) { requestAnimationFrame(step); }
            }(t0));
        }

        return { el: el, set: set, cfg: cfg };
    }

    var count = Math.max(1, Math.min(3, Math.round(num(param('count', 3), 3))));
    var shelf = document.getElementById('shelf');
    var potions = [];
    for (var i = 1; i <= count; i++) {
        var p = build(i);
        shelf.appendChild(p.el);
        potions.push(p);
    }
    // تأخير بسيط عشان السائل يرتفع من القاع وقت الظهور.
    setTimeout(function () { potions.forEach(function (p) { p.set(); }); }, 250);

}());
</script>
</body>
</html>
