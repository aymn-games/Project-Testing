<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potion Goals — قوارير الأهداف</title>
<!--
    قوارير الأهداف السحرية (Potion Bottle Goals) — ملف واحد، Browser Source لـ OBS.
    الخلفية شفافة بالكامل، فتركب على البث مباشرة.

    الإعدادات من الرابط (رقم القارورة 1 أو 2 أو 3):
      current1=55&target1=100     القيمة الحالية والهدف
      label1=Cheer Goal           اسم الهدف تحت القارورة
      color1=ff4fc8               لون السائل (بدون #)
      glow1=ff5ad9                لون توهج النيون حول الزجاج
      shape1=round|vial|heart     شكل القارورة
      display1=count|percent|fraction|both   طريقة عرض الرقم (display= لكل القوارير)
      prefix1=$                   رمز قبل الرقم (مثل $)
      count=3                     عدد القوارير المعروضة (1–3)
      size=220                    عرض القارورة بالبكسل
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Tajawal:wght@800&display=swap">
<style>
    :root {
        --potion-size: 220px;
        --potion-gap: 34px;
        --potion-font: 'Fredoka', 'Tajawal', system-ui, sans-serif;
        --potion-text: #ffffff;
        --potion-line: #f6f1ff;        /* لون حدود الزجاج */
        --potion-wave-speed: 3s;
        --potion-fill-time: 1.8s;
    }

    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--potion-font);
        color: var(--potion-text);
        -webkit-font-smoothing: antialiased;
    }

    .shelf {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: var(--potion-gap);
        padding: 20px 24px;
    }

    .potion {
        --c: #ff4fc8;   /* لون السائل */
        --g: #ff5ad9;   /* لون النيون */
        width: var(--potion-size);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: potion-in .9s cubic-bezier(.2, .9, .3, 1.2) both;
    }
    .potion:nth-child(2) { animation-delay: .12s; }
    .potion:nth-child(3) { animation-delay: .24s; }
    .potion svg { display: block; width: 100%; height: auto; overflow: visible; }

    /* ===== الزجاج ===== */
    .neon {
        filter:
            drop-shadow(0 0 3px var(--g))
            drop-shadow(0 0 10px var(--g))
            drop-shadow(0 0 24px color-mix(in srgb, var(--g) 70%, transparent))
            drop-shadow(0 0 46px color-mix(in srgb, var(--g) 40%, transparent));
    }
    .glass-line { fill: none; stroke: var(--potion-line); stroke-width: 11; stroke-linejoin: round; }
    .glass-rim  { fill: color-mix(in srgb, var(--g) 55%, #ffffff); opacity: .4; }
    .hl      { fill: #ffffff; opacity: .85; }
    .hl-soft { fill: #ffffff; opacity: .28; }
    .hl-line { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; opacity: .5; }

    /* الحافة والفلّينة */
    .rim  { fill: rgba(255, 255, 255, .22); stroke: var(--potion-line); stroke-width: 4.5; }
    .cork { fill: url(#cork-grad); stroke: #b4604f; stroke-width: 2.5; stroke-linejoin: round; }
    .cork-top { fill: #ffd3bd; stroke: #b4604f; stroke-width: 2.5; }
    .cork-dot { fill: #d9796a; }

    /* ===== السائل ===== */
    .liquid { transition: transform var(--potion-fill-time) cubic-bezier(.22, 1, .36, 1); }
    .wave-a { animation: wave var(--potion-wave-speed) linear infinite; }
    .wave-b { animation: wave-rev calc(var(--potion-wave-speed) * 1.5) linear infinite; }
    .wave-c { animation: wave calc(var(--potion-wave-speed) * 1.25) linear infinite; }
    .bubble { fill: #ffffff; opacity: 0; animation: bubble 4.8s ease-in infinite; }
    .bubble:nth-of-type(2) { animation-delay: 1.2s; animation-duration: 5.6s; }
    .bubble:nth-of-type(3) { animation-delay: 2.4s; animation-duration: 4.1s; }
    .bubble:nth-of-type(4) { animation-delay: 3.5s; animation-duration: 6.3s; }
    .bubble:nth-of-type(5) { animation-delay: .7s;  animation-duration: 5.2s; }
    .bubble:nth-of-type(6) { animation-delay: 2.9s; animation-duration: 4.4s; }

    /* ===== الزينة ===== */
    .deco { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--g) 55%, transparent)); }
    .float   { animation: float 4.5s ease-in-out infinite; }
    .float.b { animation-duration: 5.5s; animation-delay: -1.5s; }
    .float.c { animation-duration: 6.5s; animation-delay: -3s; }
    .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 4s ease-in-out infinite; }

    /* ===== النص ===== */
    .label, .value {
        text-align: center;
        white-space: nowrap;
        font-weight: 700;
        color: #fff;
        text-shadow:
            0 0 6px color-mix(in srgb, var(--g) 90%, #fff),
            0 0 16px var(--g),
            0 0 30px color-mix(in srgb, var(--g) 60%, transparent),
            0 2px 4px rgba(0, 0, 0, .55);
    }
    .label { margin-top: 12px; font-size: calc(var(--potion-size) * .155); line-height: 1.1; }
    .value { margin-top: 2px;  font-size: calc(var(--potion-size) * .15); font-variant-numeric: tabular-nums; }

    .potion.is-full svg { animation: full-pulse 1.8s ease-in-out infinite; }

    @keyframes wave     { from { transform: translateX(0); }     to { transform: translateX(-120px); } }
    @keyframes wave-rev { from { transform: translateX(-120px); } to { transform: translateX(0); } }
    @keyframes bubble {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: .75; }
        100% { transform: translateY(-170px); opacity: 0; }
    }
    @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 5px -6px; } }
    @keyframes sway  { 0%, 100% { rotate: -4deg; } 50% { rotate: 4deg; } }
    @keyframes potion-in  { from { opacity: 0; transform: translateY(20px) scale(.94); } }
    @keyframes full-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }

    @media (prefers-reduced-motion: reduce) {
        .potion, .wave-a, .wave-b, .wave-c, .bubble, .float, .sway, .potion.is-full svg { animation: none; }
    }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <linearGradient id="cork-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e08a72"/>
            <stop offset=".45" stop-color="#f7b69b"/>
            <stop offset="1" stop-color="#d47862"/>
        </linearGradient>
    </defs>
</svg>

<main class="shelf" id="shelf"></main>

<script>
(function () {
    'use strict';

    var q = new URLSearchParams(location.search);
    function param(name, def) { var v = q.get(name); return v === null || v === '' ? def : v; }
    function num(v, def) { var n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : def; }
    function hex(v) { return /^[0-9a-f]{3,8}$/i.test(v) ? '#' + v : v; }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function fmt(n) { return Math.abs(n - Math.round(n)) > .004 ? n.toFixed(2) : String(Math.round(n)); }

    /* ================= الزينة ================= */
    function strawberry(x, y, s, r) {
        var seeds = [[-5, 0], [4, -2], [0, 6], [-6, 9], [6, 8], [0, 14], [-2, -4]].map(function (p) {
            return '<ellipse cx="' + p[0] + '" cy="' + p[1] + '" rx="1.2" ry="1.7" fill="#ffe48a"/>';
        }).join('');
        return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ') scale(' + s + ')">' +
            '<path d="M0 -10 C10 -12 14 -2 12 6 C10 14 4 20 0 22 C-4 20 -10 14 -12 6 C-14 -2 -10 -12 0 -10Z" ' +
                'fill="#ff5b73" stroke="#a8243f" stroke-width="2.2"/>' +
            '<path d="M-7 -4 C-6 -8 -2 -9 1 -8" fill="none" stroke="#ff9aa8" stroke-width="2" stroke-linecap="round"/>' +
            seeds +
            '<path d="M-10 -10 L-3 -7 L0 -15 L3 -7 L10 -10 L5 -3 L-5 -3Z" fill="#6cc47a" stroke="#2c7442" ' +
                'stroke-width="1.8" stroke-linejoin="round"/></g>';
    }
    function flower(x, y, s, r) {
        var petals = '';
        for (var k = 0; k < 5; k++) {
            petals += '<ellipse cx="0" cy="-9" rx="7.5" ry="9.5" transform="rotate(' + (k * 72) + ')" ' +
                'fill="#ffc6da" stroke="#d9709a" stroke-width="1.8"/>';
        }
        var lines = '';
        for (var j = 0; j < 5; j++) {
            lines += '<path d="M0 -5 V-11" transform="rotate(' + (j * 72) + ')" stroke="#f08fb4" stroke-width="1.4" stroke-linecap="round"/>';
        }
        return '<g transform="translate(' + x + ' ' + y + ') rotate(' + (r || 0) + ') scale(' + s + ')">' + petals + lines +
            '<circle r="4.5" fill="#ffe08a" stroke="#d99a36" stroke-width="1.6"/></g>';
    }
    function leaf(x, y, r, s) {
        return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ') scale(' + s + ')">' +
            '<path d="M0 0 C6 -9 19 -9 26 0 C19 9 6 9 0 0Z" fill="#7fd08c" stroke="#2c7442" stroke-width="1.8"/>' +
            '<path d="M2 0 H21" stroke="#2c7442" stroke-width="1.3" stroke-linecap="round"/></g>';
    }
    /* غيمة بحدّ خارجي بس: نرسم الحدود أول، وبعدها التعبئة فوقها. */
    function cloud(x, y, s, cls) {
        var shapes = '<circle cx="0" cy="0" r="13"/><circle cx="16" cy="-9" r="16"/><circle cx="35" cy="-3" r="13"/>' +
            '<circle cx="48" cy="5" r="9"/><rect x="-12" y="0" width="66" height="14" rx="7"/>';
        return '<g class="float ' + (cls || '') + '"><g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
            '<g fill="#8fb0ff" stroke="#8fb0ff" stroke-width="7">' + shapes + '</g>' +
            '<g fill="#eef3ff">' + shapes + '</g>' +
            '<path d="M8 6 a6 6 0 1 1 7 -6 a3 3 0 1 1 -3 3" fill="none" stroke="#8fb0ff" stroke-width="2.2" stroke-linecap="round"/>' +
            '<path d="M34 7 a5 5 0 1 0 -4 -7" fill="none" stroke="#8fb0ff" stroke-width="2.2" stroke-linecap="round"/>' +
            '</g></g>';
    }
    function bow(x, y, s) {
        var st = 'fill="#ff9db7" stroke="#cf4f78" stroke-width="2" stroke-linejoin="round"';
        return '<g class="sway" transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
            '<path d="M-4 3 L-15 26 L-8 23 L-4 30 L2 6Z" ' + st + '/>' +
            '<path d="M4 3 L15 26 L8 23 L4 30 L-2 6Z" ' + st + '/>' +
            '<path d="M0 0 C-10 -14 -30 -12 -28 2 C-26 15 -10 10 0 0Z" ' + st + '/>' +
            '<path d="M0 0 C10 -14 30 -12 28 2 C26 15 10 10 0 0Z" ' + st + '/>' +
            '<path d="M-6 -1 C-12 -6 -20 -6 -21 0" fill="none" stroke="#cf4f78" stroke-width="1.5" stroke-linecap="round"/>' +
            '<path d="M6 -1 C12 -6 20 -6 21 0" fill="none" stroke="#cf4f78" stroke-width="1.5" stroke-linecap="round"/>' +
            '<rect x="-6" y="-6" width="12" height="12" rx="5" ' + st + '/></g>';
    }
    /* فلّينة مخروطية (أعرض فوق) مع نقش نقاط. */
    function cork(cx, top, h, wTop, wBot) {
        var a = cx - wTop / 2, b = cx + wTop / 2, c = cx + wBot / 2, d = cx - wBot / 2, bot = top + h;
        var dots = [[-12, .35], [6, .3], [-3, .55], [11, .62], [-9, .78], [3, .85]].map(function (p) {
            return '<circle cx="' + (cx + p[0]) + '" cy="' + (top + h * p[1]) + '" r="2" class="cork-dot"/>';
        }).join('');
        return '<path class="cork" d="M' + a + ' ' + top + ' L' + d + ' ' + bot + ' Q' + cx + ' ' + (bot + 4) + ' ' + c + ' ' + bot +
            ' L' + b + ' ' + top + 'Z"/>' + dots +
            '<ellipse class="cork-top" cx="' + cx + '" cy="' + top + '" rx="' + (wTop / 2) + '" ry="6"/>' +
            '<circle cx="' + (cx - 6) + '" cy="' + (top - 1) + '" r="1.8" class="cork-dot"/>' +
            '<circle cx="' + (cx + 8) + '" cy="' + (top + 1) + '" r="1.5" class="cork-dot"/>';
    }

    /*
     * أشكال القوارير (إحداثيات الرسم 240 × 320).
     *   parts : أجزاء الزجاج (اتحادها = الداخل؛ حدّه الخارجي بس يُرسم).
     *   الرقبة المائلة بالقارورة الدائرية تنرسم مائلة، والسائل يبقى أفقي دايماً.
     *   bottom/top : مدى السائل (0% و100%).
     */
    var HEART = 'M100 170 C40 125 0 95 0 55 C0 22 25 0 55 0 C75 0 92 12 100 28 ' +
                'C108 12 125 0 145 0 C175 0 200 22 200 55 C200 95 160 125 100 170 Z';
    var SHAPES = {
        round: {
            parts: ['<circle cx="120" cy="205" r="78"/>',
                    '<rect x="104" y="92" width="32" height="54" transform="rotate(32 120 205)"/>'],
            bottom: 283, top: 124,
            top_parts: '<g transform="rotate(32 120 205)">' +
                '<rect class="rim" x="97" y="84" width="46" height="14" rx="7"/>' + cork(120, 54, 32, 52, 36) + '</g>',
            highlights: '<ellipse class="hl" cx="84" cy="160" rx="18" ry="10" transform="rotate(-35 84 160)"/>' +
                '<circle class="hl" cx="70" cy="184" r="5"/>' +
                '<path class="hl-line" d="M60 250 A70 70 0 0 0 96 274"/>' +
                '<ellipse class="hl-soft" cx="150" cy="250" rx="26" ry="14" transform="rotate(-20 150 250)"/>',
            deco: '<g class="deco">' +
                '<path d="M196 212 C214 196 208 176 196 166" fill="none" stroke="#3f8f52" stroke-width="3" stroke-linecap="round"/>' +
                '<path d="M200 200 C190 236 172 262 146 282" fill="none" stroke="#3f8f52" stroke-width="3" stroke-linecap="round"/>' +
                leaf(198, 236, -60, .9) + leaf(160, 276, 200, .8) + leaf(188, 268, 20, .85) + leaf(204, 180, -100, .7) +
                '<g class="sway">' + strawberry(208, 160, .9, 10) + '</g>' +
                flower(176, 262, 1.15, 10) + flower(150, 294, .75, 30) + flower(200, 244, .6, 0) +
                strawberry(48, 272, .95, -25) + leaf(58, 262, -150, .7) +
                '</g>'
        },
        vial: {
            parts: ['<path d="M104 72 V108 C104 124 72 128 72 158 V266 Q72 292 98 292 H142 Q168 292 168 266 V158 C168 128 136 124 136 108 V72 Z"/>'],
            bottom: 293, top: 140,
            top_parts: '<rect class="rim" x="97" y="62" width="46" height="14" rx="7"/>' + cork(120, 30, 34, 54, 38),
            highlights: '<rect class="hl" x="86" y="150" width="11" height="34" rx="5.5" transform="rotate(8 92 167)"/>' +
                '<circle class="hl" cx="90" cy="196" r="4"/>' +
                '<path class="hl-line" d="M86 214 V268"/>' +
                '<rect class="hl-soft" x="112" y="80" width="6" height="24" rx="3"/>',
            deco: '<g class="deco">' + cloud(160, 190, .8, '') + cloud(46, 246, .75, 'b') + cloud(140, 260, 1.05, 'c') + '</g>'
        },
        heart: {
            parts: ['<path transform="translate(20 112)" d="' + HEART + '"/>',
                    '<rect x="106" y="78" width="28" height="66"/>'],
            bottom: 283, top: 114,
            top_parts: '<rect class="rim" x="99" y="68" width="42" height="14" rx="7"/>' + cork(120, 38, 32, 50, 34),
            highlights: '<ellipse class="hl" cx="66" cy="150" rx="16" ry="9" transform="rotate(-30 66 150)"/>' +
                '<circle class="hl" cx="50" cy="170" r="4.5"/>' +
                '<path class="hl-line" d="M44 200 C52 220 66 236 82 248"/>' +
                '<ellipse class="hl-soft" cx="176" cy="148" rx="14" ry="7" transform="rotate(30 176 148)"/>',
            deco: '<g class="deco">' + bow(120, 112, 1.05) + '</g>'
        }
    };

    /* موجة بفترة 120 — تنزاح 120 فتبان مستمرة. */
    function wave(amp) {
        var d = 'M-120 0', x;
        for (x = -120; x < 480; x += 60) { d += ' Q' + (x + 30) + ' ' + (((x / 60) % 2 === 0) ? -amp : amp) + ' ' + (x + 60) + ' 0'; }
        return d + ' V360 H-120 Z';
    }
    var WAVE_A = wave(6), WAVE_B = wave(8);

    var DEFAULTS = [
        { label: 'Cheer Goal',    color: 'ff4fc8', glow: 'ff5ad9', shape: 'round', display: 'count',    prefix: '' },
        { label: 'Sub Goal',      color: '4d7bff', glow: '4fd8ff', shape: 'vial',  display: 'percent',  prefix: '' },
        { label: 'Donation Goal', color: '8a4dff', glow: 'a46bff', shape: 'heart', display: 'fraction', prefix: '$' }
    ];

    if (param('size', '')) { document.documentElement.style.setProperty('--potion-size', num(param('size'), 220) + 'px'); }
    if (param('gap', ''))  { document.documentElement.style.setProperty('--potion-gap', num(param('gap'), 34) + 'px'); }

    function build(i) {
        var d = DEFAULTS[i - 1];
        var shape = SHAPES[param('shape' + i, d.shape)] || SHAPES[d.shape];
        var color = hex(param('color' + i, d.color));
        var glow = hex(param('glow' + i, d.glow));
        var cfg = {
            label: param('label' + i, d.label),
            current: Math.max(0, num(param('current' + i, 0), 0)),
            target: Math.max(0, num(param('target' + i, 100), 100)),
            display: param('display' + i, param('display', d.display)),
            prefix: param('prefix' + i, d.prefix)
        };
        var id = 'p' + i, parts = shape.parts.join('');
        var light = 'color-mix(in srgb, ' + color + ' 45%, #ffffff)';
        var deep = 'color-mix(in srgb, ' + color + ' 70%, #1a0030)';

        var bubbles = [70, 98, 124, 146, 160, 86].map(function (x, k) {
            return '<circle class="bubble" cx="' + x + '" cy="' + (60 + k * 9) + '" r="' + [3, 2.2, 3.6, 2, 2.6, 1.8][k] + '"/>';
        }).join('');

        var el = document.createElement('section');
        el.className = 'potion';
        el.style.setProperty('--c', color);
        el.style.setProperty('--g', glow);
        el.innerHTML =
            '<svg viewBox="0 0 240 320" role="img" aria-label="' + esc(cfg.label) + '">' +
              '<defs>' +
                '<clipPath id="' + id + '-clip">' + parts + '</clipPath>' +
                '<mask id="' + id + '-out" maskUnits="userSpaceOnUse" x="-60" y="-60" width="360" height="440">' +
                  '<rect x="-60" y="-60" width="360" height="440" fill="#fff"/><g fill="#000">' + parts + '</g></mask>' +
                '<linearGradient id="' + id + '-liq" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0" style="stop-color:' + color + '"/>' +
                  '<stop offset=".55" style="stop-color:color-mix(in srgb, ' + color + ' 85%, #1a0030)"/>' +
                  '<stop offset="1" style="stop-color:' + deep + '"/>' +
                '</linearGradient>' +
                // حافة داخلية للزجاج على حدّ الاتحاد بس (تآكل الشكل ثم طرحه من الأصل)
                '<filter id="' + id + '-inner" x="-10%" y="-10%" width="120%" height="120%">' +
                  '<feMorphology in="SourceAlpha" operator="erode" radius="6" result="e"/>' +
                  '<feComposite in="SourceGraphic" in2="e" operator="out" result="band"/>' +
                  '<feGaussianBlur in="band" stdDeviation="1.2"/>' +
                '</filter>' +
                '<radialGradient id="' + id + '-glass" cx=".42" cy=".4" r=".75">' +
                  '<stop offset="0" style="stop-color:rgba(255,255,255,.06)"/>' +
                  '<stop offset=".7" style="stop-color:color-mix(in srgb, ' + glow + ' 14%, transparent)"/>' +
                  '<stop offset="1" style="stop-color:color-mix(in srgb, ' + glow + ' 34%, transparent)"/>' +
                '</radialGradient>' +
              '</defs>' +
              // داخل الزجاج (لمعة لونية خفيفة)
              '<rect x="0" y="0" width="240" height="320" fill="url(#' + id + '-glass)" clip-path="url(#' + id + '-clip)"/>' +
              // السائل: طبقة خلفية فاتحة + طبقة سطح فاتحة + الجسم المتدرّج
              '<g clip-path="url(#' + id + '-clip)">' +
                '<g class="liquid" style="transform:translateY(' + (shape.bottom + 14) + 'px)">' +
                  '<path class="wave-b" style="fill:' + light + ';opacity:.55" d="' + WAVE_B + '" transform="translate(0 -6)"/>' +
                  '<path class="wave-a" style="fill:' + light + '" d="' + WAVE_A + '"/>' +
                  '<g transform="translate(0 9)"><path class="wave-c" fill="url(#' + id + '-liq)" d="' + WAVE_A + '"/></g>' +
                  '<ellipse cx="96" cy="70" rx="34" ry="16" fill="#ffffff" opacity=".18"/>' +
                  bubbles +
                '</g>' +
                // حدّ داخلي ملوّن خفيف يعطي سماكة للزجاج
              '</g>' +
              '<g class="glass-rim" filter="url(#' + id + '-inner)">' + parts + '</g>' +
              // حدّ الزجاج الأبيض + توهج النيون
              '<g class="neon"><g class="glass-line" mask="url(#' + id + '-out)">' + parts + '</g>' +
                shape.top_parts + '</g>' +
              shape.highlights +
              shape.deco +
            '</svg>' +
            '<div class="label">' + esc(cfg.label) + '</div>' +
            '<div class="value"></div>';

        var liquid = el.querySelector('.liquid');
        var valueEl = el.querySelector('.value');
        var shown = 0;

        function text(v) {
            var p = cfg.target > 0 ? Math.floor(v / cfg.target * 100) : 0;
            var a = cfg.prefix + fmt(v), b = cfg.prefix + fmt(cfg.target);
            switch (cfg.display) {
                case 'percent':  return p + '%';
                case 'fraction': return a + ' • ' + b;
                case 'both':     return p + '% • ' + a + '/' + b;
                default:         return a;
            }
        }

        /* يرفع/ينزل السائل بسلاسة ويعدّ الرقم تدريجياً. */
        function set() {
            var pct = cfg.target > 0 ? cfg.current / cfg.target * 100 : 0;
            var lvl = Math.min(100, pct);
            var y = shape.bottom + 14 - (shape.bottom + 14 - shape.top) * lvl / 100;
            liquid.style.transform = 'translateY(' + y.toFixed(2) + 'px)';
            el.classList.toggle('is-full', pct >= 100 && cfg.target > 0);
            var from = shown, to = cfg.current, t0 = performance.now(), dur = 1700;
            (function step(now) {
                var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
                shown = from + (to - from) * e;
                valueEl.textContent = text(k >= 1 ? to : shown);
                if (k < 1) { requestAnimationFrame(step); }
            }(t0));
        }
        valueEl.textContent = text(0);
        return { el: el, set: set };
    }

    var count = Math.max(1, Math.min(3, Math.round(num(param('count', 3), 3))));
    var shelf = document.getElementById('shelf');
    var potions = [];
    for (var i = 1; i <= count; i++) { var p = build(i); shelf.appendChild(p.el); potions.push(p); }
    // السائل يرتفع من القاع وقت الظهور.
    setTimeout(function () { potions.forEach(function (p) { p.set(); }); }, 300);
}());
</script>
</body>
</html>
