<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الملف الشخصي — ألعاب أيمن</title>
<meta name="description" content="ملفك الشخصي على منصة ألعاب أيمن: الحساب، النقاط، المقتنيات وأدوات البث.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="js/agp-apple-emoji.js"></script>
<!--
  صفحة البروفايل: هيكل ثابت هنا، وكل المحتوى ينبني من js/agp-profile-page.js.
  الشكل من مهارة design-taste-frontend (شاشة تطبيق، نمط true-black flat):
  - أرضية سوداء واحدة للشريط العلوي والقائمة والصفحة، والطبقات أفتح بخطوة
    (#000 ← #111 ← #1c1c1c) بدون حدود أو ظلال أو تدرجات.
  - القائمة الجانبية يمين (232px) يفصلها خط 1px؛ العنصر المفعّل يصير نصه أبيض.
  - لون الوضع على البيانات فقط: بنفسجي المنصة للاعب، أزرق للستريمر.
  - الزر الأساسي أبيض بنص أسود، وزر واحد أساسي بكل شاشة.
  حساب الشبكة: 232 قائمة + 1 خط + 29 هامش + محتوى مرن + 29 هامش = عرض النافذة.
-->
<style>
  :root{
    --ground:#000000;
    --surface:#111111;
    --raised:#1c1c1c;
    --active:#222222;
    --rule:#1a1a1a;
    --line:#262626;
    --control:#444444;
    --text:#ffffff;
    --soft:#dddddd;
    --muted:#b4b4b4;
    --faint:#949494;
    --accent:#b28cf5;              /* بنفسجي المنصة — على البيانات فقط */
    --accent-track:#24202e;
    --positive:#3fc07a; --pos-bg:#172a1d;
    --negative:#e5566f; --neg-bg:#2c1a20;
    --warning:#f2b33d;  --warn-bg:#2a2211;
    --radius-card:16px; --radius-nested:10px; --radius-control:999px;
    --gap:16px; --card-pad:20px; --canvas-pad:29px;
    --control-h:36px;
    --side-w:232px; --top-h:64px;
    --font:"IBM Plex Sans Arabic",system-ui,sans-serif;
    --fs-title:24px; --fs-section:16px; --fs-kpi:24px; --fs-lead:34px; --fs-body:14px; --fs-small:12px;
  }
  body[data-pf-mode="streamer"]{ --accent:#4cb3f0; --accent-track:#16222b; }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.55;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:inherit;color:inherit}
  p{margin:0}
  :focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}
  .pf-ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* ---------------------------------------------------------- الشريط العلوي */
  .pf-top{position:sticky;top:0;z-index:50;height:var(--top-h);display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 var(--canvas-pad);background:var(--ground);border-bottom:1px solid var(--rule)}
  .pf-brand{display:flex;align-items:center;gap:12px;height:100%}
  .pf-brand img{display:block;height:34px;width:auto}
  .pf-brand-sep{width:1px;height:20px;background:var(--line)}
  .pf-brand-t{font-size:14px;color:var(--muted)}
  .pf-nav{display:flex;align-items:center;gap:4px}
  .pf-nav a{display:inline-flex;align-items:center;height:var(--control-h);padding:0 14px;border-radius:var(--radius-control);color:var(--muted);font-size:14px;transition:color .15s,background .15s}
  .pf-nav a:hover{color:var(--text);background:var(--surface)}
  .pf-nav .pf-nav-out{color:var(--negative)}
  .pf-burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ground);
    flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
  .pf-burger span{display:block;width:16px;height:1.5px;background:var(--soft);border-radius:2px;transition:transform .2s,opacity .2s}
  .pf-menu-open .pf-burger span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
  .pf-menu-open .pf-burger span:nth-child(2){opacity:0}
  .pf-menu-open .pf-burger span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

  /* ---------------------------------------------------------- الإطار: قائمة يمين + محتوى */
  .pf-shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
  .pf-side{position:sticky;top:var(--top-h);align-self:start;height:calc(100vh - var(--top-h));overflow:auto;padding:24px 12px 32px;
    border-inline-end:1px solid var(--rule);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .pf-side-group + .pf-side-group{margin-top:24px}
  .pf-side-label{padding:0 12px 6px;font-size:12px;color:var(--faint)}
  .pf-side-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-radius:8px;color:#bbbbbb;font-size:14px;transition:color .15s,background .15s}
  .pf-side-item .pf-ic{color:var(--faint);transition:color .15s}
  .pf-side-item:hover{color:var(--text);background:var(--surface)}
  .pf-side-item.on{color:var(--text);font-weight:500}
  .pf-side-item.on .pf-ic{color:var(--text)}
  .pf-side-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-side-count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--neg-bg);color:var(--negative);font-size:12px;font-weight:600;line-height:20px;text-align:center}
  .pf-side-dot{width:7px;height:7px;border-radius:50%;background:var(--warning)}
  .pf-side-lock{width:14px;height:14px;color:var(--faint) !important}

  .pf-canvas{min-width:0;padding:28px var(--canvas-pad) 64px}
  .pf-inner{max-width:1100px}

  /* صف العنوان: الصورة + الاسم (h1) + سطر رمادي · الإجراءات + زر الوضع */
  .pf-titlerow{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--rule)}
  .pf-id{display:flex;align-items:center;gap:16px;min-width:0;flex:1 1 380px}
  .pf-avatar{position:relative;flex:none;width:64px;height:64px;border-radius:16px;overflow:hidden;background:var(--raised)}
  .pf-avatar img{display:block;width:100%;height:100%;object-fit:cover}
  .pf-avatar-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:26px;font-weight:600;color:var(--muted)}
  .pf-avatar.editable{cursor:pointer}
  .pf-avatar.editable::after{content:"تغيير";position:absolute;inset:auto 0 0 0;height:22px;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);color:var(--text);font-size:11px;opacity:0;transition:opacity .15s}
  .pf-avatar.editable:hover::after,.pf-avatar.editable:focus-visible::after{opacity:1}
  .pf-id-txt{min-width:0}
  .pf-name{margin:0;font-size:var(--fs-title);font-weight:600;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
  .pf-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
  .pf-meta-btn{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--muted);cursor:pointer;direction:ltr}
  .pf-meta-btn .pf-ic{width:14px;height:14px;color:var(--faint)}
  .pf-meta-btn:hover{color:var(--text)}
  .pf-titlerow-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pf-hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* زر الوضع: مسار رمادي والخيار المفعّل أبيض بنص أسود */
  .pf-mode{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface)}
  .pf-mode button{height:30px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
  .pf-mode button:hover{color:var(--text)}
  .pf-mode button.on{background:var(--text);color:#000}

  /* ---------------------------------------------------------- المحتوى */
  .pf-content{margin-top:24px;scroll-margin-top:calc(var(--top-h) + 60px)}
  .pf-content-title{margin:0 0 16px;font-size:18px;font-weight:600}
  .pf-content-body{display:flex;flex-direction:column;gap:var(--gap)}

  .pf-panel{padding:var(--card-pad);border-radius:var(--radius-card);background:var(--surface)}
  .pf-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .pf-panel-title{margin:0;font-size:var(--fs-section);font-weight:600}
  .pf-panel-sub{font-size:13px;color:var(--faint)}
  .pf-muted{font-size:14px;color:var(--muted);line-height:1.7;max-width:68ch}
  .pf-hint{font-size:13px;color:var(--faint)}
  .pf-link{color:var(--text);font-size:13px;font-weight:500;text-decoration:underline;text-decoration-color:var(--control);text-underline-offset:4px}
  .pf-link:hover{text-decoration-color:var(--text)}
  .pf-textbtn{padding:0;border:0;background:none;color:var(--text);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
  .pf-empty{grid-column:1/-1;padding:14px 16px;border-radius:var(--radius-nested);border:1px dashed var(--line);font-size:14px;color:var(--muted)}
  .pf-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}

  /* قائمة مفتاح/قيمة بخطوط صفوف */
  .pf-kvs{display:flex;flex-direction:column}
  .pf-kv{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
  .pf-kv:last-child{border-bottom:0;padding-bottom:0}
  .pf-kv:first-child{padding-top:0}
  .pf-kv-k{color:var(--muted)}
  .pf-kv-v{color:var(--text);text-align:left;overflow-wrap:anywhere}
  .pf-kv-title{font-weight:500}
  .pf-kv-2 .pf-kv-k{font-size:13px}

  /* الكتلة القائدة: حلقة رفيعة + أكبر رقم بالصفحة */
  .pf-panel-lead{padding:24px}
  .pf-lead{display:flex;align-items:center;gap:24px}
  .pf-ring{position:relative;flex:none;width:112px;height:112px}
  .pf-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
  .pf-ring circle{fill:none;stroke-width:6}
  .pf-ring-track{stroke:var(--accent-track)}
  .pf-ring-arc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.22,1,.36,1)}
  .pf-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;direction:ltr}
  .pf-lead-txt{min-width:0}
  .pf-lead-l{font-size:14px;color:var(--muted)}
  .pf-lead-v{margin-top:2px;font-size:var(--fs-lead);font-weight:600;line-height:1.2;color:var(--accent);letter-spacing:-.02em}
  .pf-lead-v .pf-unit{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0}
  .pf-lead-lvl{margin-top:6px;font-size:15px;font-weight:500}
  .pf-lead-n{margin-top:2px;font-size:14px;color:var(--muted)}
  .pf-panel-lead .pf-kpis{margin-top:24px}
  /* الشاشات العريضة: الأرقام جنب الحلقة بدل ما يبقى نص الكتلة فاضي */
  @media (min-width:1181px){
    .pf-panel-lead:has(.pf-lead + .pf-kpis){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:center;gap:0 24px}
    .pf-panel-lead .pf-lead + .pf-kpis{margin-top:0;border-top:0;padding-inline-start:24px;border-inline-start:1px solid var(--rule)}
    .pf-panel-lead .pf-lead + .pf-kpis .pf-kpi{padding-top:0}
  }

  /* صف أرقام مقسوم بخطوط رفيعة */
  .pf-kpis{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--rule)}
  .pf-panel > .pf-kpis:first-child,.pf-panel-head + .pf-kpis{border-top:0}
  .pf-kpi{padding:16px 0 0;padding-inline-start:20px;border-inline-start:1px solid var(--rule)}
  .pf-kpi:first-child{padding-inline-start:0;border-inline-start:0}
  .pf-panel-head + .pf-kpis .pf-kpi{padding-top:4px}
  .pf-kpi-l{font-size:13px;color:var(--muted)}
  .pf-kpi-v{margin-top:2px;font-size:var(--fs-kpi);font-weight:500;line-height:1.3}
  .pf-unit{font-size:13px;font-weight:400;color:var(--faint)}
  .pf-kpi-n{margin-top:2px;font-size:12px;color:var(--faint)}

  /* أزرار: الأساسي مقلوب (أبيض/أسود)، الثانوي محدد، والخطر بلون سالب */
  .pf-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pf-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h);padding:0 18px;border-radius:var(--radius-control);border:1px solid transparent;
    cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s}
  .pf-btn:active:not(:disabled){transform:scale(.97)}
  .pf-btn:disabled{opacity:.6;cursor:default}
  .pf-btn-primary{background:var(--text);color:#000}
  .pf-btn-primary:hover:not(:disabled){background:#e4e4e4}
  .pf-btn-ghost{background:transparent;border-color:var(--control);color:var(--text)}
  .pf-btn-ghost:hover:not(:disabled){border-color:#777;background:var(--raised)}
  .pf-btn-danger{background:transparent;border-color:#5a2733;color:var(--negative)}
  .pf-btn-danger:hover:not(:disabled){background:var(--neg-bg)}
  .pf-btn-soon{border:1px dashed var(--control);color:var(--faint);cursor:not-allowed}
  .pf-btn-sm{height:30px;padding:0 14px;font-size:13px}
  .pf-btn-lg{height:44px;padding:0 22px;font-size:15px}

  .pf-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--active);color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
  .pf-pill.ok{background:var(--pos-bg);color:var(--positive)}
  .pf-pill.warn{background:var(--warn-bg);color:var(--warning)}
  .pf-chip{font-size:14px;color:var(--muted);direction:ltr}

  /* صف أداة: الوصف يمين والتحكم يسار */
  .pf-tool{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:var(--card-pad);border-radius:var(--radius-card);background:var(--surface)}
  .pf-tool-txt{flex:1 1 280px;min-width:0}
  .pf-tool-title{display:flex;align-items:center;gap:10px;font-size:var(--fs-section);font-weight:600}
  .pf-tool-title .pf-ic{color:var(--faint)}
  .pf-tool-desc{margin-top:4px;font-size:14px;line-height:1.7;color:var(--muted);max-width:68ch}

  .pf-notice{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:14px 16px 14px 14px;border-radius:var(--radius-nested);
    background:var(--warn-bg);border:1px solid #4a3a16;color:#f6d38f;font-size:14px;line-height:1.7}
  .pf-notice-txt{flex:1 1 300px}
  .pf-notice strong{color:var(--warning);font-weight:600}

  .pf-danger{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* المقتنيات */
  .pf-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .pf-items-3{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}
  .pf-items-cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .pf-item{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:12px;background:var(--raised)}
  .pf-item-art{display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:#0a0a0a}
  .pf-item-art img{max-width:94%;max-height:94%;object-fit:contain}
  .pf-item-glyph{font-size:56px;font-weight:600;color:var(--faint)}
  .pf-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;padding:0 2px}
  .pf-item-name{font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pf-item .pf-btn{width:100%}

  .pf-frame-show{display:flex;flex-direction:column;gap:10px}
  .pf-frame-show img{display:block;width:100%;height:auto;max-height:180px;object-fit:contain;border-radius:var(--radius-nested);background:#0a0a0a}
  .pf-frame-name{font-size:14px;font-weight:500}

  /* حقول */
  .pf-label{display:block;margin-bottom:8px;font-size:14px;font-weight:500}
  .pf-redeem{display:flex;gap:8px;flex-wrap:wrap}
  .pf-input{flex:1 1 240px;min-width:0;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--control);background:var(--ground);color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:border-color .15s}
  .pf-input:focus{border-color:var(--text)}
  .pf-input::placeholder{color:var(--faint)}
  .pf-input-code{direction:ltr;text-align:left;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .pf-redeem .pf-btn{height:40px}
  .pf-field-help{margin-top:8px;font-size:13px;color:var(--faint)}
  .pf-msg{min-height:20px;margin-top:10px;font-size:14px}
  .pf-msg.ok{color:var(--positive)}
  .pf-msg.err{color:var(--negative)}

  /* أكواد الفوز */
  .pf-codes{display:flex;flex-direction:column}
  .pf-code{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--rule)}
  .pf-code:last-child{border-bottom:0}
  .pf-code-info{display:flex;flex-direction:column;flex:1;min-width:0}
  .pf-code-v{font-size:15px;font-weight:600;letter-spacing:.06em;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .pf-code-meta{font-size:13px;color:var(--faint)}
  .pf-code-uses{font-size:14px;direction:ltr}
  .pf-code.dim .pf-code-v{color:var(--faint)}
  .pf-steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--soft);font-size:14px;line-height:1.7}
  .pf-steps li::marker{color:var(--faint)}
  .pf-steps + .pf-hint{margin-top:12px}

  /* تيك توك */
  .pf-tt{display:flex;flex-direction:column;gap:16px}
  .pf-tt-head{display:flex;align-items:center;gap:14px}
  .pf-tt-logo{flex:none;width:48px;height:48px;border-radius:12px;background:var(--ground);display:flex;align-items:center;justify-content:center}
  .pf-tt-logo img{width:34px;height:34px;display:block}
  .pf-tt-id{flex:1;min-width:0}
  .pf-tt-title{font-size:var(--fs-section);font-weight:600}
  .pf-tt-handle{font-size:14px;color:var(--muted);direction:ltr;text-align:right}
  .pf-tt-sub{font-size:14px;line-height:1.7;color:var(--muted);max-width:68ch}
  .pf-tt-sub b{color:var(--text);font-weight:500}
  .pf-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .pf-checks li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)}
  .pf-checks .pf-ic{color:var(--positive)}
  .pf-tt-btn-logo{width:20px;height:20px}

  /* لوحة التحكم (متحكم) */
  .pf-rc-id{display:flex;align-items:center;gap:12px;font-weight:500}
  .pf-rc-av{flex:none;width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--active);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
  .pf-panel > .pf-muted + .pf-kvs{margin-top:12px}

  /* حالات: مقفول / دخول / خطأ / تحميل */
  .pf-lock{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 20px;border-radius:var(--radius-card);background:var(--surface);text-align:center}
  .pf-lock-ic{width:28px;height:28px;color:var(--faint);margin-bottom:4px}
  .pf-lock-t{font-size:var(--fs-section);font-weight:600}
  .pf-lock-d{font-size:14px;color:var(--muted);max-width:420px;margin-bottom:10px}
  body.pf-state .pf-side,body.pf-state .pf-mode{display:none}
  body.pf-state .pf-shell{grid-template-columns:minmax(0,1fr)}
  .pf-skel{display:block;border-radius:6px;background:var(--active)}
  .pf-skel-row{height:56px;border-radius:8px;background:var(--raised)}
  body.pf-loading .pf-meta::before{content:"";display:block;width:220px;height:14px;border-radius:4px;background:var(--active)}

  /* ---------------------------------------------------------- نوافذ التعديل وتأكيد الإيميل (عائمة — ظل مسموح) */
  .agp-ed-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);opacity:0;transition:opacity .2s}
  .agp-ed-overlay.open{opacity:1}
  .agp-ed-sheet{direction:rtl;width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow:auto;border-radius:20px;background:var(--surface);border:1px solid var(--line);
    box-shadow:0 24px 64px rgba(0,0,0,.6) /* taste-skill-ignore: dialog */;padding:24px;font-family:var(--font);color:var(--text);transform:translateY(10px);transition:transform .25s cubic-bezier(.22,1,.36,1)}
  .agp-ed-overlay.open .agp-ed-sheet{transform:none}
  .agp-ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .agp-ed-title{font-size:18px;font-weight:600}
  .agp-ed-x{width:36px;height:36px;flex:none;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
  .agp-ed-x:hover{color:var(--text);border-color:var(--control)}
  .agp-ed-photo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px}
  .agp-ed-avatar{position:relative;width:120px;height:120px;border-radius:28px;cursor:pointer;transition:transform .15s}
  .agp-ed-avatar:hover,.agp-ed-avatar.drag{transform:scale(1.03)}
  .agp-ed-avatar-in{width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--raised);display:flex;align-items:center;justify-content:center}
  .agp-ed-avatar.drag .agp-ed-avatar-in{outline:2px dashed var(--muted);outline-offset:4px}
  .agp-ed-avatar-in img{width:100%;height:100%;object-fit:cover;display:block}
  .agp-ed-cam{display:none}
  .agp-ed-photo-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .agp-ed-btn{height:36px;padding:0 18px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;border:1px solid var(--control);background:transparent;color:var(--text);transition:background .15s}
  .agp-ed-btn:hover:not(:disabled){background:var(--raised)}
  .agp-ed-btn:disabled{opacity:.5;cursor:default}
  .agp-ed-btn.primary{background:var(--text);border-color:var(--text);color:#000}
  .agp-ed-btn.primary:hover:not(:disabled){background:#e4e4e4}
  .agp-ed-btn.ghost{border-color:var(--line);color:var(--muted)}
  .agp-ed-hint{font-size:13px;color:var(--faint);text-align:center}
  .agp-ed-field{margin-top:20px}
  .agp-ed-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
  .agp-ed-count{font-size:12px;color:var(--faint);direction:ltr;font-variant-numeric:tabular-nums}
  .agp-ed-count.over{color:var(--negative)}
  .agp-ed-input{box-sizing:border-box;width:100%;height:40px;margin-top:8px;padding:0 14px;border-radius:10px;border:1px solid var(--control);background:var(--ground);color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:border-color .15s}
  .agp-ed-input:focus{border-color:var(--text)}
  .agp-ed-msg{min-height:20px;margin-top:14px;font-size:14px;text-align:center}
  .agp-ed-msg.err{color:var(--negative)}.agp-ed-msg.ok{color:var(--positive)}
  .agp-ed-actions{display:flex;gap:8px;margin-top:8px}
  .agp-ed-actions .agp-ed-btn{flex:1}
  .agp-ed-toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:1100;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;font-size:14px;
    background:var(--text);color:#000;font-family:var(--font);text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.5) /* taste-skill-ignore: toast */}
  .agp-ed-toast.bad{background:var(--neg-bg);color:var(--negative);border:1px solid #5a2733}

  /* ---------------------------------------------------------- تجاوب */
  @media (max-width:1180px){ .pf-row2{grid-template-columns:minmax(0,1fr)} }
  /* آيباد وجوال: القائمة تصير صف تبويبات يتمرر جانبياً تحت صف العنوان */
  @media (max-width:899px){
    :root{--canvas-pad:20px}
    .pf-shell{grid-template-columns:minmax(0,1fr)}
    .pf-side{position:sticky;top:var(--top-h);z-index:20;height:auto;overflow:visible;padding:8px var(--canvas-pad);
      border-inline-end:0;border-bottom:1px solid var(--rule);background:var(--ground)}
    #pfSideNav{display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-padding-inline:8px}
    #pfSideNav::-webkit-scrollbar{display:none}
    .pf-side-group{flex:none}
    .pf-side-group{display:flex;align-items:center;gap:2px}
    .pf-side-group + .pf-side-group{margin:0;padding-inline-start:8px;border-inline-start:1px solid var(--line)}
    .pf-side-label{display:none}
    .pf-side-item{height:36px;padding:0 12px;border-radius:999px;white-space:nowrap}
    .pf-side-item.on{background:var(--active)}
    .pf-canvas{padding-top:20px}
  }
  @media (max-width:640px){
    .pf-brand-sep,.pf-brand-t{display:none}
    .pf-nav{display:none;position:absolute;top:calc(100% + 6px);left:12px;right:12px;flex-direction:column;align-items:stretch;gap:0;padding:6px;border-radius:16px;
      background:var(--surface);border:1px solid var(--line);box-shadow:0 20px 48px rgba(0,0,0,.6) /* taste-skill-ignore: menu */}
    .pf-menu-open .pf-nav{display:flex}
    .pf-nav a{height:48px;padding:0 14px;border-radius:10px;font-size:15px}
    .pf-burger{display:flex}
    .pf-titlerow{align-items:stretch}
    .pf-id{flex-basis:100%}
    .pf-avatar{width:56px;height:56px;border-radius:14px}
    .pf-name{font-size:22px}
    .pf-titlerow-end{width:100%}
    .pf-hero-actions{width:100%}
    .pf-hero-actions .pf-btn{flex:1}
    .pf-mode{width:100%;order:-1}
    .pf-mode button{flex:1;height:36px}
    .pf-btn{height:44px}
    .pf-btn-sm{height:36px}
    .pf-panel,.pf-tool{padding:16px}
    .pf-lead{flex-direction:column;align-items:flex-start;gap:16px}
    .pf-ring{width:88px;height:88px}
    .pf-lead-v{font-size:30px}
    .pf-kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}
    .pf-kpi:nth-child(odd){padding-inline-start:0;border-inline-start:0}
    .pf-kpi:nth-child(odd):last-child{grid-column:1/-1}
    .pf-items,.pf-items-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .pf-items-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .pf-items-3 .pf-item-art{height:150px !important}
    .pf-code{flex-wrap:wrap;gap:6px 12px}
    .pf-code-info{flex-basis:100%}
    .pf-tool .pf-btn,.pf-danger .pf-btn,.pf-notice .pf-btn{width:100%}
  }
  @media (max-width:400px){
    .pf-items-cards{grid-template-columns:minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
  }
</style>
</head>

  </nav>
  <button type="button" class="pf-burger" id="pfBurger" aria-label="القائمة" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

<div class="pf-shell">
  <aside class="pf-side" aria-label="أقسام البروفايل">

      <span class="pf-skel" style="height:14px;width:60px;margin:0 12px 12px"></span>
      <span class="pf-skel" style="height:14px;width:130px;margin:0 12px 20px"></span>
      <span class="pf-skel" style="height:14px;width:110px;margin:0 12px 20px"></span>
      <span class="pf-skel" style="height:14px;width:120px;margin:0 12px 20px"></span>
    </nav>

  <main class="pf-canvas">

          </div>
          <div class="pf-hero-actions" id="pfHeroActions"></div>
        </div>
      </div>


      <section class="pf-content" id="pfContent" aria-live="polite">
        <div class="pf-skel" style="height:22px;width:160px"></div>
        <div class="pf-skel" style="height:220px;margin-top:16px;border-radius:16px;background:var(--surface)"></div>
      </section>
    </div>
  </main>
</div>
