<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الملف الشخصي — ألعاب أيمن</title>
<meta name="description" content="ملفك الشخصي على منصة ألعاب أيمن: الحساب، النقاط، المقتنيات وأدوات البث.">
<meta name="theme-color" content="#060609">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="js/agp-apple-emoji.js"></script>
<!--
  صفحة البروفايل: هيكل ثابت هنا، وكل المحتوى ينبني من js/agp-profile-page.js.
  - فوق: بطاقة الحساب + زر «لاعب | ستريمر» يبدّل البروفايل بين وضعين.
  - يمين: قائمة جانبية مقسّمة تصنيفات (الحساب، التقدّم، المقتنيات، البث، أدوات الستريمر، الدعم).
  - على الجوال تتحول القائمة لشريط أفقي يتمرر فوق المحتوى.
-->
<style>
  :root{
    --bg:#060609;
    --surface:#110f1a;
    --surface-2:#171425;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);
    --text:#f4f2fb;
    --text-2:#cfc7e2;
    --muted:#8f88a3;
    --accent:#7a3fd4;
    --accent-2:#b28cf5;
    --accent-3:#c46ae0;
    --accent-soft:rgba(122,63,212,.14);
    --blue:#4d7bff;
    --blue-2:#7f9cf5;
    --blue-soft:rgba(77,123,255,.10);
    --ok:#7ee0a6;
    --bad:#e08a8a;
    --warn:#fde68a;
    --green:#34d399;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
    --ff-head:"Noto Kufi Arabic",system-ui,sans-serif;
    --ff-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
    --side-w:268px;
  }
  body[data-pf-mode="streamer"]{ --accent:#3f62d4; --accent-2:#7f9cf5; --accent-3:#4dd8ff; --accent-soft:rgba(77,123,255,.13); }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--ff-body);line-height:1.6;overflow-x:hidden}
  a{color:var(--accent-2);text-decoration:none}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

  .pf-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60vw 40vw at 85% -10%,rgba(122,63,212,.20),transparent 60%),
      radial-gradient(50vw 40vw at 0% 110%,rgba(196,106,224,.10),transparent 60%),
      var(--bg);transition:background .4s}
  body[data-pf-mode="streamer"] .pf-bg{background:
      radial-gradient(60vw 40vw at 85% -10%,rgba(63,98,212,.22),transparent 60%),
      radial-gradient(50vw 40vw at 0% 110%,rgba(77,216,255,.08),transparent 60%),
      var(--bg)}

  /* ---------------------------------------------------------- الهيدر */
  .pf-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px max(16px,3vw);background:rgba(6,6,10,.92);border-bottom:1px solid var(--line)}
  .pf-brand img{display:block;height:40px;width:auto}
  .pf-nav{display:flex;align-items:center;gap:6px}
  .pf-nav a{padding:8px 14px;border-radius:999px;color:var(--text-2);font-size:14px;transition:color .2s,background .2s}
  .pf-nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .pf-nav .pf-nav-out{border:1px solid rgba(224,138,138,.3);color:var(--bad)}
  .pf-nav .pf-nav-out:hover{background:rgba(224,138,138,.1);color:var(--bad)}
  .pf-burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(178,140,245,.35);background:rgba(122,63,212,.12);
    flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
  .pf-burger span{display:block;width:18px;height:2px;background:#c6b4f2;border-radius:2px;transition:transform .25s,opacity .25s}
  .pf-menu-open .pf-burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .pf-menu-open .pf-burger span:nth-child(2){opacity:0}
  .pf-menu-open .pf-burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* ---------------------------------------------------------- الإطار العام */
  .pf-wrap{width:100%;max-width:1440px;margin:0 auto;padding:24px max(16px,3vw) 64px}

  /* بطاقة الحساب العلوية */
  .pf-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    padding:22px 24px;border-radius:var(--r-lg);border:1px solid var(--line);
    background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);position:relative;overflow:hidden}
  .pf-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-3));opacity:.9}
  .pf-hero-id{display:flex;align-items:center;gap:18px;min-width:0;flex:1 1 360px}
  .pf-avatar{position:relative;flex:none;width:84px;height:84px;border-radius:24px;padding:3px;background:linear-gradient(140deg,var(--accent),var(--accent-3))}
  .pf-avatar img,.pf-avatar-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:21px;object-fit:cover;
    background:repeating-linear-gradient(135deg,#2a2440 0 9px,#191527 9px 18px);font-family:var(--ff-head);font-size:30px;font-weight:700;color:var(--accent-2)}
  .pf-avatar.editable{cursor:pointer}
  .pf-avatar-cam{position:absolute;bottom:-6px;left:-6px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);border:3px solid var(--surface);font-size:13px;pointer-events:none}
  .pf-hero-text{min-width:0}
  .pf-name{margin:0;font-family:var(--ff-head);font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.4;overflow-wrap:anywhere}
  .pf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pf-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;color:var(--text-2);
    border:1px solid var(--line-2);background:rgba(255,255,255,.03);white-space:nowrap}
  .pf-chip.role{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-3))}
  .pf-chip.ok{color:var(--ok);border-color:rgba(126,224,166,.35);background:rgba(126,224,166,.08)}
  .pf-chip.warn{color:var(--bad);border-color:rgba(224,138,138,.35);background:rgba(224,138,138,.08)}
  .pf-chip-btn{cursor:pointer;font-family:inherit;direction:ltr}
  .pf-chip-btn:hover{border-color:var(--accent-2);color:#fff}
  .pf-hero-end{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
  .pf-hero-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

  /* زر الوضع: لاعب | ستريمر */
  .pf-mode{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;border:1px solid var(--line-2);background:rgba(0,0,0,.35)}
  .pf-mode::before{content:"";position:absolute;top:4px;bottom:4px;right:4px;width:calc(50% - 4px);border-radius:999px;
    background:linear-gradient(135deg,#7a3fd4,#c46ae0);box-shadow:0 8px 22px -10px rgba(196,106,224,.9);transition:transform .35s cubic-bezier(.22,1,.36,1),background .35s}
  .pf-mode[data-active="streamer"]::before{transform:translateX(-100%);background:linear-gradient(135deg,#3f62d4,#4dd8ff);box-shadow:0 8px 22px -10px rgba(77,216,255,.8)}
  .pf-mode button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:118px;padding:10px 18px;border:0;border-radius:999px;
    background:transparent;color:var(--muted);font-size:14.5px;font-weight:700;cursor:pointer;transition:color .25s}
  .pf-mode button.on{color:#fff}
  .pf-mode button:not(.on):hover{color:var(--text-2)}

  /* ---------------------------------------------------------- التخطيط: قائمة يمين + محتوى */
  .pf-layout{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
  .pf-side{position:sticky;top:86px;max-height:calc(100vh - 106px);overflow:auto;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);scrollbar-width:thin}
  .pf-side-group + .pf-side-group{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .pf-side-label{padding:0 10px 6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
  .pf-side-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:14px;position:relative;
    transition:background .2s,color .2s}
  .pf-side-item:hover{background:rgba(255,255,255,.04);color:#fff}
  .pf-side-item.on{background:var(--accent-soft);color:#fff;font-weight:600}
  .pf-side-item.on::before{content:"";position:absolute;right:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:linear-gradient(var(--accent-2),var(--accent-3))}
  .pf-side-ic{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.04);font-size:15px}
  .pf-side-item.on .pf-side-ic{background:rgba(255,255,255,.08)}
  .pf-side-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pf-side-badge{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#d878ff;color:#1a0b2e;font-size:11.5px;font-weight:800;line-height:20px;text-align:center}
  .pf-side-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.8)}
  .pf-side-lock{font-size:12px;opacity:.7}

  .pf-content{min-width:0;padding:22px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);min-height:420px;scroll-margin-top:90px}
  .pf-anim{animation:pf-rise .4s cubic-bezier(.22,1,.36,1) both}
  @keyframes pf-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pf-content-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .pf-content-ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:var(--accent-soft);border:1px solid rgba(255,255,255,.06);font-size:20px}
  .pf-content-title{margin:0;font-family:var(--ff-head);font-size:20px;font-weight:700}
  .pf-content-body{display:flex;flex-direction:column;gap:16px}

  /* ---------------------------------------------------------- مكونات المحتوى */
  .pf-panel{padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
  .pf-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pf-panel-title{margin:0;font-family:var(--ff-head);font-size:15.5px;font-weight:700}
  .pf-panel-sub{font-size:12.5px;color:var(--muted)}
  .pf-panel-danger{border-color:rgba(224,90,90,.22);background:rgba(224,90,90,.03)}
  .pf-muted{font-size:13px;color:var(--muted);line-height:1.8}
  .pf-mt{margin-top:8px}
  .pf-eyebrow{font-size:12px;font-weight:600;color:var(--accent-2)}
  .pf-link{font-size:13px;font-weight:600;color:var(--accent-2)}
  .pf-link:hover{color:#fff}
  .pf-hint{font-size:13px;color:var(--muted)}
  .pf-empty{grid-column:1/-1;padding:18px;border-radius:var(--r-sm);border:1px dashed var(--line-2);font-size:13px;color:var(--muted);text-align:center}

  .pf-kvs{display:flex;flex-direction:column;margin-top:10px}
  .pf-kv{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
  .pf-kv:last-child{border-bottom:0}
  .pf-kv-k{color:var(--muted)}
  .pf-kv-v{color:var(--text);text-align:left;overflow-wrap:anywhere}

  .pf-ov{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
  .pf-ov-level{display:flex;align-items:center;gap:20px}
  .pf-ov-level-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pf-ov-level-name{font-family:var(--ff-head);font-size:18px;font-weight:700}
  .pf-ring{--p:0;--c1:#c46ae0;flex:none;width:112px;height:112px;border-radius:50%;padding:9px;background:conic-gradient(var(--c1) calc(var(--p) * 1%),rgba(255,255,255,.07) 0)}
  .pf-ring.blue{--c1:#4dd8ff}
  .pf-ring-in{width:100%;height:100%;border-radius:50%;background:#0b0a12;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pf-ring-v{font-family:var(--ff-head);font-size:22px;font-weight:700;line-height:1.2}
  .pf-ring-u{font-size:11.5px;color:var(--muted)}

  .pf-stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pf-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pf-stat{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:16px 14px;border-radius:var(--r-md);border:1px solid rgba(178,140,245,.16);background:rgba(122,63,212,.07)}
  .pf-stat.blue{border-color:rgba(127,156,245,.18);background:rgba(63,95,212,.07)}
  .pf-stat-v{font-family:var(--ff-head);font-size:24px;font-weight:700;line-height:1.3;direction:ltr;text-align:right}
  .pf-stat-l{font-size:12.5px;color:var(--muted)}

  .pf-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .pf-quick-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text-2);font-size:13.5px;transition:border-color .2s,background .2s,transform .2s}
  .pf-quick-item:hover{border-color:var(--accent-2);background:var(--accent-soft);color:#fff;transform:translateY(-2px)}
  .pf-quick-ic{font-size:17px}

  .pf-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

  /* أزرار */
  .pf-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;
    font-size:13.5px;font-weight:700;white-space:nowrap;text-decoration:none;transition:filter .2s,transform .2s,background .2s,border-color .2s}
  .pf-btn:disabled{opacity:.55;cursor:default}
  .pf-btn:not(:disabled):hover{transform:translateY(-1px)}
  .pf-btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-3));color:#fff;box-shadow:0 10px 24px -14px var(--accent-3)}
  .pf-btn-primary:hover{filter:brightness(1.08);color:#fff}
  .pf-btn-ghost{background:rgba(255,255,255,.03);border-color:var(--line-2);color:var(--text-2)}
  .pf-btn-ghost:hover{border-color:var(--accent-2);color:#fff}
  .pf-btn-green{background:linear-gradient(135deg,#0f9f74,#34d399);color:#04140e}
  .pf-btn-gold{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.45);color:#fde7a8}
  .pf-btn-warn{align-self:flex-start;background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.6);color:var(--warn);border-radius:999px}
  .pf-btn-danger{background:rgba(224,90,90,.08);border-color:rgba(224,90,90,.45);color:#e05a5a}
  .pf-btn-danger:hover{background:rgba(224,90,90,.16)}
  .pf-btn-soon{border:1px dashed rgba(178,140,245,.45);background:rgba(122,63,212,.08);color:#a99bc7;cursor:not-allowed}
  .pf-btn-soon:hover{transform:none !important}
  .pf-btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px}

  .pf-tag{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:10px;font-size:12px;color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
  .pf-tag.ok{color:var(--ok);border-color:rgba(126,224,166,.35);background:rgba(126,224,166,.08)}
  .pf-tag.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-3))}

  /* صفوف الأدوات: الوصف يمين والتحكم يسار */
  .pf-tool{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r-md);
    border:1px solid rgba(178,140,245,.22);background:rgba(122,63,212,.06)}
  .pf-tool.green{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.05)}
  .pf-tool.cyan{border-color:rgba(77,216,255,.25);background:rgba(77,216,255,.05)}
  .pf-tool.danger{border-color:rgba(224,90,90,.25);background:transparent;padding:14px 0 0;border-width:0}
  .pf-tool-txt{flex:1 1 260px;min-width:0;text-align:right}
  .pf-tool-title{display:flex;align-items:center;gap:8px;font-family:var(--ff-head);font-size:15px;font-weight:700}
  .pf-tool-ic{font-size:17px}
  .pf-tool-desc{margin-top:4px;font-size:13px;line-height:1.8;color:#c3bad6}
  .pf-tool-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .pf-banner{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-md);font-size:13.5px;line-height:1.8}
  .pf-banner.warn{border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.07);color:var(--warn)}

  /* شبكة المقتنيات */
  .pf-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
  .pf-items-md{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .pf-items-lg{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .pf-item{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.025);transition:transform .25s,border-color .25s}
  .pf-item:hover{transform:translateY(-3px);border-color:var(--line-2)}
  .pf-item.on{border-color:rgba(178,140,245,.6);background:var(--accent-soft)}
  .pf-item-art{height:64px;border-radius:11px;border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,rgba(178,140,245,.16),rgba(23,19,38,.9) 70%)}
  .pf-item-art img{max-height:94%;max-width:94%;object-fit:contain}
  .pf-item-glyph{font-family:var(--ff-head);font-size:54px;font-weight:700;color:var(--accent-2)}
  .pf-item-name{font-size:13px;line-height:1.6;color:var(--text);min-height:21px}
  .pf-item-status{font-size:11.5px}
  .pf-item-status.ok{color:var(--ok)}
  .pf-item-status.off{color:var(--bad)}
  .pf-item .pf-btn,.pf-item .pf-tag{width:100%}

  .pf-entrance{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.025)}
  .pf-entrance-ic{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--accent-soft);font-size:20px}
  .pf-entrance-txt{min-width:0}
  .pf-entrance-name{font-size:14.5px;font-weight:600}

  /* استرداد كود */
  .pf-redeem{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .pf-input{flex:1;min-width:0;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
  .pf-input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
  .pf-input-code{flex-basis:220px;font-family:ui-monospace,monospace;direction:ltr;text-align:left;letter-spacing:1px}
  .pf-msg{min-height:20px;margin-top:10px;font-size:13px}
  .pf-msg.ok{color:var(--ok)}
  .pf-msg.err{color:var(--bad)}

  /* أكواد الفوز */
  .pf-howto{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.25);font-size:12.5px;line-height:1.9;color:#d9d3e6}
  .pf-howto b{color:#fde7a8}
  .pf-codes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .pf-code{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.025)}
  .pf-code-info{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pf-code-v{font-family:ui-monospace,monospace;font-size:15px;letter-spacing:1px;direction:ltr;text-align:right;color:#e6dcff}
  .pf-code.dim .pf-code-v{color:var(--muted)}

  /* تيك توك */
  .pf-tt{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:22px 20px;border-radius:var(--r-lg);border:1px solid transparent;
    background:linear-gradient(180deg,rgba(18,16,28,.97),rgba(8,8,13,.98)) padding-box,linear-gradient(135deg,#25f4ee,#7a3fd4 50%,#fe2c55) border-box;
    box-shadow:0 24px 60px -34px rgba(254,44,85,.55),0 18px 50px -36px rgba(37,244,238,.5)}
  .pf-tt-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pf-tt-head > div{flex:1;min-width:0}
  .pf-tt-logo{flex:none;width:52px;height:52px;border-radius:15px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 24px -10px rgba(254,44,85,.6)}
  .pf-tt-logo img{width:40px;height:40px;display:block}
  .pf-tt-title{font-family:var(--ff-head);font-size:16.5px;font-weight:700}
  .pf-tt-handle{font-size:13px;color:var(--text-2);direction:ltr;text-align:right}
  .pf-tt-sub{font-size:13.5px;line-height:1.85;color:#d9d3e8}
  .pf-tt-sub b{color:#fff}
  .pf-tt-chips{display:flex;flex-wrap:wrap;gap:6px}
  .pf-tt-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11.5px;color:#e9e4f5;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .pf-tt-why{font-size:12.5px;line-height:1.8;color:var(--muted);padding:10px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.03)}
  .pf-tt-why b{color:var(--text-2)}
  .pf-tt-btn{padding:14px 16px;border-radius:14px;border:0;cursor:pointer;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(90deg,#fe2c55,#b0269e 55%,#25c7ee);box-shadow:0 14px 30px -14px rgba(254,44,85,.8);transition:transform .2s,filter .2s}
  .pf-tt-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .pf-tt-btn.unlink{background:transparent;border:1px solid rgba(224,138,138,.45);color:var(--bad);box-shadow:none;font-size:13.5px;padding:11px 16px}
  .pf-tt-btn-logo{width:20px;height:20px;vertical-align:-4px;margin-inline-start:8px}

  /* لوحة التحكم (متحكم) */
  .pf-rc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .pf-rc-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(52,211,153,.25);background:rgba(52,211,153,.05);color:var(--text)}
  .pf-rc-item:hover{background:rgba(52,211,153,.1)}
  .pf-rc-av{flex:none;width:38px;height:38px;border-radius:50%;object-fit:cover;background:rgba(52,211,153,.2);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
  .pf-rc-name{flex:1;min-width:0;font-weight:600}

  /* قريباً */
  .pf-soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .pf-soon-card{padding:16px;border-radius:var(--r-md);border:1px dashed var(--line-2);background:rgba(255,255,255,.02)}
  .pf-soon-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .pf-soon-ic{font-size:22px}
  .pf-soon-t{font-family:var(--ff-head);font-size:14.5px;font-weight:700;margin-bottom:2px}

  /* حالة مقفولة / تسجيل دخول / خطأ */
  .pf-lock{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 20px;text-align:center}
  .pf-lock-ic{font-size:40px}
  .pf-lock-t{font-family:var(--ff-head);font-size:17px;font-weight:700}
  .pf-lock-d{font-size:13.5px;color:var(--muted);max-width:420px;margin-bottom:8px}
  body.pf-state .pf-side,body.pf-state .pf-mode{display:none}
  body.pf-state .pf-layout{grid-template-columns:minmax(0,1fr)}
  body.pf-visitor .pf-mode{opacity:.95}

  /* هيكل مؤقت أثناء التحميل */
  .pf-skel{border-radius:var(--r-sm);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));background-size:200% 100%;animation:pf-shim 1.4s linear infinite}
  @keyframes pf-shim{to{background-position:-200% 0}}

  /* ---------------------------------------------------------- نوافذ التعديل وتأكيد الإيميل */
  .agp-ed-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,3,8,.72);opacity:0;transition:opacity .2s}
  .agp-ed-overlay.open{opacity:1}
  .agp-ed-sheet{direction:rtl;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow:auto;border-radius:24px;border:1px solid rgba(178,140,245,.28);background:linear-gradient(180deg,#1c1830,#0c0b13);box-shadow:0 40px 90px -30px rgba(0,0,0,.95);padding:22px;font-family:var(--ff-body);color:var(--text);transform:translateY(14px) scale(.98);transition:transform .25s cubic-bezier(.22,1,.36,1)}
  .agp-ed-overlay.open .agp-ed-sheet{transform:none}
  .agp-ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .agp-ed-title{font-family:var(--ff-head);font-size:18px;font-weight:700}
  .agp-ed-x{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--text-2);font-size:20px;line-height:1;cursor:pointer}
  .agp-ed-photo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px}
  .agp-ed-avatar{position:relative;width:132px;height:132px;border-radius:32px;padding:4px;background:linear-gradient(140deg,#7a3fd4,#c46ae0);cursor:pointer;transition:transform .2s}
  .agp-ed-avatar:hover,.agp-ed-avatar.drag{transform:scale(1.04)}
  .agp-ed-avatar-in{width:100%;height:100%;border-radius:28px;overflow:hidden;background:repeating-linear-gradient(135deg,#2a2440 0 9px,#191527 9px 18px);display:flex;align-items:center;justify-content:center}
  .agp-ed-avatar-in img{width:100%;height:100%;object-fit:cover;display:block}
  .agp-ed-cam{position:absolute;bottom:-6px;left:-6px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#7a3fd4;border:3px solid #15121f;font-size:17px}
  .agp-ed-photo-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .agp-ed-btn{padding:11px 18px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;border:1px solid rgba(178,140,245,.4);background:rgba(122,63,212,.14);color:#e2d6ff;transition:background .2s}
  .agp-ed-btn:hover{background:rgba(122,63,212,.3)}
  .agp-ed-btn:disabled{opacity:.55;cursor:default}
  .agp-ed-btn.primary{background:linear-gradient(180deg,#8a4fe8,#7a3fd4);border-color:#7a3fd4;color:#fff}
  .agp-ed-btn.ghost{background:transparent;border-color:rgba(255,255,255,.14);color:var(--text-2)}
  .agp-ed-hint{font-size:12px;color:var(--muted);text-align:center}
  .agp-ed-field{margin-top:22px}
  .agp-ed-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--text-2)}
  .agp-ed-count{font-size:12px;color:var(--muted);direction:ltr}
  .agp-ed-count.over{color:var(--bad)}
  .agp-ed-input{box-sizing:border-box;width:100%;margin-top:8px;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
  .agp-ed-input:focus{border-color:rgba(178,140,245,.7);box-shadow:0 0 0 3px rgba(122,63,212,.25)}
  .agp-ed-msg{min-height:20px;margin-top:14px;font-size:13px;text-align:center}
  .agp-ed-msg.err{color:var(--bad)}.agp-ed-msg.ok{color:var(--ok)}
  .agp-ed-actions{display:flex;gap:10px;margin-top:8px}
  .agp-ed-actions .agp-ed-btn{flex:1}
  .agp-ed-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:1100;max-width:calc(100vw - 32px);padding:12px 20px;border-radius:12px;font-size:14px;background:rgba(18,40,30,.95);border:1px solid rgba(126,224,166,.4);color:var(--ok);font-family:var(--ff-body);text-align:center}
  .agp-ed-toast.bad{background:rgba(44,18,22,.95);border-color:rgba(224,138,138,.4);color:var(--bad)}

  /* ---------------------------------------------------------- تجاوب */
  @media (max-width:1100px){
    :root{--side-w:232px}
    .pf-ov{grid-template-columns:minmax(0,1fr)}
  }
  /* آيباد وجوال: القائمة الجانبية تصير شريط أفقي فوق المحتوى */
  @media (max-width:899px){
    .pf-layout{grid-template-columns:minmax(0,1fr);gap:14px}
    .pf-side{position:sticky;top:64px;z-index:20;max-height:none;overflow-x:auto;overflow-y:hidden;padding:8px;display:block;border-radius:var(--r-md);
      background:rgba(17,15,26,.96);scrollbar-width:none}
    .pf-side::-webkit-scrollbar{display:none}
    #pfSideNav{display:flex;gap:6px;width:max-content}
    .pf-side-group{display:flex;align-items:center;gap:4px}
    .pf-side-group + .pf-side-group{margin:0;padding:0 8px 0 0;border-top:0;border-right:1px solid var(--line)}
    .pf-side-label{display:none}
    .pf-side-item{padding:7px 12px 7px 10px;gap:7px;font-size:13.5px;white-space:nowrap}
    .pf-side-item.on::before{display:none}
    .pf-side-ic{width:24px;height:24px;font-size:13px;border-radius:7px}
    .pf-content{padding:18px 16px}
  }
  @media (max-width:700px){
    .pf-hero{padding:18px 16px}
    .pf-hero-end{width:100%;align-items:stretch}
    .pf-mode{display:grid;width:100%}
    .pf-mode button{min-width:0}
    .pf-hero-actions{justify-content:stretch}
    .pf-hero-actions > *{flex:1}
    .pf-avatar{width:68px;height:68px;border-radius:20px}
    .pf-avatar img,.pf-avatar-fallback{border-radius:17px}
    .pf-ov-level{flex-direction:column;text-align:center}
    .pf-ov-level-txt{align-items:center}
    .pf-stat{padding:14px 10px}
    .pf-stat-v{font-size:20px;text-align:center}
    .pf-stat-l{text-align:center;font-size:12px}
    .pf-stats-grid,.pf-items,.pf-items-lg{grid-template-columns:repeat(2,minmax(0,1fr))}
    .pf-tool-ctl,.pf-tool > .pf-btn,.pf-tool > a.pf-btn{width:100%}
    .pf-tool-ctl .pf-btn{flex:1}
  }
  @media (max-width:560px){
    .pf-nav{display:none;position:absolute;top:100%;left:16px;right:16px;flex-direction:column;align-items:stretch;gap:0;padding:6px;border-radius:18px;
      border:1px solid rgba(178,140,245,.25);background:linear-gradient(180deg,#1a1526,#0d0b14);box-shadow:0 24px 60px -30px rgba(122,63,212,.6)}
    .pf-menu-open .pf-nav{display:flex}
    .pf-nav a{padding:14px 16px;border-radius:12px}
    .pf-burger{display:flex}
    .pf-side{top:66px}
  }
  @media (max-width:420px){
    .pf-items-md{grid-template-columns:minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body class="pf-loading" data-pf-mode="player">
<div class="pf-bg" aria-hidden="true"></div>

<header class="pf-header">
  <a href="./" class="pf-brand" aria-label="ألعاب أيمن — الرئيسية"><img src="logo.png" alt="ألعاب أيمن"></a>
  <nav class="pf-nav" aria-label="القائمة الرئيسية">
    <a href="./">الرئيسية</a>
    <a href="games.html">الألعاب</a>
    <a href="./#gallery">التصنيف</a>
    <a href="login.html" class="pf-nav-out" data-logout>تسجيل خروج</a>
  </nav>
  <button type="button" class="pf-burger" id="pfBurger" aria-label="القائمة" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

<main class="pf-wrap">
  <section class="pf-hero" aria-label="بطاقة الحساب">
    <div class="pf-hero-id">
      <div class="pf-avatar" id="pfAvatar"><span class="pf-avatar-fallback pf-skel"></span></div>
      <div class="pf-hero-text">
        <h1 class="pf-name" id="pfName">جارٍ التحميل...</h1>
        <div class="pf-chips" id="pfChips"></div>
      </div>
    </div>
    <div class="pf-hero-end">
      <div class="pf-mode" id="pfMode" role="tablist" aria-label="نوع البروفايل" data-active="player">
        <button type="button" role="tab" data-mode="player" class="on" aria-selected="true">🎮 لاعب</button>
        <button type="button" role="tab" data-mode="streamer" aria-selected="false">🎥 ستريمر</button>
      </div>
      <div class="pf-hero-actions" id="pfHeroActions"></div>
    </div>
  </section>

  <div class="pf-layout">
    <aside class="pf-side" aria-label="أقسام البروفايل">
      <nav id="pfSideNav">
        <div class="pf-skel" style="height:34px;margin:6px 0"></div>
        <div class="pf-skel" style="height:34px;margin:6px 0"></div>
        <div class="pf-skel" style="height:34px;margin:6px 0"></div>
      </nav>
    </aside>
    <section class="pf-content" id="pfContent" aria-live="polite">
      <div class="pf-skel" style="height:42px;width:220px"></div>
      <div class="pf-skel" style="height:160px;margin-top:18px"></div>
      <div class="pf-skel" style="height:120px;margin-top:16px"></div>
    </section>
  </div>
</main>

<script src="js/agp-stream-overlay.js"></script>
<script src="js/agp-frame-picker.js"></script>
<script src="js/agp-stream-stats.js"></script>

<script src="js/agp-core.js"></script>

</body>
