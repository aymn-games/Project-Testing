<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روليت الإقصاء — ألعاب أيمن</title>
<!--
    Native page for "Elimination Roulette" — no external site or
    postMessage bridge (js/agp-game-bridge.js) dependency, unlike the old
    Tribe Roulette. Loads AGP Core in full, in the same order as the main
    page (see docs/CLAUDE.md and docs/ARCHITECTURE.md), then
    js/agp-game-shell.js (a pre-existing shared file, not modified here),
    then this game's own file. No login is required on this page
    specifically — the entry gate (login + admin approval) already
    happens on the main page before a visitor ever reaches the "Play Now"
    link (same mechanism as every other game).
-->
</head>
<body>

<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-events.js"></script>
<script src="../../js/agp-timer-manager.js"></script>
<script src="../../js/agp-storage-manager.js"></script>
<script src="../../js/agp-services.js"></script>
<script src="../../js/agp-stream-connector.js"></script>
<script src="../../adapters/agp-tiktok-adapter.js"></script>
<script src="../../js/agp-registry.js"></script>
<script src="../../js/agp-session.js"></script>
<script src="../../js/agp-rooms-manager.js"></script>
<script src="../../js/agp-player-manager.js"></script>
<script src="../../js/agp-player-source.js"></script>
<script src="../../js/agp-keyword-manager.js"></script>
<script src="../../js/agp-queue-manager.js"></script>
<script src="../../js/agp-score-manager.js"></script>
<script src="../../js/agp-lobby.js"></script>
<script src="../../js/agp-game-api.js"></script>
<script src="../../js/agp-game-engine.js"></script>
<script src="../../js/agp-game-manager.js"></script>
<script src="../../js/agp-game-bridge.js"></script>
<script src="../../js/agp-round-manager.js"></script>
<script src="../../js/agp-bootstrap.js"></script>

<!-- Accounts/points layer — independent of AGP.*, used only to report end-of-match points -->
<script src="../../auth/auth-client.js"></script>

<!-- Shared player card (photo + name [+ lobby frame]) — loaded before
     agp-game-shell.js and this game's own file since both use it
     optionally (AGP.playerCard?) -->
<script src="../../js/agp-player-card.js"></script>

<!-- "Entrance" animation (a player with an entrance enabled from the
     admin panel) — loaded after agp-player-manager.js (listens to its
     events) and before agp-game-shell.js (provides the stable
     banner/card containers on the lobby screen). See js/agp-entrance.js. -->
<script src="../../js/agp-entrance.js"></script>

<!-- Settings screen + TikTok connection + lobby (shared, pre-existing) -->
<script src="../../js/agp-game-shell.js"></script>

<!-- Real TikTok gift-support icons, shared across every game — loaded
     before this game's own file since it calls AGP.tiktokGifts when
     building each gift's icon -->
<script src="../../assets/tiktok-gifts/tiktok-gifts.js"></script>

<!-- This game's own logic -->
<script src="agp-elimination-roulette.js"></script>

</body>
</html>
