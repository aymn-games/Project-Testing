<!DOCTYPE html>

<head>

<title>خلية الحروف — ألعاب أيمن</title>

<!-- خطوط Cairo + Baloo Bhaijaan 2 (Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Baloo+Bhaijaan+2:wght@800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<!--
    ==========================================================================
     خلية الحروف (Letters Cell) — "حروف مع أيمن". لعبة أصلية (Native) داخل
     مستودع Project-Testing. هوية بصرية مستقلة بالكامل حسب تصميم التسليم
     (design handoff) — لا اعتماد على js/agp-game-shell.js. لا تعديل على أي
     ملف موجود بالمشروع غير games.html (لإضافة اللعبة لمكتبة الألعاب).
    ==========================================================================
-->
    <script src="../../js/agp-apple-emoji.js"></script>
</head>
<body>
<!-- 🔧 وضع الصيانة: اللعبة مقفولة مؤقتاً. سكربتات اللعبة محفوظة كما هي داخل
     <template id="lc-game-scripts"> (لا تُنفَّذ). لإعادة فتح اللعبة: احذف قسم
     #lc-maintenance ووسوم <template> المحيطة بالسكربتات، وشيل
     maintenance: true وشارة 'صيانة' من بطاقة letters-cell في games.html. -->
<div id="lc-maintenance" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#0a0812;font-family:'Cairo',sans-serif;direction:rtl;">
    <div style="width:100%;max-width:420px;padding:32px 26px;border-radius:20px;border:1px solid rgba(251,191,36,.4);background:linear-gradient(180deg,#1a1526,#0d0b14);text-align:center;color:#f2edff;">
        <div style="font-size:44px;line-height:1;">🔧</div>
        <h1 style="margin:16px 0 8px;font-size:26px;font-weight:900;">خلية الحروف تحت الصيانة</h1>
        <p style="margin:0 0 22px;font-size:15px;line-height:1.8;color:#c9c2df;">اللعبة مقفولة مؤقتاً للصيانة، وبترجع قريب إن شاء الله.</p>
        <a href="../../games.html" style="display:block;padding:12px;border-radius:12px;background:linear-gradient(90deg,#8b5cf6,#a78bfa);color:#0a0812;font-weight:900;font-size:15px;text-decoration:none;">العودة لمكتبة الألعاب</a>
    </div>
</div>

<template id="lc-game-scripts">

<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-events.js"></script>
<script src="../../js/agp-timer-manager.js"></script>

<script src="../../adapters/agp-tiktok-adapter.js"></script>
<script src="../../js/agp-registry.js"></script>
<script src="../../js/agp-session.js"></script>
<script src="../../js/agp-rooms-manager.js"></script>
<script src="../../js/agp-player-manager.js"></script>
<script src="../../js/agp-player-source.js"></script>
<script src="../../js/agp-keyword-manager.js"></script>
<script src="../../js/agp-queue-manager.js"></script>
<script src="../../js/agp-score-manager.js"></script>
<script src="../../js/agp-lobby.js"></script>
<script src="../../js/agp-game-api.js"></script>
<script src="../../js/agp-game-engine.js"></script>
<script src="../../js/agp-game-manager.js"></script>
<script src="../../js/agp-game-bridge.js"></script>
<script src="../../js/agp-round-manager.js"></script>
<script src="../../js/agp-bootstrap.js"></script>

<script src="../../js/agp-player-card.js"></script>
<script src="../../js/agp-win-card.js"></script>

<!-- يفعّل رابط "إدارة بنك الأسئلة" بشاشة الإعدادات لأي مستخدم مسجّل دخول
     بالمتصفح ومعه صلاحية can_manage_letters_cell أو أدمن -- نفس طريقة
     games/top-ten (auth-client.js + isCachedAllowedAdminUser()). -->
<script src="../../auth/auth-client.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<script src="../../js/agp-live-watch.js"></script>

<!-- منطق لعبة خلية الحروف نفسها (بدون agp-game-shell.js) -->
<script src="agp-letters-cell.js"></script>

</template>

</html>
