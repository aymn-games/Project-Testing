<!--
    ==========================================================================
     شخبطة (Shakhbata) — لعبة أصلية (Native) داخل مستودع Project-Testing، بنفس
     نمط games/khazna من ناحية طريقة التحميل: لا اعتماد على
     js/agp-game-shell.js. هوية بصرية: قالب "settings-no-box" منقول من
     الخزنة (خط Zain فقط). لا تعديل على أي ملف موجود بالمشروع (بما فيها
     ملفات الخزنة نفسها).

     الفكرة: الستريمر يرسم شي يختاره (يكتبه بمربع نص سري ما يشوفه المشاهدين)،
     والمشاهدين يخمنون بالشات. أول تخمين صحيح (تطابق تقريبي) ياخذ 3 نقاط،
     الثاني نقطتين، والباقي (لين العدد المحدد بالإعدادات) نقطة لكل واحد.
    ==========================================================================
-->
</head>
