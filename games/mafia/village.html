<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المافيا — القرية</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="../../auth/auth-client.js"></script>
<!-- التحكم عن بعد: المتحكم يشغّل اللعبة من جواله (control.html) أو بأوامر الشات -->
<script src="../../js/agp-remote-control.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<script src="../../js/agp-stream-overlay.js"></script>
<script src="../../js/agp-live-presence.js" data-game="mafia"></script>
<script src="mafia-net.js"></script>
<script src="mafia-looks.js"></script>
<script src="mafia-sfx.js"></script>
<script src="village-roles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/*
 * «المافيا» — نظام القرية: شاشة البث (المذيع راوي وليس لاعباً).
 * نفس ساحة القرية ثلاثية الأبعاد (mafia-scene.js)، وفوقها لوحات النظام الجديد:
 * لافتة المرحلة، «طلع الصبح على القرية»، شبكة التصويت، «قرار القرية»، وشاشة النهاية.
 */
:root {
    --ink: #f4f2f8; --mute: #a8a3b5; --navy: rgba(14, 18, 42, .88); --navy-bd: rgba(160, 170, 255, .16);
    --paper: #fbf6ea; --paper-ink: #2b2333; --paper-mute: #7d7287; --gold: #f5c84c;
    --red: #e2483d; --green: #22b36b; --blue: #4f8ff7; --purple: #b07cf7;
    --c3: #ddd6fe; --g1: #7c3aed; --g2: #a855f7; --c-bd: rgba(167,139,250,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07060b; color: var(--ink); font-family: 'IBM Plex Sans Arabic', "Segoe UI", Tahoma, sans-serif; direction: rtl; }
button { font-family: inherit; cursor: pointer; }
#stage { position: fixed; inset: 0; }
#stage canvas { width: 100%; height: 100%; display: block; }
.ui { position: fixed; inset: 0; pointer-events: none; }
.ui > * { pointer-events: auto; }
.hide { display: none !important; }

/* الشريط العلوي */
.topbar { position: absolute; top: 0; inset-inline: 0; z-index: 6; height: 64px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 16px; background: rgba(10, 9, 15, .3); border-bottom: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
.brand-dot { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #b8861d, #f0b93a); font-size: 18px; }
.brand small { color: var(--mute); font-size: 13px; font-weight: 600; }
.logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 50px; pointer-events: none; }
.logo img { height: 50px; max-width: 240px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(139,92,246,.45)); }
.top-actions { display: flex; gap: 8px; }
.tbtn { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--c-bd); background: rgba(139,92,246,.08); color: var(--c3); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tbtn:hover { background: rgba(139,92,246,.18); }
.tbtn.exit { border-color: rgba(248,113,113,.28); color: #fca5a5; background: rgba(255,255,255,.03); }
.tbtn.lock { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(167,139,250,.35); } }

/* المؤقت · بطاقة اليوم · اللافتة */
.timer { position: absolute; top: 78px; left: 18px; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); font-weight: 800; font-size: 28px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 5; }
.day { position: absolute; top: 78px; right: 18px; padding: 8px 14px; border-radius: 16px; background: var(--navy); border: 1px solid var(--navy-bd); display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
.day .ico { font-size: 26px; }
.day b { display: block; font-size: 21px; font-weight: 800; line-height: 1.1; }
.day b em { font-style: normal; color: var(--gold); }
.day span { font-size: 13px; color: var(--mute); font-weight: 700; }
.day button { margin-inline-start: 6px; height: 34px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--navy-bd); background: rgba(255,255,255,.06); color: #fff; font-weight: 700; font-size: 14px; }
.banner { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); width: min(760px, 56%); text-align: center; padding: 8px 22px 10px; border-radius: 16px; background: var(--navy); border: 1px solid var(--navy-bd); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.banner .sub { font-size: 14px; font-weight: 700; color: #c9cdea; }
.banner .title { font-size: clamp(20px, 2.1vw, 30px); font-weight: 800; color: #fff; line-height: 1.25; }
.banner .title.gold { color: var(--gold); }
.banner .act { margin-top: 8px; height: 40px; padding: 0 20px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #ffe08a, #f0b93a); color: #2a1d00; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #b8861d; }

/* شريط أعداد الأدوار */
.rolebar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 480px); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 7px; border-radius: 18px; background: var(--navy); border: 1px solid var(--navy-bd); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.rolebar .rc { --rc: #4f8ff7; flex: none; display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 12px; background: color-mix(in srgb, var(--rc) 20%, rgba(255,255,255,.03)); border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent); }
.rolebar .rc b { font-size: 24px; font-weight: 800; }
.rolebar .rc span { font-size: 13px; font-weight: 700; line-height: 1.2; }
.rolebar .rc i { font-style: normal; font-size: 20px; }

/* باركود الرجوع */
.qr-mini { position: absolute; bottom: 14px; left: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.qr-mini img { width: 66px; height: 66px; image-rendering: pixelated; }
.qr-mini b { display: block; color: #a8322a; font-size: 14px; }
.qr-mini .code { font-size: 26px; font-weight: 800; letter-spacing: 3px; direction: ltr; text-align: right; }
.qr-mini small { display: block; font-size: 11.5px; line-height: 1.45; color: var(--paper-mute); }

/* الورقة (الصبح، القرار، النهاية): ورق كريمي فوق المشهد */
.paper { background: var(--paper); color: var(--paper-ink); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.05); }
.ph { position: relative; flex: none; border-radius: 50%; overflow: hidden; background: #e8e0cf; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--rc, #b8a98a); }
.ph svg, .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.num { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 999px; background: #2b2333; color: #fff; font-size: 14px; font-weight: 800; }

/* «طلع الصبح على القرية» */
.morning { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(900px, 64%); max-height: calc(100% - 190px); overflow-y: auto; padding: 8px 26px; scrollbar-width: none; }
.mi { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1.5px dashed #d8ccb3; animation: miIn .5s cubic-bezier(.2,1.2,.4,1) both; }
.mi:last-child { border-bottom: 0; }
.mi .ph { width: 64px; height: 64px; }
.mi .t { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.mi .why { font-size: 15px; font-weight: 700; color: var(--paper-mute); }
.mi .nm { display: flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 800; color: #8f1d1d; }
.mi .was { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
.mi.saved .nm { color: #15803d; }
.mi.saved .ok { font-size: 16px; font-weight: 800; color: #15803d; }
.mi.quiet { justify-content: center; padding: 26px 0; font-size: 24px; font-weight: 800; color: var(--paper-ink); }
@keyframes miIn { from { opacity: 0; transform: translateX(-30px); } }

/* شبكة التصويت */
.votes { position: absolute; top: 150px; left: 18px; right: 18px; bottom: 84px; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-auto-rows: minmax(0, 76px); align-content: center; gap: 10px; }
.vc { position: relative; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 16px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 8px 20px rgba(0,0,0,.35); border: 2px solid transparent; min-width: 0; transition: border-color .3s, transform .3s; }
.vc.top { border-color: var(--red); box-shadow: 0 0 0 3px rgba(226,72,61,.25), 0 8px 20px rgba(0,0,0,.35); }
.vc .ph { width: 46px; height: 46px; }
.vc .num { min-width: 36px; height: 36px; font-size: 17px; }
.vc.top .num { background: var(--red); }
.vc .nm { flex: 1; min-width: 0; font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc .nm small { font-size: 13px; color: #a17a0e; }
.vc .n { flex: none; min-width: 44px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.vc .n b { font-size: 28px; font-weight: 800; color: #e7a7a0; }
.vc .n.has b { color: var(--red); }
.vc .n small { font-size: 11.5px; font-weight: 700; color: var(--paper-mute); margin-top: 2px; }
.vc .did { position: absolute; top: -10px; left: 12px; padding: 1px 10px; border-radius: 999px; background: var(--green); color: #fff; font-size: 12.5px; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.endvote { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); height: 52px; padding: 0 30px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #ffe08a, #f0b93a); color: #2a1d00; font-weight: 800; font-size: 18px; box-shadow: 0 5px 0 #b8861d, 0 14px 30px rgba(0,0,0,.4); }

/* «قرار القرية» */
.verdict { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(900px, 64%); padding: 16px 26px 20px; animation: miIn .5s ease both; }
.verdict .who { display: flex; align-items: center; gap: 16px; }
.verdict .ph { width: 84px; height: 84px; }
.verdict .t { flex: 1; min-width: 0; }
.verdict .k { font-size: 16px; font-weight: 700; color: var(--paper-mute); }
.verdict .nm { display: flex; align-items: center; gap: 10px; font-size: 30px; font-weight: 800; }
.verdict .bar { margin-top: 14px; height: 58px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; font-weight: 800; color: #fff; background: #3a2c1c; transition: background .4s; }
.verdict .bar.ask { animation: ask 1s ease-in-out infinite; }
.verdict .bar.mafia { background: var(--red); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.verdict .bar.town { background: var(--blue); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.verdict .bar.neutral { background: var(--purple); animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.verdict.none { text-align: center; font-size: 26px; font-weight: 800; }
@keyframes ask { 50% { opacity: .75; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }

/* النقاش (شات اللاعبين العام) */
.chat { position: absolute; top: 160px; right: 14px; bottom: 100px; width: min(280px, 21%); display: flex; flex-direction: column; border-radius: 18px; background: var(--navy); border: 1px solid var(--navy-bd); overflow: hidden; }
.chat-h { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 17px; font-weight: 800; display: flex; justify-content: space-between; }
.chat-h span { font-size: 13px; color: var(--mute); }
.msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg .ph { width: 32px; height: 32px; box-shadow: none; }
.msg b { display: block; font-size: 13.5px; color: var(--gold); }
.msg p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.chat .empty { margin: auto; text-align: center; color: var(--mute); font-weight: 700; line-height: 1.7; }

/* النهاية */
.over { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(1180px, 92%); max-height: calc(100% - 150px); display: flex; flex-direction: column; align-items: center; padding: 18px 22px 16px; background-image: repeating-linear-gradient(180deg, transparent 0 33px, rgba(120,150,200,.13) 33px 34px); }
.over .k { font-size: 15px; font-weight: 800; color: #a8322a; }
.over h1 { margin: 2px 0 6px; font-size: clamp(26px, 3vw, 40px); font-weight: 800; text-align: center; }
.over h1.town { color: #1f5fb8; } .over h1.mafia { color: #b91c1c; }
.over .jw { font-size: 16px; font-weight: 800; color: #7e3fd0; margin-bottom: 6px; }
.over .all { width: 100%; flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 14px; padding: 6px 2px; scrollbar-width: none; }
.over .op { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 6px; border-radius: 12px; }
.over .op.win { background: rgba(245,200,76,.22); }
.over .op .ph { width: 34px; height: 34px; box-shadow: none; }
.over .op .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.over .op.dead .nm { text-decoration: line-through; text-decoration-thickness: 2px; color: #8c8294; }
.over .acts { display: flex; gap: 10px; margin-top: 10px; }
.over .acts button { height: 48px; padding: 0 24px; border-radius: 14px; border: 0; font-weight: 800; font-size: 16px; color: #2a1d00; background: linear-gradient(180deg, #ffe08a, #f0b93a); box-shadow: 0 4px 0 #b8861d; }
.over .acts button.ghost { background: #ece3cf; box-shadow: 0 4px 0 #c9bb9c; }

/* التحكم */
.modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); }
.modal.on { display: grid; }
.sheet { width: min(520px, calc(100vw - 24px)); max-height: 80vh; display: flex; flex-direction: column; padding: 20px; border-radius: 22px; background: #13111b; border: 1px solid rgba(167,139,250,.25); }
.sheet h3 { margin: 0 0 14px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
.sheet .x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--c-bd); background: rgba(139,92,246,.08); color: var(--c3); }
.ctl-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.ctl-actions button { height: 48px; border-radius: 14px; border: 0; color: #fff; font-weight: 800; font-size: 15px; background: linear-gradient(135deg, var(--g1), var(--g2)); }
.ctl-actions button.ghost { background: rgba(139,92,246,.1); border: 1px solid var(--c-bd); color: var(--c3); }
.ctl-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.ctl-p { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.04); }
.ctl-p .who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.ctl-p .who .ph { width: 30px; height: 30px; box-shadow: none; }
.ctl-p .dead { opacity: .5; text-decoration: line-through; }
.ctl-p button { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(248,113,113,.35); background: rgba(248,113,113,.08); color: #fca5a5; font-weight: 700; font-size: 13px; }
.status { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(226,72,61,.92); font-weight: 800; display: none; }
.status.on { display: block; }
body.is-over .qr-mini, body.is-over .timer { display: none !important; }
@media (max-width: 900px) {
    .banner { width: 70%; top: 150px; } .morning, .verdict { width: 92%; } .chat { display: none; }
    .rolebar { max-width: calc(100% - 24px); bottom: 100px; } .votes { --cols: 2 !important; top: 220px; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="ui" id="ui">
    <header class="topbar">
        <div class="brand"><span class="brand-dot">🏘️</span> المافيا <small>· القرية</small></div>
        <div class="logo"><img src="../../logo.png" alt="ألعاب أيمن" onerror="this.style.display='none'"></div>
        <div class="top-actions">
            <button class="tbtn" id="sndBtn" type="button">🔊</button>
            <button class="tbtn" id="fsBtn" type="button" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
            <button class="tbtn" id="ctlBtn" type="button">☰ التحكم</button>
            <button class="tbtn exit" id="exitBtn" type="button">⏻ إنهاء اللعبة</button>
        </div>
    </header>

    <div class="timer hide" id="timer"><svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" stroke="rgba(255,255,255,.12)"/><circle id="timerArc" cx="35" cy="35" r="30" stroke="#f5c84c" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0"/></svg><span id="timerTxt"></span></div>
    <div class="day hide" id="day"><span class="ico" id="dayIco">🌙</span><div><b id="dayTxt"></b><span id="aliveTxt"></span></div><button type="button" id="rolesBtn">👁 الأدوار</button></div>
    <div class="banner hide" id="banner"><div class="sub" id="bSub"></div><div class="title" id="bTitle"></div><button class="act hide" id="bAct" type="button"></button></div>

    <section class="morning paper hide" id="morning" aria-live="polite"></section>
    <section class="votes hide" id="votes"></section>
    <button class="endvote hide" id="endVote" type="button">إنهاء التصويت ‹</button>
    <section class="verdict paper hide" id="verdict" aria-live="polite"></section>
    <aside class="chat hide" id="chat"><div class="chat-h">💬 النقاش <span id="chatCount"></span></div><div class="msgs" id="msgs"></div></aside>
    <div class="rolebar hide" id="rolebar"></div>
    <div class="qr-mini" id="qrMini"><img id="qrImg" alt="باركود الدخول"><div><b>دورك على هاتفك</b><div class="code" id="qrCode">----</div><small>قفلت الصفحة؟<br>امسح الباركود من جديد</small></div></div>
    <section class="over paper hide" id="over"></section>
    <div class="status" id="status">جاري الاتصال بالخادم…</div>
</div>

<div class="modal" id="ctlModal"><div class="sheet"><h3>التحكم <button class="x" type="button" data-close>✕</button></h3>
    <div class="ctl-actions"><button id="skipBtn" type="button">⏭ تخطي المرحلة</button><button class="ghost" id="toLobbyBtn" type="button">رجوع للوبي</button></div>
    <div class="ctl-list" id="ctlList"></div></div></div>

<script>
(function () {
    'use strict';
    var L = window.MafiaLooks, NET = window.MafiaNet, V = window.MafiaVillage, R = V.ROLES, esc = V.esc;
    V.injectCss();   // شارات الأدوار (vr-badge) بلوحات الصبح والنهاية
    var S = { code: '', room: null, G: null, reported: {}, showRoles: true };
    var PHOTOS = window.__mafiaPhotos = {};
    var $ = function (id) { return document.getElementById(id); };
    var ASK_AT = 1500, REVEAL_AT = 4200;   // «هل كان من المافيا؟» ثم الكشف (نفس توقيت القفص بالمشهد)
    var ITEM_FIRST = 900, ITEM_GAP = 1400;  // ظهور سطور «طلع الصبح» واحد ورا الثاني

    // المشهد ثلاثي الأبعاد نفسه حق النظام الحالي: نعطيه نسخة من الحالة بمراحله هو
    // (الصبح = نهار بدون لقطات سينمائية، والليل بجو المافيا)
    window.__mafiaFrame = function () {
        var G = S.G, now = NET.now();
        if (!G) return { G: null, room: S.room, now: now };
        var ph = G.phase === 'dawn' ? 'day' : G.phase;
        return { G: Object.assign({}, G, { phase: ph, seq: [], turn: G.phase === 'night' ? 'mafia' : null }), room: S.room, now: now };
    };

    // ---------------------------------------------------------------- الاتصال
    var net = NET.connect(onMsg, function () {
        var h = NET.hostSession() || {};
        net.send({ t: 'host', code: h.code, token: h.token });
    }, function (ok) { $('status').classList.toggle('on', !ok); });

    function onMsg(m) {
        if (m.t === 'welcome') { S.code = m.code; $('qrCode').textContent = m.code; NET.hostSession({ code: m.code, token: m.token }); makeQr(); }
        else if (m.t === 'avatars') { Object.keys(m.map).forEach(function (k) { PHOTOS[k] = m.map[k]; }); keys = {}; }
        else if (m.t === 'room') { S.room = m.room; if (!m.room.started) return location.replace('lobby.html'); renderCtl(); }
        else if (m.t === 'state') {
            if (m.G.system !== 'village') return location.replace('game.html');
            S.G = m.G; render();
        } else if (m.t === 'err') { $('status').textContent = m.err || ''; $('status').classList.add('on'); setTimeout(function () { $('status').classList.remove('on'); $('status').textContent = 'جاري الاتصال بالخادم…'; }, 4000); }
        else if (m.t === 'gone') alert('شاشة البث انفتحت بمكان ثاني');
    }
    function makeQr() {
        if (!window.qrcode) { setTimeout(makeQr, 200); return; }
        var q = qrcode(0, 'M'); q.addData(new URL('join.html?room=' + S.code, location.href).href); q.make();
        $('qrImg').src = q.createDataURL(8, 0); $('qrCode').textContent = S.code;
    }

    // ---------------------------------------------------------------- أدوات
    function P(id) { return S.G && S.G.players.find(function (p) { return p.id === id; }); }
    function photo(p, size) {
        var src = PHOTOS[p.id];
        return '<span class="ph" style="width:' + size + 'px;height:' + size + 'px' + (p.role ? ';--rc:' + (R[p.role] || R.citizen).c : '') + '">' + L.avatarSVG(p.look, size) + (src ? '<img src="' + esc(src) + '" alt="" onerror="this.remove()">' : '') + '</span>';
    }
    function num(p) { return '<span class="num">' + (p.seat + 1) + '</span>'; }
    function alive() { return S.G.players.filter(function (p) { return p.alive; }); }
    var keys = {};
    function once(id, key, fn) { if (keys[id] === key) return; keys[id] = key; fn(); }
    function showOnly(id, on) { $(id).classList.toggle('hide', !on); }

    // ---------------------------------------------------------------- الرسم
    function render() {
        var G = S.G, ph = G.phase;
        document.body.classList.toggle('is-over', ph === 'over');
        // بطاقة اليوم
        showOnly('day', ph !== 'over');
        var night = ph === 'night' || ph === 'reveal';
        $('dayIco').textContent = night ? '🌙' : '☀️';
        $('dayTxt').innerHTML = ph === 'reveal' ? 'المافيا' : (night ? 'الليلة ' : 'النهار ') + '<em>' + G.round + '</em>';
        $('aliveTxt').textContent = alive().length + ' أحياء';
        renderBanner(G);
        renderRoleBar(G);
        renderMorning(G);
        renderVotes(G);
        renderVerdict(G);
        renderChat(G);
        renderOver(G);
        renderCtl();
        sounds(G);
    }

    function banner(sub, title, gold, act) {
        $('bSub').textContent = sub || ''; $('bSub').classList.toggle('hide', !sub);
        $('bTitle').textContent = title; $('bTitle').classList.toggle('gold', !!gold);
        $('bAct').classList.toggle('hide', !act); if (act) $('bAct').textContent = act;
    }
    function renderBanner(G) {
        var ph = G.phase; showOnly('banner', ph !== 'over');
        if (ph === 'reveal') banner('افتحوا هواتفكم', 'كل واحد يعرف دوره من هاتفه، ولا يقوله لأحد');
        else if (ph === 'night') banner('الليلة ' + G.round, 'القرية نايمة… الأدوار تختار من جوالاتها 🌙');
        else if (ph === 'dawn') banner('', 'طلع الصبح على القرية', true);
        else if (ph === 'day') banner('النهار ' + G.round, 'ناقشوا: من المافيا؟', false, '🗳️ ابدأ التصويت الحين');
        else if (ph === 'vote') {
            var n = alive().length, done = alive().filter(function (p) { return G.votes[p.id]; }).length;
            banner('صوّت ' + done + ' من ' + n + ' · صوت واحد لكل لاعب ولا يتغيّر', 'صوّتوا من هواتفكم: من المافيا؟', true);
        } else if (ph === 'verdict') banner('', 'قرار القرية');
    }
    $('bAct').onclick = function () { if (S.G && S.G.phase === 'day') { net.send({ t: 'endStage' }); this.classList.add('hide'); } };

    function renderRoleBar(G) {
        var on = S.showRoles && (G.phase === 'reveal' || G.phase === 'night' || G.phase === 'day');
        showOnly('rolebar', on); if (!on) return;
        once('rolebar', JSON.stringify(G.counts), function () {
            $('rolebar').innerHTML = V.CORE.concat(V.EXTRA, ['citizen']).filter(function (k) { return G.counts[k] > 0; }).map(function (k) {
                return '<div class="rc" style="--rc:' + R[k].c + '"><b>' + G.counts[k] + '</b><span>' + esc(R[k].n) + '</span><i>' + R[k].i + '</i></div>';
            }).join('');
        });
    }
    $('rolesBtn').onclick = function () { S.showRoles = !S.showRoles; if (S.G) render(); };

    // «طلع الصبح على القرية»: مين مات (وسببه ودوره) ومين نجا
    var WHY = { mafia: 'قتلته المافيا', sniper: 'أصابته رصاصة القنّاص' };
    function renderMorning(G) {
        var on = G.phase === 'dawn' && G.morning; showOnly('morning', on); if (!on) return;
        var items = G.morning.items, shown = Math.min(items.length, Math.max(0, Math.floor((NET.now() - G.phaseAt - ITEM_FIRST) / ITEM_GAP) + 1));
        once('morning', G.phaseAt + ':' + shown, function () {
            if (!items.length) { $('morning').innerHTML = '<div class="mi quiet">🌙 ليلة هادية… ما مات أحد</div>'; return; }
            $('morning').innerHTML = items.slice(0, shown).map(function (it) {
                var p = P(it.id); if (!p) return '';
                if (it.kind === 'saved-guard' || it.kind === 'saved-doctor') {
                    return '<div class="mi saved"><div class="t"><span class="why">حاولت المافيا قتله</span><span class="nm">' + esc(p.name) + ' ' + num(p) + '</span>' +
                        '<span class="ok">' + (it.kind === 'saved-guard' ? '🛡️ فحماه الحارس الشخصي ونجا!' : '🩺 لكن الطبيب أنقذه في آخر لحظة!') + '</span></div>' + photo(p, 64) + '</div>';
                }
                var ref = it.ref && P(it.ref);
                var why = it.kind === 'guard' ? 'قتله الحارس الشخصي وهو يحاول قتل ' + (ref ? ref.name : '') : WHY[it.kind] || '';
                return '<div class="mi"><div class="t"><span class="why">' + esc(why) + '</span><span class="nm">' + esc(p.name) + ' ' + num(p) + '</span>' +
                    '<span class="was">كان ' + V.roleBadge(p.role) + '</span></div>' + photo(p, 64) + '</div>';
            }).join('');
            $('morning').scrollTop = $('morning').scrollHeight;
        });
    }

    // شبكة التصويت: كل الأحياء بأرقامهم، وعدد الأصوات (العمدة بصوتين)، و«✓ صوّت» على اللي صوّت
    function renderVotes(G) {
        var on = G.phase === 'vote'; showOnly('votes', on); showOnly('endVote', on); if (!on) return;
        var list = alive().sort(function (a, b) { return a.seat - b.seat; }), t = G.tally || {}, max = 0, tops = 0;
        list.forEach(function (p) { max = Math.max(max, t[p.id] || 0); });
        list.forEach(function (p) { if (max && (t[p.id] || 0) === max) tops++; });
        once('votes', JSON.stringify([G.votes, t, list.length]), function () {
            var cols = list.length <= 8 ? 2 : list.length <= 15 ? 3 : list.length <= 28 ? 4 : 5;
            $('votes').style.setProperty('--cols', cols);
            $('votes').innerHTML = list.map(function (p) {
                var n = t[p.id] || 0;
                return '<div class="vc' + (n && n === max && tops === 1 ? ' top' : '') + '">' + (G.votes[p.id] ? '<span class="did">✓ صوّت</span>' : '') + num(p) + photo(p, 46) +
                    '<span class="nm">' + esc(p.name) + (p.role === 'mayor' ? ' <small>👑 العمدة</small>' : '') + '</span>' +
                    '<span class="n' + (n ? ' has' : '') + '"><b>' + n + '</b><small>' + (n > 2 && n < 11 ? 'أصوات' : 'صوت') + '</small></span></div>';
            }).join('');
        });
    }
    $('endVote').onclick = function () { if (S.G && S.G.phase === 'vote') net.send({ t: 'endStage' }); };

    // «قرار القرية»: المطرود بعدد أصواته ← «هل كان من المافيا؟» ← الكشف
    function renderVerdict(G) {
        var on = G.phase === 'verdict' && G.verdict; showOnly('verdict', on); if (!on) return;
        var Vd = G.verdict, u = NET.now() - G.phaseAt, p = Vd.id && P(Vd.id);
        var stage = !p ? 'none' : u < ASK_AT ? 'who' : u < REVEAL_AT ? 'ask' : 'reveal';
        once('verdict', G.phaseAt + stage, function () {
            var el = $('verdict');
            el.className = 'verdict paper' + (p ? '' : ' none');
            if (!p) { el.innerHTML = Vd.tie ? '⚖️ تعادل بالأصوات — ما أحد خرج من القرية' : '🤐 ما أحد صوّت — ما أحد خرج من القرية'; return; }
            var bar = '';
            if (stage === 'ask') bar = '<div class="bar ask">هل كان من المافيا؟</div>';
            else if (stage === 'reveal') {
                var r = R[Vd.role] || R.citizen;
                bar = Vd.jester ? '<div class="bar neutral">🤡 المهرّج فاز! كان يبيكم تطردونه</div>'
                    : Vd.team === 'mafia' ? '<div class="bar mafia">' + r.i + ' نعم! كان ' + (Vd.role === 'mafia' ? 'من المافيا' : esc(r.n) + '، من المافيا') + '</div>'
                    : '<div class="bar town">بريء! كان ' + esc(r.n) + '</div>';
            }
            el.innerHTML = '<div class="who"><div class="t"><div class="k">خرج من القرية بـ' + Vd.votes + ' ' + (Vd.votes > 2 && Vd.votes < 11 ? 'أصوات' : 'صوت') + '</div><div class="nm">' + num(p) + ' ' + esc(p.name) + '</div></div>' + photo(p, 84) + '</div>' + bar;
        });
    }

    // النقاش: شات اللاعبين العام من جوالاتهم (رسائل اليوم الحالي)
    function renderChat(G) {
        var on = G.phase === 'day'; showOnly('chat', on); if (!on) return;
        var dayN = 0; G.chat.forEach(function (c) { if (c.sys && /بدأ النقاش/.test(c.text)) dayN = c.n; });
        var list = G.chat.filter(function (c) { return !c.sys && c.ch === 'city' && c.n > dayN; }).slice(-30);
        once('chat', dayN + ':' + (list.length ? list[list.length - 1].n : 0), function () {
            $('chatCount').textContent = list.length + ' رسالة';
            $('msgs').innerHTML = list.length ? list.map(function (c) { var p = P(c.from) || { name: '؟', look: {} }; return '<div class="msg">' + photo(p, 32) + '<div><b>' + esc(p.name) + '</b><p>' + esc(c.text) + '</p></div></div>'; }).join('')
                : '<div class="empty">💬 النقاش بدأ<br>اللاعبين يكتبون من جوالاتهم…</div>';
            $('msgs').scrollTop = $('msgs').scrollHeight;
        });
    }

    // النهاية: الفريق الفائز، وكل اللاعبين بأدوارهم (الميت اسمه مشطوب، والفائز مضيء)
    function winners(G) {
        return G.players.filter(function (p) { return p.team === G.winner || (G.jesterWins || []).indexOf(p.id) >= 0; });
    }
    function renderOver(G) {
        var on = G.phase === 'over'; showOnly('over', on); if (!on) return;
        reportPoints(G);
        once('over', G.id + JSON.stringify(PHOTOS ? Object.keys(PHOTOS).length : 0), function () {
            var win = {}; winners(G).forEach(function (p) { win[p.id] = true; });
            var js = (G.jesterWins || []).map(P).filter(Boolean);
            var order = G.players.slice().sort(function (a, b) { return (win[b.id] ? 1 : 0) - (win[a.id] ? 1 : 0) || a.seat - b.seat; });
            $('over').innerHTML = '<div class="k">☀️ انتهت اللعبة بعد ' + (G.round === 1 ? 'ليلة وحدة' : G.round === 2 ? 'ليلتين' : G.round + ' ' + (G.round < 11 ? 'ليالٍ' : 'ليلة')) + '</div>' +
                '<h1 class="' + G.winner + '">' + (G.winner === 'mafia' ? 'فازت المافيا! سيطرت على القرية' : 'فاز أهل القرية! خرجت المافيا كلها') + '</h1>' +
                (js.length ? '<div class="jw">🤡 والمهرّج ' + js.map(function (p) { return esc(p.name); }).join('، ') + ' فاز بعد — القرية طردته</div>' : '') +
                '<div class="all">' + order.map(function (p) {
                    return '<div class="op' + (p.alive ? '' : ' dead') + (win[p.id] ? ' win' : '') + '">' + photo(p, 34) + '<span class="nm">' + esc(p.name) + '</span>' + V.roleBadge(p.role) + '</div>';
                }).join('') + '</div>' +
                '<div class="acts"><button type="button" id="againBtn">جولة جديدة بنفس اللاعبين</button><button type="button" class="ghost" id="lobbyBtn">رجوع للوبي</button></div>';
            $('againBtn').onclick = function () { net.send({ t: 'again' }); };
            $('lobbyBtn').onclick = function () { net.send({ t: 'lobby' }); };
        });
    }

    // نقاط المنصة: مرة وحدة لكل مباراة، للموثّقين بتيك توك. لعبة فريقين (+5 لكل لاعب بالفريق الفائز)، والمهرّج اللي فاز معهم
    function reportPoints(G) {
        var key = 'mafia-reported-' + G.id;
        try { if (S.reported[G.id] || sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { if (S.reported[G.id]) return; }
        S.reported[G.id] = true;
        if (!(window.AGPAuth && typeof window.AGPAuth.reportMatchPoints === 'function')) return;
        var verified = G.players.filter(function (p) { return p.tiktok; });
        if (!verified.length) return;
        var pid = function (p) { return 'tiktok:' + p.tiktok; }, win = {};
        winners(G).forEach(function (p) { win[p.id] = true; });
        window.AGPAuth.reportMatchPoints({
            players: verified.map(function (p) { return { id: pid(p), name: p.name }; }),
            winnerIds: verified.filter(function (p) { return win[p.id]; }).map(pid),
            teamGame: true, durationMs: (G.endedAt || NET.now()) - G.startedAt
        });
    }

    // ---------------------------------------------------------------- المؤقت والأصوات (كل فريم)
    var last = { phase: '', sec: -1, items: 0 };
    function sounds(G) {
        var SF = window.MafiaSFX; if (!SF) return;
        var key = G.phase + G.phaseAt;
        if (key !== last.phase) {
            last.phase = key; last.items = 0;
            if (G.phase === 'night') SF.cue('owl', {});
            else if (G.phase === 'dawn') SF.cue('bell', {});
            else if (G.phase === 'vote') SF.cue('whoosh', {});
        }
    }
    function tickUI() {
        requestAnimationFrame(tickUI);
        var G = S.G; if (!G) return;
        var left = G.endsAt ? Math.max(0, G.endsAt - NET.now()) : 0, show = !!G.endsAt && G.phase !== 'over' && G.phase !== 'dawn' && G.phase !== 'verdict';
        showOnly('timer', show);
        if (show) {
            var sec = Math.ceil(left / 1000), total = Math.max(1, G.endsAt - G.phaseAt);
            $('timerTxt').textContent = sec;
            $('timerArc').style.strokeDashoffset = String(188.5 * (1 - left / total));
            if (sec <= 10 && sec > 0 && sec !== last.sec && window.MafiaSFX) window.MafiaSFX.cue('tick', { hi: sec <= 3, g: sec <= 3 ? 1 : 0.6 });
            last.sec = sec;
        }
        // الأجزاء المتحركة بالوقت: سطور الصبح، ومراحل القرار
        if (G.phase === 'dawn') {
            renderMorning(G);
            var n = G.morning ? Math.min(G.morning.items.length, Math.max(0, Math.floor((NET.now() - G.phaseAt - ITEM_FIRST) / ITEM_GAP) + 1)) : 0;
            if (n > last.items && window.MafiaSFX) { var it = G.morning.items[n - 1]; window.MafiaSFX.cue(/^saved/.test(it.kind) ? 'heal' : 'stinger', {}); }
            last.items = n;
        }
        if (G.phase === 'verdict') renderVerdict(G);
    }
    requestAnimationFrame(tickUI);

    // ---------------------------------------------------------------- التحكم
    function renderCtl() {
        var list = S.G ? S.G.players : (S.room ? S.room.players : []);
        var online = {}; (S.room ? S.room.players : []).forEach(function (p) { online[p.id] = p.online; });
        $('ctlList').innerHTML = list.map(function (p) {
            return '<div class="ctl-p"><span class="who">' + photo(p, 30) + '<span class="' + (p.alive === false ? 'dead' : '') + '">' + esc(p.name) + '</span>' + (online[p.id] === false ? ' <small style="color:#ff8a80">غير متصل</small>' : '') + '</span>' +
                '<button type="button" data-kick="' + p.id + '">طرد</button></div>';
        }).join('') || '<p style="color:var(--mute)">ما فيه لاعبين</p>';
        $('skipBtn').disabled = !S.G || S.G.phase === 'over';
    }
    document.querySelectorAll('.modal').forEach(function (m) { m.addEventListener('click', function (e) { if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('on'); }); });
    $('ctlBtn').onclick = function () { renderCtl(); $('ctlModal').classList.add('on'); };
    $('ctlList').addEventListener('click', function (e) { var b = e.target.closest('[data-kick]'); if (b && confirm('متأكد تبي تطرد هذا اللاعب؟')) net.send({ t: 'kick', id: b.getAttribute('data-kick') }); });
    $('skipBtn').onclick = function () { net.send({ t: 'endStage' }); $('ctlModal').classList.remove('on'); };
    $('toLobbyBtn').onclick = function () { if (confirm('ترجع للوبي وتنهي المباراة الحالية؟')) { net.send({ t: 'lobby' }); $('ctlModal').classList.remove('on'); } };
    $('exitBtn').onclick = function () {
        if (!confirm('إنهاء اللعبة وقفل الروم؟')) return;
        net.send({ t: 'close' }); NET.hostSession(null);
        setTimeout(function () { location.href = '../../games.html'; }, 300);
    };
    $('fsBtn').onclick = function () { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); };
    // الصوت: المتصفح يقفله لين أول ضغطة
    function sndLabel() { var SF = window.MafiaSFX; $('sndBtn').textContent = SF.needsUnlock() ? '🔈 فعّل الصوت' : SF.muted() ? '🔇' : '🔊'; $('sndBtn').classList.toggle('lock', SF.needsUnlock()); }
    $('sndBtn').onclick = function () { var SF = window.MafiaSFX; if (SF.needsUnlock()) SF.unlock(); else SF.setMuted(!SF.muted()); setTimeout(sndLabel, 50); };
    setTimeout(sndLabel, 0); setInterval(sndLabel, 1500);
})();
</script>
<script type="module">
import { createStage } from './mafia-scene.js';
window.__mafiaStage = createStage(document.getElementById('stage'), function () { return window.__mafiaFrame(); }, {
    onCue: function (k, d) { window.MafiaSFX.cue(k, d); }, onAmbience: function (m) { window.MafiaSFX.ambience(m); },
    photoOf: function (id) { return (window.__mafiaPhotos || {})[id] || null; }
});
</script>
</body>
</html>
