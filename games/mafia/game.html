<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المافيا — المباراة</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="../../auth/auth-client.js"></script>
<script src="mafia-net.js"></script>
<script src="mafia-looks.js"></script>
<script src="mafia-sfx.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root {
    /* هوية ألعاب المنصة (نفس روليت الإقصاء): بنفسجي على خلفية داكنة */
    --ink: #f4f2f8; --mute: #a8a3b5; --panel: rgba(18, 16, 26, .82);
    --line: rgba(255, 255, 255, .1); --gold: #c4b5fd; --red: #e2483d; --green: #2fb36a; --blue: #3e8ef0;
    --c: #a78bfa; --c3: #ddd6fe; --g1: #7c3aed; --g2: #a855f7; --c-bd: rgba(167,139,250,.28);
    --agp-accent: #a78bfa;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07060b; color: var(--ink); font-family: 'IBM Plex Sans Arabic', "Segoe UI", Tahoma, sans-serif; direction: rtl; }
button { font-family: inherit; cursor: pointer; }
#stage { position: fixed; inset: 0; }
#stage canvas { width: 100%; height: 100%; display: block; }
.ui { position: fixed; inset: 0; pointer-events: none; }
.ui > * { pointer-events: auto; }

/* الشريط العلوي (مثل شريط البث) */
.topbar { position: absolute; top: 0; inset-inline: 0; z-index: 5; height: 76px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 18px; background: rgba(10, 9, 15, .3); border-bottom: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; justify-self: start; }
.brand-dot { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 0 18px rgba(139,92,246,.45); font-size: 18px; }
.brand small { font-weight: 600; color: var(--mute); font-size: 14px; }
.logo { height: 58px; display: grid; place-items: center; }
.logo img { height: 58px; max-width: 260px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(139,92,246,.45)); }
.top-actions { display: flex; gap: 8px; justify-self: end; }
.tbtn { height: 38px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--c-bd); background: rgba(139,92,246,.08); color: var(--c3); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; backdrop-filter: blur(10px); transition: background .2s, border-color .2s; }
.tbtn:hover { background: rgba(139,92,246,.18); border-color: rgba(167,139,250,.55); }
.tbtn.exit { border-color: rgba(248,113,113,.28); background: rgba(255,255,255,.03); color: #fca5a5; }
.tbtn.exit:hover { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.5); }

/* المؤقت والجولة */
.timer { position: absolute; top: 90px; left: 18px; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,9,15,.82); font-weight: 900; font-size: 30px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
.timer svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 6; }
.round { position: absolute; top: 90px; right: 18px; padding: 8px 16px; border-radius: 14px; background: rgba(10,9,15,.82); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
.round b { font-size: 26px; font-weight: 900; }
.round span { color: var(--mute); font-size: 14px; display: block; line-height: 1; }
.round .ico { font-size: 26px; }

/* لافتة المرحلة */
.banner { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); max-width: min(760px, 70vw); text-align: center; padding: 8px 26px 10px; border-radius: 14px; background: rgba(10,9,15,.82); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.5); transition: opacity .35s; }
.banner .sub { font-size: 15px; font-weight: 700; color: #e6e2f7; }
.banner .title { font-size: 30px; font-weight: 900; color: var(--gold); line-height: 1.15; }
.banner .prog { margin-top: 4px; display: flex; gap: 6px; justify-content: center; }
.banner .prog i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.2); }
.banner .prog i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
/* ترتيب أدوار الليل: المافيا ← الطبيب ← المحقق ← الصباح */
.turns { display: flex; gap: 4px; justify-content: center; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.turns span { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; color: rgba(255,255,255,.45); background: rgba(255,255,255,.06); }
.turns span.done { color: rgba(255,255,255,.7); }
.turns span.on { color: #fff; background: var(--tc, #e2483d); box-shadow: 0 0 12px var(--tc, #e2483d); }
.turns b { color: rgba(255,255,255,.3); font-size: 12px; }

/* عنوان اللقطة السينمائية */
.caption { position: absolute; bottom: 9vh; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s, transform .4s; width: 90vw; }
.caption.on { opacity: 1; }
.caption .k { font-size: clamp(30px, 4.4vw, 64px); font-weight: 900; text-shadow: 0 4px 22px rgba(0,0,0,.85), 0 0 2px #000; }
.caption .s { font-size: clamp(16px, 1.7vw, 26px); font-weight: 800; color: #f1ecff; text-shadow: 0 2px 12px rgba(0,0,0,.9); margin-top: 4px; }
.caption .role { display: inline-block; margin-top: 10px; padding: 6px 18px; border-radius: 999px; font-size: clamp(16px, 1.6vw, 24px); font-weight: 900; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
.letterbox::before, .letterbox::after { content: ''; position: absolute; inset-inline: 0; height: 0; background: #000; transition: height .5s; pointer-events: none; }
.letterbox::before { top: 0; } .letterbox::after { bottom: 0; }
.letterbox.on::before, .letterbox.on::after { height: 7vh; }

/* QR صغير (أثناء المباراة) */
.qr-mini { position: absolute; bottom: 14px; left: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #fffaf0; color: #1b1a26; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.qr-mini img { width: 64px; height: 64px; image-rendering: pixelated; }
.qr-mini b { display: block; color: var(--red); font-size: 14px; }
.qr-mini .code { font-size: 24px; font-weight: 900; letter-spacing: 2px; direction: ltr; text-align: right; }
.qr-mini small { display: block; font-size: 12px; line-height: 1.45; color: #5d5a70; }

/* لوحة النقاش/المجريات: بالنقاش والتصويت = الشات العام بس، وبباقي المراحل = سجل الأحداث */
.chat { position: absolute; top: 166px; right: 14px; bottom: 14px; width: min(390px, 28vw); display: flex; flex-direction: column; border-radius: 18px; background: linear-gradient(180deg, rgba(22,19,32,.9), rgba(10,9,15,.92)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden; transition: opacity .3s, transform .3s; backdrop-filter: blur(8px); }
.chat.off { opacity: 0; transform: translateX(30px); pointer-events: none; }
.chat-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); }
.chat-h b { font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.chat-h b i { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: live 1.6s ease-in-out infinite; }
.chat-h span { font-size: 13px; font-weight: 800; color: var(--mute); background: rgba(255,255,255,.06); padding: 3px 10px; border-radius: 999px; }
@keyframes live { 50% { opacity: .35; } }
.msgs { flex: 1; overflow-y: auto; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.msgs::-webkit-scrollbar { display: none; }
.msg { display: flex; gap: 10px; align-items: flex-start; animation: pop .3s ease-out; }
.msg.cont { margin-top: -6px; }
.msg.cont .av, .msg.cont .who { visibility: hidden; height: 0; }
.msg.cont .av { height: 0; }
.msg .av { width: 40px; height: 40px; flex: none; border-radius: 50%; background: rgba(255,255,255,.06); overflow: hidden; box-shadow: 0 0 0 2px var(--pc); }
.msg .av svg { width: 40px; height: 40px; }
.msg .col { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.msg .who { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; color: var(--pc); }
.msg .who em { font-style: normal; font-size: 11px; font-weight: 900; color: #fff; background: var(--pc); padding: 0 7px; border-radius: 999px; opacity: .85; }
.msg .bd { align-self: flex-start; max-width: 100%; background: color-mix(in srgb, var(--pc) 14%, rgba(255,255,255,.04)); border: 1px solid color-mix(in srgb, var(--pc) 30%, transparent); border-radius: 4px 14px 14px 14px; padding: 7px 12px 8px; }
.msg .tx { font-size: 18px; line-height: 1.45; font-weight: 700; color: #f6f4ff; word-wrap: break-word; overflow-wrap: anywhere; }
.msg .re { margin-bottom: 4px; padding: 3px 8px; border-inline-start: 3px solid var(--rc); border-radius: 6px; background: rgba(0,0,0,.25); font-size: 13px; font-weight: 700; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .re b { color: var(--rc); }
.ev { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 15px; font-weight: 800; color: #e9e6ff; animation: pop .3s ease-out; }
.roles-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,.08); }
.roles-sum span { padding: 7px 10px; border-radius: 10px; background: rgba(139,92,246,.1); border: 1px solid rgba(167,139,250,.2); font-size: 14px; font-weight: 700; color: #e9e6ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roles-sum b { color: #fff; font-size: 16px; }
.ev.big { background: rgba(167,139,250,.1); color: #ddd6fe; }
.empty-talk { margin: auto; text-align: center; color: var(--mute); font-size: 15px; font-weight: 700; line-height: 1.7; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }

/* ملخص الليلة (بالنقاش والتصويت): مين انقصى/أنقذه الطبيب، وآخر طرد، والأحياء */
.recap { position: absolute; top: 180px; left: 18px; width: min(330px, 25vw); padding: 14px; border-radius: 18px; background: linear-gradient(180deg, rgba(22,19,32,.9), rgba(10,9,15,.92)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 18px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px; transition: opacity .3s, transform .3s; }
.recap.off { opacity: 0; transform: translateX(-30px); pointer-events: none; }
.recap h4 { margin: 0; font-size: 17px; font-weight: 900; color: var(--c3); display: flex; justify-content: space-between; }
.recap h4 small { color: var(--mute); font-size: 12px; }
.rc-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: rgba(255,255,255,.04); }
.rc-row .av { width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,.06); }
.rc-row .av svg { width: 44px; height: 44px; }
.rc-row .ic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 26px; border-radius: 50%; background: rgba(255,255,255,.06); }
.rc-row b { display: block; font-size: 17px; font-weight: 900; }
.rc-row span { display: block; font-size: 13px; font-weight: 700; color: var(--mute); }
.rc-row.dead { background: rgba(226,72,61,.12); box-shadow: inset 3px 0 0 #e2483d; }
.rc-row.dead .av { filter: grayscale(1); }
.rc-row.saved { background: rgba(47,179,106,.12); box-shadow: inset 3px 0 0 #2fb36a; }

/* النوافذ */
.modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4,5,14,.66); backdrop-filter: blur(4px); z-index: 20; padding: 16px; }
.modal.on { display: flex; }
.sheet { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 20px; background: #12101a; border: 1px solid var(--line); padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.sheet h3 { margin: 0 0 10px; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; }
.sheet h4 { margin: 14px 0 8px; color: var(--gold); font-size: 16px; font-weight: 900; }
.x { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: #fff; font-size: 18px; }

/* صفوف الإعدادات — قاعدة المنصة: العنوان يمين، عنصر التحكم يسار */
.agp-row { direction: rtl; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); }
.agp-row .lbl { text-align: right; font-weight: 800; font-size: 17px; }
.agp-row .lbl small { display: block; color: var(--mute); font-weight: 700; font-size: 13px; }
.agp-ctl { display: flex; align-items: center; gap: 8px; flex: none; }
.cnt { display: flex; align-items: center; gap: 6px; direction: ltr; }
.cnt button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #fff; font-size: 20px; font-weight: 900; }
.cnt output { min-width: 54px; text-align: center; font-weight: 900; font-size: 18px; direction: rtl; }
.sw { position: relative; width: 52px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.18); border: 0; transition: background .2s; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw.on { background: var(--agp-accent); }
.sw.on::after { transform: translateX(22px); }

.ctl-list { display: flex; flex-direction: column; gap: 6px; }
.ctl-p { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.05); }
.ctl-p .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.ctl-p svg { width: 30px; height: 30px; }
.ctl-p .dead { opacity: .5; text-decoration: line-through; }
.mini { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,120,110,.5); background: rgba(226,72,61,.15); color: #ffb3ad; font-weight: 800; }
.ctl-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.ctl-actions .btn { height: 44px; font-size: 16px; padding: 0 10px; }

/* شاشة النهاية */
.over { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(900px, 94vw); padding: 16px 18px; border-radius: 22px; background: rgba(10,9,15,.9); border: 1px solid var(--line); text-align: center; }
.over .win { font-size: clamp(30px, 4vw, 54px); font-weight: 900; }
.over .roles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 12px; }
.over .rl { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px; background: rgba(255,255,255,.07); font-weight: 800; }
.over .rl svg { width: 28px; height: 28px; }
.over .rl.w { outline: 2px solid var(--gold); }
.over .acts { display: flex; gap: 10px; justify-content: center; }
.status { position: absolute; bottom: 14px; right: 50%; transform: translateX(50%); padding: 6px 14px; border-radius: 999px; background: rgba(226,72,61,.9); font-weight: 800; display: none; }
.status.on { display: block; }
.hide { display: none !important; }
.is-over .qr-mini { display: none; }

@media (max-width: 760px) {
    .chat { width: 46vw; }
    .banner .title { font-size: 22px; }
    .brand small { display: none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="ui" id="ui">
    <div class="vignette"></div>
    <div class="letterbox" id="letterbox"></div>
    <div class="flash" id="flash"></div>

    <header class="topbar">
        <div class="brand"><span class="brand-dot">🔪</span> المافيا <small>ساحة القرية</small></div>
        <div class="logo"><img src="../../logo.png" alt="ألعاب أيمن" onerror="this.style.display='none'"></div>
        <div class="top-actions">
            <button class="tbtn" id="sndBtn" type="button" aria-label="الصوت">🔊 الصوت</button>
            <button class="tbtn" id="fsBtn" type="button">⛶ ملء الشاشة</button>
            <button class="tbtn" id="ctlBtn" type="button">☰ التحكم</button>
            <button class="tbtn exit" id="exitBtn" type="button">⏻ إنهاء اللعبة</button>
        </div>
    </header>

    <div class="timer hide" id="timer"><svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="32" stroke="rgba(255,255,255,.12)"/><circle id="timerArc" cx="37" cy="37" r="32" stroke="#c4b5fd" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="0"/></svg><span id="timerTxt">0</span></div>
    <div class="round hide" id="round"><span class="ico" id="roundIco">🌙</span><div><b id="roundTxt">الليلة 1</b><span id="aliveTxt"></span></div></div>
    <div class="banner hide" id="banner"><div class="sub" id="bSub"></div><div class="title" id="bTitle"></div><div class="prog" id="bProg"></div></div>
    <div class="caption" id="caption"><div class="k" id="capK"></div><div class="s" id="capS"></div><div id="capR"></div></div>

    <aside class="chat off" id="chat"><div class="chat-h"><b id="chatTitle"><i></i>النقاش العام</b><span id="chatCount"></span></div><div class="msgs" id="msgs"></div></aside>
    <aside class="recap off" id="recap" aria-label="ملخص الليلة"></aside>

    <div class="qr-mini" id="qrMini"><img id="qrMiniImg" alt="باركود الدخول"><div><b>رجوع اللاعبين للمباراة</b><div class="code" id="qrMiniCode">----</div><small>قفلت صفحة اللعبة؟ امسحه من نفس جوالك<br>وترجع لدورك · للمشاركين فقط</small></div></div>

    <section class="over hide" id="over">
        <div class="win" id="winTxt"></div>
        <div class="roles" id="winRoles"></div>
        <div class="acts"><button class="btn" id="againBtn" type="button">جولة جديدة بنفس اللاعبين</button><button class="btn ghost" id="lobbyBtn" type="button">رجوع للوبي</button></div>
    </section>

    <div class="status" id="status">جاري الاتصال بالخادم…</div>
</div>

<div class="modal" id="ctlModal"><div class="sheet"><h3>التحكم <button class="x" type="button" data-close>✕</button></h3>
    <div class="ctl-actions"><button class="btn" id="skipBtn" type="button">⏭ تخطي المرحلة</button><button class="btn ghost" id="toLobbyBtn" type="button">رجوع للوبي</button></div>
    <h4>اللاعبين</h4><div class="ctl-list" id="ctlList"></div></div></div>

<script>
(function () {
    'use strict';
    var L = window.MafiaLooks, NET = window.MafiaNet;
    var S = { code: '', token: '', schema: null, room: null, G: null, reported: {} };
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

    window.__mafiaFrame = function () { return { G: S.G, room: S.room, now: NET.now() }; };

    // ---------------------------------------------------------------- الاتصال
    var net = NET.connect(onMsg, function () {
        var h = NET.hostSession() || {};
        net.send({ t: 'host', code: h.code, token: h.token });
    }, function (ok) { $('status').classList.toggle('on', !ok); });

    function onMsg(m) {
        if (m.t === 'welcome') {
            S.code = m.code; S.token = m.token; S.schema = m.schema;
            NET.hostSession({ code: m.code, token: m.token });
            makeQr();
        } else if (m.t === 'room') {
            S.room = m.room;
            // صفحة المباراة بس — قبل البداية (أو بعد «رجوع للوبي») مكانه شاشة اللوبي
            if (!m.room.started) return location.replace('lobby.html');
            renderCtl();
        } else if (m.t === 'state') {
            S.G = m.G; onState();
        } else if (m.t === 'err') {
            $('status').textContent = m.err || ''; $('status').classList.add('on');

        var mafiaWin = G.winner === 'mafia';
        $('winTxt').innerHTML = mafiaWin ? '<span style="color:#ff5a4d">🔪 فازت المافيا!</span>' : '<span style="color:#c4b5fd">🏠 فازت المدينة!</span>';
        // الأدوار الحقيقية للكل، والمجنّد يظهر دوره الأصلي + «جُنّد». كروت المافيا تنكشف هنا
        var list = G.players.length > 40 ? G.players.filter(function (p) { return p.team === 'mafia' || p.role === 'doctor' || p.role === 'detective'; }) : G.players;
        $('winRoles').innerHTML = list.map(function (p) {
            var R = ROLE[p.role] || ROLE.citizen, w = p.team === G.winner;
            return '<span class="rl' + (w ? ' w' : '') + '">' + L.avatarSVG(p.look, 28) + esc(p.name) + ' <span style="color:' + R.c + '">' + R.icon + ' ' + R.n + (p.recruited ? ' ← جُنّد للمافيا' : '') + '</span></span>';
        }).join('') + (G.players.length > 40 ? '<span class="rl">🏠 والباقي مواطنين</span>' : '') +
            (G.cards ? '<span class="rl">🃏 كروت المافيا: ' + G.cards.map(function (c) { return c.name + (c.used ? ' ✓' : ''); }).join('، ') + '</span>' : '');
    }

    requestAnimationFrame(tickUI);
})();
</script>
<script type="module">
import { createStage } from './mafia-scene.js';
window.__mafiaStage = createStage(document.getElementById('stage'), function () { return window.__mafiaFrame(); }, {
    onCue: function (k, d) { window.MafiaSFX.cue(k, d); }, onAmbience: function (m) { window.MafiaSFX.ambience(m); }
});
</script>
</body>
