<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f24">
<title>المافيا — العب من جوالك</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="../../auth/auth-client.js"></script>
<script src="mafia-net.js"></script>
<script src="mafia-looks.js"></script>
<style>
:root { --bg: #0d0f24; --card: #171a38; --card2: #1e2247; --ink: #f6f3ff; --mute: #a9a6c6; --line: rgba(255,255,255,.12); --gold: #ffcc4d; --red: #e2483d; --green: #2fb36a; --blue: #3e8ef0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Zain, "Segoe UI", Tahoma, sans-serif; direction: rtl; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); }
button, input { font-family: inherit; }
.wrap { max-width: 480px; margin: 0 auto; }
.hide { display: none !important; }
h1 { font-size: 30px; font-weight: 900; margin: 16px 0 4px; }
h2 { font-size: 22px; font-weight: 900; margin: 16px 0 8px; }
p { margin: 4px 0; color: var(--mute); font-weight: 700; font-size: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 12px; }
.field { width: 100%; height: 52px; border-radius: 14px; border: 2px solid var(--line); background: #0f1130; color: #fff; font-size: 20px; font-weight: 800; padding: 0 14px; outline: none; }
.field:focus { border-color: var(--gold); }
.code-in { text-align: center; letter-spacing: 10px; font-size: 32px; direction: ltr; }
.btn { width: 100%; height: 54px; border-radius: 16px; border: 0; font-weight: 900; font-size: 20px; color: #1b1300; background: linear-gradient(180deg, #ffd96b, #f2b632); box-shadow: 0 5px 0 #a87710; margin-top: 12px; cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a87710; }
.btn[disabled] { filter: grayscale(1) brightness(.6); }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; box-shadow: none; border: 1px solid var(--line); }
.err { color: #ff8a80; font-weight: 800; min-height: 22px; margin-top: 8px; }
.brand { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-weight: 900; font-size: 18px; color: var(--mute); }

/* محرر الشخصية — صف لكل خيار: العنوان يمين والاختيارات يسار */
.preview { display: grid; place-items: center; padding: 6px; }
.preview svg { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2b2f63, #15183a); }
.opt-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt-row:first-of-type { border-top: 0; }
.opt-row .lbl { font-weight: 800; font-size: 16px; text-align: right; flex: none; }
.opts { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: none; direction: rtl; }
.opts::-webkit-scrollbar { display: none; }
.sw { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
.pill { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
.pill.on { background: var(--gold); color: #1b1300; border-color: var(--gold); }
.acct { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.acct a { color: var(--gold); font-weight: 900; }
.acct .av { width: 52px; height: 52px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--card2); font-weight: 900; font-size: 22px; }
.acct .av img { width: 100%; height: 100%; object-fit: cover; }
.acct .who2 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.acct .who2 div { min-width: 0; }
.acct .nm2 { font-size: 20px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .sub2 { font-size: 14px; color: var(--mute); font-weight: 700; }
.need-login { flex-direction: column; align-items: stretch; text-align: center; gap: 10px; }
.need-login .btn { margin-top: 0; color: #1b1300; }

/* اللعبة */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: var(--bg); }
.me { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }
.me svg { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); }
.rolechip { padding: 6px 12px; border-radius: 999px; font-weight: 900; font-size: 15px; border: 0; color: #fff; cursor: pointer; }
.phase { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; background: var(--card2); }
.phase b { font-size: 20px; font-weight: 900; }
.phase .t:empty { display: none; }
.phase .t { min-width: 52px; text-align: center; font-size: 22px; font-weight: 900; padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,.3); }
.role-card { text-align: center; padding: 22px 14px; border-radius: 22px; margin-top: 12px; color: #fff; }
.role-card .ic { font-size: 64px; line-height: 1; }
.role-card .nm { font-size: 36px; font-weight: 900; margin-top: 6px; }
.role-card .ds { font-size: 17px; font-weight: 700; opacity: .95; margin-top: 4px; }
.role-card .mates { margin-top: 10px; font-weight: 800; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); border: 2px solid transparent; cursor: pointer; width: 100%; color: #fff; text-align: right; font-size: 17px; font-weight: 800; }
.prow .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.prow svg { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--card2); }
.prow .num { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #5b54d6; font-size: 14px; }
.prow .tag { font-size: 14px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.08); flex: none; }
.prow.sel { border-color: var(--gold); background: #2a2650; }
.prow.dead { opacity: .45; cursor: default; }
.prow[disabled] { cursor: default; }
.note { padding: 12px 14px; border-radius: 14px; background: rgba(255,204,77,.1); color: #ffe7a6; font-weight: 800; margin-top: 10px; font-size: 16px; }
.res { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 12px; background: var(--card); margin-top: 6px; font-weight: 800; }
.chatbox { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; padding: 8px; border-radius: 14px; background: #0b0c22; border: 1px solid var(--line); margin-top: 10px; }
.cm { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.cm b { color: var(--gold); font-weight: 900; }
.cm.sys { color: #ffe7a6; text-align: center; font-size: 14px; }
.cm.maf b { color: #ff8a80; }
.send { display: flex; gap: 8px; margin-top: 8px; }
.send .field { height: 48px; font-size: 17px; }
.send button { flex: none; width: 74px; height: 48px; border-radius: 14px; border: 0; background: var(--gold); font-weight: 900; font-size: 17px; }
.big { text-align: center; padding: 26px 10px; }
.big .ic { font-size: 70px; }
.big .tt { font-size: 28px; font-weight: 900; margin-top: 6px; }
.status { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--red); font-weight: 800; display: none; z-index: 9; }
.status.on { display: block; }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand">🔪 المافيا · ساحة القرية</div>

    <!-- 1) رقم الروم -->
    <section id="vCode" class="hide">
        <h1>ادخل رقم الروم</h1>
        <p>رقم الغرفة ظاهر على شاشة البث جنب الباركود. اللعب بحساب الموقع — لو ما عندك حساب بنطلب منك تنشئ واحد بالخطوة الجاية.</p>
        <div class="card">
            <input class="field code-in" id="codeIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" aria-label="رقم الروم">
            <button class="btn" id="codeGo" type="button">التالي</button>
            <div class="err" id="codeErr"></div>
        </div>
    </section>

    <!-- 2) الاسم والشخصية -->
    <section id="vProfile" class="hide">
        <h1>جهّز شخصيتك</h1>
        <p id="roomInfo"></p>
        <!-- الدخول بحساب الموقع إلزامي: الاسم والصورة والإطار من الحساب نفسه -->
        <div class="card acct" id="acct"></div>
        <div class="card">
            <div class="preview" id="preview"></div>
            <div id="editor"></div>
        </div>
        <button class="btn" id="joinGo" type="button">ادخل الساحة</button>
        <div class="err" id="joinErr"></div>
    </section>

    <!-- 3) انتظار البداية -->
    <section id="vWait" class="hide">
        <div class="big"><div class="preview" id="waitAv"></div><div class="tt">أنت جالس حول النار 🔥</div><p>شوف شخصيتك على البث! بانتظار المذيع يبدأ اللعبة…</p><p id="waitCount"></p></div>
        <h2>💬 شات الانتظار</h2>
        <div class="chatbox" id="lobbyChat"></div>
        <div class="send"><input class="field" id="lobbyIn" maxlength="140" placeholder="سلّم على اللي معك…" autocomplete="off"><button type="button" id="lobbySend">إرسال</button></div>
        <button class="btn ghost" id="editLook" type="button">غيّر شكل شخصيتك</button>
        <button class="btn ghost" id="leaveBtn" type="button">اطلع من الروم</button>
    </section>

    <!-- 4) المباراة -->
    <section id="vGame" class="hide">
        <div class="top"><div class="me" id="meBox"></div><button class="rolechip" id="roleChip" type="button"></button></div>
        <div class="phase"><b id="phaseTxt"></b><span class="t" id="phaseT"></span></div>
        <div id="gameBody"></div>
    </section>
</div>
<div class="status" id="status">جاري الاتصال…</div>

<script>
(function () {
    'use strict';
    var L = window.MafiaLooks, NET = window.MafiaNet, ROLE = L.ROLE;
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
    var params = new URLSearchParams(location.search);
    var S = { code: params.get('room') || '', me: NET.me(), room: null, G: null, look: NET.look() || L.randomLook(), view: '', hideRole: false, draft: '' };
    if (S.me && S.code && S.me.room !== S.code) S.me = null;

    function show(v) { S.view = v; ['vCode', 'vProfile', 'vWait', 'vGame'].forEach(function (id) { $(id).classList.toggle('hide', id !== v); }); }

    var net = NET.connect(onMsg, function () {
        if (S.me && (S.me.room === S.code || !S.code)) { S.code = S.me.room; net.send({ t: 'resume', code: S.me.room, id: S.me.id, key: S.me.key }); }
        else if (S.code) net.send({ t: 'peek', code: S.code });
        else show('vCode');
    }, function (ok) { $('status').classList.toggle('on', !ok); });

    function onMsg(m) {
        if (m.t === 'peek') {
            if (!m.ok) { show('vCode'); $('codeErr').textContent = m.err; return; }
            S.room = m.room; if (S.view !== 'vProfile') openProfile();
            renderRoomInfo();
        } else if (m.t === 'welcome') {
            S.me = { room: m.code, id: m.id, key: m.key }; NET.me(S.me);
            if (!S.G) show('vWait');
        } else if (m.t === 'room') {
            S.room = m.room; renderRoomInfo();
            if (S.me && !m.room.started && S.view !== 'vProfile') { S.G = null; show('vWait'); renderWait(); }
        } else if (m.t === 'state') {
            S.G = m.G; if (S.view !== 'vGame') show('vGame'); renderGame();
        } else if (m.t === 'lobby') {
            S.G = null; show('vWait'); renderWait();
        } else if (m.t === 'err') {
            if (m.step === 'code') { show('vCode'); $('codeErr').textContent = m.err; }
            else if (m.step === 'auth') { $('joinErr').innerHTML = esc(m.err) + ' — <a href="' + loginUrl() + '" style="color:var(--gold)">سجّل دخول</a>'; }
            else $('joinErr').textContent = m.err;
        } else if (m.t === 'gone' || m.t === 'kicked' || m.t === 'closed') {
            NET.me(null); S.me = null; S.G = null;
            show('vCode'); $('codeErr').textContent = m.t === 'kicked' || m.reason === 'kicked' ? 'المذيع طلّعك من الروم' : 'الروم انقفل';
        }
    }

    // ---------------------------------------------------------------- رقم الروم
    $('codeGo').onclick = function () {
        var c = $('codeIn').value.replace(/\D/g, '');
        if (c.length !== 4) { $('codeErr').textContent = 'الرقم من 4 خانات'; return; }
        S.code = c; $('codeErr').textContent = ''; net.send({ t: 'peek', code: c });
    };
    $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('codeGo').click(); });

    // ---------------------------------------------------------------- الشخصية
    function renderRoomInfo() {
        if (!S.room) return;
        $('roomInfo').textContent = 'روم ' + S.room.code + ' · ' + S.room.players.length + ' لاعب داخل';
        if (S.view === 'vWait') renderWait();
    }
    function loginUrl() { return '../../login.html?next=' + encodeURIComponent('games/mafia/join.html?room=' + S.code); }
    function account() { try { return window.AGPAuth && AGPAuth.getToken() ? AGPAuth.getCachedUser() : null; } catch (e) { return null; } }
    function renderAccount() {
        var u = account(), box = $('acct');
        box.classList.toggle('need-login', !u);
        $('joinGo').classList.toggle('hide', !u);
        if (!u) {
            box.innerHTML = '<div style="font-size:42px">🔐</div><b style="font-size:20px">لازم تسجّل دخول بحساب الموقع</b>' +
                '<p>اللعب بحساب الموقع بس. بعد الدخول يرجعك هنا تلقائياً، واسمك وصورتك وإطارك يطلعون على البث.</p>' +
                '<a class="btn" style="display:grid;place-items:center;text-decoration:none" href="' + loginUrl() + '">تسجيل الدخول / إنشاء حساب</a>';
            return;
        }
        var name = u.tiktok_display_name || u.username || '', tk = u.tiktok_verified && u.tiktok_username;
        box.innerHTML = '<span class="who2"><span class="av">' + (u.tiktok_avatar_url ? '<img src="' + esc(u.tiktok_avatar_url) + '" alt="" referrerpolicy="no-referrer">' : esc(name.slice(0, 1))) + '</span>' +
            '<div><div class="nm2">' + esc(name) + '</div><div class="sub2">' + (tk ? '@' + esc(tk) + ' · <span style="color:#7ee2a6">تنحسب لك النقاط</span>' : 'حسابك مو موثّق بتيك توك — بدون نقاط ولا إطار') + '</div></div></span>';
    }
    function openProfile() {
        show('vProfile');
        renderAccount(); renderEditor();
        // تحديث بيانات الحساب من الخادم (الصورة/التوثيق/انتهاء الجلسة)
        try { if (window.AGPAuth && AGPAuth.getToken() && AGPAuth.refreshUser) AGPAuth.refreshUser().then(renderAccount, renderAccount); } catch (e) { }
    }
    var ROWS = [
        { k: 'skin', n: 'لون البشرة', c: L.SKIN },
        { k: 'hair', n: 'التسريحة', names: L.HAIR_STYLES },
        { k: 'hairC', n: 'لون الشعر', c: L.HAIR_C },
        { k: 'shirt', n: 'القميص', c: L.SHIRT },
        { k: 'pants', n: 'البنطلون', c: L.PANTS }
    ];
    function renderEditor(target) {
        var host = target || $('editor');
        $('preview').innerHTML = L.avatarSVG(S.look, 130);
        host.innerHTML = ROWS.map(function (r) {
            var items = r.c ? r.c.map(function (col, i) { return '<button type="button" class="sw' + (S.look[r.k] === i ? ' on' : '') + '" style="background:' + col + '" data-k="' + r.k + '" data-v="' + i + '" aria-label="' + r.n + ' ' + (i + 1) + '"></button>'; }).join('')
                : r.names.map(function (nm, i) { return '<button type="button" class="pill' + (S.look[r.k] === i ? ' on' : '') + '" data-k="' + r.k + '" data-v="' + i + '">' + nm + '</button>'; }).join('');
            return '<div class="opt-row"><span class="lbl">' + r.n + '</span><div class="opts">' + items + '</div></div>';
        }).join('') + '<button type="button" class="btn ghost" id="randLook">🎲 شكل عشوائي</button>';
    }
    $('editor').addEventListener('click', function (e) {
        if (e.target.id === 'randLook') S.look = L.randomLook();
        else { var b = e.target.closest('[data-k]'); if (!b) return; S.look[b.getAttribute('data-k')] = Number(b.getAttribute('data-v')); }
        NET.look(S.look); renderEditor();
        if (S.me) net.send({ t: 'look', look: S.look });
    });
    $('joinGo').onclick = function () {
        $('joinErr').textContent = ''; NET.look(S.look);
        if (S.me) { net.send({ t: 'look', look: S.look }); show('vWait'); renderWait(); return; }   // تعديل الشكل بعد الدخول
        if (!NET.authToken()) { location.href = loginUrl(); return; }
        net.send({ t: 'join', code: S.code, look: S.look, auth: NET.authToken() });
    };

    // ---------------------------------------------------------------- الانتظار
    function renderWait() {
        $('waitAv').innerHTML = L.avatarSVG(S.look, 130);
        $('waitCount').textContent = S.room ? 'داخل الروم: ' + S.room.players.length + ' لاعب' : '';
        var byId = {}, chat = (S.room && S.room.chat) || [], box = $('lobbyChat');
        (S.room ? S.room.players : []).forEach(function (p) { byId[p.id] = p; });
        var last = chat.length ? chat[chat.length - 1].n : 0;
        if (box.dataset.n !== String(last)) {
            box.dataset.n = last;
            box.innerHTML = chat.length ? chat.map(function (c) { return '<div class="cm"><b>' + esc((byId[c.from] || { name: '؟' }).name) + ':</b> ' + esc(c.text) + '</div>'; }).join('') : '<div class="cm sys">ما فيه رسائل للحين</div>';
            box.scrollTop = box.scrollHeight;
        }
    }
    function sendLobby() { var i = $('lobbyIn'), t = i.value.trim(); if (!t) return; net.send({ t: 'lchat', text: t }); i.value = ''; i.focus(); }
    $('lobbySend').onclick = sendLobby;
    $('lobbyIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendLobby(); });
    $('editLook').onclick = function () { show('vProfile'); $('joinGo').textContent = 'حفظ'; renderEditor(); };
    $('leaveBtn').onclick = function () { if (!confirm('تطلع من الروم؟')) return; net.send({ t: 'leave' }); NET.me(null); S.me = null; show('vCode'); };

    // ---------------------------------------------------------------- المباراة
    $('roleChip').onclick = function () { S.hideRole = !S.hideRole; renderGame(); };
    S.opMode = 'kill'; S.cardSel = null; S.chan = 'city'; S.filter = '';
    function plist(G) { return G.players.slice().sort(function (a, b) { return a.seat - b.seat; }); }
    function avatar(p, s) { return L.avatarSVG(p.look, s || 40); }
    function act(a, arg) { net.send({ t: 'act', a: a, arg: arg }); }
    function big(G) { return G.players.length > 25; }

    function playerRows(G, opts) {
        // opts: {can(p) → bool, sel(p) → bool, tag(p) → html, action, argOf(p)} — الرومات الكبيرة: الأحياء فقط مع بحث بالاسم
        var f = S.filter.trim().toLowerCase();
        var list = plist(G).filter(function (p) { return (!big(G) || p.alive) && (!f || p.name.toLowerCase().indexOf(f) >= 0); });
        return (big(G) ? '<input class="field" id="pf" placeholder="🔎 دوّر على اسم…" autocomplete="off" style="margin-top:10px;height:44px;font-size:16px" value="' + esc(S.filter) + '">' : '') +
            '<div class="list">' + list.map(function (p) {
                var ok = opts.can(p), sel = opts.sel && opts.sel(p), t = opts.tag ? opts.tag(p) : '';
                return '<button type="button" class="prow' + (sel ? ' sel' : '') + (!p.alive ? ' dead' : '') + '"' + (ok ? ' data-act="' + opts.action + '" data-id="' + esc(opts.argOf ? opts.argOf(p) : p.id) + '"' : ' disabled') + '>' +
                    '<span class="who"><span class="num">' + (p.seat + 1) + '</span>' + avatar(p) + '<span>' + esc(p.name) + (p.id === S.me.id ? ' (أنت)' : '') + '</span></span>' +
                    (t ? '<span class="tag">' + t + '</span>' : '') + '</button>';
            }).join('') + (list.length ? '' : '<p>ما فيه أحد بهالاسم</p>') + '</div>';
    }

    // الشات: عام للمدينة، حي (لو فيه أحياء)، والمافيا السري — العام والحي بالنقاش فقط، والمافيا طول المباراة
    function chatHtml(G, chans) {
        if (chans.indexOf(S.chan) < 0) S.chan = chans[0];
        var names = { city: '🏙️ العام', district: '🏘️ حيّك (' + G.me.district + ')', mafia: '🔪 المافيا' };
        var byId = {}; G.players.forEach(function (p) { byId[p.id] = p; });
        var msgs = G.chat.filter(function (c) { return c.sys ? S.chan === 'city' : c.ch === S.chan; }).slice(-60).map(function (c) {
            if (c.sys) return '<div class="cm sys">' + esc(c.text) + '</div>';
            var p = byId[c.from] || { name: '؟' };
            return '<div class="cm' + (c.ch === 'mafia' ? ' maf' : '') + '"><b>' + esc(p.name) + ':</b> ' + esc(c.text) + '</div>';
        }).join('');
        var canSend = G.me.alive && (S.chan === 'mafia' ? G.me.team === 'mafia' : G.phase === 'day' && !G.me.silenced);
        return (chans.length > 1 ? '<div class="opts" style="margin-top:10px">' + chans.map(function (c) { return '<button type="button" class="pill' + (S.chan === c ? ' on' : '') + '" data-chan="' + c + '">' + names[c] + '</button>'; }).join('') + '</div>' : '') +
            '<div class="chatbox" id="chatbox">' + msgs + '</div>' + (canSend
            ? '<div class="send"><input class="field" id="chatIn" maxlength="140" placeholder="' + (S.chan === 'mafia' ? 'كلّم فريقك بسرية…' : 'اكتب رسالة…') + '" autocomplete="off"><button type="button" id="chatSend">إرسال</button></div>' : '');
    }
    function chansFor(G) {
        var c = [];
        if (G.phase === 'day' || G.phase === 'vote') { c.push('city'); if (G.districts > 1) c.push('district'); }
        return c;
    }

    // ---- الشات الخاص بالدور: المافيا (طول المباراة)، والأطباء/المحققين لو أكثر من واحد (وقت النقاش)
    // لوحة تنفتح وتنقفل تحت الشات العام، فيقدر يتابع الاثنين ويكتب بالاثنين
    var PRIV = { mafia: { n: '🔪 شات المافيا', h: 'كلّم فريقك بسرية…' }, doctor: { n: '🩺 شات الأطباء', h: 'نسّقوا مين تحمون…' }, detective: { n: '🕵️ شات المحققين', h: 'شاركوا نتائج الفحص…' } };
    S.privOpen = false; S.privSeen = {}; S.pdraft = '';
    function privChan(G) {
        var me = G.me; if (!me.alive) return null;
        if (me.team === 'mafia') return 'mafia';
        if (me.role === 'doctor' && G.settings.doctors > 1) return 'doctor';
        if (me.role === 'detective' && G.settings.detectives > 1) return 'detective';
        return null;
    }
    function privateHtml(G, forceOpen) {
        var ch = privChan(G); if (!ch) return '';
        var open = forceOpen || S.privOpen, list = G.chat.filter(function (c) { return c.ch === ch; });
        var last = list.length ? list[list.length - 1].n : 0, seen = S.privSeen[ch] || 0;
        if (open) S.privSeen[ch] = last;
        var unread = open ? 0 : list.filter(function (c) { return c.n > seen && c.from !== G.me.id; }).length;
        var canSend = ch === 'mafia' || G.phase === 'day';
        var byId = {}; G.players.forEach(function (p) { byId[p.id] = p; });
        var head = forceOpen ? '<h2>' + PRIV[ch].n + '</h2>'
            : '<button type="button" class="btn ghost" data-priv-toggle style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px">' +
              '<span>🔒 ' + PRIV[ch].n.replace(/^\S+ /, '') + (unread ? ' <span style="background:#e2483d;color:#fff;border-radius:999px;padding:1px 9px;font-size:13px">' + unread + ' جديدة</span>' : '') + '</span><span>' + (open ? 'اقفل ▴' : 'افتح ▾') + '</span></button>';
        if (!open) return head;
        return head + '<div class="chatbox" id="privbox" style="border-color:rgba(226,72,61,.35)">' + (list.slice(-60).map(function (c) {
            var p = byId[c.from] || { name: '؟' }; return '<div class="cm maf"><b>' + esc(p.name) + ':</b> ' + esc(c.text) + '</div>';
        }).join('') || '<div class="cm sys">ما فيه رسائل — الشات هذا يشوفه ' + (ch === 'mafia' ? 'فريقك' : ch === 'doctor' ? 'الأطباء' : 'المحققين') + ' بس</div>') + '</div>' +
            (canSend ? '<div class="send"><input class="field" id="privIn" maxlength="140" placeholder="' + PRIV[ch].h + '" autocomplete="off"><button type="button" id="privSend">إرسال</button></div>' : '<p>يفتح للكتابة وقت النقاش.</p>');
    }

    var CARD_INFO = {
        recruit: { i: '🤝', d: 'بدل القتل: يحوّل لاعب من المدينة لمافيا الصبح (من الليلة 3)' },
        shield: { i: '🛡️', d: 'عضو مافيا يطلع للمحقق «تعذر التحقيق» لمدة ليلتين' },
        reveal: { i: '👁️', d: 'تعرفون الدور الدقيق للاعب من المدينة' },
        mislead: { i: '🎭', d: 'لاعب من المدينة يطلع للمحقق «مافيا» لمدة ليلتين' },
        silence: { i: '🤐', d: 'لاعب من المدينة ما يقدر يكتب بالنقاش الجاي (يصوّت عادي)' }
    };
    function mafiaNight(G) {
        var me = G.me, ops = me.ops || {}, cv = me.cardVotes || {}, cards = G.cards || [], html = '';
        var recruit = cards.find(function (c) { return c.id === 'recruit'; });
        if (S.opMode === 'recruit' && !(recruit && recruit.available)) S.opMode = 'kill';
        var cnt = {}; Object.keys(ops).forEach(function (k) { var o = ops[k]; if (o.op === S.opMode) cnt[o.target] = (cnt[o.target] || 0) + 1; });
        html += '<h2>🔪 عملية الليلة</h2><p>كل المافيا يصوّتون، والأكثر يتنفّذ — التعادل يلغي العملية.</p>' +
            '<div class="opts"><button type="button" class="pill' + (S.opMode === 'kill' ? ' on' : '') + '" data-opmode="kill">🔪 قتل</button>' +
            (recruit ? '<button type="button" class="pill' + (S.opMode === 'recruit' ? ' on' : '') + '" data-opmode="recruit"' + (recruit.available ? '' : ' disabled style="opacity:.45"') + '>🤝 تجنيد' + (recruit.used ? ' (مستخدم)' : recruit.available ? '' : ' (من الليلة 3)') + '</button>' : '') + '</div>' +
            playerRows(G, {
                action: S.opMode, can: function (p) { return p.alive && p.team !== 'mafia'; },
                sel: function (p) { return ops[me.id] && ops[me.id].op === S.opMode && ops[me.id].target === p.id; },
                tag: function (p) { return p.team === 'mafia' ? '🔪 فريقك' : (cnt[p.id] ? '🎯 ' + cnt[p.id] : ''); }
            });
        // الكروت المساعدة (قبل قائمة الأهداف بالرومات الكبيرة عشان ما تضيع تحت)
        var opHtml = html; html = '';
        html += '<h2>🃏 كروت المافيا</h2><p>كرت مساعد واحد بالليلة (من الليلة 2)، وكل كرت مرة وحدة. التجنيد ما ينجمع مع كرت.</p><div class="list">' +
            cards.filter(function (c) { return c.id !== 'recruit'; }).map(function (c) {
                var on = S.cardSel === c.id, I = CARD_INFO[c.id];
                return '<button type="button" class="prow' + (on ? ' sel' : '') + '"' + (c.available ? ' data-cardsel="' + c.id + '"' : ' disabled') + ' style="' + (c.available ? '' : 'opacity:.5') + '">' +
                    '<span class="who"><span style="font-size:26px">' + I.i + '</span><span>' + esc(c.name) + '<br><small style="color:var(--mute);font-weight:700">' + I.d + '</small></span></span>' +
                    '<span class="tag">' + (c.used ? 'مستخدم' : c.available ? 'متاح' : 'من الليلة 2') + '</span></button>';
            }).join('') + '<button type="button" class="btn ghost" data-act="card" data-id="none">' + (cv[me.id] && cv[me.id].card === 'none' ? '✓ ' : '') + 'بدون كرت الليلة</button></div>';
        var votesTxt = Object.keys(cv).map(function (k) { var v = cv[k]; if (v.card === 'none') return 'بدون كرت'; var t = G.players.find(function (p) { return p.id === v.target; }); return CARD_INFO[v.card].i + ' ' + (t ? t.name : ''); });
        if (votesTxt.length) html += '<div class="note">ترشيحات فريقك للكرت: ' + votesTxt.map(esc).join(' · ') + '</div>';
        if (S.cardSel) {
            var shield = S.cardSel === 'shield';
            html += '<h2>' + CARD_INFO[S.cardSel].i + ' على مين؟</h2>' + playerRows(G, {
                action: 'card', argOf: function (p) { return S.cardSel + '|' + p.id; },
                can: function (p) { return p.alive && (shield ? p.team === 'mafia' : p.team !== 'mafia'); },
                sel: function (p) { return cv[me.id] && cv[me.id].card === S.cardSel && cv[me.id].target === p.id; },
                tag: function (p) { return p.team === 'mafia' ? '🔪 فريقك' : ''; }
            });
        }
        return big(G) ? html + opHtml : opHtml + html;
    }

    function noticesHtml(G) {
        var list = (G.me.notices || []).slice(-6).reverse(); if (!list.length) return '';
        return '<h2>📬 إشعاراتك السرية</h2>' + list.map(function (n) { return '<div class="res" style="font-size:15px">' + esc(n.text) + '</div>'; }).join('');
    }

    var lastRenderKey = '';
    function renderGame() {
        var G = S.G; if (!G || !G.me) return;
        var me = G.me, R = ROLE[me.role], mp = G.players.find(function (p) { return p.id === me.id; }) || {};
        $('meBox').innerHTML = avatar(mp, 40) + '<span>' + esc(mp.name || '') + (G.districts > 1 ? ' <small style="color:var(--mute)">· حي ' + me.district + '</small>' : '') + '</span>';
        $('roleChip').style.background = S.hideRole ? '#3b3f63' : R.c;
        $('roleChip').textContent = S.hideRole ? '👁 اضغط لعرض دورك' : R.icon + ' ' + R.n;

        // نعيد بناء المحتوى فقط إذا تغيّر شي يهم (عشان ما يضيع النص اللي يكتبه)
        var key = JSON.stringify([G.phase, G.turn, G.round, G.players.map(function (p) { return [p.alive, p.team]; }), me, G.cards, G.votes, G.chat.length && G.chat[G.chat.length - 1].n, G.verdict, G.winner, S.hideRole, S.opMode, S.cardSel, S.chan, S.filter, S.privOpen]);
        if (key === lastRenderKey) return; lastRenderKey = key;
        var input = $('chatIn'); if (input) S.draft = input.value;
        var pin = $('privIn'); if (pin) S.pdraft = pin.value;
        var focusId = document.activeElement && document.activeElement.id;

        var html = '', ph = G.phase, alive = me.alive;
        var mates = G.players.filter(function (p) { return p.team === 'mafia' && p.id !== me.id; });
        if (!alive && ph !== 'over') html += '<div class="note">💀 خرجت من اللعبة — تقدر تتابع البث بس ما تقدر تتكلم أو تصوّت.</div>';
        if (me.silenced) html += '<div class="note">🤐 المافيا أسكتتك هالنهار — ما تقدر تكتب بالشات، بس تقدر تصوّت.</div>';

        if (ph === 'reveal') {
            html += '<div class="role-card" style="background:linear-gradient(160deg,' + R.c + ',#1b1d3d)"><div class="ic">' + R.icon + '</div><div class="nm">أنت ' + R.n + '</div><div class="ds">' + R.desc + '</div>' +
                (me.team === 'mafia' && mates.length ? '<div class="mates">فريقك: ' + mates.map(function (p) { return esc(p.name) + (p.role === 'disguised' ? ' 🎭' : ''); }).join('، ') + '</div>' : '') + '</div>' +
                (G.districts > 1 ? '<div class="note">أنت في الحي ' + me.district + ' — شات الحي لأهل حيّك بس.</div>' : '') +
                '<div class="note">لا تخلي أحد يشوف جوالك! وخبّ الدور من الزر فوق إذا تبي.</div>';
        } else if (ph === 'night') {
            // الليل بأدوار: كل دور يشتغل بوقته، والباقين ينتظرون
            var myTurn = me.team === 'mafia' ? 'mafia' : me.role === 'doctor' || me.role === 'detective' ? me.role : null;
            var ORDER = ['mafia', 'doctor', 'detective'], TN = { mafia: 'المافيا', doctor: 'الطبيب', detective: 'المحقق' };
            var wait = function (ic, tt) { return '<div class="big"><div class="ic">' + ic + '</div><div class="tt">' + tt + '</div><p>الحين دور ' + TN[G.turn] + '. تابع البث.</p></div>'; };
            if (!alive) html += '<div class="big"><div class="ic">🌙</div><div class="tt">الليل · دور ' + TN[G.turn] + '</div></div>';
            else if (myTurn && G.turn !== myTurn) {
                html += ORDER.indexOf(G.turn) < ORDER.indexOf(myTurn) ? wait('⏳', 'انتظر… دورك بعد شوي') : wait('✔️', 'خلّصت دورك الليلة');
                if (me.team === 'mafia') html += privateHtml(G, true);
                if (me.role === 'detective') html += inspections(G);
            }
            else if (me.team === 'mafia') html += mafiaNight(G) + privateHtml(G, true);
            else if (me.role === 'doctor') {
                html += '<h2>🩺 مين تحمي الليلة؟</h2><p>ما تكرر نفس الشخص ليلتين ورا بعض، وتحمي نفسك مرة وحدة بالمباراة' + (me.doctorSelfUsed ? ' (استخدمتها)' : '') + '.</p>' + playerRows(G, {
                    action: 'protect', can: function (p) { return p.alive && p.id !== me.doctorPrev && !(p.id === me.id && me.doctorSelfUsed); },
                    sel: function (p) { return me.protect === p.id; },
                    tag: function (p) { return me.protect === p.id ? '🛡️ محمي' : p.id === me.doctorPrev ? 'حميته أمس' : ''; }
                });
            } else if (me.role === 'detective') {
                html += '<h2>🕵️ مين تفحص الليلة؟</h2><p>فحص واحد بالليلة، والنتيجة توصلك الصبح.</p>' + playerRows(G, {
                    action: 'inspect', can: function (p) { return p.alive && p.id !== me.id && !me.inspect; },
                    sel: function (p) { return me.inspect === p.id; }, tag: function (p) { return me.inspect === p.id ? '🔍 تحت التحقيق' : ''; }
                }) + inspections(G);
            } else {
                html += '<div class="big"><div class="ic">😴</div><div class="tt">نام يا مواطن…</div><p>الحين دور ' + TN[G.turn] + '. لا تشيل عينك عن البث!</p></div>';
            }
        } else if (ph === 'dawn') {
            html += '<div class="big"><div class="ic">🎬</div><div class="tt">شوف البث!</div><p>مشاهد الليلة شغالة على شاشة البث الحين.</p></div>' + noticesHtml(G);
        } else if (ph === 'day') {
            html += '<h2>💬 النقاش</h2><p>رسائل الشات العام تظهر على البث.</p>' + chatHtml(G, chansFor(G)) + privateHtml(G) + noticesHtml(G) + inspections(G);
        } else if (ph === 'vote') {
            var tally = {}; Object.keys(G.votes).forEach(function (k) { var t = G.votes[k]; tally[t] = (tally[t] || 0) + 1; });
            html += '<h2>🗳️ مين يطلع؟</h2><p>تقدر تغيّر صوتك لين يخلص الوقت. التعادل = ما أحد يطلع.</p>' + (alive ? '<button type="button" class="btn ghost" data-act="vote" data-id="skip">' + (me.vote === 'skip' ? '✓ ' : '') + 'أمتنع عن التصويت (' + (tally.skip || 0) + ')</button>' : '') + playerRows(G, {
                action: 'vote', can: function (p) { return alive && p.alive && p.id !== me.id; },
                sel: function (p) { return me.vote === p.id; }, tag: function (p) { return tally[p.id] ? '🗳️ ' + tally[p.id] : ''; }
            }) + (chansFor(G).length ? chatHtml(G, chansFor(G)) : '') + privateHtml(G) + inspections(G);
        } else if (ph === 'verdict') {
            var V = G.verdict, op = V && V.id && G.players.find(function (p) { return p.id === V.id; });
            html += '<div class="big"><div class="ic">⚖️</div><div class="tt">' + (op ? 'المدينة طردت ' + esc(op.name) : (V && V.tie ? 'تعادل — ما أحد طلع' : 'ما أحد طلع')) + '</div><p>' +
                (op ? (op.id === me.id ? 'هذا أنت! 😢 ' : '') + (op.team === 'mafia' ? 'كان من المافيا 🔪' : 'كان من المدينة 🏠') : 'شوف البث') + '</p></div>';
        } else if (ph === 'over') {
            var won = me.team === G.winner;
            html += '<div class="big"><div class="ic">' + (won ? '🏆' : '💔') + '</div><div class="tt">' + (G.winner === 'mafia' ? 'فازت المافيا' : 'فازت المدينة') + '</div><p>' + (won ? 'مبروك! فريقك فاز' : 'حظ أوفر المرة الجاية') + '</p></div>' +
                (G.cards ? '<div class="note">🃏 كروت المافيا كانت: ' + G.cards.map(function (c) { return esc(c.name) + (c.used ? ' ✓' : ''); }).join('، ') + '</div>' : '') +
                '<div class="list">' + plist(G).map(function (p) { var r = ROLE[p.role] || ROLE.citizen; return '<div class="prow"><span class="who">' + avatar(p) + esc(p.name) + '</span><span class="tag" style="color:' + r.c + '">' + r.icon + ' ' + r.n + (p.recruited ? ' ← جُنّد' : '') + '</span></div>'; }).join('') + '</div>' +
                '<p style="text-align:center;margin-top:10px">بانتظار المذيع يبدأ جولة جديدة…</p>';
        }
        $('gameBody').innerHTML = html;
        var box = $('chatbox'); if (box) box.scrollTop = box.scrollHeight;
        var ci = $('chatIn'); if (ci) ci.value = S.draft;
        var pi = $('privIn'); if (pi) pi.value = S.pdraft;
        var pb = $('privbox'); if (pb) pb.scrollTop = pb.scrollHeight;
        var fe = focusId && $(focusId); if (fe && fe.tagName === 'INPUT') { fe.focus(); fe.setSelectionRange(fe.value.length, fe.value.length); }
    }

    function inspections(G) {
        var list = (G.me && G.me.inspections) || []; if (!list.length) return '';
        var R3 = { mafia: ['#ff8a80', '🔪 مافيا!'], town: ['#7ee2a6', '✓ من المدينة'], blocked: ['#ffd27a', '❔ تعذر التحقيق'] };
        return '<h2>📁 ملف التحقيقات</h2>' + list.map(function (r) {
            var p = G.players.find(function (q) { return q.id === r.id; }), x = R3[r.res] || R3.town;
            return '<div class="res"><span>الليلة ' + r.round + ': ' + esc(p ? p.name : '') + '</span><span style="color:' + x[0] + '">' + x[1] + '</span></div>';
        }).join('');
    }

    $('gameBody').addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (b) { act(b.getAttribute('data-act'), b.getAttribute('data-id')); if (navigator.vibrate) navigator.vibrate(20); return; }
        var m = e.target.closest('[data-opmode]'); if (m) { S.opMode = m.getAttribute('data-opmode'); return renderGame(); }
        var c = e.target.closest('[data-cardsel]'); if (c) { var id = c.getAttribute('data-cardsel'); S.cardSel = S.cardSel === id ? null : id; return renderGame(); }
        var ch = e.target.closest('[data-chan]'); if (ch) { S.chan = ch.getAttribute('data-chan'); return renderGame(); }
        if (e.target.id === 'chatSend') sendChat();
        if (e.target.id === 'privSend') sendPriv();
        if (e.target.closest('[data-priv-toggle]')) { S.privOpen = !S.privOpen; lastRenderKey = ''; renderGame(); }
    });
    $('gameBody').addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; if (e.target.id === 'chatIn') sendChat(); if (e.target.id === 'privIn') sendPriv(); });
    $('gameBody').addEventListener('input', function (e) { if (e.target.id === 'pf') { S.filter = e.target.value; renderGame(); } });
    function sendPriv() { var i = $('privIn'), ch = S.G && privChan(S.G); if (!i || !ch) return; var t = i.value.trim(); if (!t) return; act('chat', ch + '|' + t); i.value = ''; S.pdraft = ''; i.focus(); }
    function sendChat() { var i = $('chatIn'); if (!i) return; var t = i.value.trim(); if (!t) return; act('chat', S.chan + '|' + t); i.value = ''; S.draft = ''; i.focus(); }

    // المؤقت
    setInterval(function () {
        var G = S.G; if (!G || S.view !== 'vGame') return;
        var names = { reveal: 'كشف الأدوار', night: '🌙 الليل', dawn: '🎬 مشاهد الليلة', day: '☀️ النقاش', vote: '🗳️ التصويت', verdict: '⚖️ النتائج', over: '🏁 النهاية' };
        $('phaseTxt').textContent = names[G.phase] + (G.phase === 'night' && G.turn ? ' · دور ' + ({ mafia: 'المافيا', doctor: 'الطبيب', detective: 'المحقق' })[G.turn] : G.round ? ' · ' + G.round : '');
        var left = G.endsAt ? Math.max(0, Math.ceil((G.endsAt - NET.now()) / 1000)) : 0;
        $('phaseT').textContent = G.endsAt && G.phase !== 'dawn' && G.phase !== 'verdict' ? left : '';
    }, 250);

    if (!S.code && !S.me) show('vCode');
    if (S.code) $('codeIn').value = S.code;
})();
</script>
</body>
</html>
