<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<title>المافيا — العب من جوالك</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="../../auth/auth-client.js"></script>
<script src="mafia-net.js"></script>
<script src="mafia-looks.js"></script>
<style>
:root { /* هوية ألعاب أيمن (نفس روليت الإقصاء): بنفسجي على خلفية داكنة */
    --bg: #07060b; --card: #13111b; --card2: #1c1828; --ink: #f4f2f8; --mute: #a8a3b5; --line: rgba(255,255,255,.09);
    --gold: #a78bfa; --c2: #c4b5fd; --c3: #ddd6fe; --g1: #7c3aed; --g2: #a855f7; --red: #e2483d; --green: #2fb36a; --blue: #3e8ef0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: radial-gradient(700px 500px at 100% -10%, rgba(124,58,237,.2), transparent 65%), radial-gradient(600px 500px at -10% 60%, rgba(139,92,246,.1), transparent 65%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: 'IBM Plex Sans Arabic', "Segoe UI", Tahoma, sans-serif; direction: rtl; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); }
button, input { font-family: inherit; }
.wrap { max-width: 480px; margin: 0 auto; }
@media (min-width: 700px) { .wrap { max-width: 760px; } }
/* شاشة اللعب: تملى الشاشة كاملة بأي وضع (طولي/عرضي) وبأي جهاز */
body.in-game { height: 100dvh; min-height: 0; overflow: hidden; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
body.in-game .wrap { max-width: 1280px; height: 100%; display: flex; flex-direction: column; }
body.in-game .brand { flex-direction: row; justify-content: center; gap: 10px; margin-top: 6px; }
body.in-game .brand img { height: 30px; }
#vGame:not(.hide) { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#gameBody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
.lay { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.lay .pa { flex: 1.3 1 0; min-height: 220px; display: flex; flex-direction: column; }
.lay .pb { flex: 0 0 auto; max-height: 45%; display: flex; flex-direction: column; overflow-y: auto; }
.lay .pb:has(.chatbox) { flex: 1 1 0; min-height: 160px; max-height: none; }
/* لو فيه شبكة اختيار (الليل/التصويت) بالجوال الطولي: الشبكة لها الأولوية والشات تحتها أصغر */
.lay:has(.pa .grid) .pb:has(.chatbox) { flex: 0 1 auto; min-height: 0; max-height: 36%; }
.lay:has(.pa .grid) .pb .chatbox { min-height: 80px; }
.lay:has(.pa .grid) .pa { min-height: 300px; }
.lay.solo .pa { flex: 1; }
.lay .grid { flex: 1; max-height: none; min-height: 0; align-content: start; }
.lay .chatbox { flex: 1; max-height: none; min-height: 110px; }
.lay .pa > .sec-h:first-child, .lay .pb > .sec-h:first-child { margin-top: 10px; }
@media (orientation: landscape) and (min-width: 640px), (min-width: 900px) {
    .lay { flex-direction: row; }
    .lay .pa { flex: 1.5 1 0; min-height: 0; }
    .lay .pb { flex: 1 1 0; min-height: 0; }
    .lay:has(.pa .grid) .pb:has(.chatbox) { flex: 1 1 0; max-height: none; }
    .lay:has(.pa .grid) .pa { min-height: 0; }
}
.lay .grid { --ts: 110px; }
.lay .pt svg { width: calc(var(--ts) * .46); height: calc(var(--ts) * .46); }
.lay .pt b { font-size: clamp(13px, calc(var(--ts) * .13), 19px); }
.lay .pt.skip .pi { font-size: calc(var(--ts) * .3); }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }

body.in-game .top { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.hide { display: none !important; }
h1 { font-size: 30px; font-weight: 900; margin: 16px 0 4px; }
h2 { font-size: 22px; font-weight: 900; margin: 16px 0 8px; }
p { margin: 4px 0; color: var(--mute); font-weight: 700; font-size: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 12px; }
.field { width: 100%; height: 52px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.03); color: #fff; font-size: 20px; font-weight: 800; padding: 0 14px; outline: none; }
.field:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(139,92,246,.18); }
.code-in { text-align: center; letter-spacing: 10px; font-size: 32px; direction: ltr; }
.btn { width: 100%; height: 54px; border-radius: 16px; border: 0; font-weight: 900; font-size: 20px; color: #fff; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 8px 24px rgba(139,92,246,.35); margin-top: 12px; cursor: pointer; }
.btn:active { transform: scale(.98); }
.btn[disabled] { filter: grayscale(1) brightness(.6); }
.btn.ghost { background: rgba(139,92,246,.08); color: var(--c3); border-color: rgba(167,139,250,.28) !important; box-shadow: none; border: 1px solid var(--line); }
.err { color: #ff8a80; font-weight: 800; min-height: 22px; margin-top: 8px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 12px; font-weight: 600; font-size: 14px; color: var(--mute); }
.brand img { height: 46px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(139,92,246,.45)); }

/* محرر الشخصية — صف لكل خيار: العنوان يمين والاختيارات يسار */
.preview { display: grid; place-items: center; padding: 6px; }
.preview svg { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #3b2a6e, #16121f); box-shadow: 0 0 30px rgba(139,92,246,.3); }
.opt-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt-row:first-of-type { border-top: 0; }
.opt-row .lbl { font-weight: 800; font-size: 16px; text-align: right; flex: none; }
.opts { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: none; direction: rtl; }
.opts::-webkit-scrollbar { display: none; }
.sw { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
.pill { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
.pill.on { background: rgba(139,92,246,.28); color: #fff; border-color: var(--gold); box-shadow: 0 0 12px rgba(139,92,246,.35); }
.acct { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.acct a { color: var(--gold); font-weight: 900; }
.acct .av { width: 52px; height: 52px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; position: relative; background: var(--card2); font-weight: 900; font-size: 22px; }
.acct .av img { width: 100%; height: 100%; object-fit: cover; }
.acct .who2 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.acct .who2 div { min-width: 0; }
.acct .nm2 { font-size: 20px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .sub2 { font-size: 14px; color: var(--mute); font-weight: 700; }
.need-login { flex-direction: column; align-items: stretch; text-align: center; gap: 10px; }
.need-login .btn { margin-top: 0; color: #fff; }

/* بطاقات اختيار اللاعبين */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 44vh; overflow-y: auto; margin-top: 10px; padding: 2px; scrollbar-width: thin; overscroll-behavior: contain; }
.pt { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 6px; border-radius: 16px; border: 1.5px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); color: #fff; font: inherit; cursor: pointer; min-width: 0; }
.pt svg { width: 42px; height: 42px; border-radius: 50%; background: var(--card2); }
.pt b { max-width: 100%; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt em { font-style: normal; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(139,92,246,.25); color: var(--c3); }
.pt .num { position: absolute; top: 6px; right: 6px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; background: rgba(139,92,246,.3); font-size: 11px; font-weight: 700; }
.pt.sel { border-color: var(--gold); background: linear-gradient(180deg, rgba(139,92,246,.32), rgba(124,58,237,.12)); box-shadow: 0 0 0 2px rgba(167,139,250,.35), 0 6px 18px rgba(124,58,237,.35); }
.pt.dead, .pt[disabled] { opacity: .4; cursor: default; }
.pt.skip { border-style: dashed; border-color: rgba(251,191,36,.55); background: rgba(251,191,36,.08); color: #fde68a; }
.pt.skip .pi { font-size: 28px; line-height: 1; }
.pt.skip.sel { border-style: solid; border-color: #fbbf24; background: rgba(251,191,36,.2); box-shadow: 0 0 0 2px rgba(251,191,36,.35); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
.sec-h h2 { margin: 0; font-size: 19px; }
.sec-h .st { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(139,92,246,.18); color: var(--c3); white-space: nowrap; }
.sec-h .st.ok { background: rgba(47,179,106,.2); color: #7ee2a6; }
.ctiles { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; padding: 2px; scrollbar-width: none; }
.ctiles::-webkit-scrollbar { display: none; }
.ct { flex: none; width: 92px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 16px; border: 1.5px solid rgba(167,139,250,.25); background: linear-gradient(160deg, rgba(139,92,246,.16), rgba(255,255,255,.02)); color: #fff; font: inherit; cursor: pointer; }
.ct span { font-size: 28px; line-height: 1; }
.ct b { font-size: 13px; font-weight: 700; }
.ct em { font-style: normal; font-size: 11px; color: var(--mute); font-weight: 600; }
.ct.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(167,139,250,.4); }
.ct[disabled] { opacity: .4; cursor: default; }
.ct.none { border-style: dashed; }
/* شريط الفريق: زملاءك + زر الشات السري — مضغوط وثابت فوق بكل المراحل */
.teambar { --tc: #e2483d; --tr: 226,72,61; position: relative; margin-top: 10px; padding: 10px 12px; border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(var(--tr), .32); background: linear-gradient(135deg, rgba(var(--tr), .14), rgba(255,255,255,.015) 60%), rgba(19,17,27,.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px -14px rgba(var(--tr), .55); }
.teambar::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tc); box-shadow: 0 0 14px var(--tc); }
.teambar.doctor { --tc: #2fb36a; --tr: 47,179,106; } .teambar.detective { --tc: #3e8ef0; --tr: 62,142,240; }
.teambar-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.teambar-t { display: flex; flex-direction: column; min-width: 0; }
.teambar-t b { font-size: 14px; font-weight: 700; letter-spacing: .2px; }
.teambar-t small { color: var(--mute); font-size: 11.5px; font-weight: 500; }
.mates-row { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.mates-row::-webkit-scrollbar { display: none; }
.mate { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 3px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-size: 13px; font-weight: 600; }
.mate svg { width: 24px; height: 24px; border-radius: 50%; background: var(--card2); box-shadow: 0 0 0 1.5px rgba(var(--tr), .7); }
.mate.dead { opacity: .4; text-decoration: line-through; }
.teambar .pbtns { flex: none; gap: 6px; }
.pbtn { --tr: 226,72,61; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(var(--tr), .7); background: linear-gradient(135deg, rgba(var(--tr), .95), rgba(var(--tr), .7)); color: #fff; font: inherit; font-weight: 700; font-size: 13px; white-space: nowrap; cursor: pointer; box-shadow: 0 4px 14px -4px rgba(var(--tr), .7), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .15s, background .2s; }
.pbtn:active { transform: scale(.96); }
.pbtn.doctor { --tr: 47,179,106; } .pbtn.detective { --tr: 62,142,240; }
.pbtn[aria-expanded="true"] { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); box-shadow: none; color: var(--c3); }
.pbtn i { font-style: normal; min-width: 18px; height: 18px; display: grid; place-items: center; background: #fff; color: rgb(var(--tr)); border-radius: 999px; padding: 0 5px; font-size: 11px; font-weight: 800; }
.pbtn.ping { animation: ping 1.6s ease-in-out infinite; }
@keyframes ping { 50% { box-shadow: 0 0 0 5px rgba(var(--tr), .18), 0 4px 14px -4px rgba(var(--tr), .7); } }
/* عنوان كل شات: صغير ومرتب */
.chead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.chead span { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--c3); letter-spacing: .2px; }
.chead span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7ee2a6; box-shadow: 0 0 8px #7ee2a6; }
.chead small { color: var(--mute); font-size: 11.5px; font-weight: 500; }
.chead.mafia span { color: #ffb4ab; } .chead.mafia span::before { background: #e2483d; box-shadow: 0 0 8px #e2483d; }
.chead.doctor span { color: #7ee2a6; } .chead.detective span { color: #8ab4ff; } .chead.detective span::before { background: #3e8ef0; box-shadow: 0 0 8px #3e8ef0; }
.chatbox.priv { border-color: rgba(226,72,61,.3); background: linear-gradient(180deg, rgba(226,72,61,.07), rgba(0,0,0,.25)); }
.chatbox.priv.doctor { border-color: rgba(47,179,106,.3); background: linear-gradient(180deg, rgba(47,179,106,.07), rgba(0,0,0,.25)); }
.chatbox.priv.detective { border-color: rgba(62,142,240,.3); background: linear-gradient(180deg, rgba(62,142,240,.07), rgba(0,0,0,.25)); }
/* الشات السري لما ينفتح يطلع فوق والعام ينزل تحته (نفس العمود)، ويتقاسمون الطول */
.notices-mini .res:nth-child(n+4) { display: none; }
.lay.priv-on .notices-mini .res:nth-child(n+2) { display: none; }
@media (orientation: landscape) and (min-width: 640px), (min-width: 900px) {
    .notices-mini .res:nth-child(n+2) { display: flex !important; }
}

/* دور المافيا: ملخص، خطوات، كروت، نافذة اختيار */
.msum { margin-top: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(167,139,250,.3); background: rgba(139,92,246,.1); }
.msum.ok { border-color: rgba(47,179,106,.5); background: rgba(47,179,106,.1); }
.msum-h { font-size: 15px; font-weight: 700; color: var(--c3); margin-bottom: 4px; }
.msum.ok .msum-h { color: #7ee2a6; }
.msum-l { font-size: 17px; font-weight: 700; }
.msum small { display: block; color: var(--mute); font-size: 13px; margin-top: 4px; }
.mstep { margin-top: 14px; padding: 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.mstep-h { display: flex; align-items: center; gap: 8px; font-size: 19px; }
.mstep-h .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--g1), var(--g2)); font-size: 15px; font-weight: 700; flex: none; }
.mstep-h small { margin-inline-start: auto; color: var(--mute); font-size: 13px; }
.cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ccard { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid rgba(167,139,250,.25); background: linear-gradient(160deg, rgba(139,92,246,.14), rgba(255,255,255,.02)); color: #fff; text-align: right; cursor: pointer; font: inherit; }
.ccard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(167,139,250,.45); }
.ccard[disabled] { opacity: .45; cursor: default; }
.ccard .ci { font-size: 34px; line-height: 1; flex: none; }
.ccard .cb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ccard b { font-size: 18px; }
.ccard small { color: var(--mute); font-size: 14px; font-weight: 600; }
.ccard .cm2 { font-size: 13px; color: var(--c3); font-weight: 600; }
.ccard .cv { font-size: 13px; font-weight: 700; color: #fff; background: rgba(0,0,0,.3); border-radius: 8px; padding: 3px 8px; align-self: flex-start; }
.help { margin-top: 8px; padding: 12px; border-radius: 14px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
.help p { font-size: 14px; margin: 0 0 8px; }
.help p b { color: #fff; }
.help-c { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.help-c > span { font-size: 26px; }
.help-c b { display: block; font-size: 16px; }
.help-c small { display: block; color: var(--mute); font-size: 13px; font-weight: 600; }
.pick-bg { position: fixed; inset: 0; z-index: 30; background: rgba(4,3,8,.7); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
.pick { width: min(480px, 100%); max-height: 78vh; overflow-y: auto; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: #13111b; border: 1px solid rgba(167,139,250,.3); animation: up .2s ease-out; }
.pick-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; }
.pick-h button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: #fff; font-size: 18px; cursor: pointer; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

/* اللعبة */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; background: rgba(7,6,11,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.me { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }
.me svg { width: 40px; height: 40px; border-radius: 50%; background: var(--card2); }
.rolechip { padding: 6px 12px; border-radius: 999px; font-weight: 900; font-size: 15px; border: 0; color: #fff; cursor: pointer; }
.phase { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 16px; background: var(--card2); }
.phase b { font-size: 20px; font-weight: 900; }
.phase .t:empty { display: none; }
.phase .t { min-width: 52px; text-align: center; font-size: 22px; font-weight: 900; padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,.3); }
.role-card { text-align: center; padding: 22px 14px; border-radius: 22px; margin-top: 12px; color: #fff; }
.role-card .ic { font-size: 64px; line-height: 1; }
.role-card .nm { font-size: 36px; font-weight: 900; margin-top: 6px; }
.role-card .ds { font-size: 17px; font-weight: 700; opacity: .95; margin-top: 4px; }
.role-card .mates { margin-top: 10px; font-weight: 800; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); border: 2px solid transparent; cursor: pointer; width: 100%; color: #fff; text-align: right; font-size: 17px; font-weight: 800; }
.prow .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.prow svg { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--card2); }
.prow .num { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgba(139,92,246,.35); font-size: 14px; }
.prow .tag { font-size: 14px; font-weight: 900; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.08); flex: none; }
.prow.sel { border-color: var(--gold); background: rgba(139,92,246,.16); }
.prow.dead { opacity: .45; cursor: default; }
.prow[disabled] { cursor: default; }
.note { padding: 12px 14px; border-radius: 14px; background: rgba(139,92,246,.1); border: 1px solid rgba(167,139,250,.22); color: var(--c3); font-weight: 600; margin-top: 10px; font-size: 16px; }
.res { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 12px; background: var(--card); margin-top: 6px; font-weight: 800; }
.chatbox { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; padding: 8px; border-radius: 14px; background: rgba(0,0,0,.3); border: 1px solid var(--line); margin-top: 10px; }
.cm { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.cm b { color: var(--gold); font-weight: 900; }
.cm.sys { color: #ddd6fe; text-align: center; font-size: 14px; }
.cm.maf b { color: #ff8a80; }
/* فقاعة رسالة مع زر رد */
.bm { display: flex; flex-direction: column; gap: 3px; padding: 7px 10px 8px; border-radius: 4px 14px 14px 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
.bm.mine { background: rgba(124,92,255,.16); border-color: rgba(124,92,255,.35); }
.bm .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bm .hd b { font-size: 14px; font-weight: 900; }
.bm .rp { border: 0; background: rgba(255,255,255,.08); color: #d9d6ff; font: inherit; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.bm .tx { font-size: 16px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.bm .qt { padding: 3px 8px; border-inline-start: 3px solid var(--gold); border-radius: 6px; background: rgba(0,0,0,.28); font-size: 12px; font-weight: 700; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.replybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(167,139,250,.1); border: 1px solid rgba(167,139,250,.3); font-size: 13px; font-weight: 800; color: #ddd6fe; }
.replybar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.replybar button { border: 0; background: none; color: #ddd6fe; font-size: 18px; cursor: pointer; padding: 0 4px; }
.send { display: flex; gap: 8px; margin-top: 8px; }
.send .field { height: 48px; font-size: 17px; }
.send button { flex: none; width: 74px; height: 48px; border-radius: 14px; border: 0; background: linear-gradient(135deg, var(--g1), var(--g2)); color: #fff; font-weight: 900; font-size: 17px; }
.big { text-align: center; padding: 26px 10px; }
.big .ic { font-size: 70px; }
.big .tt { font-size: 28px; font-weight: 900; margin-top: 6px; }
.status { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--red); font-weight: 800; display: none; z-index: 9; }
.status.on { display: block; }

/* ===== طبقة «بريميوم» لشاشة اللعب: زجاج هادي، خطوط أنعم، مسافات مرتبة ===== */
body.in-game .brand { opacity: .75; margin-top: 4px; font-size: 12px; }
body.in-game .brand img { height: 24px; }
.top { padding: 8px 0; }
.me { font-size: 16px; font-weight: 700; gap: 10px; }
.me svg { width: 38px; height: 38px; box-shadow: 0 0 0 2px rgba(167,139,250,.55), 0 0 16px rgba(139,92,246,.35); }
.rolechip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px -6px rgba(0,0,0,.6); }
.phase { padding: 10px 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,.07); background: linear-gradient(135deg, rgba(139,92,246,.16), rgba(255,255,255,.02) 55%), rgba(19,17,27,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.phase b { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
.phase .t { min-width: 46px; font-size: 17px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(139,92,246,.18); border: 1px solid rgba(167,139,250,.35); color: #ede9fe; font-variant-numeric: tabular-nums; }
.sec-h h2 { font-size: 15px; font-weight: 700; color: var(--c3); }
.chatbox { gap: 6px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.07); margin-top: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.03); scrollbar-width: thin; scrollbar-color: rgba(167,139,250,.3) transparent; }
.bm { gap: 2px; padding: 7px 11px 8px; border-radius: 14px 4px 14px 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.05); }
.bm.mine { background: linear-gradient(135deg, rgba(124,58,237,.24), rgba(168,85,247,.12)); border-color: rgba(167,139,250,.28); }
.bm .hd b { font-size: 12.5px; font-weight: 700; }
.bm .tx { font-size: 15px; font-weight: 500; line-height: 1.5; }
.bm .rp { font-size: 11px; font-weight: 600; padding: 2px 9px; background: transparent; border: 1px solid rgba(255,255,255,.1); color: var(--mute); }
.send { gap: 6px; margin-top: 8px; padding: 4px; border-radius: 16px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); }
.send:focus-within { border-color: rgba(167,139,250,.55); box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
.send .field { height: 40px; font-size: 15px; font-weight: 500; border: 0; background: transparent; box-shadow: none; padding: 0 10px; }
.send button { width: 64px; height: 40px; border-radius: 12px; font-size: 14px; font-weight: 700; box-shadow: 0 4px 14px -4px rgba(139,92,246,.7); }
.res { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); font-weight: 500; }
.notices-mini .res { font-size: 13.5px !important; color: #d9d4e6; }
.note { font-size: 14px; border-radius: 14px; }
.pt { border-radius: 18px; border-width: 1px; }

/* ===== بطاقات الحالة (انتظار/دورك خلص/الصبح/النتائج/النهاية) + شاشة الانتقال بين المراحل ===== */
.stage { --sr: 167,139,250; position: relative; width: 100%; max-width: 560px; margin: 14px auto 4px; padding: 26px 16px 20px; border-radius: 24px; text-align: center; overflow: hidden;
    border: 1px solid rgba(var(--sr), .28); background: radial-gradient(120% 75% at 50% 0%, rgba(var(--sr), .22), transparent 62%), rgba(19,17,27,.78);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 22px 50px -26px rgba(var(--sr), .65); animation: stIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes stIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.stage .orb { position: relative; width: 100px; height: 100px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 46px; line-height: 1;
    background: radial-gradient(circle at 50% 38%, rgba(var(--sr), .38), rgba(var(--sr), .06) 72%); box-shadow: 0 0 44px rgba(var(--sr), .35), inset 0 0 0 1px rgba(var(--sr), .45); }
.stage .orb::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 62%, rgba(var(--sr), .95) 88%, transparent 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); animation: spin 2.4s linear infinite; }
.stage.still .orb::before { animation: none; background: rgba(var(--sr), .75); }
@keyframes spin { to { transform: rotate(360deg); } }
.stage .st-k { display: inline-block; margin-top: 16px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .3px; color: rgb(var(--sr)); background: rgba(var(--sr), .12); border: 1px solid rgba(var(--sr), .3); }
.stage .st-t { font-size: 25px; font-weight: 800; margin-top: 10px; line-height: 1.3; }
.stage .st-s { font-size: 14.5px; color: #c9c3d8; font-weight: 500; margin-top: 6px; line-height: 1.55; }
/* خطوات الليل: المافيا ← الطبيب ← المحقق ← الصبح */
.steps { display: flex; align-items: flex-start; justify-content: center; margin-top: 20px; }
.step { --c: 167,139,250; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; font-size: 11.5px; font-weight: 700; color: var(--mute); position: relative; }
.step .dot { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); transition: all .3s; }
.step.done .dot { background: rgba(var(--c), .14); border-color: rgba(var(--c), .4); }
.step.done .dot::after { content: "✓"; position: absolute; bottom: -3px; left: -3px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; background: rgb(var(--c)); }
.step.now { color: #fff; }
.step.now .dot { border-color: rgb(var(--c)); background: rgba(var(--c), .28); box-shadow: 0 0 0 4px rgba(var(--c), .14), 0 0 20px rgba(var(--c), .55); animation: dotP 1.6s ease-in-out infinite; }
@keyframes dotP { 50% { box-shadow: 0 0 0 7px rgba(var(--c), .08), 0 0 26px rgba(var(--c), .7); } }
.step .me { position: absolute; top: -9px; padding: 0 6px; border-radius: 999px; font-size: 9.5px; font-weight: 800; background: rgb(var(--c)); color: #fff; line-height: 15px; z-index: 1; }
.sline { flex: 0 1 26px; height: 2px; margin-top: 17px; border-radius: 2px; background: rgba(255,255,255,.1); }
.sline.done { background: rgba(255,255,255,.35); }
/* شريط «دورك الحين» فوق شبكة الاختيار */
.turnhead { --sr: 167,139,250; display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 16px; border: 1px solid rgba(var(--sr), .45);
    background: linear-gradient(135deg, rgba(var(--sr), .22), rgba(var(--sr), .05)); box-shadow: 0 10px 26px -16px rgba(var(--sr), .8); animation: stIn .4s ease-out both; }
.turnhead i { width: 10px; height: 10px; flex: none; border-radius: 50%; background: rgb(var(--sr)); box-shadow: 0 0 0 0 rgba(var(--sr), .6); animation: live2 1.4s ease-out infinite; }
@keyframes live2 { to { box-shadow: 0 0 0 10px rgba(var(--sr), 0); } }
.turnhead b { font-size: 15.5px; font-weight: 800; }
.turnhead small { margin-inline-start: auto; color: #d9d4e6; font-size: 12px; font-weight: 500; text-align: left; }
/* شاشة الانتقال: تطلع ثانية ونص مع كل تغيير مرحلة/دور ثم تختفي (ما تمنع اللمس) */
.flash { --sr: 167,139,250; position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; pointer-events: none; padding: 24px;
    background: radial-gradient(circle at 50% 45%, rgba(var(--sr), .3), rgba(4,3,8,.86) 68%); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    animation: flIn .25s ease-out both, flOut .4s ease-in 1.5s forwards; }
@keyframes flIn { from { opacity: 0; } } @keyframes flOut { to { opacity: 0; visibility: hidden; } }
.flash .fc { text-align: center; animation: fcIn .55s cubic-bezier(.2,.9,.25,1.25) both; }
@keyframes fcIn { from { opacity: 0; transform: scale(.85) translateY(10px); } }
.flash .fi { font-size: 66px; line-height: 1; filter: drop-shadow(0 0 26px rgba(var(--sr), .85)); }
.flash .fk { margin-top: 14px; font-size: 12.5px; font-weight: 700; letter-spacing: .4px; color: rgb(var(--sr)); }
.flash .ft { font-size: 31px; font-weight: 800; margin-top: 4px; }
.flash .fs { font-size: 15px; color: #e4dff0; font-weight: 500; margin-top: 6px; }
.flash .fbar { width: 130px; height: 3px; margin: 16px auto 0; border-radius: 3px; background: rgb(var(--sr)); transform-origin: right; animation: fbar 1.7s linear both; }
@keyframes fbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .stage, .stage .orb::before, .step.now .dot, .turnhead, .turnhead i, .flash .fc, .flash .fbar { animation: none !important; } }

/* ===== شاشات ما قبل المباراة (رقم الروم، الشخصية، الانتظار): تملى الشاشة وبالنص، وعمودين بالآيباد ===== */
body:not(.in-game) .wrap { min-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
.pre:not(.hide) { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 0 18px; animation: stIn .4s ease-out both; }
.hero { width: 100%; max-width: 460px; margin: 0 auto; text-align: center; padding: 30px 20px 22px; border-radius: 26px; border: 1px solid rgba(167,139,250,.22);
    background: radial-gradient(120% 70% at 50% 0%, rgba(139,92,246,.22), transparent 62%), rgba(19,17,27,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 60px -30px rgba(124,58,237,.7); }
.hero h1 { margin: 16px 0 6px; font-size: 27px; font-weight: 800; }
.hero p { font-size: 14.5px; font-weight: 500; line-height: 1.6; color: #c9c3d8; }
.hero .code-in { margin-top: 18px; height: 70px; font-size: 40px; border-radius: 18px; background: rgba(0,0,0,.25); }
.orb-s { width: 88px; height: 88px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 40px; background: radial-gradient(circle at 50% 38%, rgba(167,139,250,.38), rgba(167,139,250,.06) 72%); box-shadow: 0 0 40px rgba(139,92,246,.35), inset 0 0 0 1px rgba(167,139,250,.45); }
.pre-head { text-align: center; }
.pre-head h1 { margin: 6px 0 2px; font-size: 26px; font-weight: 800; }
.pre-head p { font-size: 14px; font-weight: 500; }
.cols { display: flex; flex-direction: column; gap: 0; }
.card { border-radius: 20px; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--card); }
.card-h { font-size: 14px; font-weight: 700; color: var(--c3); margin-bottom: 4px; }
.prev-card { display: grid; place-items: center; padding: 18px 14px; background: radial-gradient(70% 70% at 50% 40%, rgba(139,92,246,.2), transparent 70%), var(--card); }
.wait-card { text-align: center; padding: 22px 16px; background: radial-gradient(80% 60% at 50% 30%, rgba(251,146,60,.16), transparent 70%), var(--card); }
.wait-card .tt { font-size: 23px; font-weight: 800; margin-top: 10px; }
.wait-card p { font-size: 14.5px; font-weight: 500; }
.wait-card .wait-n { display: inline-block; align-self: center; margin-top: 10px; padding: 4px 14px; border-radius: 999px; background: rgba(139,92,246,.16); border: 1px solid rgba(167,139,250,.3); color: var(--c3); font-weight: 700; font-size: 13.5px; }
.wait-card .wait-n:empty { display: none; }
.wait-btns { display: flex; gap: 8px; }
.wait-btns .btn { font-size: 16px; height: 48px; }
.chatcol .chatbox { min-height: 140px; }
@media (min-width: 760px) {
    body:not(.in-game) .wrap { max-width: 1080px; }
    .cols { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .cols .card { margin-top: 0; }
    .col-a { display: flex; flex-direction: column; gap: 12px; }
    .col-a .btn { margin-top: 0; }
    .prev-card .preview svg { width: 190px; height: 190px; }
    #vProfile .col-b .card { padding: 18px 20px; }
    .opt-row { padding: 14px 0; }
    .sw { width: 38px; height: 38px; }
    .pill { height: 38px; font-size: 15px; }
    #vWait .cols { align-items: stretch; min-height: min(620px, calc(100dvh - 170px)); }
    .wait-card { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .wait-card .preview svg { width: 170px; height: 170px; }
    .chatcol { display: flex; flex-direction: column; }
    .chatcol .chatbox { flex: 1; max-height: none; }
}

/* ===== شاشة المباراة: رأس · محتوى تبويب واحد · تبويبات تحت (الجوال) — أو مقسومة (الآيباد) ===== */
#gameBody { overflow: clip; }   /* clip مو hidden: hidden يخليه حاوية سكرول وتنزاح الشاشة شوي يمين */
#gTrail:empty { display: none; }
.gview { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 0 12px; scrollbar-width: none; overscroll-behavior: contain; }
.gview::-webkit-scrollbar, .pview::-webkit-scrollbar, .gwrap::-webkit-scrollbar { display: none; }
.gview.fill { overflow: hidden; }
.gview > .stage { margin: 4px auto; }
.gview > .note, .gview > .role-card, .gview > .sec-h { margin-top: 0; }
.gview.chatv, .pview.chatv { padding-bottom: 0; }
.gview .chatbox, .pview .chatbox { flex: 1; max-height: none; min-height: 120px; }
.gview .send, .pview .send { margin-bottom: 8px; }
/* التبويبات */
.gtabs { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 6px 0 0; border-top: 1px solid var(--line); background: rgba(10,9,15,.94); }
.gtab { --sr: 167,139,250; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 56px; border: 0; border-radius: 14px; background: transparent; color: var(--mute); font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.gtab .ti { font-size: 21px; line-height: 1; filter: grayscale(.6); opacity: .8; }
.gtab.on { color: #fff; background: var(--card2); }
.gtab.on .ti { filter: none; opacity: 1; }
.gtab .bdg { position: absolute; top: 4px; left: calc(50% - 26px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 2px #0a090f; }
.gtab.need::before { content: ''; position: absolute; inset: 2px; border-radius: 14px; border: 1.5px solid var(--gold); animation: needP 1.4s ease-in-out infinite; }
@keyframes needP { 50% { opacity: .2; } }
.gtab.secret.on { background: rgba(var(--sr), .22); }
.gtab.locked { color: #5a5468; }
.gtab.locked .ti { filter: grayscale(1); opacity: .45; }
/* ترتيب أدوار الليل تحت المرحلة */
.trail { display: flex; gap: 4px; margin-top: 8px; }
.trail span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 28px; border-radius: 9px; font-size: 11.5px; font-weight: 600; color: var(--mute); background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.trail span.done { color: #c9c3d8; }
.trail span.now { color: #fff; background: rgba(var(--tr), .28); border-color: rgb(var(--tr)); }
.trail span.mine::after { content: 'أنت'; font-size: 9.5px; padding: 0 5px; border-radius: 6px; background: rgb(var(--tr)); color: #fff; margin-inline-start: 2px; }
/* الاختيار: تلميح + شبكة تملى المساحة + تأكيد */
.pickhint { --sr: 167,139,250; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(var(--sr), .45); background: rgba(var(--sr), .14); font-size: 13.5px; line-height: 1.55; font-weight: 500; }
.pickhint > span:first-child { font-size: 22px; flex: none; }
.gwrap { position: relative; flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
.gwrap .grid { --ts: 104px; max-height: none; margin-top: 0; overflow: visible; justify-content: center; align-content: start; gap: 8px; }
.gwrap .pt { aspect-ratio: auto; min-height: var(--ts); }
.gwrap .pt svg { width: calc(var(--ts) * .44); height: calc(var(--ts) * .44); }
.gwrap .pt b { font-size: clamp(12px, calc(var(--ts) * .12), 18px); }
.gwrap .pt.skip .pi { font-size: calc(var(--ts) * .28); }
.gwrap .pt.sel::after { content: '✓'; position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #fff; font-size: 13px; font-weight: 800; }
.confirm { --sr: 167,139,250; flex: none; }
.confirm > div { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 12px 8px; border-radius: 16px; background: var(--card2); border: 1px solid rgba(255,255,255,.12); }
.confirm > div.ok { border-color: rgba(var(--sr), .65); background: linear-gradient(135deg, rgba(var(--sr), .16), transparent), var(--card2); }
.confirm b { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbtn { flex: none; height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: rgb(var(--sr)); color: #fff; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px -6px rgba(var(--sr), .9); }
.cbtn[disabled] { opacity: .35; box-shadow: none; cursor: default; }
/* النتيجة بعد التأكيد */
.result { --sr: 167,139,250; width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px; border-radius: 22px; text-align: center; border: 1.5px solid rgb(var(--sr)); background: radial-gradient(120% 80% at 50% 0%, rgba(var(--sr), .3), transparent 70%), var(--card); animation: stIn .4s ease-out both; }
.result .k { font-size: 12.5px; font-weight: 700; color: #c9c3d8; }
.result .who { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 12px 0 10px; }
.result .who svg { width: 64px; height: 64px; border-radius: 50%; background: var(--card2); box-shadow: 0 0 0 3px rgb(var(--sr)); }
.result .who b { font-size: 19px; font-weight: 700; }
.result .sk { font-size: 44px; line-height: 64px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 999px; background: rgb(var(--sr)); color: #fff; font-size: 21px; font-weight: 800; }
.result p { margin: 12px 0 0; color: #c9c3d8; font-size: 13.5px; font-weight: 500; line-height: 1.6; }
.teamh { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; max-width: 560px; margin: 4px auto 0; }
.teamh b { font-size: 15px; font-weight: 700; }
.teamh small { font-size: 12px; color: var(--mute); }
.trow { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px; margin: 0 auto; padding: 9px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.trow svg { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--card2); }
.trow .ic { width: 36px; text-align: center; font-size: 22px; }
.trow > div { flex: 1; min-width: 0; }
.trow b { display: block; font-size: 14.5px; font-weight: 700; }
.trow small { display: block; font-size: 12.5px; color: #c9c3d8; font-weight: 500; }
.trow.dead { border-color: rgba(226,72,61,.4); background: rgba(226,72,61,.08); }
.trow.dead svg { filter: grayscale(1); }
.trow.saved { border-color: rgba(47,179,106,.4); background: rgba(47,179,106,.08); }
.rchip { --sr: 47,179,106; flex: none; height: 26px; padding: 0 10px; border-radius: 999px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; background: rgba(var(--sr), .25); color: #fff; }
.waitline { --sr: 167,139,250; display: flex; align-items: center; justify-content: center; gap: 8px; color: #c9c3d8; font-size: 13px; font-weight: 500; }
.waitline i { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--sr)); animation: needP 1.2s ease-in-out infinite; }
/* الأحداث */
.evfilter { display: flex; gap: 6px; flex-wrap: wrap; }
.evfilter button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: #c9c3d8; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.evfilter button.on { background: rgba(139,92,246,.2); border-color: var(--gold); color: #fff; }
.round-h { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: #c9c3d8; margin-top: 4px; }
.round-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.evr { padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 500; line-height: 1.55; }
.evr small { display: block; font-size: 11.5px; color: var(--c2); }
.evr.priv { border-style: dashed; border-color: rgba(167,139,250,.5); background: rgba(139,92,246,.07); }
.evr.big { border-color: rgba(226,72,61,.45); background: rgba(226,72,61,.07); }
.evr.saved { border-color: rgba(47,179,106,.5); background: rgba(47,179,106,.08); }
.evr { white-space: pre-line; }   /* «مين صوّت لمين» سطر لكل خيار */
.teamnote { display: flex; flex-direction: column; gap: 6px; }
.teamnote .trow { padding: 6px 10px; }
.nlist { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 560px; margin: 0 auto; }
.lockcard { margin: auto 0; padding: 24px 16px; border-radius: 22px; text-align: center; background: var(--card); border: 1px dashed rgba(255,255,255,.16); }
.lockcard .big { font-size: 46px; }
.lockcard h3 { margin: 8px 0 6px; font-size: 20px; font-weight: 700; }
.lockcard p { font-size: 14px; font-weight: 500; line-height: 1.65; color: #c9c3d8; }
.lockmsg { padding: 12px; text-align: center; color: var(--mute); font-size: 13px; }
.secret-h { --sr: 226,72,61; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(var(--sr), .45); background: rgba(var(--sr), .12); }
.secret-h .big { font-size: 22px; }
.secret-h > div { flex: 1; min-width: 0; }
.secret-h b { display: block; font-size: 14px; font-weight: 700; }
.secret-h small { font-size: 12px; color: #c9c3d8; }
/* ===== الآيباد: الشاشة كاملة مقسومة (عرضي: اللعب يمين واللوحة يسار · طولي: اللعب فوق واللوحة تحت) ===== */
body.in-game.tablet .wrap { max-width: none; }
body.in-game.tablet .brand { display: none; }
body.tablet .g-hdr { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
body.tablet .g-hdr .top { flex: none; padding: 0; }
body.tablet .g-hdr .phase { flex: 1; }
.split { flex: 1; min-height: 0; display: flex; gap: 14px; padding-top: 10px; }
.split > .gview { flex: 1.35 1 0; padding: 0 0 12px; }
.split > .gview:not(.fill) { justify-content: center; }
.split > .gview > * { width: 100%; max-width: 640px; margin-inline: auto; }
.split > .gview > .gwrap, .split > .gview > .confirm { max-width: none; }
.pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; margin-bottom: 8px; border-radius: 20px; background: rgba(19,17,27,.85); border: 1px solid var(--line); overflow: hidden; }
.pane-tabs { flex: none; display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
.pane-tabs .gtab { flex: 1; flex-direction: row; gap: 6px; height: 42px; font-size: 13px; padding: 0 6px; }
.pane-tabs .gtab .ti { font-size: 17px; }
.pane-tabs .gtab .bdg { position: static; margin-inline-start: 2px; box-shadow: none; }
.pview { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.pview > .lockcard { margin: auto 0; }
body.tablet:not(.portrait) .split:not(.picking) > .gview { flex: 1 1 0; }
body.tablet:not(.portrait) .split:not(.picking) > .pane { flex: 1.15 1 0; }   /* بالنقاش الشات أعرض */
body.portrait .split { flex-direction: column; }
body.portrait .split > .gview { flex: 1.3 1 0; }
body.portrait .split > .gview:not(.fill) { flex: 1 1 0; }
body.portrait .split.picking > .pane { flex: .7 1 0; }   /* وقت الاختيار البطاقات أهم */
@media (prefers-reduced-motion: reduce) { .gtab.need::before, .waitline i, .result { animation: none !important; } }

/* ===== «📺 المشهد»: مشاهد البث ملء الشاشة على الجوال ===== */
.top-r { display: flex; align-items: center; gap: 6px; }
.scenebtn { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(167,139,250,.5); background: rgba(139,92,246,.18); color: #ede9fe; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
body.watching { overflow: hidden; }
.scene-ov { position: fixed; inset: 0; z-index: 70; background: #07060b; }
.sc-stage { position: absolute; inset: 0; }
.sc-stage canvas { width: 100% !important; height: 100% !important; display: block; }
.sc-load { position: absolute; inset: 0; display: grid; place-items: center; color: #c9c3d8; font-size: 15px; font-weight: 600; text-align: center; padding: 20px; }
.sc-top { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 2; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.sc-btn { pointer-events: auto; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,9,15,.75); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.sc-cap { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(92%, 640px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s; }
.sc-cap.on { opacity: 1; }
.sc-cap b { display: block; font-size: clamp(22px, 6vw, 40px); font-weight: 800; text-shadow: 0 3px 16px rgba(0,0,0,.9), 0 0 2px #000; }
.sc-cap span { display: block; margin-top: 4px; font-size: clamp(14px, 3.6vw, 20px); font-weight: 700; color: #f1ecff; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
.sc-tip { position: absolute; top: calc(60px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(10,9,15,.75); color: #ddd6fe; font-size: 13px; font-weight: 600; pointer-events: none; white-space: nowrap; animation: flOut .5s ease-in 4s forwards; }

/* ===== «وش الجديد بالمافيا»: يطلع لكل حساب مرة وحدة (محفوظ بالخادم) ===== */
.news-bg { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(4,3,8,.78); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: flIn .25s ease-out both; }
.news { width: 100%; max-width: 440px; max-height: min(88dvh, 820px); display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; border: 1px solid rgba(167,139,250,.3);
    background: radial-gradient(120% 50% at 50% 0%, rgba(139,92,246,.22), transparent 60%), #13111b; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03) inset; animation: fcIn .45s cubic-bezier(.2,.9,.25,1.15) both; }
.news-h { padding: 20px 20px 12px; text-align: center; }
.news-h .tag { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #ddd6fe; background: rgba(139,92,246,.2); border: 1px solid rgba(167,139,250,.35); }
.news-h h2 { margin: 10px 0 4px; font-size: 24px; font-weight: 800; }
.news-h p { font-size: 13.5px; font-weight: 500; color: #c9c3d8; }
.news-b { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 6px; display: flex; flex-direction: column; gap: 8px; }
.nw { --c: 167,139,250; display: flex; gap: 12px; align-items: center; padding: 11px 13px; border-radius: 18px; border: 1px solid rgba(var(--c), .28); background: linear-gradient(135deg, rgba(var(--c), .12), rgba(255,255,255,.015) 60%); }
.nw .ni { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; background: rgba(var(--c), .18); border: 1px solid rgba(var(--c), .35); }
.nw .nt { font-size: 15.5px; font-weight: 800; margin-bottom: 3px; }
.nw p b { color: #fff; font-weight: 800; }
.nw p { margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.65; color: #d9d4e6; }
.news-f { padding: 10px 16px 16px; }
.news-f .btn { margin-top: 0; }
</style>
</head>
<body>
<div class="wrap">
    <div class="brand"><img src="../../logo.png" alt="ألعاب أيمن" onerror="this.style.display='none'"><span>🔪 المافيا</span></div>

    <!-- 1) رقم الروم -->
    <section id="vCode" class="hide pre">
        <div class="hero">
            <div class="orb-s">🔪</div>
            <h1>ادخل رقم الروم</h1>
            <p>رقم الغرفة ظاهر على شاشة البث جنب الباركود. اللعب بحساب الموقع — لو ما عندك حساب بنطلب منك تنشئ واحد بالخطوة الجاية.</p>
            <input class="field code-in" id="codeIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" aria-label="رقم الروم">
            <button class="btn" id="codeGo" type="button">التالي</button>
            <div class="err" id="codeErr"></div>
        </div>
    </section>

    <!-- 2) الاسم والشخصية -->
    <section id="vProfile" class="hide pre">
        <div class="pre-head"><h1>جهّز شخصيتك</h1><p id="roomInfo"></p></div>
        <!-- بالآيباد عمودين: الشخصية والحساب وزر الدخول يمين، والمحرر يسار — بالجوال تحت بعض -->
        <div class="cols">
            <div class="col-a">
                <div class="card prev-card"><div class="preview" id="preview"></div></div>
                <!-- الدخول بحساب الموقع إلزامي: الاسم والصورة والإطار من الحساب نفسه -->
                <div class="card acct" id="acct"></div>
                <button class="btn" id="joinGo" type="button">ادخل الساحة</button>
                <div class="err" id="joinErr"></div>
            </div>
            <div class="col-b"><div class="card"><div class="card-h">🎨 شكل شخصيتك</div><div id="editor"></div></div></div>
        </div>
    </section>

    <!-- 3) انتظار البداية -->
    <section id="vWait" class="hide pre">
        <div class="cols">
            <div class="col-a">
                <div class="card wait-card"><div class="preview" id="waitAv"></div><div class="tt">أنت جالس حول النار 🔥</div><p>شوف شخصيتك على البث! بانتظار المذيع يبدأ اللعبة…</p><p class="wait-n" id="waitCount"></p></div>
                <div class="wait-btns"><button class="btn ghost" id="editLook" type="button">🎨 غيّر شكلك</button><button class="btn ghost" id="leaveBtn" type="button">🚪 اطلع من الروم</button></div>
            </div>
            <div class="col-b chatcol">
                <div class="chead"><span>شات الانتظار</span><small>سلّم على اللي معك</small></div>
                <div class="chatbox" id="lobbyChat"></div>
                <div class="send"><input class="field" id="lobbyIn" maxlength="140" placeholder="اكتب…" autocomplete="off"><button type="button" id="lobbySend">إرسال</button></div>
            </div>
        </div>
    </section>

    <!-- 4) المباراة -->
    <section id="vGame" class="hide">
        <div class="g-hdr"><div class="top"><div class="me" id="meBox"></div><div class="top-r"><button class="scenebtn" id="sceneBtn" type="button" title="شوف مشاهد البث هنا">📺 المشهد</button><button class="rolechip" id="roleChip" type="button"></button></div></div>
        <div class="phase"><b id="phaseTxt"></b><span class="t" id="phaseT"></span></div></div>
        <div id="gTrail"></div>
        <div id="gameBody"></div>
    </section>
</div>
<div class="status" id="status">جاري الاتصال…</div>

<script>
(function () {
    'use strict';
    var L = window.MafiaLooks, NET = window.MafiaNet, ROLE = L.ROLE;
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
    var params = new URLSearchParams(location.search);
    var S = { code: params.get('room') || '', me: NET.me(), room: null, G: null, look: NET.look() || L.randomLook(), view: '', hideRole: false, draft: '' };
    if (S.me && S.code && S.me.room !== S.code) S.me = null;

    function show(v) { S.view = v; document.body.classList.toggle('in-game', v === 'vGame'); ['vCode', 'vProfile', 'vWait', 'vGame'].forEach(function (id) { $(id).classList.toggle('hide', id !== v); }); }

    var net = NET.connect(onMsg, function () {
        if (S.me && (S.me.room === S.code || !S.code)) { S.code = S.me.room; net.send({ t: 'resume', code: S.me.room, id: S.me.id, key: S.me.key }); }
        else if (S.code) net.send({ t: 'peek', code: S.code });
        else show('vCode');
    }, function (ok) { $('status').classList.toggle('on', !ok); });

    function onMsg(m) {
        if (m.t === 'peek') {
            if (!m.ok) { show('vCode'); $('codeErr').textContent = m.err; return; }
            S.room = m.room; if (S.view !== 'vProfile') openProfile();
            renderRoomInfo();
        } else if (m.t === 'welcome') {
            S.me = { room: m.code, id: m.id, key: m.key }; NET.me(S.me);
            S.news = !!m.news && !newsSeenLocal();
            if (S.news === false && m.news && newsSeenLocal()) net.send({ t: 'news-seen' });   // قفله قبل وانقطع الاتصال: نبلّغ الخادم الحين
            if (!S.G) show('vWait');
            maybeNews();
        } else if (m.t === 'room') {
            S.room = m.room; renderRoomInfo();
            if (S.me && !m.room.started && S.view !== 'vProfile') { S.G = null; show('vWait'); renderWait(); maybeNews(); }
        } else if (m.t === 'state') {
            S.G = m.G; if (S.view !== 'vGame') show('vGame'); renderGame(); maybeNews();
        } else if (m.t === 'lobby') {
            closeScene(); S.G = null; show('vWait'); renderWait();
        } else if (m.t === 'err') {
            if (m.step === 'code') { show('vCode'); $('codeErr').textContent = m.err; }
            else if (m.step === 'auth') { $('joinErr').innerHTML = esc(m.err) + ' — <a href="' + loginUrl() + '" style="color:var(--gold)">سجّل دخول</a>'; }
            else $('joinErr').textContent = m.err;
        } else if (m.t === 'gone' || m.t === 'kicked' || m.t === 'closed') {
            closeScene(); NET.me(null); S.me = null; S.G = null;
            show('vCode'); $('codeErr').textContent = m.t === 'kicked' || m.reason === 'kicked' ? 'المذيع طلّعك من الروم' : 'الروم انقفل';
        }
    }


    // ---------------------------------------------------------------- «وش الجديد بالمافيا» (مرة وحدة لكل حساب)
    // الخادم يقول بالترحيب (news) إذا الحساب ما شافه؛ لما يقفله نرسل news-seen ونحفظه بالجهاز بعد (احتياط لو انقطع الاتصال).
    // إعلان جديد مستقبلاً = غيّر NEWS_KEY هنا وبـbackend/mafia/mafia-server.js
    var NEWS_KEY = 'mafia-news-2026-11', NEWS_LS = 'mafia-news-seen:' + NEWS_KEY;
    function newsSeenLocal() { try { return localStorage.getItem(NEWS_LS) === '1'; } catch (e) { return false; } }
    // شاشة وحدة مختصرة: سطر لكل تغيير
    var NEWS = [
        { c: '167,139,250', i: '🎯', t: 'كل ليلة: شخص أو شخصين', d: 'لو فريقك اتفق يختار <b>شخص واحد</b>، ولو اختلفوا يختارون <b>شخصين</b>. الشخص الثالث ممنوع.' },
        { c: '226,72,61', i: '🔪', t: 'المافيا', d: 'لو المافيا أكثر من واحد واختلفوا، يقتلون <b>شخصين</b> بنفس الليلة.' },
        { c: '47,179,106', i: '🩺', t: 'الأطباء', d: 'يقدرون يحمون <b>شخصين بالكثير</b> كل ليلة.' },
        { c: '62,142,240', i: '🕵️', t: 'المحققين', d: 'يقدرون يفحصون <b>شخصين بالكثير</b> كل ليلة، وكل محقق تجيه نتيجته.' },
        { c: '242,182,50', i: '🔒', t: 'الشات السري', d: 'للمافيا والأطباء والمحققين <b>بس</b> (كل فريق لحاله)، ويشتغل حتى بالليل. المواطنين ما عندهم شات سري.' }
    ];
    function newsHtml() {
        return '<div class="news" role="dialog" aria-modal="true" aria-labelledby="newsT"><div class="news-h"><span class="tag">🆕 جديد</span><h2 id="newsT">وش الجديد بالمافيا؟</h2></div>' +
            '<div class="news-b">' + NEWS.map(function (it) {
                return '<div class="nw" style="--c:' + it.c + '"><div class="ni">' + it.i + '</div><div><div class="nt">' + it.t + '</div><p>' + it.d + '</p></div></div>';
            }).join('') + '</div>' +
            '<div class="news-f"><button type="button" class="btn" id="newsOk">فهمت ✓</button></div></div>';
    }
    // يطلع بس بلحظة هادية: الانتظار، أو بالمباراة وقت النقاش/الفجر/النتائج/النهاية (مو وسط دورك بالليل أو التصويت)
    function maybeNews() {
        if (!S.news || newsSeenLocal() || document.getElementById('newsBg')) return;
        var ph = S.G && S.G.phase, calm = S.view === 'vWait' || (S.view === 'vGame' && ['day', 'dawn', 'verdict', 'over'].indexOf(ph) >= 0);
        if (!calm) return;
        var bg = document.createElement('div'); bg.className = 'news-bg'; bg.id = 'newsBg'; bg.innerHTML = newsHtml();
        document.body.appendChild(bg);
        bg.addEventListener('click', function (e) { if (e.target.id === 'newsOk') closeNews(); });
    }
    function closeNews() {
        S.news = false;
        try { localStorage.setItem(NEWS_LS, '1'); } catch (e) { }
        net.send({ t: 'news-seen' });
        var bg = document.getElementById('newsBg'); if (bg) bg.remove();
    }

    // ---------------------------------------------------------------- رقم الروم
    $('codeGo').onclick = function () {
        var c = $('codeIn').value.replace(/\D/g, '');
        if (c.length !== 4) { $('codeErr').textContent = 'الرقم من 4 خانات'; return; }
        S.code = c; $('codeErr').textContent = ''; net.send({ t: 'peek', code: c });
    };
    $('codeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('codeGo').click(); });

    // ---------------------------------------------------------------- الشخصية
    function renderRoomInfo() {
        if (!S.room) return;
        $('roomInfo').textContent = 'روم ' + S.room.code + ' · ' + S.room.players.length + ' لاعب داخل';
        if (S.view === 'vWait') renderWait();
    }
    function loginUrl() { return '../../login.html?next=' + encodeURIComponent('games/mafia/join.html?room=' + S.code); }

        var box = $('chatbox'); if (box) box.scrollTop = box.scrollHeight;
        lastChatHtml = chatMsgs(G) || '<div class="cm sys">💬</div>'; lastPrivHtml = privMsgs(G); lastHeads = '';
        var ci = $('chatIn'); if (ci) ci.value = S.draft;
        var pi = $('privIn'); if (pi) pi.value = S.pdraft;
        var pb = $('privbox'); if (pb) pb.scrollTop = pb.scrollHeight;
        var fe = focusId && $(focusId); if (fe && fe.tagName === 'INPUT') { fe.focus(); var sp = Math.min(caret, fe.value.length); fe.setSelectionRange(sp, sp); }
    }
    // ================================================================ «📺 المشهد»: مشاهد البث على جوال اللاعب
    // نفس المشهد الثلاثي الأبعاد اللي على شاشة البث، يتحمّل بس لما يضغط الزر ويوقف وينمسح من الذاكرة لما يقفله.
    // يشتغل من نفس اتصال اللاعب (الحالة اللي توصله أصلاً) — بدون أي اتصال أو بيانات زيادة من السيرفر،
    // وبالوضع الخفيف (بدون ظلال وتوهّج)، وبالأسماء بدون صور، والصوت مطفي لين يشغّله.
    // قبل ما نعطيه للمشهد ننظّف الحالة لنفس اللي تشوفه شاشة البث: بدون دور اللاعب وأدوار زملاءه، والشات العام بس
    var sceneCache = { src: null, out: null };
    function sceneG(G) {
        if (!G) return null;
        if (sceneCache.src === G) return sceneCache.out;
        var over = G.phase === 'over', st = G.settings || {}, me = G.me || {};
        var out = Object.assign({}, G);
        out.players = G.players.map(function (p) {
            var o = Object.assign({}, p); delete o.mate;
            if (!over && (p.id === me.id || p.mate || (me.team === 'mafia' && p.team === 'mafia'))) {
                if (p.alive) { o.role = null; o.team = null; }
                else if (!(st.fullReveal && p.cause !== 'left')) { o.role = null; o.team = p.cause === 'vote' ? p.team : null; }
            }
            return o;
        });
        out.chat = G.chat.filter(function (m) { return m.sys || m.ch === 'city'; });
        delete out.me; if (!over) out.cards = null;
        sceneCache = { src: G, out: out };
        return out;
    }
    // عناوين المشهد (نفس نصوص شاشة البث وتوقيتاتها)
    function sceneCaption(G, info, now) {
        if (!G) return ['', ''];
        var nm = function (id) { return pname(G, id); }, ph = G.phase, sh = info && info.s, u = info ? info.u : 0;
        if (ph === 'reveal') return ['توزيع الأدوار', 'كل لاعب يشوف دوره على جواله'];
        if (ph === 'night') return [{ mafia: '🔪 دور المافيا', doctor: '🩺 دور الطبيب', detective: '🕵️ دور المحقق' }[G.turn] || '🌙 الليل', 'الكل نايم… والمختارين يختارون من جوالاتهم'];
        if (ph === 'dawn' && sh) {
            if (sh.k === 'intro') return ['الليلة ' + G.round, 'المواطنين نايمين… والمافيا صاحية'];
            if (sh.k === 'inspect') return ['🕵️ غرفة التحقيق', 'المحقق يستجوب مشتبهاً… والنتيجة وصلت لجواله بس'];
            if (sh.k === 'attack') {
                var two = !!sh.target2, names = nm(sh.target) + (two ? ' و' + nm(sh.target2) : '');
                if (u < 3200) return ['🌙 السوق بالليل…', two ? 'اثنين يمشون بين الدكاكين' : 'أحد يمشي لحاله بين الدكاكين'];
                if (u < 6000) return [two ? '👁️ في اثنين يراقبون من الظلام…' : '👁️ في أحد يراقب من الظلام…', ''];
                if (u < 6650) return ['انتبه وراك!', ''];
                if (u < 8200) return ['هجوم على ' + names + '!', ''];
                return [two ? 'المافيا هربوا في الظلام…' : 'المافيا هرب في الظلام…', names + (two ? ' طايحين' : ' طايح') + ' بالسوق'];
            }
            if (sh.k === 'save') { var rs = sh.rescue || [sh.target]; return [rs.length > 1 ? '🩺 الطبيبين وصلوا!' : '🩺 الطبيب وصل!', 'أنقذ ' + rs.map(nm).join(' و') + ' في آخر لحظة']; }
            if (sh.k === 'quiet') return ['ليلة هادية', 'المافيا ما اختارت أحد…'];
            if (sh.k === 'heal') return ['🩺 الطبيب في العيادة', 'يعالج شخص اختاره يحميه الليلة… ومين هو؟ سر'];
            if (sh.k === 'noheal') return ['🩺 الطبيب ما اختار أحد', 'ما فيه حماية الليلة'];
            if (sh.k === 'result') { var vl = sh.victims || (sh.victim ? [sh.victim] : []); return vl.length ? ['صباح حزين ☀️', vl.map(nm).join(' و') + (vl.length > 1 ? ' ما نجوا من الليلة' : ' ما نجا من الليلة')] : ['طلع الصبح ☀️', sh.recruited ? '🤝 بس المافيا جنّدت مواطن!' : sh.saved ? 'الكل بخير بفضل الطبيب' : 'ما مات أحد الليلة']; }
        }
        if (ph === 'dawn') return ['🎬 مشاهد الليلة', ''];
        if (ph === 'day') return ['النقاش: مين المافيا؟', 'اكتبوا بالشات العام من تبويب الشات'];
        if (ph === 'vote') return ['التصويت: مين يطلع؟', G.players.filter(function (p) { return p.alive && G.votes[p.id]; }).length + ' صوّتوا من ' + G.players.filter(function (p) { return p.alive; }).length];
        if (ph === 'verdict') {
            var V = G.verdict || {}, uu = now - G.phaseAt;
            if (V.id) return ['المواطنين قرروا طرد ' + nm(V.id), uu > 4200 ? (V.team === 'mafia' ? 'كان من المافيا 🔪' : 'كان مواطن 🏠') : 'القفص نازل…'];
            return [V.skip ? 'الأغلبية اختارت التخطي ⏭️' : V.tie ? 'تعادل بالأصوات' : 'ما أحد طلع', 'ما أحد طلع هالمرة'];
        }
        if (ph === 'over') return [G.winner === 'mafia' ? '🔪 فازت المافيا!' : '🏠 فاز المواطنين!', ''];
        return ['', ''];
    }
    S.scene = null;
    function openScene() {
        if ($('sceneOv') || !S.G) return;
        var ov = document.createElement('div'); ov.className = 'scene-ov'; ov.id = 'sceneOv';
        ov.innerHTML = '<div class="sc-stage" id="sceneStage"><div class="sc-load" id="scLoad">⏳ جاري تحميل المشهد…</div></div>' +
            '<div class="sc-top"><button type="button" class="sc-btn" id="scClose">✕ رجوع للعب</button><button type="button" class="sc-btn" id="scSnd" aria-label="الصوت">🔇 الصوت</button></div>' +
            '<div class="sc-cap" id="scCap"><b></b><span></span></div>' + (innerHeight > innerWidth ? '<div class="sc-tip">📱 لف جوالك بالعرض لمشهد أكبر</div>' : '');
        document.body.appendChild(ov); document.body.classList.add('watching');
        var frame = function () { return { G: sceneG(S.G), room: S.room, now: NET.now() }; };
        import('./mafia-scene.js').then(function (m) {
            if (!$('sceneOv')) return;
            var l = $('scLoad'); if (l) l.remove();
            S.scene = m.createStage($('sceneStage'), frame, {
                lite: true, photoOf: function () { return null; },
                onCue: function (k, d) { if (S.sceneSnd && window.MafiaSFX) window.MafiaSFX.cue(k, d); },
                onAmbience: function (md) { if (window.MafiaSFX) window.MafiaSFX.ambience(S.sceneSnd ? md : null); }
            });
            (function loop() {
                if (!S.scene || !$('sceneOv')) return;
                var c = sceneCaption(S.G, S.scene.shotInfo(), NET.now()), cap = $('scCap');
                if (cap.dataset.k !== c[0] + c[1]) { cap.dataset.k = c[0] + c[1]; cap.querySelector('b').textContent = c[0]; cap.querySelector('span').textContent = c[1]; cap.classList.toggle('on', !!c[0]); }
                requestAnimationFrame(loop);
            })();
        }).catch(function () { var l = $('scLoad'); if (l) l.textContent = 'ما قدرنا نحمّل المشهد — تأكد من النت وجرّب مرة ثانية'; });
    }
    function closeScene() {
        var ov = $('sceneOv'); if (!ov) return;
        if (S.scene) { try { S.scene.dispose(); } catch (e) { } S.scene = null; }
        if (window.MafiaSFX) window.MafiaSFX.ambience(null);
        ov.remove(); document.body.classList.remove('watching');
    }
    // الصوت: ملف المؤثرات يتحمّل أول مرة يشغّله بس
    function toggleSceneSound(btn) {
        S.sceneSnd = !S.sceneSnd;
        btn.textContent = S.sceneSnd ? '🔊 الصوت' : '🔇 الصوت';
        if (!S.sceneSnd) { if (window.MafiaSFX) window.MafiaSFX.ambience(null); return; }
        var go = function () { window.MafiaSFX.setMuted(false); window.MafiaSFX.unlock(); };
        if (window.MafiaSFX) return go();
        var sc = document.createElement('script'); sc.src = 'mafia-sfx.js'; sc.onload = go; document.head.appendChild(sc);
    }
    document.addEventListener('click', function (e) {
        if (e.target.closest('[data-scene]') || e.target.id === 'sceneBtn') return openScene();
        if (e.target.id === 'scClose') return closeScene();
        if (e.target.id === 'scSnd') return toggleSceneSound(e.target);
    });

    // تحديث الرسائل بس: يحافظ على مكان القراءة (إلا لو كان تحت أصلاً) وما يلمس خانة الكتابة
    var lastChatHtml = '', lastPrivHtml = '', lastHeads = '';
    function patchChat(G) {
        var stick = function (box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; };
        var box = $('chatbox');
        if (box) { var h = chatMsgs(G) || '<div class="cm sys">💬</div>'; if (h !== lastChatHtml) { var st = stick(box); box.innerHTML = h; lastChatHtml = h; if (st) box.scrollTop = box.scrollHeight; } }
        var pb = $('privbox');
        if (pb) { var ph = privMsgs(G); if (ph !== lastPrivHtml) { var st2 = stick(pb); pb.innerHTML = ph; lastPrivHtml = ph; if (st2) pb.scrollTop = pb.scrollHeight; } }
        var hb = document.querySelector('#gameBody .teambar .pbtns'), chans = privChans(G);
        if (hb && chans.length) { var hh = privHeads(G, chans); if (hh !== lastHeads) { hb.innerHTML = hh; lastHeads = hh; } }
    }


    $('gameBody').addEventListener('click', function (e) {
        var gt = e.target.closest('[data-gtab]');
        if (gt) { var k = gt.getAttribute('data-gtab'); if (S.tablet) { if (k !== 'play') S.pane = k; } else S.gtab = k; return renderGame(); }
        if (e.target.closest('[data-confirm]')) { act('confirm', null); if (navigator.vibrate) navigator.vibrate([30, 40, 30]); return; }
        var ef = e.target.closest('[data-evf]'); if (ef) { S.evf = ef.getAttribute('data-evf'); return renderGame(); }
        var ps = e.target.closest('[data-privsel]'); if (ps) { S.privOpen = ps.getAttribute('data-privsel'); return renderGame(); }
        var b = e.target.closest('[data-act]');
        if (b) { act(b.getAttribute('data-act'), b.getAttribute('data-id')); if (navigator.vibrate) navigator.vibrate(20); if (b.getAttribute('data-act') === 'card' && S.cardSel) { S.cardSel = null; renderGame(); } return; }
        var m = e.target.closest('[data-opmode]'); if (m) { S.opMode = m.getAttribute('data-opmode'); return renderGame(); }
        var c = e.target.closest('[data-cardsel]'); if (c) { var id = c.getAttribute('data-cardsel'); S.cardSel = S.cardSel === id ? null : id; return renderGame(); }
        if (e.target.closest('[data-cardhelp]')) { S.cardHelp = !S.cardHelp; return renderGame(); }
        if (e.target.hasAttribute('data-cardclose') || e.target.closest('.pick-h [data-cardclose]')) { S.cardSel = null; return renderGame(); }
        var ch = e.target.closest('[data-chan]'); if (ch) { S.chan = ch.getAttribute('data-chan'); return renderGame(); }
        var rp = e.target.closest('[data-reply]');
        if (rp) {
            var parts = rp.getAttribute('data-reply').split(':'); S.reply[parts[0]] = +parts[1]; renderGame();
            var inp = $(S.privOpen === parts[0] ? 'privIn' : 'chatIn'); if (inp) inp.focus();
            return;
        }
        var ur = e.target.closest('[data-unreply]'); if (ur) { delete S.reply[ur.getAttribute('data-unreply')]; return renderGame(); }
        if (e.target.id === 'chatSend') sendChat();
        if (e.target.id === 'privSend') sendPriv();
        var pt = e.target.closest('[data-priv-toggle]'); if (pt) { var pc = pt.getAttribute('data-priv-toggle'); S.privOpen = S.privOpen === pc ? '' : pc; S.privAuto = false; lastRenderKey = ''; renderGame(); }
    });
    $('gameBody').addEventListener('keydown', function (e) { if (e.key !== 'Enter') return; if (e.target.id === 'chatIn') sendChat(); if (e.target.id === 'privIn') sendPriv(); });
    $('gameBody').addEventListener('input', function (e) { if (e.target.id === 'pf') { S.filter = e.target.value; renderGame(); } });
    function sendPriv() { var i = $('privIn'), ch = S.privOpen; if (!i || !ch) return; var t = i.value.trim(); if (!t) return; act('chat', ch + (S.reply[ch] ? '#' + S.reply[ch] : '') + '|' + t); delete S.reply[ch]; i.value = ''; S.pdraft = ''; renderGame(); var f = $('privIn'); if (f) f.focus(); }
    function sendChat() { var i = $('chatIn'); if (!i) return; var t = i.value.trim(); if (!t) return; act('chat', S.chan + (S.reply[S.chan] ? '#' + S.reply[S.chan] : '') + '|' + t); delete S.reply[S.chan]; i.value = ''; S.draft = ''; renderGame(); var f = $('chatIn'); if (f) f.focus(); }

    // المؤقت
    setInterval(function () {
        var G = S.G; if (!G || S.view !== 'vGame') return;
        var names = { reveal: 'كشف الأدوار', night: '🌙 الليل', dawn: '🎬 مشاهد الليلة', day: '☀️ النقاش', vote: '🗳️ التصويت', verdict: '⚖️ النتائج', over: '🏁 النهاية' };
        $('phaseTxt').textContent = names[G.phase] + (G.phase === 'night' && G.turn ? ' · دور ' + ({ mafia: 'المافيا', doctor: 'الطبيب', detective: 'المحقق' })[G.turn] : G.round ? ' · ' + G.round : '');
        var left = G.endsAt ? Math.max(0, Math.ceil((G.endsAt - NET.now()) / 1000)) : 0;
        $('phaseT').textContent = G.endsAt && G.phase !== 'dawn' && G.phase !== 'verdict' ? left : '';
    }, 250);

    if (!S.code && !S.me) show('vCode');
    if (S.code) $('codeIn').value = S.code;
})();
</script>
