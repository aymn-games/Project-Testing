<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المافيا — لوبي الدخول</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../../auth/auth-client.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<link rel="stylesheet" href="mafia-host.css">
<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-player-card.js"></script>
<script src="mafia-net.js"></script>
<script src="mafia-host.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* كرت اللاعبين: نفس كرت الفريق بلوبي روليت الإقصاء */
.team { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 26px; background: var(--card); backdrop-filter: blur(14px); border: 1.5px solid var(--c-bd2); box-shadow: 0 20px 60px rgba(0,0,0,.3), 0 0 50px var(--c-halo); overflow: hidden; position: relative; }
.team .halo { position: absolute; top: -100px; left: 50%; width: 460px; height: 200px; margin-left: -230px; border-radius: 50%; background: var(--c-halo); filter: blur(44px); pointer-events: none; }
.team-h { position: relative; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: clamp(14px,1.8vw,22px) clamp(18px,2.2vw,28px); border-bottom: 1px solid var(--line2); }
.team-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.team-name { display: flex; align-items: center; gap: 10px; min-width: 0; font: 700 clamp(18px,1.7vw,22px) 'IBM Plex Sans Arabic', sans-serif; color: var(--c); }
.team-name i { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
.count { flex-shrink: 0; display: flex; align-items: baseline; gap: 4px; padding: 6px 14px; border-radius: 999px; background: var(--c-soft); border: 1px solid var(--c-bd); }
.count b { font: 700 20px 'IBM Plex Sans Arabic', sans-serif; color: var(--c); font-variant-numeric: tabular-nums; }
.count span { font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: var(--sub2); }
.join { display: grid; grid-template-columns: auto 1fr; gap: clamp(14px,1.8vw,22px); align-items: center; }
.qr { width: clamp(108px,10.5vw,148px); aspect-ratio: 1; padding: 9px; border-radius: 18px; background: #fff; box-shadow: 0 0 0 1.5px var(--c-bd2), 0 10px 30px rgba(0,0,0,.4); }
.qr img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.jinfo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.jlbl { font: 500 13px 'IBM Plex Sans Arabic', sans-serif; color: var(--sub); }
.code { text-align: center; padding: 6px 22px; border-radius: 999px; background: var(--c-soft); border: 1.5px dashed var(--c); font: 700 clamp(26px,2.9vw,38px)/1.2 'IBM Plex Sans Arabic', sans-serif; color: var(--c); letter-spacing: 12px; direction: ltr; font-variant-numeric: tabular-nums; }
.steps li { font-size: 13px; line-height: 1.5; }

/* شبكة البطاقات: 5 أعمدة (2 بالشاشة الضيقة)، صف 54px — 78px لو فيه بطاقة بإطار */
.players { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: clamp(12px,1.6vw,20px); }
.empty { height: 100%; min-height: 140px; display: grid; place-items: center; border-radius: 18px; border: 1.5px dashed rgba(255,255,255,.1); color: var(--sub); font: 500 14px 'IBM Plex Sans Arabic', sans-serif; text-align: center; padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); grid-auto-rows: 54px; align-items: center; gap: 10px; }
.cards.framed { grid-auto-rows: 78px; gap: 6px 10px; }
.cell { position: relative; min-width: 0; height: 100%; display: flex; align-items: center; animation: rise .4s cubic-bezier(.2,1.3,.4,1) both; transition: opacity .3s; }
.cell.off { opacity: .45; }
.plain { width: 100%; min-width: 0; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 7px; border-radius: 999px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); }
.av { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; position: relative; overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, #a78bfa, #a78bfa66); border: 1.5px solid var(--c); font: 700 16px 'IBM Plex Sans Arabic', sans-serif; color: #fff; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pname { flex: 1; min-width: 0; font: 600 14px 'IBM Plex Sans Arabic', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.x { width: 30px; height: 30px; flex-shrink: 0; border: none; background: transparent; padding: 0; color: #fca5a5; cursor: pointer; display: grid; place-items: center; opacity: .75; transition: opacity .2s, transform .2s; }
.x:hover { opacity: 1; transform: scale(1.15); }
.framebox { position: relative; width: 100%; min-width: 0; display: flex; align-items: center; }
.framebox .x { position: absolute; z-index: 10; width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.9)); }
@media (max-width: 820px) { .cards { grid-template-columns: repeat(2, minmax(0,1fr)); } .join { grid-template-columns: 1fr; justify-items: center; } .jinfo { width: 100%; } }
</style>
</head>
<body>
<div class="fx" aria-hidden="true"></div>
<header class="hdr">
    <div class="side"><button class="hbtn exit" id="exitBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span class="lbl-txt">خروج</span></button></div>
    <div class="logo"><img src="../../logo.png" alt="" onerror="this.style.display='none'"></div>
    <div class="side end"><a class="hbtn" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg><span class="lbl-txt">الإعدادات</span></a></div>
</header>

<main class="main">
    <div class="wrap">
        <div class="titlebox tight">
            <span class="kicker">المافيا</span>
            <span class="title">لوبي الدخول</span>
        </div>

        <section class="team">
            <span class="halo"></span>
            <div class="team-h">
                <div class="team-top">
                    <span class="team-name"><i></i>اللاعبين</span>
                    <div class="chips" id="roles"></div>
                    <span class="count"><b id="cnt">0</b><span id="cntMax">/ 200 لاعب</span></span>
                </div>
                <div class="join">
                    <div class="qr"><img id="qrImg" alt="باركود الدخول للمباراة"></div>
                    <div class="jinfo">
                        <span class="jlbl">رقم الروم</span>
                        <span class="code" id="code">----</span>
                        <div id="steps"></div>
                    </div>
                </div>
            </div>
            <div class="players noscroll">
                <div class="empty" id="empty">بانتظار انضمام اللاعبين…</div>
                <div class="cards" id="cards"></div>
            </div>
        </section>

        <div class="footer">
            <button class="cta" id="startBtn" type="button" disabled><span id="startTxt">ابدأ المباراة</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        </div>
    </div>
</main>

<div class="ov" id="exitOv">
    <div class="dlg">
        <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
        <b>الخروج؟</b>
        <p>بترجع لمكتبة الألعاب والغرفة بتنقفل</p>
        <div class="two"><button class="btn-ghost" type="button" data-close>إلغاء</button><button class="btn-red" type="button" id="exitYes">خروج</button></div>
    </div>
</div>
<div class="toast hide" id="toast" role="status"></div>

<script>
(function () {
    'use strict';
    var NET = window.MafiaNet, AGP = window.AymanGamesPlatform;
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
    var S = { code: '', room: null };
    var X_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';

    var net = NET.connect(function (m) {
        if (m.t === 'welcome') {
            S.code = m.code; NET.hostSession({ code: m.code, token: m.token });
            $('code').textContent = m.code; makeQr();
        } else if (m.t === 'room') {
            S.room = m.room;
            if (m.room.started) return location.replace('game.html');   // بدأت المباراة ← شاشة المباراة
            render();
        } else if (m.t === 'err') toast(m.err);
        else if (m.t === 'gone') toast('اللعبة انفتحت بمكان ثاني');
    }, function () {
        // إنشاء الغرفة (أو الرجوع لها) بإعدادات شاشة الإعدادات
        var h = NET.hostSession() || {};
        net.send({ t: 'host', code: h.code, token: h.token, settings: NET.setup() || undefined });
    }, function (ok) { if (!ok) toast('جاري الاتصال بالخادم…'); });

    function siteJoin() { return new URL('join.html', location.href).href; }
    function makeQr() {
        if (!window.qrcode) { setTimeout(makeQr, 200); return; }
        var q = qrcode(0, 'M'); q.addData(siteJoin() + '?room=' + S.code); q.make();
        $('qrImg').src = q.createDataURL(8, 0);
        $('steps').innerHTML = window.MafiaHost.joinStepsHtml(siteJoin().replace(/^https?:\/\//, ''), S.code);
    }

    // ---- بطاقات اللاعبين (نفس لوبي روليت الإقصاء) ----
    // بدون إطار: كبسولة 54px بالصورة والاسم و×. بإطار: بطاقة المنصة (AGP.playerCard) بحجم من عرض الخانة
    // (نفس ER.frameCard: الحجم = العرض ÷ 4.96، وخط الاسم من ارتفاع اللوح، و× داخل طرف اللوح).
    var FRAME_W_RATIO = 4.96, X_SIZE = 24, cells = {};
    function initial(n) { return ([].slice.call(String(n || '')).find(function (ch) { return /[^\s_\d]/.test(ch); })) || ''; }
    function plainHtml(p) {
        return '<div class="plain"><span class="av">' + esc(initial(p.name)) + (p.avatar ? '<img src="' + esc(p.avatar) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + '</span>' +
            '<span class="pname" title="' + esc(p.name) + '">' + esc(p.name) + '</span>' +
            '<button class="x" type="button" data-kick="' + p.id + '" aria-label="إقصاء ' + esc(p.name) + '">' + X_SVG + '</button></div>';
    }
    function drawFramed(cell, p) {
        var w = Math.floor(cell.clientWidth); if (!w) return;
        cell.dataset.w = w;
        cell.innerHTML = '<div class="framebox">' + AGP.playerCard.renderHtml(
            { id: p.id, name: p.name, avatarUrl: p.avatar || null, frame: p.frame },
            { showFrame: true, basePath: '../../', size: Math.max(20, Math.floor(w / FRAME_W_RATIO)) }) +
            '<button class="x" type="button" data-kick="' + p.id + '" aria-label="إقصاء ' + esc(p.name) + '">' + X_SVG + '</button></div>';
        var box = cell.firstChild, plates = box.querySelectorAll('[data-agp-pcard-name="1"]');
        for (var i = 0; i < plates.length; i++) {
            var ph = plates[i].clientHeight;
            if (ph) { plates[i].style.fontSize = Math.max(9, Math.min(14, Math.round(ph * 0.65))) + 'px'; plates[i].style.lineHeight = '1.2'; }
            if (plates[i].style.width) plates[i].style.width = 'calc(' + plates[i].style.width + ' - ' + X_SIZE + 'px)';   // مساحة × من عرض اللوح
        }
        AGP.playerCard.fitAllNames(box);
        var x = box.querySelector('.x');
        if (plates[0]) {
            var b = box.getBoundingClientRect(), r = plates[0].getBoundingClientRect();
            x.style.left = Math.round(r.right - b.left) + 'px'; x.style.top = Math.round(r.top - b.top + r.height / 2 - X_SIZE / 2) + 'px';
        } else { x.style.top = '0'; x.style.left = '0'; }
    }
    function render() {
        var R = S.room, list = R.players, box = $('cards'), seen = {};
        box.classList.toggle('framed', list.some(function (p) { return p.frame; }));
        list.forEach(function (p) {
            seen[p.id] = true;
            var key = p.name + '|' + (p.avatar || '') + '|' + (p.frame ? p.frame.imageFilename : '');
            var c = cells[p.id];
            if (!c) { c = cells[p.id] = document.createElement('div'); c.className = 'cell'; box.appendChild(c); }
            if (c.dataset.key !== key) {
                c.dataset.key = key; c._p = p;
                if (p.frame) drawFramed(c, p); else c.innerHTML = plainHtml(p);
            }
            c._p = p;
            c.classList.toggle('off', !p.online);
        });
        Object.keys(cells).forEach(function (id) { if (!seen[id]) { cells[id].remove(); delete cells[id]; } });
        $('empty').classList.toggle('hide', list.length > 0);
        $('cnt').textContent = list.length; $('cntMax').textContent = '/ ' + R.settings.maxPlayers + ' لاعب';
        var s = R.settings;
        $('roles').innerHTML = '<span class="chip">🔪 ' + s.mafia + ' مافيا' + (s.disguised ? ' · ' + s.disguised + ' متخفي' : '') + '</span>' +
            (s.doctors ? '<span class="chip">🩺 ' + s.doctors + ' طبيب</span>' : '') + (s.detectives ? '<span class="chip">🕵️ ' + s.detectives + ' محقق</span>' : '');
        var need = R.minPlayers, ok = list.length >= need;
        $('startBtn').disabled = !ok;
        $('startTxt').textContent = ok ? 'ابدأ المباراة' : 'تحتاج ' + need + ' لاعبين (' + list.length + '/' + need + ')';
    }
    // البطاقات بإطار تنحسب من عرض الخانة — نعيد رسمها لو تغيّر العرض
    if (window.ResizeObserver) new ResizeObserver(function () {
        Object.keys(cells).forEach(function (id) { var c = cells[id]; if (c._p && c._p.frame && String(Math.floor(c.clientWidth)) !== c.dataset.w) drawFramed(c, c._p); });
    }).observe($('cards'));

    $('cards').addEventListener('click', function (e) {
        var b = e.target.closest('[data-kick]'); if (b) net.send({ t: 'kick', id: b.getAttribute('data-kick') });
    });
    $('startBtn').onclick = function () { net.send({ t: 'start' }); };

    var tt;
    function toast(text) { var t = $('toast'); t.textContent = text; t.classList.remove('hide'); clearTimeout(tt); tt = setTimeout(function () { t.classList.add('hide'); }, 3500); }

    $('exitBtn').onclick = function () { $('exitOv').classList.add('on'); };
    $('exitOv').addEventListener('click', function (e) { if (e.target === this || e.target.closest('[data-close]')) this.classList.remove('on'); });
    $('exitYes').onclick = function () { net.send({ t: 'close' }); NET.hostSession(null); setTimeout(function () { location.href = '../../games.html'; }, 200); };
})();
</script>
</body>
</html>
