<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حفلة عيد الميلاد — القاعة</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Zain:wght@700;900&display=swap" rel="stylesheet">
<!-- حفلة عيد الميلاد ثري دي — المرحلة الأولى: القاعة الرئيسية (الماب).
     المشهد كله في hall3d.js، والتحكم بالتجوّل في controls.js. اسم صاحبة
     الحفلة يُمرَّر مؤقتاً بالرابط: index.html?name=سارة
     أبواب الأقسام الأربعة موجودة بالقاعة وتظهر "قريباً" لحد ما تنبني مشاهدها. -->
<style>
    :root{ --agp-accent:#f472b6; --ink:#6b2147; --glass:rgba(255,246,250,.72); --line:rgba(236,160,195,.55); }
    html,body{ margin:0; height:100%; overflow:hidden; background:#f3d3e0; }
    body{ font-family:'IBM Plex Sans Arabic',sans-serif; color:var(--ink); -webkit-tap-highlight-color:transparent; }
    button{ font-family:inherit; }
    .hidden{ display:none !important; }

    #stage{ position:fixed; inset:0; touch-action:none; cursor:grab; }
    #stage:active{ cursor:grabbing; }

    .hud{ position:fixed; inset:0; pointer-events:none; z-index:5; }
    .hud > *{ pointer-events:auto; }
    .top{ position:absolute; top:max(12px,env(safe-area-inset-top)); left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; pointer-events:none; }
    .top > *{ pointer-events:auto; }
    .pill{ height:40px; padding:0 16px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--glass); color:var(--ink);
        font:700 14px 'IBM Plex Sans Arabic'; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 6px 20px rgba(214,110,160,.18); cursor:pointer; text-decoration:none; white-space:nowrap; transition:transform .15s, background .2s; }
    .pill:active{ transform:scale(.96); }
    .pill:focus-visible{ outline:3px solid #f472b6; outline-offset:2px; }
    .pill.on{ background:linear-gradient(180deg,#ff9ccc,#f472b6); color:#fff; border-color:transparent; }
    .pill svg{ width:18px; height:18px; flex:none; }
    .title{ font:900 24px/1 'Zain'; color:#fff; text-shadow:0 2px 3px rgba(140,30,80,.55),0 2px 16px rgba(219,39,119,.6); pointer-events:none; text-align:center; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .group{ display:flex; gap:8px; }
    .pill.party.on{ background:linear-gradient(180deg,#c86bff,#8b3fd9); box-shadow:0 0 22px rgba(200,107,255,.55); }
    body.party{ --glass:rgba(48,20,52,.55); --line:rgba(214,140,255,.45); --ink:#fde7f3; }
    body.party .title{ text-shadow:0 0 18px rgba(255,79,174,.9),0 2px 3px rgba(40,0,30,.7); }

    .hint{ position:absolute; bottom:max(16px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); padding:9px 18px; border-radius:999px; background:var(--glass); border:1px solid var(--line);
        backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font:600 13px 'IBM Plex Sans Arabic'; white-space:nowrap; pointer-events:none; transition:opacity .4s; }
    .netbad{ position:absolute; top:64px; right:16px; padding:7px 14px; border-radius:999px; background:#fff1f2; color:#9f1239; border:1px solid #fecdd3; font:700 13px 'IBM Plex Sans Arabic'; pointer-events:none; }
    body.net #tourBtn, body.net #partyBtn{ display:none; }
    body.viewer .hint, body.viewer .joy{ display:none !important; }
    .toast{ position:absolute; top:76px; left:50%; transform:translate(-50%,-8px); opacity:0; transition:all .3s; pointer-events:none; text-align:center;
        padding:12px 26px; border-radius:22px; background:rgba(255,250,252,.9); border:2px solid #f0c98f; box-shadow:0 12px 34px rgba(214,110,160,.3); }
    .toast.show{ opacity:1; transform:translate(-50%,0); }
    .toast b{ display:block; font:900 26px/1.1 'Zain'; color:#a3306a; }
    .toast span{ font:600 13px 'IBM Plex Sans Arabic'; color:#c07a9c; }

    .joy{ position:absolute; left:max(24px,env(safe-area-inset-left)); bottom:max(28px,env(safe-area-inset-bottom)); width:124px; height:124px; border-radius:50%; touch-action:none;
        background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,214,231,.35)); border:2px solid rgba(255,255,255,.75); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; }
    .joy-knob{ position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:linear-gradient(180deg,#ffb3d6,#f472b6); box-shadow:0 4px 14px rgba(219,39,119,.4); pointer-events:none; transition:transform .12s; }
    .joy.on .joy-knob{ transition:none; }
    @media (pointer:coarse){ .joy{ display:block; } .hint .desk{ display:none; } .hint{ bottom:auto; top:calc(max(12px,env(safe-area-inset-top)) + 52px); } .toast{ top:118px; } }
    @media (pointer:fine){ .hint .touch{ display:none; } }

    .loader{ position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:radial-gradient(circle at 50% 40%,#fff3f8,#f7c9dc); transition:opacity .6s; }
    .loader.out{ opacity:0; pointer-events:none; }
    .loader .box{ text-align:center; }
    .loader h1{ margin:14px 0 4px; font:700 46px/1.2 'Aref Ruqaa',serif; color:#d6407f; }
    .loader p{ margin:0; font:600 14px 'IBM Plex Sans Arabic'; color:#b0708f; }
    .spin{ width:58px; height:58px; margin:auto; border-radius:50%; border:5px solid #fbd3e4; border-top-color:#f472b6; animation:sp 1s linear infinite; }
    @keyframes sp{ to{ transform:rotate(360deg); } }
    .loader.fail .spin{ display:none; }
    @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:3s; } }
    @media (max-width:520px){ .title{ font-size:19px; } .pill .lbl{ display:none; } .pill{ padding:0 12px; } }
    /* الجوال بالعرض (اللعب الأساسي): شريط علوي أصغر، العصا أصغر، التلميح تحت بالنص */
    @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
        .top{ top:max(8px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); right:max(12px,env(safe-area-inset-right)); }
        .pill{ height:34px; font-size:12px; } .title{ font-size:18px; }
        .joy{ width:108px; height:108px; bottom:max(14px,env(safe-area-inset-bottom)); left:max(18px,env(safe-area-inset-left)); }
        .joy-knob{ width:46px; height:46px; margin:-23px 0 0 -23px; }
        .hint{ top:auto; bottom:max(10px,env(safe-area-inset-bottom)); font-size:12px; padding:6px 14px; }
        .toast{ top:54px; } .netbad{ top:50px; }
    }
    .hint.gone{ opacity:0 !important; }
    /* الجوال بالطول: نطلب يلفّه (اللعبة مصممة بالعرض) */
    .rotate{ position:fixed; inset:0; z-index:20; display:none; place-items:center; text-align:center; padding:24px; background:radial-gradient(circle at 50% 35%,#fff3f8,#f3c6da); color:var(--ink); }
    .rotate .ph{ width:64px; height:104px; margin:0 auto 18px; border:5px solid #d45a8a; border-radius:14px; position:relative; animation:turn 2.2s ease-in-out infinite; }
    .rotate .ph::after{ content:''; position:absolute; bottom:6px; left:50%; width:14px; height:4px; margin-left:-7px; border-radius:2px; background:#d45a8a; }
    .rotate h2{ margin:0 0 6px; font:900 26px/1.2 'Zain'; color:#a3306a; }
    .rotate p{ margin:0 0 16px; font:600 14px 'IBM Plex Sans Arabic'; color:#9b6683; }
    .rotate button{ height:46px; padding:0 24px; border:0; border-radius:999px; font:700 15px 'IBM Plex Sans Arabic'; color:#fff; background:linear-gradient(180deg,#f08ab0,#d45a8a); box-shadow:0 8px 20px rgba(212,90,138,.3); cursor:pointer; }
    @keyframes turn{ 0%,20%{ transform:rotate(0); } 50%,80%{ transform:rotate(-90deg); } 100%{ transform:rotate(0); } }
    @media (prefers-reduced-motion:reduce){ .rotate .ph{ animation:none; transform:rotate(-90deg); } }
    @media (pointer:coarse) and (orientation:portrait){ body:not(.viewer) .rotate{ display:grid; } }
</style>
</head>
<body>
<div id="stage" aria-label="قاعة حفلة عيد الميلاد"></div>

<div class="hud" id="hud">
    <div class="top">
        <a class="pill" href="../../games.html" aria-label="خروج">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="lbl">خروج</span>
        </a>
        <div class="title" id="title">حفلة عيد الميلاد</div>
        <div class="group">
            <button class="pill party" id="partyBtn" type="button" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span class="lbl" id="partyLbl">بدء الحفل</span>
            </button>
            <button class="pill on" id="tourBtn" type="button" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="lbl">جولة سينمائية</span>
            </button>
            <button class="pill" id="fsBtn" type="button" aria-label="ملء الشاشة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
            </button>
        </div>
    </div>
    <div class="netbad hidden" id="netBad" role="status">جاري إعادة الاتصال…</div>
    <div class="toast" id="toast" role="status" aria-live="polite"><b id="toastTitle"></b><span>هذا القسم قريباً</span></div>
    <div class="hint" id="hint">
        <span class="desk">W A S D للمشي · اسحب بالماوس للنظر · Shift للجري</span>
        <span class="touch">العصا للمشي · اسحب بإصبعك للنظر</span>
    </div>
    <div class="joy" id="joy" aria-hidden="true"><div class="joy-knob"></div></div>
</div>

<div class="rotate" id="rotate" role="dialog" aria-label="لف الجوال بالعرض">
    <div>
        <div class="ph" aria-hidden="true"></div>
        <h2>لف جوالك بالعرض</h2>
        <p>الحفلة مصممة للشاشة العريضة</p>
        <button type="button" id="landBtn">تشغيل بالعرض</button>
    </div>
</div>

<div class="loader" id="loader">
    <div class="box">
        <div class="spin"></div>
        <h1>عيد ميلاد سعيد</h1>
        <p id="loaderMsg">نجهّز القاعة…</p>
    </div>
</div>

<script type="module">
    const log = (...a) => { try { const A = window.AymanGamesPlatform; (A && A.log ? A.log : function () {})(...a); } catch (e) {} };
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const name = (params.get('name') || '').trim().slice(0, 30);
    // play.html?code=XXXX → حفلة جماعية (view=1 = شاشة عرض بدون شخصية). بدون code = القاعة التجريبية.
    const code = (params.get('code') || '').replace(/\D/g, '').slice(0, 4);
    const viewOnly = params.get('view') === '1';
    if (code) document.body.classList.add('net');
    if (code && viewOnly) document.body.classList.add('viewer');
    if (name) $('title').textContent = 'حفلة ' + name;

    // الخطوط لازم تكون جاهزة قبل رسم اللافتات على الـ canvas
    const fontLoads = ['700 100px "Aref Ruqaa"', '900 100px Zain', '700 50px "IBM Plex Sans Arabic"'].map(f => document.fonts.load(f, 'عيد'));
    await Promise.race([Promise.all(fontLoads).catch(() => {}), new Promise(r => setTimeout(r, 3500))]);

    let hall = null;
    try {
        const [{ mountHall }, { createControls }] = await Promise.all([import('./hall3d.js'), import('./controls.js')]);
        const controls = createControls($('stage'), $('joy'));
        let toastTimer = 0;
        hall = mountHall($('stage'), {
            name, controls: (code && viewOnly) ? null : controls, noFreeWalk: !!code,
            onReady: () => setTimeout(() => $('loader').classList.add('out'), 250),
            onModeChange: m => {
                const on = m === 'tour';
                $('tourBtn').classList.toggle('on', on); $('tourBtn').setAttribute('aria-pressed', String(on));
                $('hint').style.opacity = on ? '1' : '.75';
            },
            onPartyChange: on => {
                document.body.classList.toggle('party', on);
                $('partyBtn').classList.toggle('on', on); $('partyBtn').setAttribute('aria-pressed', String(on));
                $('partyLbl').textContent = on ? 'إنهاء الحفل' : 'بدء الحفل';
            },
            onSectionNear: s => {
                clearTimeout(toastTimer);
                if (s) { $('toastTitle').textContent = s.title; $('toast').classList.add('show'); }
                else toastTimer = setTimeout(() => $('toast').classList.remove('show'), 200);
            },
        });
        $('partyBtn').addEventListener('click', () => hall.setParty(!hall.party));
        $('tourBtn').addEventListener('click', () => hall.setMode(hall.mode === 'tour' ? 'walk' : 'tour'));
        if (code) await startParty(hall);
        // اختبار بصري: play.html?cam=x,y,z,lx,ly,lz&curtain=0&doors=1&fw=1&party=1
        const camQ = params.get('cam');
        if (!code && camQ) {
            const v = camQ.split(',').map(Number); hall.debugView(v.slice(0, 3), v.slice(3, 6));
            if (params.has('curtain')) hall.setCurtain(+params.get('curtain'), true);
            if (params.has('doors')) hall.setDoors(+params.get('doors'), true);
            if (params.get('party') === '1') hall.setParty(true);
            if (params.get('fw') === '1') hall.fireworks(30);
        }
    } catch (err) {
        log('[birthday-party] 3D غير متاح', err);
        $('loader').classList.add('fail');
        $('loaderMsg').textContent = 'جهازك أو متصفحك ما يدعم العرض ثلاثي الأبعاد — جرّب متصفح Chrome أو جهاز آخر.';
    }

    // ---- الحفلة الجماعية: الاتصال بالسيرفر + الشخصيات ----
    async function startParty(hall) {
        const [{ connect, readJSON, writeJSON, serverNow, unpackRows }, { createCrowd }] = await Promise.all([import('./party-net.js'), import('./crowd3d.js')]);
        const me = viewOnly ? null : readJSON('party-me');
        if (!viewOnly && !(me && me.code === code)) { location.replace('join.html?code=' + code); return; }
        if (!viewOnly) $('hint').querySelector('.touch').textContent = 'العصا للمشي · اسحب للف الكاميرا';
        const crowd = createCrowd(hall.scene, { floorAt: hall.floorAt });
        let myN = null, placed = false, lastSent = null;
        hall.addTicker(dt => crowd.update(dt, hall.camera, serverNow()));
        const net = connect({
            onStatus: on => $('netBad').classList.toggle('hidden', on),
            onOpen: () => net.send(viewOnly ? { t: 'peek', code } : { t: 'resume', code, id: me.id, key: me.key }),
            onMessage: m => {
                if (m.t === 'welcome') { myN = m.n; crowd.setLocal(myN, hall.getLocal); }
                else if (m.t === 'room') {
                    crowd.sync(m.room.players);
                    if (m.room.girlName) { $('title').textContent = 'حفلة ' + m.room.girlName; hall.setName(m.room.girlName); }
                } else if (m.t === 'all' || m.t === 's') {
                    const rows = unpackRows(m.d);
                    crowd.apply(rows, m.now, m.t === 'all');
                    // أول مرة نعرف مكاننا من السيرفر ← نبدأ وضع الشخصية
                    if (!placed && myN != null) { const r = rows.find(x => x[0] === myN); if (r) { placed = true; hall.setFollow({ x: r[1], z: r[2], ry: r[3] }); } }
                } else if (m.t === 'err') {
                    if (m.err === 'resume' || m.err === 'nocode') { writeJSON('party-me', null); location.replace('join.html?code=' + code); }
                    else if (m.err === 'elsewhere') { $('netBad').textContent = 'فتحت الحفلة من مكان ثاني'; $('netBad').classList.remove('hidden'); net.close(); }
                    else if (m.err === 'disabled') { $('netBad').textContent = 'الحفلات متوقفة حالياً'; $('netBad').classList.remove('hidden'); }
                }
            },
        });
        // نرسل مكاننا 8 مرات بالثانية — بس إذا تغيّر
        if (!viewOnly) setInterval(() => {
            if (!placed || hall.mode !== 'follow') return;
            const L = hall.getLocal(), a = L.moving ? 1 : 0;
            const p = [Math.round(L.x * 100) / 100, Math.round(L.z * 100) / 100, Math.round(L.ry * 100) / 100, a];
            if (lastSent && Math.abs(p[0] - lastSent[0]) < .02 && Math.abs(p[1] - lastSent[1]) < .02 && Math.abs(p[2] - lastSent[2]) < .03 && p[3] === lastSent[3]) return;
            lastSent = p; net.send({ t: 'mv', p });
        }, 125);
    }

    // ---- العرض الأفقي على الجوال ----
    // أندرويد: ملء الشاشة + قفل الاتجاه بالعرض (يحتاج ضغطة من المستخدم). الآيفون ما يسمح
    // بقفل الاتجاه للمواقع، فتبقى شاشة «لف جوالك» لين يلفّه بنفسه.
    const coarse = matchMedia('(pointer:coarse)').matches;
    async function goLandscape() {
        try {
            const d = document.documentElement;
            if (!document.fullscreenElement && d.requestFullscreen) await d.requestFullscreen({ navigationUI: 'hide' });
            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) { /* غير مدعوم (آيفون) — المستخدم يلفّه بنفسه */ }
    }
    $('landBtn').addEventListener('click', goLandscape);
    if (coarse && !viewOnly) document.addEventListener('pointerdown', function once() { document.removeEventListener('pointerdown', once); if (matchMedia('(orientation:portrait)').matches) goLandscape(); }, { once: true });
    // التلميح يختفي بعد شوي عشان ما يغطي اللعب
    setTimeout(() => $('hint').classList.add('gone'), 9000);

    $('fsBtn').addEventListener('click', () => {
        const d = document;
        if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen();
        else d.documentElement.requestFullscreen && d.documentElement.requestFullscreen().catch(() => {});
    });
</script>
</body>
</html>
