<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -2 90 56">
  <!-- أيقونة أصلية لهدية «جي جي» (GG): حرفين G بتدرّج ألوان وحدود غامقة — بدل أيقونة المايك القديمة -->
  <defs>
