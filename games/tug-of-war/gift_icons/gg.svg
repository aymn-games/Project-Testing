      <stop offset="0" stop-color="#fff27a"/>
      <stop offset=".45" stop-color="#ff8ad8"/>
      <stop offset="1" stop-color="#8f7bff"/>
    </linearGradient>
    <linearGradient id="gg-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="gg-g" d="M33.2 14.8 A14 14 0 1 0 37 28 H25.5"/>
