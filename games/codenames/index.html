<!--
    ==========================================================================
     كود نيمز (Codenames) — لعبة أصلية (Native) داخل مستودع Project-Testing،
     بنفس نمط games/khazna و games/team-war و games/photo-challenge من ناحية
     طريقة التحميل: لا اعتماد على js/agp-game-shell.js. الهوية البصرية:
     قالب "settings-no-box" منقول بالحرف من روليت القبائل/تحدي الصور/الخزنة
     (خط Zain فقط). لا تعديل على أي ملف موجود بالمشروع.

     ⚠️ بناء تدريجي: هذا الملف يغطي شاشة الإعدادات + تبويب الاتصال بالبث
     + اللوبي + شاشة اللعب (منطق كامل: كلمات عشوائية، أوامر شات حقيقية،
     تعيين أدوار يدوي) + نظام QR الحقيقي لجوال السباي ماستر (يتصل بقناة
     websocket/room-relay-server.js المنفصلة عن بروتوكول التيك توك --
     راجع games/codenames/spymaster.html). لسا غير مبني: شاشة فائز مستقلة
     بمعيار باقي ألعاب المنصة، ونظام دخول لاعبين أثناء المباراة.
    ==========================================================================
-->
