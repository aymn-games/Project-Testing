<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../js/agp-wide-scale.js" data-min-height="900"></script>
<title>بلدة الكاوبوي — ألعاب أيمن</title>
<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-events.js"></script>
<script src="../../js/agp-timer-manager.js"></script>
<script src="../../js/agp-storage-manager.js"></script>
<script src="../../js/agp-services.js"></script>
<script src="../../js/agp-stream-connector.js"></script>
<script src="../../adapters/agp-tiktok-adapter.js"></script>
<script src="../../auth/auth-client.js"></script>
<script src="../../js/agp-shared-prefs.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<script src="../../js/agp-live-watch.js"></script>
<script src="../../js/agp-auto-connect.js"></script>
<script src="cd-platform.js"></script>
<script src="cd-settings.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* شاشة الإعدادات بنفس تنسيق وألوان وخط روليت الإقصاء (طلب صاحب المنصة): هيدر + عنوان + حالة البث + كروت أقسام مرقّمة + زر الدخول للوبي
   — صفوف RTL: العنوان يمين والتحكم يسار (CLAUDE.md) */
:root{--accent:#8b5cf6;--accent2:#c4b5fd;--accent-glow:rgba(139,92,246,.4);--bg:#07060b;--card:rgba(255,255,255,.025);--line:rgba(255,255,255,.07);--muted:#a8a3b5;--agp-accent:#8b5cf6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;direction:rtl}
body{background:radial-gradient(circle at 50% 0%,rgba(124,58,237,.22),transparent 55%),radial-gradient(circle at 85% 40%,rgba(139,92,246,.12),transparent 50%),radial-gradient(circle at 10% 80%,rgba(168,85,247,.1),transparent 50%),var(--bg);overflow-x:hidden}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(220,210,255,.55)}
header{position:relative;height:78px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
header img{height:40px}
.exit{position:absolute;left:18px;top:50%;transform:translateY(-50%);height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.06);color:#fca5a5;font:600 13px "IBM Plex Sans Arabic";cursor:pointer;display:flex;align-items:center;gap:6px}
main{position:relative;max-width:1020px;margin:0 auto;padding:30px 18px 40px}
h1{margin:0;text-align:center;font:700 clamp(32px,4.2vw,56px)/1.1 'IBM Plex Sans Arabic';background:linear-gradient(180deg,#f4f2f8,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;margin:4px 0 0;color:var(--muted);font-size:14px}
.status{display:flex;justify-content:center;gap:8px;margin:14px 0 26px;flex-wrap:wrap}
.pill{height:30px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;font:600 12px "IBM Plex Sans Arabic";border:1px solid}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.off{color:#f87171;border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.06)}.pill.off .dot{background:#f87171}
.pill.on{color:#34d399;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}.pill.on .dot{background:#34d399;box-shadow:0 0 8px #34d399}
.golive{height:30px;padding:0 14px;display:flex;align-items:center;border-radius:999px;text-decoration:none;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;font:600 12px "IBM Plex Sans Arabic";box-shadow:0 4px 14px rgba(139,92,246,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 24px 8px;animation:rise .5s cubic-bezier(.2,1,.3,1) both}
.card.full{grid-column:1/-1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.chead{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(139,92,246,.16);color:var(--accent2);font:700 13px "IBM Plex Sans Arabic"}
.chead h2{margin:0;font:700 17px "IBM Plex Sans Arabic"}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:64px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lab{text-align:right;flex:1;min-width:0}
.lab b{display:block;font:600 15px "IBM Plex Sans Arabic"}
.lab small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.6}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);flex:none}
.seg button{height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 13px "IBM Plex Sans Arabic";cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 20px var(--accent-glow)}
.txt{width:190px;height:40px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;font:500 14px "IBM Plex Sans Arabic";text-align:center;outline:none}
.txt:focus{border-color:rgba(167,139,250,.5)}
.step{display:flex;align-items:center;height:40px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);flex:none}
.step button{width:40px;height:40px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
.step input{width:50px;border:0;background:none;color:#fff;text-align:center;font:700 15px "IBM Plex Sans Arabic";outline:none;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tog{position:relative;width:52px;height:28px;border-radius:999px;border:0;background:rgba(255,255,255,.1);cursor:pointer;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;right:27px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.tog.on{background:linear-gradient(90deg,#7c3aed,#a855f7)}.tog.on::after{right:3px}
.go{display:flex;justify-content:center;margin-top:30px}
.go button{width:min(400px,100%);height:58px;border:0;border-radius:18px;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;font:700 20px "IBM Plex Sans Arabic";cursor:pointer;box-shadow:0 10px 30px var(--accent-glow);display:flex;align-items:center;justify-content:center;gap:10px}
.go button[disabled]{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;transition:all .3s;background:#1d1626;border:1px solid rgba(167,139,250,.4);color:#fff;padding:10px 18px;border-radius:12px;font:600 14px "IBM Plex Sans Arabic";pointer-events:none}
#toast.in{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.grid{grid-template-columns:1fr}.card{padding:16px 16px 6px}.seg button{padding:0 10px;font-size:12px}.txt{width:150px}}
</style>
</head>
<body>
<div class="fx" id="fx"></div>
<header><img src="../../logo.png" alt="ألعاب أيمن" onerror="this.style.display='none'"><button class="exit" id="exitBtn" type="button">خروج ↩</button></header>
<main>
  <h1>بلدة الكاوبوي</h1>
  <p class="sub">كل لاعبَين في مبارزة وسط شارع في الغرب. عند الجرس يظهر رقم ذهبي، وأول من يكتبه يُسقط خصمه ويتأهل.</p>
  <div class="status"><span class="pill off" id="livePill"><i class="dot"></i><span id="liveTxt">غير متصل بالبث</span></span><a class="golive" id="goLive" href="../../games.html">ابدأ البث ونتصل تلقائياً</a></div>
  <div class="grid" id="grid"></div>
  <div class="go"><button type="button" id="startBtn">الدخول للوبي <span>‹</span></button></div>
</main>
<div id="toast"></div>
<script>
(function () {
    'use strict';
    var P = window.CDPlatform, S = window.CDSettings; if (!P || !S) return;
    var SP = window.AGPSharedPrefs ? AGPSharedPrefs.bind({ keyword: 'keyword' }) : null;
    var values = S.load(); if (SP) values = SP.fill(values);
    var $ = function (s) { return document.querySelector(s); };
    // نجوم خفيفة بالخلفية (نفس روح روليت الإقصاء)
    var fx = $('#fx'); for (var i = 0; i < 60; i++) { var st = document.createElement('i'); st.style.left = Math.random() * 100 + '%'; st.style.top = Math.random() * 100 + '%'; st.style.opacity = (.2 + Math.random() * .6).toFixed(2); fx.appendChild(st); }
    function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('in'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('in'); }, 2400); }
    function esc(x) { return String(x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function control(f) {
        var v = values[f.key];
        if (f.type === 'text') return '<input class="txt" data-k="' + f.key + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '" maxlength="40">';
        if (f.type === 'number') return '<div class="step"><button type="button" data-dec="' + f.key + '">−</button><input type="number" data-n="' + f.key + '" value="' + v + '" min="' + f.min + '" max="' + f.max + '"><button type="button" data-inc="' + f.key + '">+</button></div>';
        if (f.type === 'toggle') return '<button type="button" class="tog' + (v ? ' on' : '') + '" data-t="' + f.key + '" aria-label="' + esc(f.label) + '"></button>';
        return '<div class="seg">' + f.options.map(function (o, i) { return '<button type="button" data-k="' + f.key + '" data-i="' + i + '" class="' + (v === o[0] ? 'on' : '') + '">' + esc(o[1]) + '</button>'; }).join('') + '</div>';
    }
    function render() {
        $('#grid').innerHTML = S.SECTIONS.map(function (sec, si) {
            var rows = S.FIELDS.filter(function (f) { return f.section === sec.n && (!f.showIf || values[f.showIf[0]] === f.showIf[1]); });
            return '<section class="card' + (sec.full ? ' full' : '') + '" style="animation-delay:' + (si * .07) + 's"><div class="chead"><span class="num">' + sec.n + '</span><h2>' + sec.title + '</h2></div>' +
                rows.map(function (f) { var d = f.descs ? f.descs[values[f.key]] : f.desc; return '<div class="row"><div class="lab"><b>' + esc(f.label) + '</b>' + (d ? '<small>' + esc(d) + '</small>' : '') + '</div>' + control(f) + '</div>'; }).join('') + '</section>';
        }).join('');
    }
    render();
    var grid = $('#grid');
    grid.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var f;
        if (b.dataset.i != null) { f = S.FIELDS.find(function (x) { return x.key === b.dataset.k; }); values[f.key] = f.options[+b.dataset.i][0]; render(); }
        else if (b.dataset.t) { values[b.dataset.t] = !values[b.dataset.t]; render(); }
        else if (b.dataset.inc || b.dataset.dec) { var k = b.dataset.inc || b.dataset.dec; f = S.FIELDS.find(function (x) { return x.key === k; }); values[k] = Math.max(f.min, Math.min(f.max, (+values[k] || f.min) + (b.dataset.inc ? 1 : -1))); render(); }
    });
    grid.addEventListener('input', function (e) { var t = e.target; if (t.dataset.k) values[t.dataset.k] = t.value; if (t.dataset.n) values[t.dataset.n] = t.value; });
    // حالة الاتصال بالبث (من مكتبة الألعاب أو الاتصال التلقائي)
    function live() { var c = P.getSavedConnection(), on = !!c; $('#livePill').className = 'pill ' + (on ? 'on' : 'off'); $('#liveTxt').textContent = on ? 'متصل بالبث · @' + c.username : 'غير متصل بالبث'; $('#goLive').style.display = on ? 'none' : ''; return on; }
    live(); addEventListener('storage', live); addEventListener('focus', live); addEventListener('agp:stream-connected', live); addEventListener('agp:stream-ended', live);
    $('#startBtn').onclick = function () {
        values.keyword = String(values.keyword || '').trim();
        if (!values.keyword) return toast('اكتب كلمة الدخول');
        if (!live() && !P.demo) return toast('ابدأ البث على حساب تيك توك المربوط بحسابك — نتصل تلقائياً');
        values = S.save(values); if (SP) SP.save(values);
        location.href = P.gameUrl + (P.demo ? '?demo=1' : '');
    };
    $('#exitBtn').onclick = function () { location.href = P.libraryUrl; };
}());
</script>
</body>
</html>
