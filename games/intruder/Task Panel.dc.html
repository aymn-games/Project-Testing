<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
@keyframes tpIn{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:none}}
@keyframes tpShake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes tpDots{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</helmet>
<div dir="rtl" style="position:relative;width:min(470px, calc(100vw - 20px));box-sizing:border-box;padding:16px 18px 14px;border-radius:22px;background:linear-gradient(180deg,#8b93a1 0%,#6b7280 45%,#4b5361 100%);border:5px solid #0b0c10;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.35),0 14px 0 rgba(0,0,0,.45),0 30px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;font-family:'Zain',sans-serif;color:#f4f2f8;animation:tpIn .35s cubic-bezier(.2,1.25,.35,1);user-select:none;-webkit-user-select:none;touch-action:none">
  <span style="position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:#374151;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)"></span>
  <span style="position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#374151;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)"></span>
  <span style="position:absolute;bottom:8px;left:8px;width:8px;height:8px;border-radius:50%;background:#374151;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)"></span>
  <span style="position:absolute;bottom:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#374151;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)"></span>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#11131a;border:3px solid #0b0c10;font:400 24px/1 'Zain'">{{ icon }}</span>
    <span style="flex:1;min-width:0;font:900 23px/1.2 'Zain';color:#fff;text-shadow:0 2px 0 #0b0c10,0 0 1px #0b0c10">{{ title }}</span>
    <button onClick="{{ close }}" aria-label="إغلاق" style="flex:none;width:46px;height:46px;border-radius:12px;border:4px solid #0b0c10;background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;font:900 20px 'Zain';cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #0b0c10" style-active="transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 #0b0c10">✕</button>
  </div>
  <span style="padding:6px 10px;border-radius:10px;background:rgba(11,12,16,.55);font:700 15px/1.5 'Zain';color:#e5e7eb">{{ hint }}</span>
  <div style="display:flex;align-items:center;gap:10px">
    <div style="flex:1;height:16px;border-radius:6px;background:#1f2937;border:3px solid #0b0c10;overflow:hidden"><div style="height:100%;width:{{ pct }}%;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .25s"></div></div>
    <span style="min-width:44px;font:900 15px 'Zain';color:#fff;text-shadow:0 2px 0 #0b0c10;font-variant-numeric:tabular-nums">{{ pct }}%</span>
  </div>

  <div style="padding:10px;border-radius:14px;background:#11131a;border:4px solid #0b0c10;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 6px 18px rgba(0,0,0,.6);animation:{{ shake }}">
    <sc-if value="{{ isSvg }}" hint-placeholder-val="{{ false }}">
      <svg ref="{{ svgRef }}" viewBox="0 0 320 240" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" onLostPointerCapture="{{ up }}" style="width:100%;height:auto;display:block;border-radius:10px;touch-action:none;cursor:{{ cursor }}">{{ board }}</svg>
    </sc-if>

    <sc-if value="{{ isCal }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0">
        <div style="position:relative;width:100%;height:50px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);overflow:hidden">
          <div style="position:absolute;top:0;bottom:0;left:{{ cal.zl }}%;width:{{ cal.zw }}%;background:rgba(34,197,94,.35);border-left:2px solid #6ee7b7;border-right:2px solid #6ee7b7"></div>
          <div style="position:absolute;top:-2px;bottom:-2px;left:{{ cal.mk }}%;width:6px;margin-left:-3px;border-radius:3px;background:#fde68a;box-shadow:0 0 12px #fde68a"></div>
        </div>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ cal.dots }}" as="d" hint-placeholder-count="3">
            <span style="width:16px;height:16px;border-radius:50%;background:{{ d.c }}"></span>
          </sc-for>
        </div>
        <button onPointerDown="{{ cal.tap }}" style="width:100%;height:62px;border-radius:999px;cursor:pointer;border:none;background:linear-gradient(180deg,#fde047,#ca8a04);color:#1b1408;font:900 22px 'Zain';border:4px solid #0b0c10;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 #0b0c10">🎯 أوقف هنا</button>
      </div>
    </sc-if>

    <sc-if value="{{ isLock }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start">
        <div style="width:112px;padding:12px 10px;box-sizing:border-box;background:#fde68a;color:#3b2a08;border-radius:6px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font:800 14px 'Zain'">📌 الكود</span>
          <span dir="ltr" style="font:900 30px 'Zain';letter-spacing:.12em">{{ lock.code }}</span>
        </div>
        <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px">
          <div dir="ltr" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
            <sc-for list="{{ lock.boxes }}" as="b" hint-placeholder-count="4">
              <span style="height:52px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.4);border:1.5px solid {{ b.bd }};font:900 28px 'Zain'">{{ b.v }}</span>
            </sc-for>
          </div>
          <div dir="ltr" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            <sc-for list="{{ lock.keys }}" as="k" hint-placeholder-count="12">
              <button onPointerDown="{{ k.press }}" style="height:52px;border-radius:14px;cursor:pointer;border:1px solid rgba(255,255,255,.14);background:{{ k.bg }};color:#f4f2f8;font:900 24px 'Zain'">{{ k.l }}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isSamp }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div dir="ltr" style="width:100%;display:flex;justify-content:space-between;gap:8px;padding:14px 10px 10px;box-sizing:border-box;border-radius:16px;background:#141019;border:1px solid rgba(255,255,255,.08)">
          <sc-for list="{{ samp.tubes }}" as="t" hint-placeholder-count="5">
            <button onClick="{{ t.press }}" style="flex:1;max-width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;color:#f4f2f8">
              <span style="position:relative;width:34px;height:120px;border-radius:6px 6px 18px 18px;border:2px solid {{ t.bd }};background:rgba(255,255,255,.04);overflow:hidden;box-shadow:0 0 16px {{ t.glow }}">
                <span style="position:absolute;left:0;right:0;bottom:0;height:{{ t.h }}%;background:{{ t.c }};transition:height .3s,background .3s"></span>
              </span>
              <span style="font:800 14px 'Zain';color:{{ t.lc }}">{{ t.lbl }}</span>
            </button>
          </sc-for>
        </div>
        <span style="font:700 16px 'Zain';color:{{ samp.msgC }}">{{ samp.msg }}</span>
        <sc-if value="{{ samp.canStart }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ samp.start }}" style="width:100%;height:56px;border-radius:999px;cursor:pointer;border:4px solid #0b0c10;background:linear-gradient(180deg,#38bdf8,#0369a1);color:#fff;font:900 20px 'Zain';text-shadow:0 2px 0 #0b0c10;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #0b0c10">▶️ ابدأ الفحص</button>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isReac }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <span style="font:800 17px 'Zain';color:{{ reac.msgC }}">{{ reac.msg }}</span>
        <div dir="ltr" style="display:grid;grid-template-columns:repeat(3,minmax(0,84px));gap:10px">
          <sc-for list="{{ reac.pads }}" as="p" hint-placeholder-count="9">
            <button onPointerDown="{{ p.press }}" aria-label="لوحة" style="aspect-ratio:1;min-height:64px;border-radius:18px;cursor:pointer;border:2px solid rgba(255,255,255,{{ p.bA }});background:{{ p.c }};opacity:{{ p.op }};box-shadow:0 0 {{ p.gl }}px {{ p.c }};transition:opacity .08s"></button>
          </sc-for>
        </div>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ reac.dots }}" as="d" hint-placeholder-count="3">
            <span style="width:16px;height:16px;border-radius:50%;background:{{ d.c }}"></span>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0">
        <div dir="ltr" style="display:flex;align-items:center;gap:14px;font:400 44px/1 'Zain'">
          <span>📁</span>
          <span style="display:flex;gap:6px">
            <sc-for list="{{ upl.dots }}" as="d" hint-placeholder-count="5">
              <span style="width:10px;height:10px;border-radius:50%;background:#7dd3fc;animation:{{ d.an }}"></span>
            </sc-for>
          </span>
          <span>📡</span>
        </div>
        <div style="width:100%;height:20px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:{{ upl.p }}%;background:linear-gradient(90deg, #0284c7, #7dd3fc);border-radius:999px"></div></div>
        <span style="font:700 16px 'Zain';color:#a8a3b5">{{ upl.msg }}</span>
        <sc-if value="{{ upl.canStart }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ upl.start }}" style="width:100%;height:56px;border-radius:999px;cursor:pointer;border:4px solid #0b0c10;background:linear-gradient(180deg,#38bdf8,#0369a1);color:#fff;font:900 20px 'Zain';text-shadow:0 2px 0 #0b0c10;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #0b0c10">📤 ابدأ الرفع</button>
        </sc-if>
      </div>
    </sc-if>
  </div>

  <div style="min-height:26px;display:flex;justify-content:center;align-items:center">
    <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
      <span style="padding:4px 14px;border-radius:10px;background:#7f1d1d;border:3px solid #0b0c10;font:800 16px 'Zain';color:#fff">{{ err }}</span>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <span style="padding:6px 22px;border-radius:10px;background:#16a34a;border:3px solid #0b0c10;font:900 22px 'Zain';color:#fff;text-shadow:0 2px 0 #0b0c10;animation:tpIn .3s ease">✓ تمت المهمة</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:500,&quot;height&quot;:620},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;wires&quot;,&quot;swipe&quot;,&quot;calibrate&quot;,&quot;lock&quot;,&quot;samples&quot;,&quot;reactor&quot;,&quot;upload&quot;,&quot;trash&quot;,&quot;route&quot;,&quot;aim&quot;],&quot;default&quot;:&quot;wires&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;سهل&quot;,&quot;عادي&quot;,&quot;صعب&quot;],&quot;default&quot;:&quot;عادي&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;توصيل الأسلاك&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;taskId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const KINDS={
  wires:{icon:'🔌',hint:'اسحب كل سلك من اليسار لنفس لونه باليمين'},
  swipe:{icon:'💳',hint:'اسحب البطاقة عبر القارئ بسرعة مناسبة… لا سريعة ولا بطيئة'},
  calibrate:{icon:'🎯',hint:'أوقف المؤشر داخل المنطقة الخضراء · 3 مرات'},
  lock:{icon:'🔐',hint:'أدخل الكود المكتوب على الورقة'},
  samples:{icon:'🧪',hint:'شغّل الفحص، انتظر النتيجة، ثم اختر العينة المصابة'},
  reactor:{icon:'☢️',hint:'احفظ تسلسل الألوان وأعده · 3 جولات'},
  upload:{icon:'📡',hint:'شغّل الرفع وخلّ النافذة مفتوحة لين يكتمل'},
  trash:{icon:'🗑️',hint:'اسحب كل النفايات إلى الحاوية'},
  route:{icon:'🧭',hint:'اسحب كل نقطة إلى الدائرة الصفراء في عمودها'},
  aim:{icon:'☄️',hint:'اضغط على النيازك قبل ما تختفي'}
};
const WC=['#ef4444','#3b82f6','#facc15','#22c55e'], WY=[45,95,145,195];
const PADS=['#ef4444','#3b82f6','#22c55e','#facc15','#a855f7','#f97316','#06b6d4','#ec4899','#f4f2f8'];
const SAMP_MS=4000, UP_MS=7000, AIM_N=8, AIM_LIFE=1400;
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd=(a,b)=>a+Math.random()*(b-a);
class Component extends DCLogic {
  state={k:null};
  get D(){ const d=this.props.difficulty||'عادي'; return d==='سهل'?{aim:6,up:5000,samp:3000,zone:.27,swMin:.25,swMax:2.6,seq:2}:d==='صعب'?{aim:10,up:9000,samp:5000,zone:.14,swMin:.45,swMax:1.4,seq:4}:{aim:8,up:7000,samp:4000,zone:.2,swMin:.35,swMax:2,seq:3}; }
  svgRef=React.createRef();
  stars=Array.from({length:40},()=>[rnd(0,320),rnd(0,240),Math.random()<.2?1.6:.9]);
  componentDidMount(){ this.setState(this.init(this.props.kind)); const loop=()=>{ this.raf=requestAnimationFrame(loop); this.tick(); }; this.raf=requestAnimationFrame(loop); }
  componentDidUpdate(pp){ if(pp.taskId!==this.props.taskId||pp.kind!==this.props.kind||pp.difficulty!==this.props.difficulty){ this.won=false; clearTimeout(this.dt); this.setState(this.init(this.props.kind)); } }
  componentWillUnmount(){ cancelAnimationFrame(this.raf); clearTimeout(this.dt); clearTimeout(this.et); }
  spawn(now){ return {x:rnd(30,290),y:rnd(30,210),b:now}; }
  init(k){
    const now=performance.now(), base={k:KINDS[k]?k:'wires',done:false,err:'',errAt:0,nt:now};
    switch(base.k){
      case 'wires': return {...base,right:shuffle([0,1,2,3]),conn:[],drag:null};
      case 'swipe': return {...base,cx:0,dragging:false,t0:0,off:0};
      case 'calibrate': { const zs=rnd(.1,.68); return {...base,zs,ze:zs+this.D.zone,hits:0,t0:now}; }
      case 'lock': return {...base,code:Array.from({length:4},()=>Math.floor(Math.random()*10)).join(''),entry:''};
      case 'samples': return {...base,stage:'idle',st:0,bad:Math.floor(Math.random()*5)};
      case 'reactor': return {...base,round:0,seq:Array.from({length:5},()=>Math.floor(Math.random()*9)),showing:true,ss:now+700,inp:0,tap:null};
      case 'upload': return {...base,stage:'idle',st:0};
      case 'trash': return {...base,items:['🥫','🍌','📦','🧃','🦴','🍂'].map(e=>({e,x:rnd(25,195),y:rnd(30,210),gone:false})),drag:null};
      case 'route': return {...base,nodes:[0,1,2,3,4].map(i=>{ const ty=rnd(40,200); let y=rnd(40,200); if(Math.abs(y-ty)<45) y=ty>120?ty-85:ty+85; return {x:40+i*60,y,ty,lock:false}; }),drag:null};
      case 'aim': return {...base,hits:0,tg:this.spawn(now),miss:null};
    }
    return base;
  }
  tick(){
    const S=this.state, now=performance.now(); if(!S.k||S.done) return; let up=null;
    if(S.k==='calibrate') up={nt:now};
    else if(S.k==='samples'&&S.stage==='run'){ up={nt:now}; if(now-S.st>=this.D.samp){ up.stage='pick'; this.ok(3); } }
    else if(S.k==='upload'&&S.stage==='run'){ up={nt:now}; if(now-S.st>=this.D.up){ this.setState(up); this.win(); return; } }
    else if(S.k==='reactor'){ up={nt:now}; if(S.showing&&now-S.ss>(this.D.seq+S.round)*700) { up.showing=false; up.inp=0; } if(S.tap&&now>S.tap.u) up.tap=null; }
    else if(S.k==='aim'){ up={nt:now}; if(now-S.tg.b>AIM_LIFE) up.tg=this.spawn(now); if(S.miss&&now>S.miss.u) up.miss=null; }
    if(up) this.setState(up);
  }
  tone(f,d,type,vol){ try{ const A=this.ac||(this.ac=new (window.AudioContext||window.webkitAudioContext)()); const o=A.createOscillator(), g=A.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,A.currentTime); g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d); o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime+d); }catch(e){} }
  ok(n){ this.tone(560+(n||0)*70,.08,'triangle',.05); }
  win(){ if(this.state.done||this.won) return; this.won=true; this.setState({done:true,err:''}); [523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.15,'triangle',.06),i*90)); this.dt=setTimeout(()=>{ if(this.props.onDone) this.props.onDone(); },750); }
  fail(msg){ this.tone(160,.22,'sawtooth',.05); this.setState({err:msg,errAt:Date.now()}); clearTimeout(this.et); this.et=setTimeout(()=>this.setState({err:''}),1400); }
  pt(e){ const el=this.svgRef.current; if(!el) return {x:0,y:0}; const r=el.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*320,y:(e.clientY-r.top)/r.height*240}; }
  down(e){
    const S=this.state; if(S.done) return; const p=this.pt(e); try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
    if(S.k==='wires'){ const i=[0,1,2,3].find(i=>!S.conn.includes(i)&&p.x<80&&Math.abs(p.y-WY[i])<24); if(i!=null) this.setState({drag:{c:i,x:p.x,y:p.y}}); }
    else if(S.k==='swipe'){ const cx=20+S.cx*210; if(p.x>=cx-20&&p.x<=cx+92&&p.y>=90&&p.y<=190) this.setState({dragging:true,t0:performance.now(),off:p.x-cx}); }
    else if(S.k==='trash'){ let b=-1,bd=38; S.items.forEach((it,i)=>{ if(it.gone) return; const d=Math.hypot(p.x-it.x,p.y-it.y); if(d<bd){ bd=d; b=i; } }); if(b>=0) this.setState({drag:{i:b,dx:p.x-S.items[b].x,dy:p.y-S.items[b].y}}); }
    else if(S.k==='route'){ let i=-1,bd=40; S.nodes.forEach((n,k)=>{ if(n.lock) return; const d=Math.hypot(p.x-n.x,p.y-n.y); if(d<bd){ bd=d; i=k; } }); if(i>=0) this.setState({drag:{i}}); }
    else if(S.k==='aim'){ const t=S.tg; if(Math.hypot(p.x-t.x,p.y-t.y)<34){ const h=S.hits+1; this.ok(h); if(h>=this.D.aim){ this.setState({hits:h}); this.win(); } else this.setState({hits:h,tg:this.spawn(performance.now())}); } else this.setState({miss:{x:p.x,y:p.y,u:performance.now()+300}}); }
  }
  move(e){
    const S=this.state; if(S.done) return;
    if(S.k==='wires'&&S.drag){ const p=this.pt(e); this.setState({drag:{...S.drag,x:p.x,y:p.y}}); }
    else if(S.k==='swipe'&&S.dragging){ const p=this.pt(e); this.setState({cx:Math.max(0,Math.min(1,(p.x-S.off-20)/210))}); }
    else if(S.k==='trash'&&S.drag){ const p=this.pt(e), items=S.items.slice(), it=items[S.drag.i]; items[S.drag.i]={...it,x:Math.max(15,Math.min(305,p.x-S.drag.dx)),y:Math.max(18,Math.min(225,p.y-S.drag.dy))}; this.setState({items}); }
