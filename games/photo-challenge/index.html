<!--
    ==========================================================================
     تحدي الصور (Photo Challenge) — لعبة أصلية (Native) داخل مستودع
     Project-Testing، بنفس نمط games/team-war من ناحية طريقة التحميل فقط:
     كلمتان مفتاحيتان منفصلتان (وحدة لكل فريق) — شاشة الإعدادات المشتركة
     js/agp-game-shell.js تدعم كلمة مفتاحية واحدة بس، فما تكفي هذي اللعبة
     (نفس سبب بناء حرب الفريقين كلعبة مستقلة). هوية بصرية مستقلة (خط Zain
     فقط + قالب "settings-no-box" منقول بالحرف من روليت القبائل)، لا اعتماد
     على js/agp-game-shell.js إطلاقاً. لا تعديل على أي ملف موجود بالمشروع.

     ⚠️ بناء تدريجي: هذا الملف حالياً يغطي شاشة الإعدادات + تبويب الاتصال
     بالبث فوقها فقط (بالضبط كما اعتُمد بالمعاينة). بقية الشاشات (اللوبي،
     المباراة، شاشة الفائز) غير مبنية بعد — تُضاف صفحة بصفحة لاحقاً.
    ==========================================================================
-->
