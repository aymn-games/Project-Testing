<title>روليت القبائل — ألعاب أيمن</title>
<!--
    صفحة أصلية (Native) للعبة "روليت القبائل"، لا تعتمد على أي موقع
    خارجي ولا على جسر postMessage (js/agp-game-bridge.js) — بعكس نسخة
    الروليت القديمة (games/roulette/agp-roulette.js، لا تزال موجودة
    بالمستودع وغير مُعدَّلة، تفتح aymn-games.github.io/roulette-game/
    بنافذة منفصلة). هذي الصفحة تحمّل AGP Core كاملاً بنفس ترتيب الصفحة
    الرئيسية (راجع docs/CLAUDE.md وdocs/ARCHITECTURE.md)، ثم
    js/agp-game-shell.js (ملف عام موجود مسبقاً بالمستودع، غير مُعدَّل
    هنا)، ثم ملف اللعبة الخاص بها. لا تسجيل دخول مطلوب بهذه الصفحة
    تحديداً — بوابة الدخول (تسجيل الدخول + موافقة الأدمن) تحدث فعلياً
    بالصفحة الرئيسية قبل ما يوصل الزائر لرابط "العب الآن" أصلاً (نفس
    آلية بقية الألعاب).
-->
</head>

     بعد agp-player-manager.js (تستمع لأحداثه) وقبل agp-game-shell.js
     (يوفّر حاويتَي البانر/البطاقات المستقرة بشاشة اللوبي). راجع
     js/agp-entrance.js. -->
<script src="../../js/agp-entrance.js"></script>

<!-- شاشة الإعدادات + الاتصال بتيك توك + اللوبي (عام، موجود مسبقاً) -->
<script src="../../js/agp-game-shell.js"></script>

<!-- منطق لعبة روليت القبائل نفسها -->
<script src="agp-tribe-roulette.js"></script>
