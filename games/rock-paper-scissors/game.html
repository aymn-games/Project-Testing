<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حجرة ورقة مقص — البطولة</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Zain:wght@400;700;800;900&display=swap" rel="stylesheet">
<!-- «three» لازم يطابق الرابط اللي يستورده games/birthday-party/rig3d.js حرفياً
     (three.module.js مو .min) عشان تكون نسخة Three.js وحدة للمشهد والشخصيات. -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<!-- شاشة بطولة «حجرة ورقة مقص» على البث:
     - فترة الدخول: أي مشاهد يكتب 1 أو 2 أو 3 بالشات يدخل وتطلع له شخصية بالساحة.
     - كل دور: اللاعبين ينقسمون أزواج، وكل واحد يكتب 1 حجرة · 2 ورقة · 3 مقص.
       الفائز يتأهل والخاسر يطلع للمتفرجين، والتعادل يعيد المواجهة، لين يبقى بطل.
     - المنطق: rps-engine.js · المشهد: rps-scene.js (لو فشل الثري دي تشتغل لوحة ثنائية الأبعاد).
     - الإعدادات من index.html (localStorage 'rps-settings'). -->
<style>
    :root{ --rock:#b8926a; --paper:#7fa7c4; --scis:#c4706a; --gold:#d2b277; --ink:#f1ede4; --muted:#a7a299; --glass:rgba(15,17,22,.74); --line:rgba(255,255,255,.10); }
    html,body{ margin:0; height:100%; background:#0b0d11; overflow:hidden; }
    body{ font-family:'IBM Plex Sans Arabic',sans-serif; color:var(--ink); direction:rtl; }
    button{ font-family:inherit; }
    bdi{ unicode-bidi:isolate; }
    .hidden{ display:none !important; }
    #stage{ position:fixed; inset:0; }
    #stage canvas{ display:block; }
    .vignette{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 60%, rgba(5,6,9,.5) 100%); }

    /* ===== الترويسة ===== */
    header{ position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px clamp(12px,1.4vw,26px); pointer-events:none; }
    header > *{ pointer-events:auto; }
    .hgroup{ display:flex; align-items:center; gap:10px; }
    .hbtn{ height:40px; padding:0 16px; border-radius:999px; display:flex; align-items:center; gap:8px; font:600 14px 'IBM Plex Sans Arabic'; white-space:nowrap; cursor:pointer; color:#e7e3ef;
        border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); transition:transform .15s, background .2s; }
    .hbtn:hover{ background:rgba(34,38,46,.85); }
    .hbtn:active{ transform:scale(.97); }
    .hbtn.exit{ color:#e3b3ab; border-color:rgba(196,112,106,.3); }
    .pill-status{ height:40px; padding:0 14px; border-radius:999px; display:flex; align-items:center; gap:8px; font:600 13px 'IBM Plex Sans Arabic'; border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .pill-status i{ width:8px; height:8px; border-radius:50%; background:#c4706a; }
    .pill-status.on i{ background:#7fb38a; }
    .count{ height:40px; padding:0 16px; border-radius:999px; display:flex; align-items:center; gap:8px; font:800 18px 'Zain'; border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    .count small{ font:500 13px 'IBM Plex Sans Arabic'; opacity:.75; }

    /* ===== العنوان والعداد ===== */
    .top{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:19; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; text-align:center; }
    .title{ font:900 clamp(26px,2.6vw,44px)/1 'Zain'; letter-spacing:.5px; text-shadow:0 2px 14px rgba(0,0,0,.55); }
    .title b{ background:linear-gradient(180deg,#f4ead6,#cfae72); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .stage-name{ padding:5px 18px; border-radius:999px; font:800 clamp(15px,1.2vw,20px) 'Zain'; color:#e9dcc0; background:var(--glass); border:1px solid rgba(210,178,119,.4); }
    .timer{ position:relative; width:78px; height:78px; margin-top:4px; }
    .timer svg{ position:absolute; inset:0; transform:rotate(-90deg); }
    .timer circle{ fill:none; stroke-width:5; }
    .timer .bg{ stroke:rgba(255,255,255,.1); }
    .timer .fg{ stroke:url(#tg); stroke-linecap:round; transition:stroke-dashoffset .25s linear; }
    .timer span{ position:absolute; inset:0; display:grid; place-items:center; font:900 32px 'Zain'; }
    .timer.low span{ color:#e3a49b; animation:beat 1s infinite; }
    @keyframes beat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }

    /* ===== شريط الخيارات ===== */
    .picks{ position:fixed; bottom:clamp(14px,2.2vh,26px); left:50%; transform:translateX(-50%); z-index:19; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; width:min(92vw,760px); }
    .hint{ font:700 clamp(15px,1.25vw,21px) 'IBM Plex Sans Arabic'; padding:8px 20px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-align:center; }
    .hint b{ color:#e6cd98; }
    .cards{ display:flex; gap:clamp(8px,1vw,16px); width:100%; justify-content:center; }
    .pc{ flex:1; max-width:220px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border-radius:18px; background:var(--glass); border:1px solid color-mix(in srgb,var(--c) 45%,transparent); box-shadow:0 8px 24px rgba(0,0,0,.3); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .pc .n{ width:clamp(40px,3.2vw,52px); height:clamp(40px,3.2vw,52px); border-radius:12px; display:grid; place-items:center; font:900 clamp(26px,2.2vw,34px) 'Zain'; color:#15171c; background:var(--c); flex:none; }
    .pc .l{ font:800 clamp(18px,1.6vw,26px) 'Zain'; display:flex; align-items:center; gap:8px; }
    .pc .e{ font-size:clamp(22px,1.9vw,30px); }

    /* ===== تحكم الستريمر ===== */
    .stats{ position:fixed; bottom:clamp(14px,2.2vh,26px); left:clamp(12px,1.4vw,26px); z-index:19; padding:10px 14px; border-radius:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font:600 13px 'IBM Plex Sans Arabic'; display:flex; flex-direction:column; gap:4px; min-width:150px; }
    .stats div{ display:flex; justify-content:space-between; gap:14px; }
    .stats b{ font:800 16px 'Zain'; }

    /* ===== العد الكبير «حجرة.. ورقة.. مقص!» ===== */
    .shout{ position:fixed; inset:0; z-index:18; display:grid; place-items:center; pointer-events:none; }
    .shout span{ font:900 clamp(70px,9vw,170px)/1 'Zain'; color:#f4eee2; text-shadow:0 6px 24px rgba(0,0,0,.6), 0 0 40px color-mix(in srgb,var(--c,#d2b277) 45%,transparent); animation:shout .6s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes shout{ 0%{ opacity:0; transform:scale(.4) rotate(-6deg); } 60%{ opacity:1; transform:scale(1.12) rotate(2deg); } 100%{ opacity:1; transform:scale(1); } }
    .banner{ position:fixed; top:34%; left:50%; transform:translate(-50%,-50%); z-index:18; pointer-events:none; padding:16px 44px; border-radius:26px; font:900 clamp(34px,4vw,64px)/1.1 'Zain'; color:#f1ead9; background:rgba(15,17,22,.88); border:1px solid rgba(210,178,119,.55); box-shadow:0 20px 60px rgba(0,0,0,.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; text-align:center; }
    .banner small{ display:block; font:600 clamp(15px,1.3vw,21px) 'IBM Plex Sans Arabic'; color:var(--muted); margin-top:6px; }
    @keyframes pop{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.7); } 100%{ opacity:1; transform:translate(-50%,-50%) scale(1); } }

    /* ===== شريط المواجهة الحالية ===== */
    .vs-bar{ position:fixed; top:clamp(150px,19vh,190px); left:50%; transform:translateX(-50%); z-index:19; display:flex; align-items:center; gap:clamp(10px,1.4vw,22px); direction:ltr; pointer-events:none; animation:pop2 .45s cubic-bezier(.2,1.3,.4,1) both; }
    @keyframes pop2{ from{ opacity:0; transform:translate(-50%,-12px) scale(.9); } to{ opacity:1; transform:translate(-50%,0); } }
    .vs-p{ display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); min-width:0; max-width:34vw; }
    .vs-p.r{ flex-direction:row-reverse; padding:8px 8px 8px 16px; }
    .vs-av{ width:46px; height:46px; border-radius:50%; flex:none; background:#4a5263 center/cover; display:grid; place-items:center; font:900 22px 'Zain'; border:2px solid rgba(210,178,119,.7); }
    .vs-t{ display:flex; flex-direction:column; direction:rtl; min-width:0; }
    .vs-n{ font:800 clamp(17px,1.5vw,24px)/1.1 'Zain'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .vs-s{ font:600 12.5px 'IBM Plex Sans Arabic'; color:var(--muted); }
    .vs-s.ok{ color:#9cc7a3; }
    .vs-d{ display:flex; gap:5px; margin-top:4px; }
    .vs-d i{ width:11px; height:11px; border-radius:50%; border:1.5px solid rgba(210,178,119,.6); }
    .vs-d i.on{ background:var(--gold); border-color:var(--gold); }
    .vs-mid{ display:flex; flex-direction:column; align-items:center; gap:2px; }
    .vs-at{ font:700 12.5px 'IBM Plex Sans Arabic'; color:var(--muted); white-space:nowrap; direction:rtl; }
    .vs-x{ font:900 clamp(24px,2.2vw,36px) 'Zain'; color:#e6d3a8; text-shadow:0 2px 10px rgba(0,0,0,.5); }

    /* ===== البطل ===== */
    .champ{ position:fixed; top:clamp(110px,15vh,170px); right:clamp(12px,3vw,60px); z-index:22; width:min(360px,86vw); padding:22px; border-radius:28px; text-align:center;
        background:rgba(15,17,22,.86); border:1px solid rgba(210,178,119,.6); box-shadow:0 20px 60px rgba(0,0,0,.5); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); animation:rise .6s cubic-bezier(.2,1.2,.4,1) both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(30px) scale(.95); } to{ opacity:1; transform:none; } }
    .champ .crown{ font-size:46px; line-height:1; }
    .champ .k{ font:800 18px 'Zain'; color:#e6cd98; margin-top:6px; }
    .champ .av{ width:110px; height:110px; margin:12px auto; border-radius:50%; border:3px solid var(--gold); background:#4a5263 center/cover; display:grid; place-items:center; font:900 46px 'Zain'; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    .champ .nm{ font:900 34px/1.15 'Zain'; word-break:break-word; }
    .champ .sub{ font:500 14px 'IBM Plex Sans Arabic'; opacity:.8; margin-top:6px; }
    .champ .next{ margin-top:14px; padding:8px 14px; border-radius:999px; background:rgba(210,178,119,.1); border:1px solid rgba(210,178,119,.35); font:600 14px 'IBM Plex Sans Arabic'; color:#e6cd98; }

    /* ===== لوحة ثنائية الأبعاد (لو فشل الثري دي) ===== */
    .flat{ position:fixed; inset:190px 16px 190px; z-index:5; overflow:auto; display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start; justify-content:center; }
    .flat .duel{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:260px; padding:12px 16px; border-radius:18px; background:var(--glass); border:1px solid var(--line); font:700 16px 'IBM Plex Sans Arabic'; }
    .flat .duel em{ font:900 18px 'Zain'; color:#d2b277; font-style:normal; }
    .flat .duel .w{ color:#e6cd98; } .flat .duel .x{ opacity:.45; text-decoration:line-through; }
    .flat .pl{ padding:8px 14px; border-radius:999px; background:var(--glass); border:1px solid var(--line); font:600 15px 'IBM Plex Sans Arabic'; }
    .toast{ position:fixed; top:110px; left:50%; transform:translateX(-50%); z-index:30; padding:10px 22px; border-radius:999px; background:rgba(15,17,22,.92); border:1px solid var(--line); font:600 14px 'IBM Plex Sans Arabic'; }

    @media (max-width:700px){
        .top{ top:64px; } .timer{ width:62px; height:62px; } .timer span{ font-size:26px; }
        .stats{ display:none; } .pc{ padding:8px 10px; } .pc .l .e{ display:none; }
        .champ{ top:auto; bottom:150px; right:50%; transform:translateX(50%); animation:none; }
    }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div class="vignette"></div>
<div class="flat hidden" id="flat"></div>

<header>
    <div class="hgroup">
        <button type="button" class="hbtn exit" id="exit">✕ خروج</button>
        <div class="pill-status" id="stream"><i></i><span id="stream-t">البث غير متصل</span></div>
    </div>
    <div class="count" id="count"><span id="count-n">0</span><small id="count-l">لاعب</small></div>
</header>

<div class="top">
    <div class="title"><b>حجرة ورقة مقص</b></div>
    <div class="stage-name" id="stage-name">فترة الدخول</div>
    <div class="timer" id="timer">
        <svg viewBox="0 0 80 80"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#e9d6a8"/><stop offset="1" stop-color="#b8935a"/></linearGradient></defs>
            <circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" id="timer-fg" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
        <span id="timer-n">60</span>
    </div>
</div>

<div class="vs-bar hidden" id="vs">
    <div class="vs-p" id="vs-a"><div class="vs-av"></div><div class="vs-t"><bdi class="vs-n"></bdi><span class="vs-s"></span><span class="vs-d"><i></i><i></i></span></div></div>
    <div class="vs-mid"><div class="vs-x">VS</div><div class="vs-at" id="vs-at"></div></div>
    <div class="vs-p r" id="vs-b"><div class="vs-av"></div><div class="vs-t"><bdi class="vs-n"></bdi><span class="vs-s"></span><span class="vs-d"><i></i><i></i></span></div></div>
</div>

<div class="picks">
    <div class="hint" id="hint">اكتب <b>1</b> أو <b>2</b> أو <b>3</b> بالشات عشان تدخل البطولة</div>
    <div class="cards">
        <div class="pc" style="--c:var(--rock)"><span class="l"><span class="e">✊</span>حجرة</span><span class="n">1</span></div>
        <div class="pc" style="--c:var(--paper)"><span class="l"><span class="e">✋</span>ورقة</span><span class="n">2</span></div>
        <div class="pc" style="--c:var(--scis)"><span class="l"><span class="e">✌️</span>مقص</span><span class="n">3</span></div>
    </div>
</div>

<div class="stats" id="stats">
    <div><span>المواجهة</span><b id="st-duels">—</b></div>
    <div><span>باقي بالبطولة</span><b id="st-alive">—</b></div>
</div>

<div class="shout hidden" id="shout"><span id="shout-t"></span></div>
<div class="banner hidden" id="banner"></div>
<div class="champ hidden" id="champ">
    <div class="crown">👑</div>
    <div class="k">بطل البطولة</div>
    <div class="av" id="champ-av"></div>
    <div class="nm"><bdi id="champ-nm"></bdi></div>
    <div class="sub" id="champ-sub"></div>
    <div class="next" id="champ-next"></div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-events.js"></script>
<script src="../../js/agp-timer-manager.js"></script>
<script src="../../js/agp-storage-manager.js"></script>
<script src="../../js/agp-services.js"></script>
<script src="../../js/agp-stream-connector.js"></script>
<script src="../../js/agp-keyword-manager.js"></script>
<script src="../../js/agp-queue-manager.js"></script>
<script src="../../adapters/agp-tiktok-adapter.js"></script>
<script src="../../auth/auth-client.js"></script>
<script src="../../js/agp-stream-overlay.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<script src="rps-engine.js"></script>
<script>
(function () {
    'use strict';
    var AGP = window.AymanGamesPlatform || {};
    var log = (AGP.log || function () {});
    var E = window.RpsEngine;
    var SETTINGS_KEY = 'rps-settings', CONN_KEY = 'agp:agp-stream-connection';
    var DEF = { joinSec: 60, pickSec: 12, maxPlayers: 32 };
    var NEXT_MS = 15000; // بعد إعلان البطل تبدأ فترة دخول جديدة لحالها
    var SHAKE_MS = 1800, REVEAL_MS = 1700, KO_MS = 3400, ROUND_MS = 2400, WALK_MS = 2300, TIE_MS = 1700, POINT_MS = 1500;
    var PICK = { 1: { n: 'حجرة', e: '✊', c: '#b8926a' }, 2: { n: 'ورقة', e: '✋', c: '#7fa7c4' }, 3: { n: 'مقص', e: '✌️', c: '#c4706a' } };
    var C = { win: '#4f8a63', lose: '#a8463e', tie: '#a88a4e', bye: '#55617a', none: '#5b616c' };

    function $(id) { return document.getElementById(id); }
    function readJSON(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
    function clampInt(v, a, b, d) { v = parseInt(v, 10); return isNaN(v) ? d : Math.max(a, Math.min(b, v)); }
    var saved = readJSON(SETTINGS_KEY, {}) || {};
    var S = { joinSec: clampInt(saved.joinSec, 15, 300, DEF.joinSec), pickSec: clampInt(saved.pickSec, 5, 60, DEF.pickSec), maxPlayers: clampInt(saved.maxPlayers, 2, 64, DEF.maxPlayers) };

    function toast(t) { var el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.add('hidden'); }, 2800); }
    function go(url) { try { if (window.top !== window) { window.top.location.href = url; return; } } catch (e) {} location.href = url; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    // ---------------------------------------------------------------- الحالة
    var G, phase, phaseEnds, timers = [], openIds, joinedAt, matchStartedAt, reported, revealInfo, cur, gone, koKind, outcome;
    function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }

    function reset() {
        clearTimers();
        G = E.create({ maxPlayers: S.maxPlayers });
        phase = 'join'; phaseEnds = Date.now() + S.joinSec * 1000; openIds = {}; joinedAt = {}; reported = false; revealInfo = {}; cur = -1; gone = {}; koKind = 1; outcome = null;
        matchStartedAt = 0;
        $('champ').classList.add('hidden'); hideBanner(); $('shout').classList.add('hidden');
        render();
    }

    // ---------------------------------------------------------------- الشات
    function onComment(p) {
        if (!p || typeof p.text !== 'string' || !p.id) return;
        var choice = E.parsePick(p.text);
        if (!choice) return;
        if (phase === 'join') {
            if (G.player(p.id)) { G.touch(p); return; }
            if (G.join({ id: p.id, name: p.name || p.uniqueId || p.id, avatarUrl: p.avatarUrl })) { joinedAt[p.id] = Date.now(); render(); later(render, 2300); }
            else if (G.players.length >= G.maxPlayers) toast('البطولة اكتملت (' + G.maxPlayers + ' لاعب)');
            return;
        }
        if (phase !== 'pick' || !openIds[p.id]) return;
        if (G.pick(p.id, choice)) {
            render();
            // الكل اختار؟ نختصر الوقت
            var all = Object.keys(openIds).every(function (id) { var d = G.duelOf(id); return !d || d.picks[id]; });
            if (all && phaseEnds - Date.now() > 1200) { phaseEnds = Date.now() + 1000; }
        }
    }

    // ---------------------------------------------------------------- مراحل الدور
    // المواجهات تنلعب وحدة وحدة بنفس المكان (الكاميرا قريبة وثابتة عليه):
    // الاثنين يمشون للمكان ← يكتبون اختيارهم ← «حجرة.. ورقة.. مقص!» ← يطلع اللي بيدهم
    // ← الفائز يحتفل ويرجع للطابور، والخاسر ينقصى بشكل مضحك ويختفي.
    function startTournament() {
        if (phase !== 'join') return;
        if (G.players.length < 2) { phaseEnds = Date.now() + 15000; return; }
        G.startRound(); matchStartedAt = Date.now();
        roundIntro();
    }
    function roundIntro() {
        phase = 'round'; phaseEnds = 0; cur = -1; openIds = {}; gone = {};
        var n = G.duels.length;
        showBanner(G.stageName(), n === 1 ? 'مواجهة وحدة على اللقب' : n + ' مواجهات' + (G.bye ? ' · ولاعب يتأهل مباشرة' : ''));
        render();

    function advance() {

    function reportPoints() {

        var A = window.AGPAuth;
        if (A && typeof A.reportMatchPoints === 'function') {
            A.reportMatchPoints({
                players: G.players.map(function (p) { return { id: p.id, name: p.name }; }),
                winnerIds: G.champion ? [G.champion] : [],

    // ---------------------------------------------------------------- الواجهة

    function showBanner(t, sub) { var b = $('banner'); b.innerHTML = esc(t) + (sub ? '<small>' + esc(sub) + '</small>' : ''); b.classList.remove('hidden'); b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }
    function hideBanner() { $('banner').classList.add('hidden'); }

    function tickTimer() {

        var total = (phase === 'join' ? S.joinSec : S.pickSec) * 1000, left = Math.max(0, phaseEnds - Date.now());

        if (left <= 0) {

            else if (phase === 'pick') shake();

    setInterval(tickTimer, 200);

    function render() {

        $('count-n').textContent = inJoin ? players.length : alive.length;
        $('count-l').textContent = inJoin ? ('لاعب من ' + G.maxPlayers) : 'باقي من ' + players.length;
        $('stage-name').textContent = inJoin ? 'فترة الدخول' : phase === 'champion' ? 'انتهت البطولة' : G.stageName();
        var hint = $('hint');

        else if (phase === 'pick') hint.innerHTML = 'الاثنين اللي بالمواجهة: اكتبوا <b>1</b> حجرة · <b>2</b> ورقة · <b>3</b> مقص — من يكسب محاولتين يفوز';
        else if (phase === 'champion') hint.innerHTML = '👑 مبروك للبطل!';
        else hint.innerHTML = 'الحجرة تكسر المقص · المقص يقص الورقة · الورقة تلف الحجرة';

    }

    function renderVs() {

        [['vs-a', d.a], ['vs-b', d.b]].forEach(function (x) {

            box.querySelector('.vs-n').textContent = p.name;
            if (p.avatarUrl) { av.style.backgroundImage = 'url("' + p.avatarUrl.replace(/"/g, '%22') + '")'; av.textContent = ''; }
            else { av.style.backgroundImage = ''; av.textContent = Array.from(p.name.replace(/[\s_.@\d]/g, ''))[0] || '؟'; }
            var t = '', ok = false;
            if (phase === 'pick') { ok = !!d.picks[x[1]]; t = ok ? '✓ اختار' : 'ينتظر اختياره...'; }
            else if ((phase === 'reveal' || phase === 'result') && mine) t = PICK[mine].e + ' ' + PICK[mine].n;
            else if (phase === 'walk') t = 'جاي للمواجهة';
            if (phase === 'result' && outcome && outcome.result === 'done') { ok = d.winner === x[1]; t = ok ? '🏆 فاز بالمواجهة' : '💥 انقصى'; }
            else if (phase === 'result' && outcome && outcome.result === 'point') { ok = outcome.w === x[1]; t = ok ? '✓ كسب المحاولة' : 'خسر المحاولة'; }
            st.textContent = t; st.classList.toggle('ok', ok);

            var dots = box.querySelectorAll('.vs-d i'), w = d.wins[x[1]] || 0;
