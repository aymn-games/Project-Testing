<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حجرة ورقة مقص — لوبي الدخول</title>
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- لوبي دخول «حجرة ورقة مقص» — نفس تنسيق لوبي «روليت الإقصاء» (games/elimination-roulette/lobby.html).
     المشاهد يكتب كلمة الدخول بالشات (المتابعين فقط لو انختار بالإعدادات) ويطلع اسمه هنا،
     والمذيع يقدر يشيل أي لاعب بـ ×، وبعدها «ابدأ المباراة» يحفظ اللاعبين بـ localStorage 'rps-roster'
     ويروح لـ game.html. الإعدادات من index.html ('rps-settings')؛ بدون كلمة دخول نرجع لها. -->
<style>
    html,body{ margin:0; height:100%; background:#07060b; overflow:hidden; }
    body{ direction:rtl; font-family:'IBM Plex Sans Arabic',sans-serif; color:#f4f2f8; }
    button{ font-family:inherit; }
    [data-noscroll]::-webkit-scrollbar{ display:none; }
    @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
    .root{ position:fixed; inset:0; overflow:hidden; background:#07060b; }
    .fx{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .fx .g{ position:absolute; border-radius:50%; filter:blur(40px); }
    .fx .s{ position:absolute; border-radius:50%; }
    .fx .q{ position:absolute; }

    header{ position:fixed; top:0; left:0; right:0; z-index:50; height:80px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:clamp(10px,1.2vw,24px); padding:0 clamp(12px,1.25vw,24px); box-sizing:border-box; background:rgba(10,9,15,.72); border-bottom:1px solid rgba(255,255,255,.07); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
    .exit{ height:clamp(32px,2.3vw,42px); padding:0 clamp(10px,.9vw,16px); border-radius:999px; display:flex; align-items:center; gap:clamp(6px,.45vw,8px); font:600 clamp(12px,.78vw,15px) 'IBM Plex Sans Arabic'; white-space:nowrap; cursor:pointer; transition:all .2s; border:1px solid rgba(248,113,113,.25); background:rgba(255,255,255,.03); color:#fca5a5; text-decoration:none; }
    .exit:hover{ background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.45); }
    .logo{ height:60px; display:grid; place-items:center; }
    .logo img{ height:60px; max-width:none; object-fit:contain; filter:drop-shadow(0 0 14px rgba(139,92,246,.45)); }

    main{ position:fixed; top:80px; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; }
    .wrap{ width:100%; max-width:1080px; height:100%; box-sizing:border-box; padding:0 clamp(12px,2.5vw,32px); display:flex; flex-direction:column; }
    .head{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:10px; padding:clamp(6px,1.2vh,12px) 0 clamp(14px,2.6vh,26px); text-align:center; }
    .gname{ font:600 clamp(14px,1.4vw,18px) 'IBM Plex Sans Arabic'; color:#a8a3b5; letter-spacing:.5px; }
    .title{ font:700 clamp(32px,4.2vw,56px)/1.1 'IBM Plex Sans Arabic'; background:linear-gradient(180deg,#f4f2f8,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* بطاقة اللاعبين */
    .panel{ flex:1; min-height:0; display:flex; flex-direction:column; border-radius:26px; background:rgba(18,16,26,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1.5px solid rgba(167,139,250,.45); box-shadow:0 20px 60px rgba(0,0,0,.3), 0 0 50px rgba(167,139,250,.14); overflow:hidden; position:relative; margin-bottom:8px; }
    .halo{ position:absolute; top:-100px; left:50%; width:460px; height:200px; margin-left:-230px; border-radius:50%; background:rgba(167,139,250,.14); filter:blur(44px); pointer-events:none; }
    .ptop{ position:relative; flex-shrink:0; display:flex; flex-direction:column; gap:14px; padding:clamp(16px,2vw,24px) clamp(18px,2.2vw,28px); border-bottom:1px solid rgba(255,255,255,.06); }
    .prow{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .pname{ display:flex; align-items:center; gap:10px; min-width:0; font:700 clamp(18px,1.7vw,22px) 'IBM Plex Sans Arabic'; color:#a78bfa; }
    .pname i{ width:12px; height:12px; flex-shrink:0; border-radius:50%; background:#a78bfa; box-shadow:0 0 14px #a78bfa; }
    .who{ font:600 12px 'IBM Plex Sans Arabic'; color:#c4b5fd; padding:3px 10px; border-radius:999px; background:rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.3); }
    .cnt{ flex-shrink:0; display:flex; align-items:baseline; gap:4px; padding:6px 14px; border-radius:999px; background:rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.3); }
    .cnt b{ font:700 20px 'IBM Plex Sans Arabic'; color:#a78bfa; font-variant-numeric:tabular-nums; }
    .cnt span{ font:500 13px 'IBM Plex Sans Arabic'; color:#8a8596; }
    .kwl{ font:500 13px 'IBM Plex Sans Arabic'; color:#8a8596; }
    .kw{ align-self:stretch; text-align:center; box-sizing:border-box; padding:10px 22px; border-radius:999px; background:rgba(167,139,250,.1); border:1.5px dashed #a78bfa; font:700 clamp(24px,3vw,36px)/1.2 'IBM Plex Sans Arabic'; color:#a78bfa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .plist{ position:relative; flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; padding:clamp(12px,1.6vw,20px); }
    .empty{ height:100%; min-height:140px; display:grid; place-items:center; border-radius:18px; border:1.5px dashed rgba(255,255,255,.1); color:#8a8596; font:500 14px 'IBM Plex Sans Arabic'; text-align:center; padding:20px; box-sizing:border-box; }
    .empty[hidden], .toast[hidden]{ display:none; }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
    .pl{ min-width:0; display:flex; align-items:center; gap:10px; height:54px; padding:0 8px 0 7px; box-sizing:border-box; border-radius:999px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07); animation:rise .4s cubic-bezier(.2,1.3,.4,1) both; }
    .av{ width:40px; height:40px; flex-shrink:0; border-radius:50%; position:relative; overflow:hidden; display:grid; place-items:center; background:linear-gradient(135deg,#7c3aed,#a78bfa); border:1.5px solid #a78bfa; box-sizing:border-box; font:700 16px 'IBM Plex Sans Arabic'; color:#fff; }
    .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .nm{ flex:1; min-width:0; font:600 14px 'IBM Plex Sans Arabic'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kick{ width:30px; height:30px; flex-shrink:0; border:none; background:transparent; padding:0; color:#fca5a5; cursor:pointer; display:grid; place-items:center; opacity:.75; transition:opacity .2s, transform .2s; }
    .kick:hover{ opacity:1; transform:scale(1.15); }

    .foot{ flex-shrink:0; display:flex; justify-content:center; padding:clamp(10px,2vh,18px) 0 clamp(16px,3vh,28px); }
    .start{ width:100%; max-width:400px; height:clamp(52px,6.5vh,62px); border:none; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; background:linear-gradient(90deg,#7c3aed,#a855f7); color:#fff; font:700 clamp(17px,1.6vw,20px) 'IBM Plex Sans Arabic'; box-shadow:0 10px 34px rgba(139,92,246,.45), inset 0 1px 0 rgba(255,255,255,.2); }
    .start:hover{ filter:brightness(1.1); }
    .start:active{ transform:scale(.97); }
    .toast{ position:fixed; top:96px; left:50%; transform:translateX(-50%); z-index:90; padding:10px 22px; border-radius:999px; background:rgba(12,11,18,.94); border:1px solid rgba(248,113,113,.4); color:#fca5a5; font:600 14px 'IBM Plex Sans Arabic'; box-shadow:0 20px 50px rgba(0,0,0,.5); animation:rise .3s ease; white-space:nowrap; }
    @media (max-width:820px){ .exit span{ display:none; } .grid{ grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); } }
</style>
</head>
<body>
<div class="root">
    <div class="fx" id="fx" aria-hidden="true"></div>
    <header>
        <div style="display:flex;justify-content:flex-start">
            <a class="exit" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>خروج</span></a>
        </div>
        <div class="logo"><img src="../../logo.png" alt="ألعاب أيمن"></div>
        <div></div>
    </header>

    <main>
        <div class="wrap">
            <div class="head">
                <span class="gname">حجرة ورقة مقص</span>
                <span class="title">لوبي الدخول</span>
            </div>
            <section class="panel">
                <span class="halo"></span>
                <div class="ptop">
                    <div class="prow">
                        <span class="pname"><i></i>اللاعبين <span class="who" id="who"></span></span>
                        <span class="cnt"><b id="cnt">0</b><span id="cnt-max">/ 32 لاعب</span></span>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
                        <span class="kwl">كلمة الدخول · اكتبها في الشات</span>
                        <span class="kw" id="kw"></span>
                    </div>
                </div>
                <div class="plist" data-noscroll="">
                    <div class="empty" id="empty">بانتظار انضمام اللاعبين…</div>
                    <div class="grid" id="grid"></div>
                </div>
            </section>
            <div class="foot">
                <button type="button" class="start" id="start">ابدأ المباراة<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
            </div>
        </div>
    </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../../js/agp-core.js"></script>
<script src="../../js/agp-events.js"></script>
<script src="../../js/agp-timer-manager.js"></script>
<script src="../../js/agp-storage-manager.js"></script>
<script src="../../js/agp-services.js"></script>
<script src="../../js/agp-stream-connector.js"></script>
<script src="../../js/agp-keyword-manager.js"></script>
<script src="../../js/agp-queue-manager.js"></script>
<script src="../../adapters/agp-tiktok-adapter.js"></script>
<script src="../../auth/auth-client.js"></script>
<script src="../../js/agp-stream-overlay.js"></script>
<script src="../../auth/game-access-guard.js"></script>
<script src="rps-engine.js"></script>
<script src="rps-sfx.js"></script>
<script>
(function () {
    'use strict';
    var AGP = window.AymanGamesPlatform || {}, E = window.RpsEngine;
    var KEY = 'rps-settings', ROSTER_KEY = 'rps-roster', CONN = 'agp:agp-stream-connection';
    function $(id) { return document.getElementById(id); }
    function read(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
    function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    // الإعدادات من index.html — بدون كلمة دخول نرجع لها
    var S = read(KEY, null) || {};
    var KEYWORD = String(S.keyword || '').trim();
    if (!KEYWORD) { location.replace('index.html'); return; }
    var KW = E.norm(KEYWORD), FOLLOWERS = S.who === 'المتابعين فقط', MAX = Math.max(2, Math.min(64, +S.maxPlayers || 32));
    $('kw').textContent = KEYWORD;
    $('who').textContent = FOLLOWERS ? 'المتابعين فقط' : 'الجميع';
    $('cnt-max').textContent = '/ ' + MAX + ' لاعب';

    // الخلفية (نفس الإعدادات وروليت الإقصاء)
    (function fx() {
        var html = '';
        [['top:-20%;right:-10%;width:900px;height:900px', '124,58,237,.22'], ['top:30%;left:-15%;width:800px;height:800px', '139,92,246,.12'], ['bottom:-30%;left:35%;width:1000px;height:700px', '168,85,247,.1']]
            .forEach(function (g) { html += '<div class="g" style="' + g[0] + ';background:radial-gradient(circle, rgba(' + g[1] + '), transparent 65%)"></div>'; });
        for (var i = 0; i < 90; i++) { var sz = i % 9 ? 1.5 : 3; html += '<span class="s" style="left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;width:' + sz + 'px;height:' + sz + 'px;background:rgba(255,255,255,' + (.12 + Math.random() * .23).toFixed(2) + ')"></span>'; }
        [[88, 14, 14, 1], [73, 82, 18, 0], [16, 66, 10, 1], [42, 8, 12, 0]].forEach(function (q) { html += '<span class="q" style="left:' + q[0] + '%;top:' + q[1] + '%;width:' + q[2] + 'px;height:' + q[2] + 'px;' + (q[3] ? 'background:rgba(139,92,246,.45)' : 'border:1.5px solid rgba(139,92,246,.35)') + '"></span>'; });
        $('fx').innerHTML = html;
    }());

    function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2600); }
    function initial(n) { return (Array.from(String(n || '').replace(/[\s_.@\d]/g, ''))[0] || '؟').toUpperCase(); }

    // اللاعبين: [{id, name, avatarUrl}] بترتيب دخولهم
    var roster = [];
    function render() {
        $('cnt').textContent = roster.length;
        $('empty').hidden = roster.length > 0;
        $('grid').innerHTML = roster.map(function (p, i) {
            return '<div class="pl"><span class="av">' + esc(initial(p.name)) + (p.avatarUrl ? '<img src="' + esc(p.avatarUrl) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + '</span>' +
                '<span class="nm">' + esc(p.name) + '</span>' +
                '<button type="button" class="kick" data-i="' + i + '" aria-label="إقصاء ' + esc(p.name) + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button></div>';
        }).join('');
    }
    $('grid').addEventListener('click', function (e) { var b = e.target.closest('.kick'); if (!b) return; roster.splice(+b.dataset.i, 1); render(); });

    // الشات: كلمة الدخول تدخّل (المتابعين فقط لو انختار)، والممتلئ يطلع تنبيه
    function onComment(p) {
        if (!p || typeof p.text !== 'string' || !p.id) return;
        if (E.norm(p.text) !== KW) return;
        if (FOLLOWERS && !p.isFollower) return;
        var known = roster.filter(function (r) { return r.id === p.id; })[0];
        if (known) { if (p.avatarUrl) known.avatarUrl = p.avatarUrl; return; }
        if (roster.length >= MAX) return toast('اكتمل العدد');
        roster.push({ id: p.id, name: String(p.name || p.uniqueId || p.id), avatarUrl: p.avatarUrl || null });
        if (window.RpsSFX) window.RpsSFX.play('join');
        render();
    }
    if (AGP.events && typeof AGP.events.on === 'function') AGP.events.on('stream:commentReceived', onComment);
    (function connect() {
        var c = read(CONN, null);
        if (c && c.username && AGP.streamConnector && typeof AGP.streamConnector.connect === 'function') {
            try { AGP.streamConnector.connect('tiktok', { username: c.username }); } catch (e) { (AGP.log || function () {})('rps lobby: connect failed', e); }
        }
    }());

    $('start').addEventListener('click', function () {
        if (roster.length < 2) return toast('تحتاج لاعبين اثنين على الأقل');
        try { localStorage.setItem(ROSTER_KEY, JSON.stringify(roster)); } catch (e) {}
        location.href = 'game.html';
    });
    render();
    window.__rpsLobby = { get roster() { return roster; } };
}());
</script>
</body>
</html>
