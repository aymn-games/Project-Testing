  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <!-- منصات قادمة -->\n    <div class=\"soon\">\n      <span class=\"soon-ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z\"/><\u002Fsvg><\u002Fspan>\n      <div class=\"soon-txt\"><b>ألعاب منصات أخرى<\u002Fb><span>نشتغل على دعم منصات بث جديدة<\u002Fspan><\u002Fdiv>\n      <div class=\"soon-pills\"><span><i><\u002Fi>يوتيوب<\u002Fspan><span><i><\u002Fi>تويتش<\u002Fspan><span><i><\u002Fi>كيك<\u002Fspan><\u002Fdiv>\n      <span class=\"soon-badge\">قريباً<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"stats\" style=\"position:relative;padding:clamp(56px,7vw,96px) clamp(18px,4vw,60px);text-align:center\">\n    <div style=\"max-width:1500px;margin:0 auto\">\n      <div style=\"display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:40px\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.select }}\" style=\"padding:12px 28px;cursor:pointer;border-radius:999px;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px;font-weight:600;transition:background .3s,color .3s,border-color .3s;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px;text-align:start\">\n        <sc-for list=\"{{ tabStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"position:relative;overflow:hidden;padding:28px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg,rgba(32,28,51,.9),rgba(10,10,16,.92));box-shadow:0 24px 50px -34px rgba(0,0,0,.95);animation:{{ s.anim }}\">\n            <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:clamp(30px,3.4vw,42px);font-weight:700;line-height:1.3;color:#e9e2ff\">{{ s.value }}<\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:14.5px;line-height:1.7;color:#968ea4\">{{ s.label }}<\u002Fdiv>\n            <div style=\"margin-top:18px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden\">\n              <div style=\"height:100%;border-radius:4px;background:linear-gradient(90deg,#7a3fd4,#b28cf5);transition:width .9s cubic-bezier(.22,1,.36,1) .25s;width:{{ s.pct }}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section id=\"ops\" style=\"position:relative;padding:clamp(64px,8vw,110px) clamp(18px,4vw,60px)\">\n    <div style=\"max-width:1600px;margin:0 auto\">\n      <div style=\"text-align:center\">\n        <div style=\"font-size:13px;color:#b28cf5\">المساهمون<\u002Fdiv>\n        <h2 style=\"margin:12px 0 0;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:clamp(30px,4vw,50px);line-height:1.3;color:#f4f2fb\">شركاء الإبداع<\u002Fh2>\n        <p style=\"margin:16px auto 0;max-width:700px;font-size:16px;line-height:2;color:#968ea4;text-wrap:pretty\">لأن اليد الوحدة ماتصفق.. هالمساحة مخصصة للرهيبيين اللي شاركونا أفكارهم وطوروا معنا الألعاب حتى تطلع لكم بهالمظهر<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:44px;margin-top:52px\">\n        <sc-for list=\"{{ partnerGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <span style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:19px;font-weight:700;color:#e9e2ff\">{{ g.title }}<\u002Fspan>\n              <span style=\"padding:5px 12px;border-radius:999px;border:1px solid rgba(178,140,245,.3);background:rgba(122,63,212,.10);font-size:12.5px;color:#c6b4f2\">{{ g.count }}<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent)\"><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:10px 0 0;font-size:14px;line-height:1.9;color:#7c7590\">{{ g.note }}<\u002Fp>\n            <div style=\"margin-top:22px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)\">\n              <div style=\"display:flex;width:max-content;gap:16px;animation:nl-marquee {{ g.speed }} linear infinite\" style-hover=\"animation-play-state:paused\">\n              <sc-for list=\"{{ g.people }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:14px;width:260px;padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(32,28,51,.8),rgba(12,11,20,.9));transition:transform .25s,border-color .25s\" style-hover=\"transform:translateY(-4px);border-color:rgba(178,140,245,.45)\">\n                  <div style=\"flex:none;position:relative;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:repeating-linear-gradient(135deg,#2a2440 0 7px,#191527 7px 14px)\">\n                    <span style=\"position:absolute;inset:auto -2px -2px auto;width:18px;height:18px;border-radius:50%;border:2px solid #12101d;background:{{ p.dot }}\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:16px;font-weight:600;color:#f4f2fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fdiv>\n                    <a href=\"#ops\" style=\"display:block;margin-top:3px;font-size:13px;color:#b28cf5;direction:ltr;text-align:start\" style-hover=\"color:#d3bcff\">{{ p.tiktok }}<\u002Fa>\n                    <div style=\"display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#968ea4\">\n                      <span>ID<\u002Fspan><span style=\"color:#cfc7e2;direction:ltr\">{{ p.id }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ g.people }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:14px;width:260px;padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(32,28,51,.8),rgba(12,11,20,.9))\">\n                  <div style=\"flex:none;position:relative;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:repeating-linear-gradient(135deg,#2a2440 0 7px,#191527 7px 14px)\">\n                    <span style=\"position:absolute;inset:auto -2px -2px auto;width:18px;height:18px;border-radius:50%;border:2px solid #12101d;background:{{ p.dot }}\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:16px;font-weight:600;color:#f4f2fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fdiv>\n                    <span style=\"display:block;margin-top:3px;font-size:13px;color:#b28cf5;direction:ltr;text-align:start\">{{ p.tiktok }}<\u002Fspan>\n                    <div style=\"display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#968ea4\">\n                      <span>ID<\u002Fspan><span style=\"color:#cfc7e2;direction:ltr\">{{ p.id }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"padding:clamp(64px,8vw,110px) clamp(18px,4vw,60px)\">\n    <div style=\"max-width:900px;margin:0 auto\">\n      <div style=\"font-size:13px;color:#b28cf5\">٠٦ — الأسئلة الشائعة<\u002Fdiv>\n      <h2 style=\"margin:12px 0 34px;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,46px);line-height:1.25\">أسئلة يسألها اللاعبون<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09)\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n          <div style=\"background:#08080d\">\n            <button sc-camel-on-click=\"{{ q.toggle }}\" style=\"display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;padding:22px 24px;border:0;background:transparent;cursor:pointer;text-align:start;color:#e7e9ee;font-family:'Noto Kufi Arabic',sans-serif;font-size:16.5px;font-weight:600;line-height:1.5\">\n              {{ q.question }}\n              <span style=\"flex:none;font-size:20px;color:#b28cf5;transform:{{ q.rotate }};transition:transform .25s\">+<\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"max-height:{{ q.maxH }};overflow:hidden;transition:max-height .35s ease\">\n              <div style=\"padding:0 24px 24px\">\n                <p style=\"margin:0;font-size:15px;line-height:1.95;color:#9aa1b1\">{{ q.answer }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;padding:26px clamp(20px,3vw,32px);border-radius:22px;border:1px dashed rgba(178,140,245,.35);background:rgba(122,63,212,.06);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px\">\n        <div>\n          <div style=\"font-family:'Noto Kufi Arabic',sans-serif;font-size:18px;font-weight:700;color:#f4f2fb\">عندك اقتراح أو شكوى؟<\u002Fdiv>\n          <p style=\"margin:8px 0 0;max-width:520px;font-size:14.5px;line-height:1.9;color:#968ea4\">ما لقيت جوابك؟ أرسل لنا اقتراحك أو سؤالك أو بلّغ عن مشكلة، ونرد عليك في أقرب وقت.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"support-tickets.html\" class=\"nl-btn-glossy\" style=\"padding:13px 28px;border-radius:999px;background:linear-gradient(180deg,#8a4fe8,#7a3fd4);color:#f3ecff;font-weight:600;font-size:14.5px;transition:transform .25s,background .25s\" style-hover=\"transform:translateY(-3px);background:#9a6cf0;color:#f3ecff\">الاقتراحات والشكاوي<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"community\" style=\"position:relative;padding:clamp(70px,9vw,120px) clamp(18px,4vw,60px);background:rgba(8,8,13,.62);border-top:1px solid rgba(255,255,255,.08);overflow:hidden\">\n    <div style=\"position:absolute;left:50%;top:-40%;width:900px;height:900px;margin-left:-450px;background:radial-gradient(closest-side,rgba(122,63,212,.16),transparent 70%);animation:nl-pulse 6s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:820px;margin:0 auto;text-align:center\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border:1px solid rgba(122,63,212,.45);font-size:13px;color:#b28cf5;border-radius:999px\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#7a3fd4;animation:nl-pulse 1.6s ease-in-out infinite\"><\u002Fspan>\n        ٨٬٤٠٠ بث مباشر كل يوم\n      <\u002Fdiv>\n      <h2 style=\"margin:22px 0 0;font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:clamp(30px,4.6vw,56px);line-height:1.25;text-wrap:balance\">انضم إلى المجتمع<\u002Fh2>\n      <p style=\"margin:16px auto 0;max-width:560px;font-size:16px;line-height:1.95;color:#9aa1b1\">ادخل مع صنّاع المحتوى، جرّب الألعاب أول بأول، وشاركنا فكرتك الجاية.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px\">\n        <a href=\"#\" data-telegram-link=\"1\" class=\"nl-btn-glossy\" style=\"display:inline-flex;align-items:center;gap:10px;padding:13px 30px 13px 22px;background:linear-gradient(180deg,#8a4fe8,#7a3fd4);color:#f3ecff;font-weight:600;font-size:15.5px;border-radius:999px;transition:transform .25s,background .25s,box-shadow .25s;box-shadow:0 18px 40px -22px rgba(122,63,212,1)\" style-hover=\"transform:translateY(-3px);background:#9a6cf0;color:#f3ecff\">\n          <span data-telegram-icon=\"1\" style=\"flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center\"><\u002Fspan>\n          افتح تيليجرام\n        <\u002Fa>\n        <a href=\"#games\" class=\"nl-btn-glossy\" style=\"padding:15px 32px;border:1px solid rgba(255,255,255,.18);color:#e7e9ee;font-weight:500;font-size:15.5px;border-radius:999px;transition:transform .25s,border-color .25s,color .25s\" style-hover=\"transform:translateY(-3px);border-color:rgba(178,140,245,.6);color:#b28cf5\">ادخل الألعاب<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:clamp(48px,6vw,72px) clamp(18px,4vw,60px) 36px;border-top:1px solid rgba(255,255,255,.08)\">\n    <div style=\"max-width:1600px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:36px\">\n      <div>\n        <img src=\"13e20117-12cd-4402-a76c-f272cdf5c1a3\" alt=\"ألعاب أيمن\" style=\"display:block;height:56px;width:auto;opacity:.92\">\n        <p style=\"margin:16px 0 0;max-width:260px;font-size:13.5px;line-height:1.9;color:#7c7590\">ألعاب تفاعلية لصنّاع المحتوى والجمهور.. بروح وبصمة سعودية.<\u002Fp>\n      <\u002Fdiv>\n      <sc-for list=\"{{ footerCols }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"font-size:13px;color:#8b93a4\">{{ c.title }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px\">\n            <sc-for list=\"{{ c.links }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <a href=\"{{ l.href }}\" style=\"font-size:14px;color:#9aa1b1;transition:color .25s\" style-hover=\"color:#b28cf5\">{{ l.label }}<\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"max-width:1600px;margin:44px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;font-size:13px;color:#5f677a\">\n      <span>© ٢٠٢٦ ألعاب أيمن<\u002Fspan>\n      <span>جميع الحقوق محفوظة<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7a3fd4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7a3fd4&quot;,&quot;#3f5fd4&quot;,&quot;#a03fd4&quot;,&quot;#d43f86&quot;]}}\">\nclass Component extends DCLogic {\n  state = { op: 0, openFaq: 0, seasonal: false, email: \"\", joined: false, tab: 0, anim: 0 };\n\n  pickTab(idx) {\n    if (idx !== this.state.tab) this.setState(s => ({ tab: idx, tick: (s.tick || 0) + 1 }));\n  }\n\n  renderVals() {\n    const accent = this.props.accent ?? \"#7a3fd4\";\n    const ops = [\n      { name: \"فيكس\", role: \"مبارز\", body: \"مهاجم قريب المدى مع اندفاعة طورية تتجاهل أول إصابة في كل اشتباك.\",\n        stats: [{label:\"السرعة\",value:\"٩٢\",pct:\"92%\"},{label:\"الدرع\",value:\"٤٨\",pct:\"48%\"},{label:\"الأدوات\",value:\"٦١\",pct:\"61%\"}] },\n      { name: \"روك\", role: \"مثبِّت\", body: \"سواتر قابلة للنشر وبطارية درع تعيد شحن الفريق أثناء تثبيت الموقع.\",\n        stats: [{label:\"السرعة\",value:\"٥٤\",pct:\"54%\"},{label:\"الدرع\",value:\"٩٧\",pct:\"97%\"},{label:\"الأدوات\",value:\"٧٠\",pct:\"70%\"}] },\n      { name: \"هالسيون\", role: \"استطلاع\", body: \"درون نبضي يرسم محيط ٣٠ متراً ويكشف أسلحة الخصوم لثماني ثوانٍ.\",\n        stats: [{label:\"السرعة\",value:\"٧٨\",pct:\"78%\"},{label:\"الدرع\",value:\"٥٢\",pct:\"52%\"},{label:\"الأدوات\",value:\"٩٥\",pct:\"95%\"}] },\n      { name: \"ميراج\", role: \"مشوِّش\", body: \"نسخ خادعة وحقل تشويش يُعطّل خرائط الخصوم داخل المنطقة.\",\n        stats: [{label:\"السرعة\",value:\"٨٣\",pct:\"83%\"},{label:\"الدرع\",value:\"٤٥\",pct:\"45%\"},{label:\"الأدوات\",value:\"٨٨\",pct:\"88%\"}] }\n    ];\n    const i = this.state.op;\n\n    const faqData = [\n      { question: \"هل يحتاج الإستريمرز أو المتابعون إلى تحميل تطبيق للمشاركة في الألعاب؟\", answer: \"لا، لا يحتاج أي شخص لتحميل أي تطبيق! يفتح الإستريمرز اللعبة مباشرة عبر الموقع، بينما يشارك المتابعون باللعب فوراً من خلال كتابة الأوامر في شات البث، أو عبر مسح رمز الـ QR بالهاتف في بعض الألعاب المخصصة.\" },\n      { question: \"هل المنصة مجانية أم تتطلب اشتراكاً مدفوعاً؟\", answer: \"المنصة مجانية بالكامل! جميع الألعاب متاحة للإستريمرز والمتابعين بدون أي اشتراكات أو رسوم إلزامية. نوفر فقط إطارات وتأثيرات جمالية كمالية لتمييز اللاعبين في البث بأسعار رمزية واختيارية تماماً دون أن تؤثر على تجربة اللعب الأساسية.\" },\n      { question: \"كيف تبدأ الألعاب؟ وهل يحتاج الإستريمرز لربط حسابه بالمنصة لكل لعبة؟\", answer: \"الربط بسيط وسريع جداً! يقوم الإستريمرز بربط حسابه بالمنصة لمرة واحدة فقط عند التسجيل، وبعد ذلك، كل ما عليه فعله عند بدء اللعب هو إدخال اسم المستخدم (اسم حساب البث) للاتصال بالبث المباشر، وسيتم تشغيل جميع الألعاب فوراً بنفس الاتصال دون الحاجة لإعادة الربط في كل لعبة.\" },\n      { question: \"هل تعمل الألعاب على جميع منصات البث (تيك توك، يوتيوب، ديسكورد)؟\", answer: \"الألعاب تعمل حالياً وبشكل كامل على بثوث تيك توك (TikTok Live)، ونعمل على إضافة باقي المنصات (تويتش، يوتيوب، ديسكورد) قريباً جداً لتكون متاحة للجميع.\" },\n      { question: \"كيف أشتري الإطارات المميزة، وهل تبقى في حسابي للأبد؟\", answer: \"تستطيع شراء الإطارات من المتجر بأسعار رمزية عبر طرق الدفع المتاحة، وتظل مضافة لحسابك لتمييز اسمك وصورتك في شاشة البث أثناء اللعب.\" },\n      { question: \"هل أستطيع اقتراح لعبة جديدة أو الإبلاغ عن مشكلة؟\", answer: \"نعم بالتأكيد! نسعد دائماً بسماع أفكاركم واقتراحاتكم لتطوير المنصة. يمكنك التواصل معنا مباشرة للإبلاغ عن أي مشكلة أو تقديم اقتراحاتك عبر حسابنا في تيك توك أو من خلال الواتساب.\" }\n    ];\n\n    const monthly = [\n      { name: \"مجنّد\", badge: \"مجاني\", price: \"٠\", per: \"ريال\", items: [\"كل الخرائط الاثنتي عشرة\", \"كل الأبطال الستة\", \"دخول سلّم التصنيف\", \"أولوية انتظار عادية\"], cta: \"حمّل الآن\", solid: false },\n      { name: \"مقاتل\", badge: \"الأكثر طلباً\", price: \"٣٩\", per: \"ريال / شهرياً\", items: [\"كل ما في خطة مجنّد\", \"مسار باص المعركة كامل\", \"ضعف نقاط الخبرة في العمليات\", \"أسلحة بمظاهر حصرية\"], cta: \"اشترك\", solid: true },\n      { name: \"أسطورة\", badge: \"احترافي\", price: \"٧٩\", per: \"ريال / شهرياً\", items: [\"كل ما في خطة مقاتل\", \"رصيد دخول البطولات\", \"أولوية في الخوادم\", \"دخول مبكر للتجارب\"], cta: \"اشترك\", solid: false }\n    ];\n    const seasonal = [\n      { ...monthly[0], price: \"٠\", per: \"ريال\" },\n      { ...monthly[1], price: \"٢٩\", per: \"ريال / شهرياً\" },\n      { ...monthly[2], price: \"٥٩\", per: \"ريال / شهرياً\" }\n    ];\n    const planSrc = this.state.seasonal ? seasonal : monthly;\n\n    const ar = (s) => String(s).replace(/[0-9]/g, d => \"٠١٢٣٤٥٦٧٨٩\"[d]);\n    const group = (n) => ar(n.toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g, \"٬\"));\n    const ease = (x) => 1 - Math.pow(1 - x, 3);\n\n    const tabDefs = [\n      { label: \"المنصة\", stats: [\n        { target: 124000, label: \"حساب مسجّل في المنصة\", pct: 86, fmt: \"num\" },\n        { target: 11, label: \"لعبة جاهزة للبث\", pct: 100, fmt: \"num\" },\n        { target: 24, label: \"ساعة دعم فني\", pct: 100, fmt: \"num\" }\n      ]},\n      { label: \"الاستريمرز\", stats: [\n        { target: 6200, label: \"استريمر نشط هالشهر\", pct: 72, fmt: \"num\" },\n        { target: 8400, label: \"بث مباشر كل يوم\", pct: 80, fmt: \"num\" },\n        { target: 47, label: \"دقيقة متوسط الجلسة\", pct: 58, fmt: \"num\" },\n        { target: 14, label: \"دولة يوصلها البث\", pct: 44, fmt: \"num\" }\n      ]},\n      { label: \"اللاعبين\", stats: [\n        { target: 2.1, label: \"مليون مشاهد شهرياً\", pct: 91, fmt: \"dec\" },\n        { target: 54000, label: \"جولة لعب أسبوعياً\", pct: 76, fmt: \"num\" },\n        { target: 96, label: \"٪ رضا عن التجربة\", pct: 96, fmt: \"num\" },\n        { target: 3, label: \"ثوانٍ متوسط الدخول للعبة\", pct: 30, fmt: \"num\" }\n      ]}\n    ];\n    const t = this.state.tab;\n\n    const rankColors = [\"#f0d68a\", \"#cfd4de\", \"#d09a6a\", \"#7c7590\", \"#7c7590\"];\n    const supportersData = [\n      [\"فهد العتيبي\", \"يعطيكم العافية، استمروا\", \"$1,200\"],\n      [\"نورة\", \"أحلى منصة دخلتها\", \"$950\"],\n      [\"أبو سند\", \"دعم بسيط لمجتمع رهيب\", \"$800\"],\n      [\"ريان\", \"الألعاب غيّرت بثي\", \"$640\"],\n      [\"سلطان\", \"بالتوفيق يا شباب\", \"$520\"]\n    ];\n    const playersData = [\n      [\"مشعل\", \"@mishal.plays\", \"PL-1042\"],\n      [\"لمى\", \"@lama.gg\", \"PL-2318\"],\n      [\"تركي\", \"@turki.live\", \"PL-0871\"],\n      [\"عبدالله\", \"@abdullah.x\", \"PL-5590\"],\n      [\"ميرا\", \"@meera.gg\", \"PL-6612\"]\n    ];\n    const streamersData = [\n      [\"أيمن\", \"@ayman.games\", \"ST-0001\", \"٣١٢\"],\n      [\"سارة\", \"@sara.live\", \"ST-0114\", \"٢٨٧\"],\n      [\"نواف\", \"@nawaf.tv\", \"ST-0233\", \"٢٤٥\"],\n      [\"دانة\", \"@dana.tv\", \"ST-0391\", \"٢٢٠\"],\n      [\"خالد\", \"@khalid.stream\", \"ST-0447\", \"١٩٨\"]\n    ];\n\n    return {\n      tabs: tabDefs.map((d, idx) => ({\n        label: d.label,\n        bg: idx === t ? \"#7a3fd4\" : \"rgba(255,255,255,.04)\",\n        fg: idx === t ? \"#f3ecff\" : \"#a79fbb\",\n        border: idx === t ? \"#7a3fd4\" : \"rgba(255,255,255,.12)\",\n        select: () => this.pickTab(idx)\n      })),\n      tabStats: tabDefs[t].stats.map((s, idx) => ({\n        value: s.fmt === \"dec\" ? ar(s.target.toFixed(1)) : group(s.target),\n        label: s.label,\n        pct: s.pct + \"%\",\n        anim: (((this.state.tick || 0) % 2) === 0 ? \"nl-riseA\" : \"nl-riseB\") + \" .7s cubic-bezier(.22,1,.36,1) \" + (idx * 0.09).toFixed(2) + \"s both\"\n      })),\n      supporters: supportersData.map((r, idx) => ({\n        rank: ar(idx + 1), rankColor: rankColors[idx], name: r[0], message: r[1], amount: r[2]\n      })),\n      players: playersData.map((r, idx) => ({\n        rank: ar(idx + 1), rankColor: rankColors[idx], name: r[0], handle: r[1], id: r[2]\n      })),\n      streamers: streamersData.map((r, idx) => ({\n        rank: ar(idx + 1), rankColor: rankColors[idx], name: r[0], handle: r[1], id: r[2], hours: r[3]\n      })),\n      partnerGroups: [\n        { title: \"أصحاب الأفكار\", count: \"٧ مبدعين\", note: \"ناس عطونا أفكار ألعاب صارت اليوم جزء من المنصة.\", speed: \"34s\",\n          people: [\n            { name: \"عبدالعزيز\", tiktok: \"@aziz.ideas\", id: \"AZ-1042\", dot: \"#b28cf5\" },\n            { name: \"جود\", tiktok: \"@joud.play\", id: \"JD-2318\", dot: \"#b28cf5\" },\n            { name: \"مازن\", tiktok: \"@mazen.gg\", id: \"MZ-0871\", dot: \"#b28cf5\" },\n            { name: \"هيا\", tiktok: \"@haya.live\", id: \"HY-5590\", dot: \"#b28cf5\" },\n            { name: \"راكان\", tiktok: \"@rakan.ideas\", id: \"RK-6031\", dot: \"#b28cf5\" },\n            { name: \"شهد\", tiktok: \"@shahad.gg\", id: \"SH-7744\", dot: \"#b28cf5\" },\n            { name: \"يزيد\", tiktok: \"@yazeed.play\", id: \"YZ-8125\", dot: \"#b28cf5\" }\n          ]},\n        { title: \"فريق التطوير والتجربة\", count: \"٦ مطورين\", note: \"ناس ساعدوا في تطوير الألعاب وتجربتها قبل الإطلاق.\", speed: \"40s\",\n          people: [\n            { name: \"سعود\", tiktok: \"@saud.dev\", id: \"SD-3301\", dot: \"#7a3fd4\" },\n            { name: \"ريم\", tiktok: \"@reem.codes\", id: \"RM-4127\", dot: \"#7a3fd4\" },\n            { name: \"بدر\", tiktok: \"@bader.qa\", id: \"BD-6654\", dot: \"#7a3fd4\" },\n            { name: \"لين\", tiktok: \"@leen.test\", id: \"LN-7720\", dot: \"#7a3fd4\" },\n            { name: \"فيصل\", tiktok: \"@faisal.dev\", id: \"FS-9014\", dot: \"#7a3fd4\" },\n            { name: \"غادة\", tiktok: \"@ghada.qa\", id: \"GH-9330\", dot: \"#7a3fd4\" }\n          ]}\n      ],\n      email: this.state.email,\n      onEmail: (e) => this.setState({ email: e.target.value, joined: false }),\n      submit: () => this.setState(s => ({ joined: s.email.includes(\"@\") })),\n      ctaLabel: this.state.joined ? \"تم\" : \"سجّلني\",\n      formNote: this.state.joined\n        ? \"سجّلناك. بنرسل لك مفتاح الدخول المبكر قبل الإطلاق.\"\n        : \"\",\n      features: [\n        { num:\"٠١\", title:\"جولات بدون تحميل\", body:\"الخرائط تُحمّل في الخلفية، فالجولة تبدأ فور انتهاء السابقة.\" },\n        { num:\"٠٢\", title:\"خوادم ١٢٨ تك\", body:\"استضافة إقليمية في الرياض وفرانكفورت وفرجينيا وسنغافورة.\" },\n        { num:\"٠٣\", title:\"باحث عن فريق\", body:\"دوّر على فريق حسب الدور والرتبة واللغة من داخل اللوبي.\" },\n        { num:\"٠٤\", title:\"سلّم تصنيف\", body:\"عشر مراتب، تحديث أسبوعي، وتقييم واضح في ملفك الشخصي.\" },\n        { num:\"٠٥\", title:\"أدوات صنّاع المحتوى\", body:\"قواعد مخصصة، كاميرات مشاهدة، وتصدير الإعادة بضغطة واحدة.\" },\n        { num:\"٠٦\", title:\"دعم عربي كامل\", body:\"واجهة معرّبة بالكامل، أصوات عربية، وقوائم بترتيب صحيح من اليمين.\" }\n      ],\n      shots: [\n        { label:\"لقطة — ممر الغبار\" },\n        { label:\"لقطة — غارة ليلية\" },\n        { label:\"لقطة — نهائي التصنيف\" },\n        { label:\"لقطة — شاشة اختيار الأبطال\" },\n        { label:\"لقطة — نظرة عامة على الخريطة\" },\n        { label:\"لقطة — نقطة الإخلاء\" }\n      ],\n      operators: ops.map((o, idx) => ({\n        name: o.name, role: o.role,\n        bg: idx === i ? accent : \"#08080d\",\n        fg: idx === i ? \"#f3ecff\" : \"#9aa1b1\",\n        select: () => this.setState({ op: idx })\n      })),\n      active: ops[i],\n      stats: [\n        { value:\"٨٤ ألف\", label:\"لاعب متصل الآن\" },\n        { value:\"١٢\", label:\"خريطة في الدوران\" },\n        { value:\"١٢٨\", label:\"معدل تحديث الخادم\" },\n        { value:\"١٫٢ مليون\", label:\"مباراة كل أسبوع\" }\n      ],\n      events: [\n        { date:\"٤ أكتوبر\", name:\"بطولة الرياض المفتوحة\", place:\"الرياض · حضورياً\", prize:\"٤٥٠٬٠٠٠ ريال\", status:\"التسجيل مفتوح\", tagColor:\"#b28cf5\", tagBorder:\"rgba(122,63,212,.5)\" },\n        { date:\"١٩ أكتوبر\", name:\"دوري الليل ٧\", place:\"أونلاين · الشرق الأوسط\", prize:\"٩٠٬٠٠٠ ريال\", status:\"التسجيل مفتوح\", tagColor:\"#b28cf5\", tagBorder:\"rgba(122,63,212,.5)\" },\n        { date:\"٨ نوفمبر\", name:\"صدام الفرق\", place:\"أونلاين · أوروبا والشرق الأوسط\", prize:\"١٢٠٬٠٠٠ ريال\", status:\"قريباً\", tagColor:\"#8b93a4\", tagBorder:\"rgba(255,255,255,.2)\" },\n        { date:\"١٢ ديسمبر\", name:\"نهائيات الموسم الرابع\", place:\"جدة · حضورياً\", prize:\"١٬٠٠٠٬٠٠٠ ريال\", status:\"بالدعوة فقط\", tagColor:\"#8b93a4\", tagBorder:\"rgba(255,255,255,.2)\" }\n      ],\n      plans: planSrc.map(p => ({\n        name: p.name, badge: p.badge, price: p.price, per: p.per, items: p.items, cta: p.cta,\n        border: p.solid ? \"rgba(122,63,212,.6)\" : \"rgba(255,255,255,.11)\",\n        ctaBg: p.solid ? accent : \"transparent\",\n        ctaFg: p.solid ? \"#f3ecff\" : \"#e7e9ee\",\n        ctaBorder: p.solid ? accent : \"rgba(255,255,255,.18)\"\n      })),\n      monthlyBg: this.state.seasonal ? \"transparent\" : accent,\n      monthlyFg: this.state.seasonal ? \"#9aa1b1\" : \"#f3ecff\",\n      seasonalBg: this.state.seasonal ? accent : \"transparent\",\n      seasonalFg: this.state.seasonal ? \"#f3ecff\" : \"#9aa1b1\",\n      setMonthly: () => this.setState({ seasonal: false }),\n      setSeasonal: () => this.setState({ seasonal: true }),\n      faqs: faqData.map((f, idx) => ({\n        question: f.question, answer: f.answer,\n        maxH: this.state.openFaq === idx ? \"320px\" : \"0px\",\n <script>
(function(){
  function patchLinks(){
    var done = 0;
    document.querySelectorAll('a[href="#games"]').forEach(function(a){

        var newLinks = [
          ['سياسة الخصوصية', 'privacy-policy.html'],
          ['شروط الاستخدام', 'terms.html'],
          ['حذف البيانات', 'data-deletion.html'],
          ['تواصل معنا: aymngames1@gmail.com', 'mailto:aymngames1@gmail.com'],
          ['قواعد المجتمع', 'info.html'],
          ['عن المنصة', 'info.html']
        ];
        newLinks.forEach(function(pair){
          var a = document.createElement('a');
          a.href = pair[1];
          a.style.cssText = 'font-size:14px;color:#9aa1b1;transition:color .25s';
          a.textContent = pair[0];
          a.addEventListener('mouseenter', function(){ a.style.color = '#b28cf5'; });
          a.addEventListener('mouseleave', function(){ a.style.color = '#9aa1b1'; });
          linksContainer.appendChild(a);
        });
        footer.dataset.legalLinksAdded = '1';
        done++;
      }
    }
    function linkLeaderboardCard(titleText, url){
      var divs = Array.prototype.slice.call(document.querySelectorAll('div'));
      var titleDiv = divs.find(function(d){ return d.textContent.trim() === titleText; });
      if (!titleDiv) return false;
      var header = titleDiv.parentElement;
      var badge = header.querySelector('span');
      if (!badge || header.dataset.linked) return false;
      var wrap = document.createElement('span');
      wrap.style.cssText = 'display:flex;align-items:center;gap:8px;';
      header.insertBefore(wrap, badge);
      wrap.appendChild(badge);
      var link = document.createElement('a');
      link.href = url;
      link.textContent = 'عرض الكل';
      link.style.cssText = 'font-size:11.5px;color:#b28cf5;text-decoration:underline;white-space:nowrap;';
      wrap.appendChild(link);
      header.dataset.linked = '1';
      return true;
    }
    if (linkLeaderboardCard('توب الداعمين للمنصة', 'top-supporters.html')) done++;
    if (linkLeaderboardCard('توب الاستريمرز الأكثر نشاطاً', 'top-streamers.html')) done++;

    var supportLink = Array.prototype.slice.call(document.querySelectorAll('nav a'))
      .find(function(a){ return a.textContent.trim() === 'دعم المنصة'; });
    if (supportLink && !supportLink.dataset.patched) {
      supportLink.setAttribute('href', 'https://creators.sa/aymngame');
      supportLink.setAttribute('target', '_blank');
      supportLink.dataset.patched = '1';

      if (!document.querySelector('nav a[data-frames-link]')) {
        var framesLink = supportLink.cloneNode(true);
        framesLink.textContent = 'الإطارات';
        framesLink.setAttribute('href', 'https://aymngames.zid.store/');
        framesLink.setAttribute('target', '_blank');
        framesLink.setAttribute('data-frames-link', '1');
        supportLink.parentNode.insertBefore(framesLink, supportLink.nextSibling);
      }
      done++;
    }

    var footerAbout = Array.prototype.slice.call(document.querySelectorAll('footer p'))[0];
    if (footerAbout && !footerAbout.dataset.contactAdded) {
      var contact = document.createElement('p');
      contact.style.cssText = 'margin:10px 0 0;font-size:13px;line-height:1.9;color:#9aa1b1;';
      contact.innerHTML = '🎵 تيك توك: <a href="https://www.tiktok.com/@em70_q" target="_blank" style="color:#b28cf5;">@em70_q</a><br>📱 واتساب: <a href="https://wa.me/966582411235" target="_blank" style="color:#b28cf5;">0582411235</a>';
      footerAbout.parentNode.insertBefore(contact, footerAbout.nextSibling);
      footerAbout.dataset.contactAdded = '1';
      done++;
    }

    return done;
  }

  function arDigits(n){
    return String(n).replace(/[0-9]/g, function(d){ return "٠١٢٣٤٥٦٧٨٩"[d]; });
  }
  var RANK_COLORS = ["#f0d68a","#cfd4de","#d09a6a","#7c7590","#7c7590"];

  function findCard(titleText){
    var titleDiv = Array.prototype.slice.call(document.querySelectorAll('*'))
      .find(function(e){ return e.children.length <= 1 && e.textContent.trim() === titleText; });
    return titleDiv ? titleDiv.parentElement.parentElement : null;
  }
  function findCardRowsContainer(titleText){
    var card = findCard(titleText);
    if (!card) return null;
    // نتجاهل عناصر مضافة داخل البطاقة (مثل مؤقت تحديث التوب) عشان يبقى
    // الترتيب: [الهيدر، الخط، الصفوف].
    var kids = Array.prototype.filter.call(card.children, function(c){ return !c.hasAttribute('data-lb-extra'); });
    return kids[2] || null;
  }

  var TOP3_BADGE = [
    { bg: 'rgba(240,214,138,.16)', fg: '#f0d68a', border: 'rgba(240,214,138,.45)' },
    { bg: 'rgba(207,212,222,.14)', fg: '#cfd4de', border: 'rgba(207,212,222,.4)' },
    { bg: 'rgba(208,154,106,.16)', fg: '#d09a6a', border: 'rgba(208,154,106,.45)' }
  ];
  function buildIdMeta(customId, idx){
    var wrap = document.createElement('span');
    if (!customId) { wrap.style.display = 'none'; return wrap; }
    if (idx < 3) {
      wrap.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:2px 9px;border-radius:999px;background:' + TOP3_BADGE[idx].bg + ';border:1px solid ' + TOP3_BADGE[idx].border + ';font-size:11px;font-weight:700;color:' + TOP3_BADGE[idx].fg + ';direction:ltr;';
      wrap.textContent = 'ID ' + customId;
    } else {
      wrap.style.cssText = 'display:block;margin-top:4px;font-size:12px;color:#8f9ac2;direction:ltr;text-align:start;';
      wrap.textContent = 'ID ' + customId;
    }
    return wrap;
  }

  function buildAvatar(avatarBase64, size, placeholderBg){
    var el;
    if (avatarBase64) {
      el = document.createElement('img');
      el.src = avatarBase64;
      el.style.cssText = 'flex:none;width:' + size + 'px;height:' + size + 'px;border-radius:50%;border:1px solid rgba(255,255,255,.14);object-fit:cover;';
      el.onerror = function(){
        el.replaceWith(buildAvatar(null, size, placeholderBg));
      };
    } else {
      el = document.createElement('span');
      el.style.cssText = 'flex:none;width:' + size + 'px;height:' + size + 'px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:' + placeholderBg + ';';
    }
    return el;
  }

  function loadRealSupporters(){
    if (!window.AGPAuth || !window.AGPAuth.getTopSupporters) return;
    var card = findCard('توب الداعمين للمنصة');
    var rows = card && card.children[2] ? card.children[2] : null;
    if (!rows || rows.dataset.realData) return;

    Promise.all([
      window.AGPAuth.getTopSupporters(),
      window.AGPAuth.getRecentSupporters ? window.AGPAuth.getRecentSupporters(50).catch(function(){ return null; }) : Promise.resolve(null)
    ]).then(function(results){
      var topResult = results[0];
      var recentResult = results[1];
      var supporters = (topResult && topResult.success && topResult.supporters) || [];
      if (!supporters.length) return;

      var messageByName = {};
      if (recentResult && recentResult.success && recentResult.supporters) {
        recentResult.supporters.forEach(function(r){
          if (r.message && !messageByName[r.name]) messageByName[r.name] = r.message;
        });
      }

      // [أكبر قليلاً] زيادة الحشو وحجم الخط بهذي البطاقة تحديداً بناءً على طلب المستخدم
      card.style.padding = '32px 26px 24px';
      var headerTitle = card.children[0] && card.children[0].children[0];
      if (headerTitle) headerTitle.style.fontSize = '21px';

      rows.innerHTML = '';
      supporters.slice(0, 5).forEach(function(s, idx){
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:start;gap:13px;padding:13px 11px;border-radius:14px;transition:background .2s;';
        var rankSpan = document.createElement('span');
        rankSpan.style.cssText = 'flex:none;width:28px;text-align:center;font-family:\'Noto Kufi Arabic\',sans-serif;font-size:15px;font-weight:700;color:' + (RANK_COLORS[idx] || '#7c7590') + ';';
        rankSpan.textContent = arDigits(idx + 1);
        var infoWrap = document.createElement('span');
        infoWrap.style.cssText = 'flex:1;min-width:0;';
        var nameSpan = document.createElement('span');
        nameSpan.style.cssText = 'display:block;font-family:\'Noto Kufi Arabic\',sans-serif;font-size:16px;color:#f4f2fb;';
        nameSpan.textContent = s.name || '—';
        var metaSpan = document.createElement('span');
        metaSpan.style.cssText = 'display:block;margin-top:4px;font-size:13.5px;line-height:1.7;color:#968ea4;';
        var msg = messageByName[s.name];
        metaSpan.textContent = msg ? msg : (s.donationsCount === 1 ? 'دعم واحد' : ((s.donationsCount || 0) + ' مرات دعم'));
        infoWrap.appendChild(nameSpan);
        infoWrap.appendChild(metaSpan);
        var amountSpan = document.createElement('span');
        amountSpan.style.cssText = 'flex:none;font-family:\'Noto Kufi Arabic\',sans-serif;font-size:15px;font-weight:700;color:#b28cf5;direction:ltr;';
        amountSpan.textContent = s.totalAmount ? ('$' + Number(s.totalAmount).toLocaleString('en-US')) : '—';
        row.appendChild(rankSpan);
        row.appendChild(infoWrap);
        row.appendChild(amountSpan);
        rows.appendChild(row);
      });
      rows.dataset.realData = '1';
    }).catch(function(){});
  }

      rows.dataset.realData = '1';

      var viewAllLink = Array.prototype.slice.call(document.querySelectorAll('a'))
        .find(function(a){ return a.getAttribute('href') === 'top-streamers.html' && a.textContent.trim() === 'عرض الكل'; });

  // [إصلاح باگ حقيقي] كل دالة loadReal* كانت تُستدعى مرتين فقط بتأخير
  // ثابت (٦٠٠ و٢٠٠٠ مللي ثانية) — لو ما اكتمل تركيب الصفحة الحقيقية
  // (استبدال documentElement) قبل هالوقتين، الدالة ترجع فوراً (العنوان
  // اللي تدوّر عليه بالـDOM ما يكون موجود بعد) ولا تُعاد المحاولة أبداً،
  // فتبقى البيانات الحقيقية (بما فيها الصور الشخصية وقائمة شركاء الإبداع)
  // غير معروضة نهائياً على أي اتصال أبطأ من المعتاد. نفس فكرة الاستطلاع
  // (polling) المستخدمة أصلاً مع patchLinks بالأسفل: نكرر المحاولة كل
  // ٣٠٠ مللي ثانية لمدة ٩ ثوانٍ تقريباً؛ كل دالة أصلاً تتحقق من
  // dataset.realData فترجع فوراً بلا أي تكلفة إضافية بعد أول نجاح.
  function pollUntilReady(fn){
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      fn();
      if (tries >= 30) clearInterval(t);
    }, 300);
  }
  pollUntilReady(loadRealSupporters);
  pollUntilReady(loadRealStreamers);

  function loadRealPlayers(){

  pollUntilReady(loadRealPlayers);

  function loadRealPartners(){
    if (!window.AGPAuth || !window.AGPAuth.getPartners) return;
    var ideaTitle = Array.prototype.slice.call(document.querySelectorAll('*'))
      .find(function(e){ return e.children.length <= 1 && e.textContent.trim() === 'أصحاب الأفكار'; });
    var devTitle = Array.prototype.slice.call(document.querySelectorAll('*'))
      .find(function(e){ return e.children.length <= 1 && e.textContent.trim() === 'فريق التطوير والتجربة'; });
    if (!ideaTitle && !devTitle) return;
    var marker = ideaTitle || devTitle;
    var groupsWrap = marker.parentElement.parentElement.parentElement;
    if (groupsWrap.dataset.realData) return;

    window.AGPAuth.getPartners().then(function(result){
      if (!result || !result.success) return;
      // [تصحيح] راجعت backend/http/auth-router.js فعلياً هالمرة:
      // handleGetPartners يرجّع { success, partners: { idea, dev } } —
      // بمفتاح partners وسيط فعلاً (partners-service.js's getPartnersPublic
      // يبني { idea, dev } وrouter يغلّفها بـ"partners"). تعديل سابق هنا
      // كان مبنياً على افتراض غير محقَّق من ملف آخر (بدون partners
      // وسيط) فصار يقرأ result.idea/result.dev اللي دائماً undefined —
      // نفس مشكلة "القائمة الفاضية" اللي كانت من قبل، بس بالاتجاه
      // المعاكس. رجعناها لقراءة result.partners الصحيحة.
      var partners = result.partners || { idea: [], dev: [] };

      function buildCard(p, idx){
        var card = document.createElement('div');
        // [تجميل خفيف] دخول متدرّج بسيط (مرة وحدة فقط عند البناء، مو
        // أنيميشن مستمر) + رفعة بسيطة عند مرور الفأرة، بنفس أنيميشن
        // nl-riseA المعرّف أصلاً بالصفحة — بدون أي تكلفة أداء إضافية.
        card.style.cssText = 'display:flex;align-items:center;gap:14px;width:260px;padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(rgba(32,28,51,.8),rgba(12,11,20,.9));transition:transform .25s,border-color .25s;animation:nl-riseA .5s ease ' + ((idx || 0) * 0.05) + 's both;';
        card.addEventListener('mouseenter', function(){ card.style.transform = 'translateY(-4px)'; card.style.borderColor = 'rgba(178,140,245,.45)'; });
        card.addEventListener('mouseleave', function(){ card.style.transform = 'none'; card.style.borderColor = 'rgba(255,255,255,.09)'; });
        var avatarWrap = document.createElement('div');
        avatarWrap.style.cssText = 'flex:none;width:58px;height:58px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:repeating-linear-gradient(135deg,#2a2440 0 7px,#191527 7px 14px);';
        if (p.avatarBase64) {
          var img = document.createElement('img');
          img.src = p.avatarBase64;
          img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
          avatarWrap.appendChild(img);
        }
        var infoWrap = document.createElement('div');
        infoWrap.style.cssText = 'flex:1;min-width:0;';
        var nameDiv = document.createElement('div');
        nameDiv.style.cssText = 'font-family:\'Noto Kufi Arabic\',sans-serif;font-size:16px;font-weight:600;color:#f4f2fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        nameDiv.textContent = p.name || '—';
        var idBadge = document.createElement('div');
        idBadge.style.cssText = 'display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#968ea4;direction:ltr;';
        idBadge.textContent = 'ID ' + (p.customId || '—');
        infoWrap.appendChild(nameDiv);
        infoWrap.appendChild(idBadge);
        card.appendChild(avatarWrap);
        card.appendChild(infoWrap);
        return card;
      }

      // [إصلاح] كانت هذي الدالة تستبدل الشريط المتحرك (marquee) الأصلي
      // ببطاقات ثابتة تلتف فقط (flex-wrap) بدون أي حركة — فبمجرد ما
      // تنجح البيانات الحقيقية بالتحميل تختفي حركة التمرير التلقائي
      // اللي كانت موجودة بالتصميم الأصلي. نعيد نفس تقنية القالب: تكرار
      // القائمة مرتين + أنيميشن nl-marquee (تلف كل نصف عرض الشريط بالضبط
      // = نسخة واحدة كاملة، فيصير التمرير متصل بلا قطع)، مع إيقاف مؤقت
      // عند تمرير الفأرة فوقها.
      function renderGroup(titleEl, list){
        if (!titleEl) return;
        var headerRow = titleEl.parentElement;
        var group = headerRow.parentElement;
        var countBadge = headerRow.children[1];
        var marqueeWrap = group.children[2];
        if (!list.length) {
          group.style.display = 'none';
          return;
        }
        if (countBadge) countBadge.textContent = arDigits(list.length) + (list.length === 1 ? ' مبدع' : ' مبدعين');
        marqueeWrap.innerHTML = '';
        var speed = (Math.max(list.length, 1) * 5) + 's';
        var track = document.createElement('div');
        track.style.cssText = 'display:flex;width:max-content;gap:16px;animation:nl-marquee ' + speed + ' linear infinite;';
        track.addEventListener('mouseenter', function(){ track.style.animationPlayState = 'paused'; });
        track.addEventListener('mouseleave', function(){ track.style.animationPlayState = 'running'; });
        list.forEach(function(p, idx){ track.appendChild(buildCard(p, idx)); });
        list.forEach(function(p, idx){ track.appendChild(buildCard(p, idx)); });
        marqueeWrap.appendChild(track);
      }

      renderGroup(ideaTitle, partners.idea || []);
      renderGroup(devTitle, partners.dev || []);
      groupsWrap.dataset.realData = '1';
    }).catch(function(){});
  }
  pollUntilReady(loadRealPartners);

  // [بيانات حقيقية] "حساب مسجّل في المنصة" كان رقماً وهمياً ثابتاً
  // (١٢٤٬٠٠٠) من بيانات القالب التجريبية. نستبدله بالعدّاد الحقيقي من
  // /api/stats. "المنصة" هو التبويب الافتراضي عند فتح الصفحة، فالبطاقة
  // موجودة بالـDOM من البداية؛ لو المستخدم بدّل لتبويب ثاني ورجع، محرك
  // القالب يعيد رسمها من بياناته الأصلية (نفس محدودية بقية دوال
  // loadReal* هنا أصلاً — لا يوجد ربط مستمر بالحالة الداخلية للمكوّن).
  function loadRealStats(){
    if (!window.AGPAuth || !window.AGPAuth.getPlatformStats) return;
    var valueDiv = Array.prototype.slice.call(document.querySelectorAll('div'))
      .find(function(e){ return e.children.length <= 1 && e.textContent.trim() === 'حساب مسجّل في المنصة'; });
    if (!valueDiv) return;
    var card = valueDiv.parentElement;
    if (!card || card.dataset.realStats) return;
    var numberDiv = card.children[0];
    if (!numberDiv) return;
    window.AGPAuth.getPlatformStats().then(function(result){
      var total = result && result.success && result.stats ? result.stats.totalUsers : null;
      if (total == null) return;
      numberDiv.textContent = arDigits(total.toLocaleString('en-US').replace(/,/g, '٬'));
      card.dataset.realStats = '1';
    }).catch(function(){});
  }
  pollUntilReady(loadRealStats);

  // [أداء] عناصر الخلفية الزخرفية (مدارات ضبابية nl-orbit/nl-orbit2،
  // nl-aurora، nl-float/nl-float2، nl-pulse، nl-scan) تعمل باستمرار طوال
  // عمر الصفحة عبر عدة طبقات blur متراكبة، وblur الهيدر اللاصق
  // (backdrop-filter) يُعاد رسمه كل إطار أثناء التمرير — هذا الجمع يُنزّل
  // معدل الإطارات بشكل كبير على أجهزة أضعف ويُشعر المستخدم بثقل التصفح.
  // نطفئ الأنيميشن الزخرفي بعد ظهوره أول مرة (يبقى شكله الثابت) ونستبدل
  // blur الهيدر بخلفية شبه معتمة بنفس الإحساس البصري تقريباً، بدون
  // تكلفة الرسم المتكررة. شريط الأخبار المتحرك (nl-marquee) غير مشمول
  // عمداً — حركته بسيطة وغير مكلفة.
  // الأداء: قاعدة CSS واحدة بدل مسح كل عناصر الصفحة مع getComputedStyle
  // كل 300ms (كان هذا بحد ذاته من أثقل الأشياء على الجوال).
  function reduceAmbientCost(){
    var AMBIENT_ANIMS = ['nl-orbit', 'nl-orbit2', 'nl-aurora', 'nl-float', 'nl-float2', 'nl-pulse', 'nl-scan'];
    if (document.head && !document.getElementById('agp-ambient-off')) {
      var st = document.createElement('style');
      st.id = 'agp-ambient-off';
      st.textContent = AMBIENT_ANIMS.map(function(n){
        return '[style*="' + n + '"]';
      }).join(',') + '{animation:none !important;}';
      document.head.appendChild(st);
    }
    var header = document.querySelector('header');
    if (header && !header.dataset.blurReduced) {
      header.style.backdropFilter = 'none';
      header.style.webkitBackdropFilter = 'none';
      header.style.background = 'rgba(10,9,16,.92)';
      header.dataset.blurReduced = '1';
    }
  }
  pollUntilReady(reduceAmbientCost);

  // [زر القائمة بالجوال] قالب الصفحة يعيد بناء الهيدر من نسخة محفوظة
  // (data-dc-tpl) فيطلع زر القائمة نسخة جديدة بدون مستمع الضغط اللي
  // ركّبناه، ولأن الزر موجود ما نعيد تركيبه — فيصير الزر ميت أغلب
  // الوقت. الحل: مستمع واحد على document يلتقط الضغط على أي نسخة من
  // الزر، ويجيب الهيدر/القائمة وقت الضغط بدل الاعتماد على مراجع قديمة.
  function toggleMobilePanel(burger){
    var header = document.querySelector('header');
    var nav = document.querySelector('nav');
    if (!header || !nav) return;
    var accountLink = Array.prototype.slice.call(header.children).find(function(e){
      return e.tagName === 'A' && e !== nav.parentElement && header.children[0] !== e &&
        Array.prototype.indexOf.call(header.children, e) > Array.prototype.indexOf.call(header.children, nav);
    });
    var panel = document.querySelector('[data-mobile-panel]');
    var open = panel && panel.style.display !== 'none';
    if (open) {
      panel.style.display = 'none';
      burger.children[0].style.transform = '';
      burger.children[1].style.opacity = '1';
      burger.children[2].style.transform = '';
      return;
    }
    if (!panel) {
      panel = document.createElement('div');
      panel.setAttribute('data-mobile-panel', '1');
      panel.style.cssText = 'margin-top:10px;border-radius:20px;border:1px solid rgba(178,140,245,.25);background:linear-gradient(180deg,#1a1526,#0d0b14);box-shadow:0 24px 60px -30px rgba(122,63,212,.6);overflow:hidden;pointer-events:auto;position:relative;z-index:61;';
      header.insertAdjacentElement('afterend', panel);
    }
    panel.innerHTML = '';
    Array.prototype.slice.call(nav.querySelectorAll('a')).forEach(function(a){
      var clone = a.cloneNode(true);
      clone.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:15px 20px;color:#e7e9ee;text-decoration:none;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;';
      panel.appendChild(clone);
    });
    if (accountLink) {
      var ctaWrap = document.createElement('div');
      ctaWrap.style.cssText = 'padding:14px;';
      var ctaClone = accountLink.cloneNode(true);
      ctaClone.style.cssText = 'display:block;text-align:center;padding:13px;border-radius:999px;background:linear-gradient(135deg,#7a3fd4,#b28cf5);color:#f3ecff;font-weight:600;font-size:14.5px;';
      ctaWrap.appendChild(ctaClone);
      panel.appendChild(ctaWrap);
    }
    panel.style.display = 'block';
    burger.children[0].style.transform = 'translateY(6px) rotate(45deg)';
    burger.children[1].style.opacity = '0';
    burger.children[2].style.transform = 'translateY(-6px) rotate(-45deg)';
  }
  document.addEventListener('click', function(ev){
    var burger = ev.target && ev.target.closest ? ev.target.closest('[data-burger]') : null;
    if (burger) toggleMobilePanel(burger);
  });

  // [هيدر الجوال] الهيدر الأصلي مصمّم لعرض كل روابط nav بصف واحد أفقي —
  // على شاشة جوال هذا يتكدّس أو يفيض. تحت 900px نلفّ الهيدر ونضع nav
  // بصف ثانٍ؛ تحت 480px نخفي nav وزر الحساب تماماً ونستبدلهما بزر
  // ثلاث شرطات يفتح قائمة منسدلة تحتوي كل الروابط (بنفس الحالة الحالية
  // للروابط بعد أي تعديل من patchLinks، لأن الاستنساخ ياخذ كل الخصائص
  // الحالية للعنصر وقت فتح القائمة).
  function applyHeaderResponsive(){
    var w = window.innerWidth;
    var isNarrow = w <= 900;
    var isMobile = w <= 480;

    var header = document.querySelector('header');
    if (header) {
      if (isNarrow) {
        header.style.flexWrap = 'wrap';
        header.style.justifyContent = 'center';
        header.style.rowGap = '12px';
        header.style.borderRadius = '26px';
        header.style.padding = '14px 16px';
      } else {
        header.style.flexWrap = '';
        header.style.justifyContent = 'space-between';
        header.style.rowGap = '';
        header.style.borderRadius = '999px';
        header.style.padding = '12px 20px 12px 14px';
      }
    }

    var nav = document.querySelector('nav');
    if (nav) {
      nav.style.columnGap = '35px';
      nav.style.rowGap = isNarrow ? '10px' : '35px';
      if (isNarrow) {
        nav.style.order = '3';
        nav.style.width = '100%';
        nav.style.flexWrap = 'wrap';
        nav.style.justifyContent = 'center';
      } else {
        nav.style.order = '';
        nav.style.width = '';
        nav.style.flexWrap = '';
        nav.style.justifyContent = '';
      }
    }

    if (!header || !nav) return;

    var accountLink = Array.prototype.slice.call(header.children).find(function(e){
      return e.tagName === 'A' && e !== nav.parentElement && header.children[0] !== e &&
        Array.prototype.indexOf.call(header.children, e) > Array.prototype.indexOf.call(header.children, nav);
    });
    var burger = header.querySelector('[data-burger]');

    if (isMobile) {
      nav.style.display = 'none';
      if (accountLink) accountLink.style.display = 'none';
      if (!burger) {
        burger = document.createElement('button');
        burger.setAttribute('data-burger', '1');
        burger.setAttribute('aria-label', 'القائمة');
        burger.style.cssText = 'flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(178,140,245,.35);background:rgba(122,63,212,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;order:2;';
        for (var bi = 0; bi < 3; bi++) {
          var line = document.createElement('span');
          line.style.cssText = 'display:block;width:18px;height:2px;background:#c6b4f2;border-radius:2px;transition:transform .25s,opacity .25s;';
          burger.appendChild(line);
        }
        header.appendChild(burger);
      }
    } else {
      nav.style.display = 'flex';
      if (accountLink) accountLink.style.display = 'inline-flex';
      if (burger) burger.remove();
      var existingPanel = document.querySelector('[data-mobile-panel]');
      if (existingPanel) existingPanel.remove();
    }
  }
  window.addEventListener('resize', applyHeaderResponsive);
  pollUntilReady(applyHeaderResponsive);

  // [مقاسات الشاشة] عناصر البطاقة الترويسية (الشارة، العنوان الرئيسي،
  // الوصف) مُثبَّتة بإحداثيات مطلقة (position:absolute بقيم px ثابتة)
  // بدل التدفق الطبيعي — هذا يصلح فقط لعرض شاشة واحد محدد ويسبب فيض
  // النص خارج الشاشة على أي مقاس أصغر (جوال/آيباد). نرجعها للتدفق
  // الطبيعي (position:static) داخل حاويتها المتمركزة أصلاً
  // (max-width:760px;margin:0 auto)، فتتوسّط وتلتف تلقائياً على أي عرض.
  function fixHeroLayout(){
    if (document.body.dataset.heroFixed) return;
    var badge = Array.prototype.slice.call(document.querySelectorAll('div'))
      .find(function(e){ return e.children.length === 1 && e.textContent.trim() === 'ابدا بثك ولا تشيل هم'; });
    if (badge) {
      badge.style.position = 'static';
      badge.style.top = 'auto';
      badge.style.left = 'auto';
      badge.style.margin = '0 auto 22px';
    }

    var heading = document.querySelector('h1');
    if (heading) {
      heading.style.position = 'static';
      heading.style.left = 'auto';
      heading.style.top = 'auto';
      heading.style.width = 'auto';
      heading.style.height = 'auto';
      heading.style.margin = '0 auto';
      var hSpans = Array.prototype.slice.call(heading.querySelectorAll('span'));
      hSpans.forEach(function(s){
        s.style.width = 'auto';
        s.style.height = 'auto';
      });

    if (caption) {

      });

  function hideEmptyFormNote(){

      var t = e.textContent.trim();

  pollUntilReady(initTelegramIcon);

  window.__agpLottieReady = function(){ initTelegramIcon(); initTikTokIcon(); };
  if (window.lottie) window.__agpLottieReady();

  var tries = 0;
  var timer = setInterval(function(){

    var n = patchLinks();
    if (n >= 8 || tries > 80) { clearInterval(timer); }
  }, 250);

<!-- إعلان الأدمن (admin-settings.html -> تبويب "الإعلان") -- مكان ثابت

<!-- تصحيح أرقام قسم "الأرقام" (المنصة/الاستريمرز/اللاعبين) بأرقام حقيقية
     من السيرفر (مخزَّنة مؤقتاً ٣ أيام) + عدد الألعاب حياً من games.html،
     وتحويل باقي أرقام الصفحة الرئيسية للأرقام الإنجليزية. لا نعدّل مصدر
     المكوّن التفاعلي نفسه (خارج نطاق تعديل آمن)، فنصحّح الناتج المعروض
     بعد كل عرض/إعادة عرض عبر MutationObserver يبقى يقظاً حتى مع تبديل
     التبويبات. -->
<script>
(function () {
  var ARABIC_DIGIT_MAP = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','٬':',','٫':'.','٪':'%' };
  var ARABIC_CHARS_RE = /[٠-٩٬٫٪]/;
  var ARABIC_CHARS_RE_G = /[٠-٩٬٫٪]/g;

  function toEnglishDigits(str) {
    return String(str).replace(ARABIC_CHARS_RE_G, function (c) { return ARABIC_DIGIT_MAP[c] || c; });
  }

  function convertRemainingArabicDigits(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        var p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        var tag = p.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT' || tag === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
        return ARABIC_CHARS_RE.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    var node, touched = [];
    while ((node = walker.nextNode())) touched.push(node);
    touched.forEach(function (n) { n.nodeValue = toEnglishDigits(n.nodeValue); });
  }

  function findStatCard(labelText) {
    var spans = document.querySelectorAll('span.sc-interp');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].textContent.trim() === labelText) {
        var card = spans[i].parentElement ? spans[i].parentElement.parentElement : null;
        if (!card || !card.children[0]) return null;
        return { valueSpan: card.children[0].querySelector('.sc-interp'), labelSpan: spans[i] };
      }
    }
    return null;
  }

  function fmtInt(n) { return Number(n || 0).toLocaleString('en-US'); }

  var _realStats = null;
  var _gamesCount = null;

  function applyKnownCorrections() {
    if (_realStats) {
      [
        ['حساب مسجّل في المنصة', fmtInt(_realStats.totalAccounts)],
        ['استريمر نشط هالشهر', fmtInt(_realStats.activeStreamersThisMonth)],
        ['بث مباشر كل يوم', fmtInt(_realStats.avgDailyLiveStreams)],
        ['دقيقة متوسط الجلسة', fmtInt(_realStats.avgSessionMinutes)],
        ['مليون مشاهد شهرياً', String(_realStats.monthlyViewersMillions)]
      ].forEach(function (pair) {
        var hit = findStatCard(pair[0]);
        if (hit && hit.valueSpan) hit.valueSpan.textContent = pair[1];
      });

      // "جولة لعب أسبوعياً" -> إجمالي فعلي كلي بدل تقدير أسبوعي، لعدم
      // وجود سجل مؤرَّخ يسمح بحساب "هالأسبوع" تحديداً حالياً.
      var roundsHit = findStatCard('جولة لعب أسبوعياً');
      if (roundsHit && roundsHit.valueSpan) {
        roundsHit.valueSpan.textContent = fmtInt(_realStats.totalRoundsPlayed);
        roundsHit.labelSpan.textContent = 'جولة لعب مكتملة';
      }
    }

    if (_gamesCount != null) {
      var gamesHit = findStatCard('لعبة جاهزة للبث');
      if (gamesHit && gamesHit.valueSpan) gamesHit.valueSpan.textContent = fmtInt(_gamesCount);
    }
  }

  var _applying = false;
  function runAll() {
    if (_applying) return;
    _applying = true;
    try {
      applyKnownCorrections();
      convertRemainingArabicDigits(document.body);
    } finally {
      setTimeout(function () { _applying = false; }, 0);
    }
  }

  // مهم: نربط الـ observer بـ document.body فقط بعد التأكد إن المحتوى
  // الحقيقي (بعد hydration) صار جاهزاً -- ربطه فوراً عند تحليل هذا
  // السكربت قد يلتقط جسم الصفحة المؤقت (شاشة التحميل) قبل أن يستبدله
  // المُشغِّل بالجسم النهائي، فيراقب عنصراً صار منفصلاً عن الصفحة ولا
  // يلتقط أي تحديث لاحق (تبديل تبويبات وغيره).
  var tries3 = 0;
  var readyTimer = setInterval(function () {
    tries3++;
    if (document.querySelector('span.sc-interp') || tries3 > 80) {
      clearInterval(readyTimer);
      // تجميع دفعات التغييرات بتمريرة وحدة بدل مسح الصفحة كاملة مع كل
      // تغيير صغير (الشريط المتحرك/إعادة العرض كانت تشغّله باستمرار).
      var pending = null;
      var observer = new MutationObserver(function () {
        if (pending) return;
        pending = setTimeout(function () { pending = null; runAll(); }, 200);
      });
      observer.observe(document.body, { childList: true, subtree: true, characterData: true });
      runAll();
    }
  }, 250);

  if (window.AGPAuth && window.AGPAuth.getPlatformStats) {
    window.AGPAuth.getPlatformStats().then(function (result) {
      if (result && result.success && result.stats) {
        _realStats = result.stats;
        runAll();
      }
    }).catch(function () {});
  }

  // عدد الألعاب يحتاج تحميل games.html كامل — نأجّله لبعد تحميل
  // الصفحة عشان ما ينافس المحتوى الأساسي على الشبكة بالجوال.
  function loadGamesCount() {
    fetch('games.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      var m = /var REAL_GAMES\s*=\s*(\[[\s\S]*?\]);/.exec(html);
      if (!m) return;
      var arr = JSON.parse(m[1]);
      _gamesCount = arr.length;
      runAll();
    }).catch(function () {});
  }
  if (document.readyState === 'complete') setTimeout(loadGamesCount, 1500);
  else window.addEventListener('load', function () { setTimeout(loadGamesCount, 1500); });
})();
</script>
<!-- (1) شعار اليوم الوطني ٩٥ الجديد -- ثابت (position:fixed) أعلى يسار
     الشاشة دائماً، تحت الهيدر مباشرة، يتكيّف حسب حجم الشاشة.
     (2) حذف الصورة الخضراء القديمة من داخل صندوق إشعار الصيانة.
     (3) فيديو اليوم الوطني -- بشكله الرأسي الأصلي بدون تحويله لأفقي --
     كخلفية داخل الجزء الأسود بين نص "منصة ألعاب أيمن" (وشرائحه) وبداية
