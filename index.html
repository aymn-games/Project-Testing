<script>
(function () {
  function el(tag, style) { var e = document.createElement(tag); if (style) e.style.cssText = style; return e; }

  // ---------- (2) حذف الصورة الخضراء القديمة ----------
  function removeOldGreenImage() {
    var anchor = document.querySelector('.nl-maint-notice');
    if (!anchor) return false;
    var oldImg = anchor.querySelector('img');
    if (oldImg) oldImg.remove();
    return true;
  }
  var triesOld = 0;
  var oldImgTimer = setInterval(function () {
    triesOld++;
    if (removeOldGreenImage() || triesOld > 80) clearInterval(oldImgTimer);
  }, 250);

  // ---------- (3) فيديو اليوم الوطني كخلفية بالجزء الأسود بالهيرو ----------
  function findChipRow() {
    var spans = document.querySelectorAll('span.sc-interp, span');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].children.length === 0 && spans[i].textContent.trim() === 'مجتمع عربي كامل') return spans[i];
    }
    return null;
  }

  function addHeroVideo() {
    if (document.getElementById('agp-hero-video-wrap')) return true;
    var chip = findChipRow();
    // نفس مشكلة الشارة الثابتة: العنصر موجود بالـDOM لكن قد لا يملك
    // تخطيطاً حقيقياً بعد (rect صفري) لحظة الفحص -- ننتظر أبعاداً فعلية.
    if (!chip || chip.getBoundingClientRect().height === 0) return false;
    var heroSection = chip.closest('section');
    if (!heroSection || heroSection.getBoundingClientRect().height === 0) return false;

    var wrap = el('div');
    wrap.id = 'agp-hero-video-wrap';
    wrap.style.cssText = 'position:absolute;left:0;width:100%;overflow:hidden;pointer-events:none;z-index:0;';

    var video = document.createElement('video');
    video.muted = true; video.loop = true; video.autoplay = true; video.playsInline = true;
    // object-fit:cover يملأ العرض بالكامل (شكل أفقي) بدل شريط رأسي ضيق
    // بالمنتصف -- يقصّ أعلى/أسفل الفيديو الأصلي (رأسي)، وهذا متوقّع.
    video.style.cssText = 'display:block;height:100%;width:100%;margin:0 auto;object-fit:cover;opacity:.6;';
    // MP4 (H.264) أولاً -- التوافق الأوسع بالمتصفحات الحقيقية (خصوصاً
    // سفاري/آيفون)، وWebM كبديل احتياطي.
    var srcMp4 = document.createElement('source');
    srcMp4.src = 'hero-national-day-video.mp4'; srcMp4.type = 'video/mp4';
    var srcWebm = document.createElement('source');
    srcWebm.src = 'hero-national-day-video.webm'; srcWebm.type = 'video/webm';
    video.appendChild(srcMp4);
    video.appendChild(srcWebm);
    wrap.appendChild(video);

    var overlay = el('div', 'position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 50%,transparent 40%,rgba(5,5,8,.9) 92%);');
    wrap.appendChild(overlay);

    heroSection.style.position = heroSection.style.position || 'relative';
    heroSection.appendChild(wrap);

    function reposition() {
      var heroRect = heroSection.getBoundingClientRect();
      var chipRect = chip.getBoundingClientRect();
      // مساحة أكبر قليلاً من السابق (فجوة أصغر أعلاه) بعد التحويل لعرض
      // كامل بشكل أفقي.
      var top = (chipRect.bottom - heroRect.top) + 8;
      var height = heroRect.height - top;
      if (height < 60) height = 60;
      wrap.style.top = top + 'px';
      wrap.style.height = height + 'px';
    }
    reposition();
    [300, 1000, 2500].forEach(function (ms) { setTimeout(reposition, ms); });
    window.addEventListener('resize', reposition);
    video.play().catch(function () {});
    return true;
  }
  // الفيديو (~425KB) يبدأ بعد تحميل الصفحة — عشان ما ينافس المحتوى
  // الأساسي على الشبكة بالجوال ويأخّر ظهوره.
  function startHeroVideoPolling() {
    var triesVideo = 0;
    var videoTimer = setInterval(function () {
      triesVideo++;
      if (addHeroVideo() || triesVideo > 80) clearInterval(videoTimer);
    }, 250);
  }
  if (document.readyState === 'complete') startHeroVideoPolling();
  else window.addEventListener('load', startHeroVideoPolling);
})();
</script>

  }

      '.agp-lb-rows{display:grid !important;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px !important;margin-top:22px !important;align-items:end}' +
      '.agp-lb-rows > div{position:relative;grid-column:span 3;order:10;box-sizing:border-box;min-width:0;padding:16px 18px !important;border-radius:18px !important;background:rgba(255,255,255,.035) !important;border:1px solid rgba(255,255,255,.08);transition:transform .25s,border-color .25s,background .25s,box-shadow .25s !important}' +

      '.agp-lb-rows > div > span:first-child{flex:none;width:34px !important;height:34px;border-radius:50%;display:inline-flex !important;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:14px !important}' +
      /* الثلاثة الأوائل */
      '.agp-lb-rows > div:nth-child(-n+3){overflow:visible}' +
      '.agp-lb-rows > div:nth-child(-n+3) > span:first-child{width:44px !important;height:44px;font-size:17px !important;font-weight:800 !important;color:#1a1208 !important;border:0}' +
      '.agp-lb-rows > div:nth-child(1){border:1px solid rgba(240,214,138,.7);background:radial-gradient(120% 90% at 50% 0%,rgba(240,214,138,.28),rgba(240,214,138,.04) 60%),rgba(20,16,10,.6) !important;box-shadow:0 0 0 1px rgba(240,214,138,.15),0 22px 50px -22px rgba(240,190,80,.75)}' +
      '.agp-lb-rows > div:nth-child(2){border:1px solid rgba(214,220,232,.55);background:radial-gradient(120% 90% at 50% 0%,rgba(214,220,232,.2),rgba(214,220,232,.03) 60%),rgba(16,16,20,.6) !important;box-shadow:0 20px 44px -24px rgba(200,210,230,.6)}' +
      '.agp-lb-rows > div:nth-child(3){border:1px solid rgba(214,150,100,.6);background:radial-gradient(120% 90% at 50% 0%,rgba(214,150,100,.22),rgba(214,150,100,.03) 60%),rgba(20,14,10,.6) !important;box-shadow:0 20px 44px -24px rgba(214,140,80,.65)}' +
      '.agp-lb-rows > div:nth-child(1) > span:first-child{background:linear-gradient(135deg,#fff1b8,#f0c64e 45%,#b8861f);box-shadow:0 0 0 3px rgba(240,214,138,.25),0 8px 20px -6px rgba(240,190,80,.9)}' +
      '.agp-lb-rows > div:nth-child(2) > span:first-child{background:linear-gradient(135deg,#ffffff,#cfd6e3 45%,#8f99ad);box-shadow:0 0 0 3px rgba(214,220,232,.2),0 8px 20px -6px rgba(200,210,230,.8)}' +
      '.agp-lb-rows > div:nth-child(3) > span:first-child{background:linear-gradient(135deg,#ffd2ae,#d9935c 45%,#8f5226);box-shadow:0 0 0 3px rgba(214,150,100,.22),0 8px 20px -6px rgba(214,140,80,.85)}' +
      '.agp-lb-rows > div:nth-child(1)::before{content:"👑";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:28px;filter:drop-shadow(0 4px 10px rgba(240,190,80,.8));animation:agpLbCrown 2.6s ease-in-out infinite}' +
      '@keyframes agpLbCrown{0%,100%{transform:translate(-50%,0) rotate(-6deg)}50%{transform:translate(-50%,-4px) rotate(6deg)}}' +
      '.agp-lb-rows > div:nth-child(-n+3)::after{position:absolute;top:10px;left:12px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}' +
      '.agp-lb-rows > div:nth-child(1)::after{content:"المركز الأول";color:#f7e2a0;background:rgba(240,214,138,.14);border:1px solid rgba(240,214,138,.4)}' +
      '.agp-lb-rows > div:nth-child(2)::after{content:"المركز الثاني";color:#e3e7ef;background:rgba(214,220,232,.1);border:1px solid rgba(214,220,232,.3)}' +
      '.agp-lb-rows > div:nth-child(3)::after{content:"المركز الثالث";color:#f0c29c;background:rgba(214,150,100,.12);border:1px solid rgba(214,150,100,.35)}' +
      /* منصة التتويج (٧٠٠px وفوق): ٢ يمين، ١ بالنص وأعلى، ٣ يسار */
      '@media (min-width:700px){' +
        '.agp-lb-rows > div:nth-child(-n+3){grid-column:span 2;flex-direction:column !important;align-items:center !important;justify-content:flex-start;gap:10px !important;text-align:center;padding:34px 16px 22px !important}' +
        '.agp-lb-rows > div:nth-child(-n+3) *{text-align:center !important}' +
        '.agp-lb-rows > div:nth-child(-n+3) > span{flex:none !important}' +
        '.agp-lb-rows > div:nth-child(-n+3) > span:nth-child(2):not([style*="border-radius: 50%"]),.agp-lb-rows > div:nth-child(-n+3) > span:nth-child(3){width:100%}' +
        '.agp-lb-rows > div:nth-child(-n+3) > [style*="border-radius: 50%"]{width:72px !important;height:72px !important;border-width:2px !important}' +
        '.agp-lb-rows > div:nth-child(1) > [style*="border-radius: 50%"]{width:88px !important;height:88px !important;border-color:rgba(240,214,138,.8) !important;box-shadow:0 0 24px -4px rgba(240,190,80,.8)}' +
        '.agp-lb-rows > div:nth-child(-n+3) > span:last-child b,.agp-lb-rows > div:nth-child(-n+3) > span:last-child:not([style*="border"]) > span:first-child,.agp-lb-rows > div:nth-child(-n+3) > span:last-child:not(:has(span)):not([style*="border"]){font-size:22px !important}' +
        '.agp-lb-rows > div:nth-child(1){order:2;padding-top:44px !important;padding-bottom:30px !important}' +
        '.agp-lb-rows > div:nth-child(2){order:1}' +
        '.agp-lb-rows > div:nth-child(3){order:3}' +
        '.agp-lb-rows > div:nth-child(-n+3) [style*="inline-flex"]{align-self:center}' +
      '}' +
      '@media (max-width:699px){' +
        '.agp-lb-rows{grid-template-columns:minmax(0,1fr);gap:10px !important}' +
        '.agp-lb-rows > div{grid-column:1 / -1 !important;padding:14px 12px !important}' +
        '.agp-lb-rows > div:nth-child(-n+3){padding-top:30px !important}' +
        '.agp-lb-rows > div:nth-child(1){margin-top:14px}' +
        '.agp-lb-rows > div:nth-child(1)::before{left:auto;right:18px;transform:none;top:-20px;font-size:24px;animation:none}' +
      '}' +
      /* المؤقت */
      '.agp-lb-timer{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;flex-wrap:wrap;margin:0 0 22px;padding:18px 22px;border-radius:20px;border:1px solid rgba(240,174,228,.22);background:radial-gradient(120% 140% at 100% 0%,rgba(224,112,196,.18),transparent 60%),linear-gradient(180deg,rgba(28,16,30,.9),rgba(12,9,16,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}' +
      '.agp-lb-timer-info{display:flex;align-items:center;gap:14px;min-width:0}' +
      '.agp-lb-timer-icon{position:relative;flex:none;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#b0328f,#e070c4);box-shadow:0 10px 26px -10px rgba(224,112,196,.9)}' +
      '.agp-lb-timer-icon svg{width:24px;height:24px}' +
      '.agp-lb-timer-icon::after{content:"";position:absolute;inset:-4px;border-radius:18px;border:1px solid rgba(240,174,228,.5);animation:agpLbRing 2.2s ease-out infinite}' +
      '@keyframes agpLbRing{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}' +
      '.agp-lb-timer-title{font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;font-weight:700;color:#fff}' +
      '.agp-lb-timer-note{margin-top:3px;font-size:12.5px;color:#b59ab0}' +
      '.agp-lb-clock{display:flex;align-items:flex-start;gap:8px;direction:rtl}' +
      '.agp-lb-unit{min-width:74px;padding:10px 8px 8px;border-radius:14px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 -10px 20px -14px rgba(0,0,0,.8)}' +
      '.agp-lb-unit b{display:block;font-family:"Noto Kufi Arabic",sans-serif;font-size:28px;font-weight:700;line-height:1.15;color:#fff;font-variant-numeric:tabular-nums}' +
      '.agp-lb-unit span{display:block;margin-top:4px;font-size:11px;letter-spacing:.3px;color:#c9a9c2}' +
      '.agp-lb-sep{align-self:center;margin-top:-14px;font-size:22px;font-weight:700;color:rgba(240,174,228,.55)}' +
      '.agp-lb-progress{flex:1 1 100%;display:flex;align-items:center;gap:12px;font-size:11.5px;color:#a893a6}' +
      '.agp-lb-bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}' +
      '.agp-lb-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#e070c4,#b0328f);transition:width .6s}' +
      '@media (max-width:640px){.agp-lb-timer{padding:16px 14px;justify-content:center}.agp-lb-timer-info{width:100%}.agp-lb-clock{width:100%;justify-content:center}.agp-lb-unit{flex:1 1 0;min-width:0}.agp-lb-unit b{font-size:24px}}' +
      '@media (prefers-reduced-motion:reduce){.agp-lb-timer-icon::after,.agp-lb-rows > div:nth-child(1)::before,' + G + ' > [data-lb-card].is-active{animation:none}}';
    document.head.appendChild(st);
  }

  function findCardByTitle(title){
    var t = Array.prototype.slice.call(document.querySelectorAll('#gallery div'))
      .find(function(d){ return d.children.length === 0 && d.textContent.trim() === title; });
    return t ? t.parentElement.parentElement : null;
  }
  function rowsOf(card){
    var kids = Array.prototype.filter.call(card.children, function(c){ return !c.hasAttribute('data-lb-extra'); });
    return kids[2] || null;
  }

  function setActive(key){
    activeKey = key;
    Array.prototype.forEach.call(document.querySelectorAll('.agp-lb-tab'), function(b){
      var on = b.getAttribute('data-key') === key;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#gallery [data-lb-card]'), function(c){
      c.classList.toggle('is-active', c.getAttribute('data-lb-card') === key);
    });
  }

  function buildTimer(){
    var timer = document.createElement('div');
    timer.className = 'agp-lb-timer';
    timer.setAttribute('data-lb-extra', '1');
    timer.innerHTML =
      '<div class="agp-lb-timer-info">' +
        '<span class="agp-lb-timer-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg></span>' +
        '<div><div class="agp-lb-timer-title">الوقت الباقي على تحديث التوب</div><div class="agp-lb-timer-note">يتصفّر التوب ويبدأ من جديد كل سبت ١٢:٠٠ ص بتوقيت السعودية</div></div>' +
      '</div>' +
      '<div class="agp-lb-clock">' +
        '<div class="agp-lb-unit"><b data-u="d">٠</b><span>يوم</span></div><span class="agp-lb-sep">:</span>' +
        '<div class="agp-lb-unit"><b data-u="h">٠٠</b><span>ساعة</span></div><span class="agp-lb-sep">:</span>' +
        '<div class="agp-lb-unit"><b data-u="m">٠٠</b><span>دقيقة</span></div>' +
      '</div>' +
      '<div class="agp-lb-progress"><span data-u="p">مضى ٠٪ من الأسبوع</span><div class="agp-lb-bar"><i style="width:0%"></i></div></div>';
    return timer;
  }
  function renderTimer(timer){
    var now = Date.now();
    var next = nextRankingReset(now);
    var left = Math.max(0, next - now);
    var mins = Math.floor(left / 60000);
    var d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    timer.querySelector('[data-u="d"]').textContent = ar(d);
    timer.querySelector('[data-u="h"]').textContent = ar(pad2(h));
    timer.querySelector('[data-u="m"]').textContent = ar(pad2(m));
    var pct = Math.min(100, Math.max(0, Math.round((1 - left / WEEK_MS) * 100)));
    timer.querySelector('[data-u="p"]').textContent = 'مضى ' + ar(pct) + '٪ من الأسبوع';
    timer.querySelector('.agp-lb-bar i').style.width = pct + '%';
  }

  function mount(){
    var grid = document.querySelector('#gallery div[style*="minmax(300px, 1fr)"]');
    if (!grid) return;
    ensureStyles();

    TABS.forEach(function(t){
      var card = findCardByTitle(t.title);
      if (!card) return;
      if (!card.hasAttribute('data-lb-card')) card.setAttribute('data-lb-card', t.key);
      var rows = rowsOf(card);
      if (rows) rows.classList.add('agp-lb-rows');
      if (t.key === 'streamers' && !card.querySelector('.agp-lb-timer')) {
        var timer = buildTimer();
        card.insertBefore(timer, card.firstChild);
        renderTimer(timer);
        setInterval(function(){ if (timer.isConnected) renderTimer(timer); }, 15000);
      }
    });

    if (!grid.previousElementSibling || !grid.previousElementSibling.classList.contains('agp-lb-tabs')) {
      var bar = document.createElement('div');
      bar.className = 'agp-lb-tabs';
      var inner = document.createElement('div');
      inner.className = 'agp-lb-tabs-in';
      inner.setAttribute('role', 'tablist');
      TABS.forEach(function(t){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'agp-lb-tab';
        b.setAttribute('role', 'tab');
        b.setAttribute('data-key', t.key);
        b.innerHTML = '<span class="agp-lb-tab-icon">' + t.icon + '</span><span class="agp-lb-tab-text"><span class="agp-lb-tab-label">' + t.label + '</span><span class="agp-lb-tab-hint">' + t.hint + '</span></span>';
        b.addEventListener('click', function(){ setActive(t.key); });
        inner.appendChild(b);
      });
      bar.appendChild(inner);
      grid.parentNode.insertBefore(bar, grid);
    }
    setActive(activeKey);
  }

  var tries = 0;
  var t = setInterval(function(){
    tries++;
    mount();
    if (tries >= 30) clearInterval(t);
  }, 300);
})();
</script>
<script>

    st.id = 'agp-stats-style';
    st.textContent =
      T + '{display:inline-flex !important;flex-wrap:nowrap !important;gap:6px !important;margin:0 auto !important;padding:6px;border-radius:20px;border:1px solid rgba(255,255,255,.09);background:rgba(14,12,22,.8);box-shadow:0 20px 50px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04);max-width:100%}' +
      '#stats > div{display:flex;flex-direction:column;align-items:center}' +
      B + '{display:inline-flex !important;align-items:center;gap:9px;padding:12px 24px !important;border:0 !important;border-radius:15px !important;background:transparent !important;color:#a79fbb !important;font-family:"Noto Kufi Arabic",sans-serif !important;font-size:15px !important;font-weight:700 !important;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s !important}' +
      B + ':hover{color:#f4f2fb !important;background:rgba(255,255,255,.05) !important}' +
      B + '::before{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;font-size:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}' +
      B + ':nth-child(1)::before{content:"📊"}' +
      B + ':nth-child(2)::before{content:"🎥"}' +
      B + ':nth-child(3)::before{content:"🎮"}' +
      ON + '{color:#fff !important;background:linear-gradient(135deg,#7a3fd4,#b06cf0) !important;box-shadow:0 12px 30px -12px rgba(122,63,212,.95)}' +
