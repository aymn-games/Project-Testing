<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Veyro Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14121a">
<link rel="icon" type="image/png" href="brand/veyro-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* لوحة تحكم فيرو (Veyro Admin) — منفصلة عن لوحة أدمن ألعاب أيمن.
     نفس هوية المحرر (veyro/index.html): لافندر دخاني، أسطح زجاجية، ونظام «الحافة المشطوفة».
     التخطيط: قائمة يسار (تنطوي)، وفوق الصفحة شريط فيه البحث الشامل. المنطق بـveyro/admin.js. */
  :root {
    color-scheme: dark;
    --bg: #0e0d13; --bg-2: #14121a; --lav-d: #42394f; --lav-m: #6e617f; --lav: #a99bb8; --lav-l: #cfc3dc;
    --text: #f3eff8; --muted: #a99bb8; --muted-2: #857a95;
    --glass: linear-gradient(155deg, rgba(169,155,184,.10), rgba(66,57,79,.10) 60%, rgba(20,18,26,.18));
    --card: rgba(169,155,184,.05); --card-2: rgba(169,155,184,.09);
    --line: rgba(169,155,184,.14); --line-2: rgba(169,155,184,.28);
    --ok: #74d6a1; --warn: #e9c27a; --bad: #ec8f9d; --gold: #ffd54a; --info: #9fc7ff;
    --r: 18px; --ease: cubic-bezier(.22,1,.36,1);
    --nav-w: 244px; --nav-w-mini: 78px;
    --vf: 16px 3px 16px 3px; --vf-sm: 12px 2px 12px 2px; --vf-lg: 20px 4px 20px 4px;
    --vb-edge: linear-gradient(160deg, rgba(255,255,255,.34), rgba(207,195,220,.10) 38%, rgba(169,155,184,.06) 62%, rgba(207,195,220,.26));
    --vb-face: linear-gradient(180deg, rgba(58,50,70,.92), rgba(32,28,40,.92));
    --vb-face-h: linear-gradient(180deg, rgba(70,61,84,.95), rgba(38,33,47,.95));
    --vb-hi: linear-gradient(180deg, #b7a8cc 0%, #8d7fa3 46%, #6e617f 100%);
    --vb-hi-h: linear-gradient(180deg, #c5b7d8 0%, #9a8cb0 46%, #77698a 100%);
    --vb-hi-edge: linear-gradient(160deg, rgba(255,255,255,.75), rgba(207,195,220,.35) 45%, rgba(66,57,79,.6));
    --vb-on: #e9e1f3;
    --f-head: "Noto Kufi Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --f-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--lav-l); text-decoration: none; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--lav-l); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--muted); } .mut2 { color: var(--muted-2); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ---------- الخلفية ---------- */
  .vy-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(1100px 700px at 85% -10%, rgba(110,97,127,.32), transparent 60%),
      radial-gradient(900px 640px at -5% 110%, rgba(110,97,127,.26), transparent 60%),
      radial-gradient(700px 500px at 45% 55%, rgba(66,57,79,.25), transparent 70%),
      linear-gradient(180deg, #121018, #0b0a10); }
  .vy-bg .glow { position: absolute; width: 620px; height: 620px; left: 0; top: 0; border-radius: 50%; background: radial-gradient(circle, rgba(169,155,184,.12), transparent 62%); transform: translate3d(var(--gx, -999px), var(--gy, -999px), 0) translate(-50%, -50%); transition: transform .5s var(--ease); }
  .glass { background: var(--glass), rgba(22,19,28,.62); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px -34px rgba(0,0,0,.85); }

  /* ---------- الأزرار (الحافة المشطوفة) ---------- */
  .ob-btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 16px; border-radius: var(--vf); border: 1px solid transparent; cursor: pointer; white-space: nowrap; font-size: 13.5px; font-weight: 700;
    background: var(--vb-face) padding-box, var(--vb-edge) border-box; color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 6px 16px -10px rgba(0,0,0,.9); transition: transform .18s var(--ease), box-shadow .25s, background .25s; }
  .ob-btn::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.2), transparent 60%); transition: opacity .3s; }
  .ob-btn:hover { transform: translateY(-1px); background: var(--vb-face-h) padding-box, var(--vb-edge) border-box; }
  .ob-btn:hover::before { opacity: 1; }
  .ob-btn:active { transform: translateY(1px); box-shadow: inset 0 2px 6px rgba(0,0,0,.45); }
  .ob-btn svg { width: 16px; height: 16px; flex: none; }
  .ob-btn.primary { color: #fff; text-shadow: 0 1px 1px rgba(30,22,40,.45); background: var(--vb-hi) padding-box, var(--vb-hi-edge) border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(40,32,52,.35), 0 10px 24px -12px rgba(141,127,163,.95); }
  .ob-btn.primary:hover { background: var(--vb-hi-h) padding-box, var(--vb-hi-edge) border-box; }
  .ob-btn.ghost { color: var(--lav-l); background: linear-gradient(180deg, rgba(169,155,184,.06), rgba(169,155,184,.02)) padding-box, var(--vb-edge) border-box; }
  .ob-btn.ghost:hover { color: #fff; background: linear-gradient(180deg, rgba(169,155,184,.14), rgba(169,155,184,.05)) padding-box, var(--vb-edge) border-box; }
  .ob-btn.danger { color: #f4b6c0; background: linear-gradient(180deg, rgba(236,143,157,.12), rgba(236,143,157,.04)) padding-box, linear-gradient(160deg, rgba(255,190,200,.5), rgba(236,143,157,.12) 50%, rgba(236,143,157,.35)) border-box; }
  .ob-btn.danger:hover { color: #fff; background: linear-gradient(180deg, rgba(236,143,157,.3), rgba(236,143,157,.12)) padding-box, linear-gradient(160deg, rgba(255,200,208,.7), rgba(236,143,157,.3)) border-box; }
  .ob-btn.okb { color: #c9f3dc; background: linear-gradient(180deg, rgba(116,214,161,.16), rgba(116,214,161,.05)) padding-box, linear-gradient(160deg, rgba(190,255,220,.55), rgba(116,214,161,.15)) border-box; }
  .ob-btn.sm { min-height: 32px; padding: 5px 11px; font-size: 12.5px; border-radius: var(--vf-sm); }
  .ob-btn.icon { min-height: 0; width: 36px; height: 36px; padding: 0; border-radius: var(--vf-sm); }
  .ob-btn.icon.sm { width: 30px; height: 30px; }
  .ob-btn[disabled] { opacity: .45; pointer-events: none; }

  /* الخيارات: نقطة تضيء للمختار */
  .ob-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .ob-pill { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 12px; border-radius: var(--vf-sm); border: 1px solid transparent; cursor: pointer; color: var(--lav-l); font-weight: 600; font-size: 13px;
    background: linear-gradient(180deg, rgba(169,155,184,.07), rgba(169,155,184,.02)) padding-box, var(--vb-edge) border-box; transition: background .2s, color .2s, transform .15s var(--ease); }
  .ob-pill::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(207,195,220,.45); transition: background .2s, box-shadow .25s; }
  .ob-pill:hover { color: #fff; background: linear-gradient(180deg, rgba(169,155,184,.15), rgba(169,155,184,.05)) padding-box, var(--vb-edge) border-box; }
  .ob-pill:active { transform: scale(.97); }
  .ob-pill.on { color: #fff; background: linear-gradient(180deg, rgba(141,127,163,.62), rgba(98,86,114,.42)) padding-box, var(--vb-hi-edge) border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px -12px rgba(169,155,184,1); }
  .ob-pill.on::before { background: var(--vb-on); box-shadow: 0 0 0 3px rgba(233,225,243,.18), 0 0 10px rgba(233,225,243,.9); }
  .ob-pill .ct { font-size: 11px; padding: 0 6px; border-radius: 8px; background: rgba(169,155,184,.16); }

  /* التبويبات: مسار محفور ومفتاح مرفوع */
  .ob-seg { display: inline-flex; flex-wrap: wrap; padding: 5px; gap: 5px; border-radius: var(--vf); background: linear-gradient(180deg, rgba(8,7,11,.55), rgba(20,18,26,.4)); box-shadow: inset 0 2px 6px rgba(0,0,0,.55), inset 0 0 0 1px rgba(169,155,184,.1); }
  .ob-seg button { position: relative; border: 0; background: transparent; padding: 7px 14px; border-radius: var(--vf-sm); color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .ob-seg button:hover { color: #fff; background: rgba(169,155,184,.06); }
  .ob-seg button.on { color: #fff; background: linear-gradient(180deg, #8f81a5, #6a5d7b); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 10px -4px rgba(0,0,0,.8), 0 0 0 1px rgba(207,195,220,.35); }
  .ob-seg button .ct { font-size: 11px; opacity: .8; }

  /* مفتاح التبديل: مقبض «حجر» */
  .ob-toggle { position: relative; width: 54px; height: 30px; flex: none; display: inline-block; }
  .ob-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .ob-toggle span { position: absolute; inset: 0; cursor: pointer; border-radius: 9px 4px 9px 4px; background: linear-gradient(180deg, rgba(8,7,11,.7), rgba(30,27,38,.6)); box-shadow: inset 0 2px 5px rgba(0,0,0,.6), inset 0 0 0 1px rgba(169,155,184,.18); transition: background .25s; }
  .ob-toggle span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 7px 3px 7px 3px; background: linear-gradient(180deg, #fff, #d9d0e4); box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 -2px 0 rgba(110,97,127,.25); transition: transform .3s var(--ease); }
  .ob-toggle input:checked + span { background: linear-gradient(180deg, #9a8cb0, #5f5272); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 14px -3px rgba(169,155,184,.8); }
  .ob-toggle input:checked + span::after { transform: translateX(-24px); }
  .ob-toggle input:focus-visible + span { outline: 2px solid var(--lav-l); outline-offset: 2px; }

  /* الخانات */
  .ob-input { width: 100%; min-width: 0; font-size: 14px; color: #fff; padding: 9px 12px; border-radius: var(--vf-sm); border: 1px solid transparent; direction: rtl;
    background: rgba(12,11,16,.55) padding-box, linear-gradient(160deg, rgba(207,195,220,.28), rgba(169,155,184,.08) 50%, rgba(207,195,220,.18)) border-box; transition: box-shadow .2s; }
  .ob-input:focus { outline: none; background: rgba(12,11,16,.7) padding-box, var(--vb-hi-edge) border-box; box-shadow: 0 0 0 3px rgba(169,155,184,.16), 0 0 18px -6px rgba(207,195,220,.6); }
  .ob-input.ltr { direction: ltr; text-align: left; }
  select.ob-input { cursor: pointer; }
  select.ob-input option { background: #1b1822; }
  textarea.ob-input { resize: vertical; min-height: 70px; line-height: 1.7; }
  input[type=color].ob-color { width: 40px; height: 34px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50% 50% 50% 4px; overflow: hidden; }
  input[type=color].ob-color::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color].ob-color::-webkit-color-swatch { border: 0; border-radius: 50% 50% 50% 4px; }
  .ob-range { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
  .ob-range::-webkit-slider-runnable-track { height: 6px; border-radius: 4px 2px 4px 2px; background: linear-gradient(180deg, rgba(8,7,11,.7), rgba(30,27,38,.6)); box-shadow: inset 0 1px 3px rgba(0,0,0,.7), inset 0 0 0 1px rgba(169,155,184,.18); }
  .ob-range::-moz-range-track { height: 6px; border-radius: 4px 2px 4px 2px; background: rgba(20,18,26,.8); }
  .ob-range::-moz-range-progress { height: 6px; background: var(--vb-hi); }
  .ob-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border: 0; border-radius: 4px 50% 50% 50%; transform: rotate(45deg); background: linear-gradient(135deg, #fff, #cfc3dc); box-shadow: 0 0 0 3px rgba(141,127,163,.55), 0 3px 8px rgba(0,0,0,.6); }
  .ob-range::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 4px 50% 50% 50%; background: linear-gradient(135deg, #fff, #cfc3dc); }

  /* صف إعداد: العنوان يمين والتحكم يسار (قاعدة المنصة) */
  .ob-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(169,155,184,.06), rgba(169,155,184,.015)); }
  .ob-row .lb { text-align: right; min-width: 0; }
  .ob-row .lb b { display: block; font-weight: 600; font-size: 14px; }
  .ob-row .lb small { display: block; color: var(--muted-2); font-size: 12px; margin-top: 2px; line-height: 1.6; }
  .ob-row .ct { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ob-row .ct .ob-input { width: 180px; }
  .ob-row.col { flex-direction: column; align-items: stretch; }
  .ob-row .rv { min-width: 44px; text-align: center; font-size: 12px; padding: 3px 6px; border-radius: 7px 2px 7px 2px; background: rgba(12,11,16,.7); border: 1px solid var(--line); }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  /* ---------- الهيكل ---------- */
  .vy-app { position: relative; z-index: 1; direction: ltr; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); height: 100%; padding: 12px; gap: 12px; transition: grid-template-columns .35s var(--ease); }
  .vy-app > * { direction: rtl; }
  .vy-app.mini { grid-template-columns: var(--nav-w-mini) minmax(0, 1fr); }
  .vy-side { display: flex; flex-direction: column; min-height: 0; border-radius: 24px; padding: 14px 10px; overflow: hidden; }
  .vy-brand { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 92px; flex: none; margin-bottom: 4px; }
  .vy-brand img.full { width: 160px; height: auto; filter: drop-shadow(0 6px 18px rgba(110,97,127,.45)); transition: opacity .25s; }
  .vy-brand img.mini { position: absolute; top: 18px; width: 42px; height: 42px; opacity: 0; transition: opacity .25s; }
  .vy-brand .adm { font-family: var(--f-head); font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--lav); padding: 2px 10px; border-radius: 7px 2px 7px 2px; border: 1px solid var(--line-2); background: rgba(169,155,184,.06); }
  .vy-app.mini .vy-brand img.full { opacity: 0; }
  .vy-app.mini .vy-brand img.mini { opacity: 1; }
  .vy-app.mini .vy-brand .adm { position: absolute; bottom: 4px; font-size: 9px; padding: 1px 6px; letter-spacing: .04em; }
  .vy-nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; display: flex; flex-direction: column; gap: 2px; padding: 2px; }
  .vy-nav > * { flex: none; }
  .vy-group { display: flex; align-items: center; gap: 8px; margin: 14px 12px 6px; font-size: 12px; font-weight: 700; color: var(--lav); white-space: nowrap; overflow: hidden; transition: opacity .2s; }
  .vy-group::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .vy-app.mini .vy-group { opacity: 0; height: 1px; margin: 10px 14px; background: var(--line); }
  .vy-item { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 13px; border: 1px solid transparent; border-radius: 13px; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; transition: color .2s, background .25s; }
  .vy-item::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(207,195,220,.16), transparent 65%); transition: opacity .25s; }
  .vy-item:hover { color: var(--text); background: rgba(169,155,184,.05); }
  .vy-item:hover::before { opacity: 1; }
  .vy-item svg { width: 21px; height: 21px; flex: none; }
  .vy-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .vy-item .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(169,155,184,.16); color: var(--lav-l); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .vy-item .badge.warn { background: rgba(233,194,122,.18); color: var(--warn); }
  .vy-item.on { color: #fff; background: linear-gradient(180deg, rgba(141,127,163,.42), rgba(110,97,127,.26)); border-color: rgba(207,195,220,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 22px -14px rgba(141,127,163,.9); }
  .vy-item.on::after { content: ""; position: absolute; left: 0; top: 24%; bottom: 24%; width: 3px; border-radius: 0 3px 3px 0; background: var(--lav-l); box-shadow: 0 0 10px rgba(207,195,220,.8); }
  .vy-app.mini .vy-item { justify-content: center; padding: 0; }
  .vy-app.mini .vy-item .lbl, .vy-app.mini .vy-item .badge { opacity: 0; position: absolute; pointer-events: none; }
  .vy-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
  .vy-me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .vy-me .who { flex: 1; min-width: 0; line-height: 1.35; }
  .vy-me .who b { display: block; font-size: 13.5px; }
  .vy-me .who small { font-size: 11.5px; color: var(--muted-2); }
  .vy-app.mini .vy-me { justify-content: center; padding: 6px; background: transparent; border-color: transparent; }
  .vy-app.mini .vy-me .who, .vy-app.mini .vy-foot .ob-btn .lbl { display: none; }
  .vy-app.mini .vy-collapse svg { transform: scaleX(-1); }
  .vy-collapse { width: 100%; }
  .vy-tip { position: fixed; z-index: 90; padding: 7px 12px; border-radius: 10px; background: rgba(28,24,36,.96); border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .vy-tip.show { opacity: 1; }

  .vy-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .vy-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 20px; }
  .vy-top .ttl { flex: none; display: flex; flex-direction: column; min-width: 0; }
  .vy-top .ttl b { font-family: var(--f-head); font-size: 18px; font-weight: 700; white-space: nowrap; }
  .vy-top .ttl small { color: var(--muted-2); font-size: 12px; white-space: nowrap; }
  .vy-top .sp { flex: 1; }
  .vy-menu-b { display: none !important; }
  .vy-demo { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 9px 3px 9px 3px; border: 1px dashed rgba(233,194,122,.5); color: var(--warn); font-size: 12px; font-weight: 700; background: rgba(233,194,122,.06); }
  .vy-demo i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  /* البحث الشامل */
  .gs { position: relative; flex: 0 1 520px; min-width: 0; }
  .gs .box { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: var(--vf); border: 1px solid transparent; background: rgba(12,11,16,.6) padding-box, var(--vb-edge) border-box; }
  .gs .box:focus-within { background: rgba(12,11,16,.75) padding-box, var(--vb-hi-edge) border-box; box-shadow: 0 0 0 3px rgba(169,155,184,.14); }
  .gs .box svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
  .gs input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; font-size: 14px; color: #fff; }
  .gs kbd { font: 600 11px var(--f-body); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); direction: ltr; }
  .gs .res { position: absolute; top: calc(100% + 8px); right: 0; left: 0; z-index: 60; max-height: 60vh; overflow-y: auto; padding: 8px; border-radius: 18px; background: rgba(24,21,31,.97); border: 1px solid var(--line-2); box-shadow: 0 30px 70px -30px #000; }
  .gs .grp { font-size: 11.5px; font-weight: 700; color: var(--muted-2); padding: 8px 10px 4px; }
  .gs .it { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; text-align: right; }
  .gs .it:hover, .gs .it.sel { background: rgba(169,155,184,.1); }

  .vy-view { flex: 1; min-height: 0; }

  .wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- البطاقات ---------- */

  /* شارات الحالة */
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 8px 2px 8px 2px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }

  /* ---------- اللوحة الجانبية (ملف الستريمر) ---------- */
  .drawer-bg { position: fixed; inset: 0; z-index: 70; background: rgba(6,5,9,.55); opacity: 0; pointer-events: none; transition: opacity .3s; }

  .drawer { position: fixed; z-index: 71; top: 12px; bottom: 12px; left: 12px; width: min(760px, calc(100vw - 24px)); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; transform: translateX(-104%); transition: transform .4s var(--ease); background: linear-gradient(155deg, rgba(169,155,184,.10), rgba(66,57,79,.10) 60%), rgba(20,17,26,.98); border: 1px solid var(--line-2); box-shadow: 0 40px 90px -30px #000; }

  .subbox { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 16px 4px 16px 4px; border: 1px solid rgba(207,195,220,.25); background: linear-gradient(160deg, rgba(141,127,163,.22), rgba(66,57,79,.12)); flex-wrap: wrap; }

  .tl .e.ok::before { background: var(--ok); } .tl .e.bad::before { background: var(--bad); } .tl .e.warn::before { background: var(--warn); } .tl .e.gold::before { background: var(--gold); }
  .tl .e small { display: block; color: var(--muted-2); font-size: 11.5px; }

  /* ---------- النوافذ ---------- */
  .modal-bg { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6,5,9,.6); animation: fade .2s; }

  /* التنبيهات السريعة */

  /* ---------- المكتبة ---------- */
  .a-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .a-card { position: relative; border-radius: 16px 4px 16px 4px; overflow: hidden; border: 1px solid transparent; background: linear-gradient(180deg, rgba(169,155,184,.07), rgba(169,155,184,.02)) padding-box, var(--vb-edge) border-box; cursor: pointer; transition: transform .2s var(--ease), box-shadow .25s; display: flex; flex-direction: column; }

  .drop { border: 1.5px dashed var(--line-2); border-radius: 16px 4px 16px 4px; padding: 26px; text-align: center; color: var(--muted); cursor: pointer; transition: background .2s, border-color .2s; }

  /* معاينة التوب */

  .top-prev .tr .rk { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--ta, #8d7fa3); color: #14121a; border-radius: 6px; }
