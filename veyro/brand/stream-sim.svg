<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- «محاكاة بث» لفيرو: شاشة بث 1920×1080 (مشهد لعبة + كاميرا + شات + شارة مباشر) عشان تختبر التفريغ والأليرت فوق بث حقيقي.
       رسمة أصلية لفيرو (بدون شعارات منصات). تستخدمها veyro/admin.html (خلفية «محاكاة بث») وveyro/studio.js (المعاينة وأداة التفريغ). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1230"/><stop offset=".45" stop-color="#2a1449"/><stop offset=".62" stop-color="#5b1f55"/><stop offset=".63" stop-color="#140c22"/><stop offset="1" stop-color="#07060c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/><stop offset=".55" stop-color="#ff6b9a"/><stop offset="1" stop-color="#b13cff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7ab8" stop-opacity=".55"/><stop offset="1" stop-color="#ff7ab8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3150"/><stop offset="1" stop-color="#1b1724"/>
    </linearGradient>
    <linearGradient id="chatfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".25" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1920" height="672"/></clipPath>
    <clipPath id="camclip"><rect x="40" y="772" width="400" height="268" rx="22"/></clipPath>
  </defs>

  <!-- المشهد (لعبة) -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="210" cy="120" r="2"/><circle cx="460" cy="70" r="1.6"/><circle cx="690" cy="160" r="2.2"/><circle cx="880" cy="60" r="1.4"/><circle cx="1320" cy="110" r="2"/>
    <circle cx="1540" cy="60" r="1.6"/><circle cx="1710" cy="170" r="2.2"/><circle cx="120" cy="300" r="1.4"/><circle cx="1830" cy="320" r="1.6"/><circle cx="1010" cy="240" r="1.4"/>
  </g>
  <circle cx="960" cy="500" r="330" fill="url(#glow)"/>
  <g clip-path="url(#sunclip)">
    <circle cx="960" cy="520" r="220" fill="url(#sun)"/>
    <g fill="#2a1449"><rect x="700" y="560" width="520" height="10"/><rect x="700" y="592" width="520" height="14"/><rect x="700" y="628" width="520" height="18"/><rect x="700" y="660" width="520" height="12"/></g>
  </g>
  <path d="M0 672 L160 560 L300 620 L470 500 L640 600 L760 560 L860 672 Z" fill="#1d1033"/>
  <path d="M1060 672 L1180 580 L1320 630 L1480 520 L1650 610 L1790 540 L1920 600 L1920 672 Z" fill="#1d1033"/>
  <g stroke="#d35bff" stroke-opacity=".55" stroke-width="2">
    <line x1="0" y1="700" x2="1920" y2="700"/><line x1="0" y1="740" x2="1920" y2="740"/><line x1="0" y1="796" x2="1920" y2="796"/><line x1="0" y1="872" x2="1920" y2="872"/><line x1="0" y1="980" x2="1920" y2="980"/>
    <line x1="960" y1="672" x2="960" y2="1080"/><line x1="960" y1="672" x2="560" y2="1080"/><line x1="960" y1="672" x2="160" y2="1080"/><line x1="960" y1="672" x2="-240" y2="1080"/>
    <line x1="960" y1="672" x2="1360" y2="1080"/><line x1="960" y1="672" x2="1760" y2="1080"/><line x1="960" y1="672" x2="2160" y2="1080"/>
  </g>
  <!-- شخصية اللعبة -->
  <g transform="translate(960 900)">
    <ellipse cx="0" cy="58" rx="90" ry="16" fill="#000" opacity=".45"/>
    <path d="M-70 40 L-40 -40 L40 -40 L70 40 Z" fill="#3cf2ff" opacity=".9"/>
    <path d="M-40 -40 L0 -90 L40 -40 Z" fill="#ff5fa8"/>
    <rect x="-24" y="-20" width="48" height="16" rx="6" fill="#0b1230"/>
  </g>

  <!-- شارة مباشر + المشاهدين -->
  <g font-family="IBM Plex Sans Arabic, Noto Kufi Arabic, Tahoma, Arial, sans-serif" font-weight="700">
    <rect x="40" y="36" width="104" height="44" rx="12" fill="#ff2d55"/>
    <text x="92" y="66" font-size="24" fill="#fff" text-anchor="middle" letter-spacing="2">LIVE</text>
    <rect x="156" y="36" width="150" height="44" rx="12" fill="#000" fill-opacity=".5"/>
    <path d="M176 58 c8 -10 26 -10 34 0 c-8 10 -26 10 -34 0z" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="193" cy="58" r="4.5" fill="#fff"/>
    <text x="222" y="66" font-size="22" fill="#fff">12.4K</text>

    <!-- الستريمر -->
    <rect x="1560" y="36" width="320" height="56" rx="28" fill="#000" fill-opacity=".45"/>
    <circle cx="1852" cy="64" r="22" fill="#8d7fa3"/><circle cx="1852" cy="58" r="8" fill="#e9e1f3"/><path d="M1838 78 c4 -10 24 -10 28 0z" fill="#e9e1f3"/>
    <text x="1818" y="62" font-size="20" fill="#fff" text-anchor="end">ستريمر فيرو</text>
    <text x="1818" y="84" font-size="15" fill="#cfc3dc" text-anchor="end" font-weight="500">بث مباشر — 2:14:08</text>
  </g>

  <!-- الكاميرا -->
  <g clip-path="url(#camclip)">
    <rect x="40" y="772" width="400" height="268" fill="url(#cam)"/>
    <circle cx="240" cy="880" r="54" fill="#6e617f"/>
    <path d="M120 1040 C130 960 190 935 240 935 C290 935 350 960 360 1040 Z" fill="#6e617f"/>
    <rect x="40" y="772" width="400" height="268" fill="#ff7ab8" opacity=".06"/>
  </g>
  <rect x="40" y="772" width="400" height="268" rx="22" fill="none" stroke="#cfc3dc" stroke-opacity=".55" stroke-width="3"/>
  <circle cx="68" cy="800" r="7" fill="#ff2d55"/>

  <!-- الشات -->
  <rect x="1440" y="470" width="480" height="610" fill="url(#chatfade)"/>
  <g font-family="IBM Plex Sans Arabic, Noto Kufi Arabic, Tahoma, Arial, sans-serif" font-size="22">
    <g transform="translate(0 540)"><circle cx="1856" cy="-8" r="18" fill="#ffd54a"/><text x="1826" y="0" text-anchor="end" fill="#ffd54a" font-weight="700">فهد<tspan fill="#fff" font-weight="500">  هلا والله بالبث</tspan></text></g>
    <g transform="translate(0 604)"><circle cx="1856" cy="-8" r="18" fill="#4dd8ff"/><text x="1826" y="0" text-anchor="end" fill="#4dd8ff" font-weight="700">سارة<tspan fill="#fff" font-weight="500">  أسطوري اليوم</tspan></text></g>
    <g transform="translate(0 668)"><circle cx="1856" cy="-8" r="18" fill="#ff7ab8"/><text x="1826" y="0" text-anchor="end" fill="#ff7ab8" font-weight="700">نواف<tspan fill="#fff" font-weight="500">  أرسل 5 وردة</tspan></text></g>
    <g transform="translate(0 732)"><circle cx="1856" cy="-8" r="18" fill="#7cff6b"/><text x="1826" y="0" text-anchor="end" fill="#7cff6b" font-weight="700">ريم<tspan fill="#fff" font-weight="500">  تابعت البث</tspan></text></g>
    <g transform="translate(0 796)"><circle cx="1856" cy="-8" r="18" fill="#c58bff"/><text x="1826" y="0" text-anchor="end" fill="#c58bff" font-weight="700">سلطان<tspan fill="#fff" font-weight="500">  كمل كمل</tspan></text></g>
    <g transform="translate(0 860)"><circle cx="1856" cy="-8" r="18" fill="#ffd54a"/><text x="1826" y="0" text-anchor="end" fill="#ffd54a" font-weight="700">جود<tspan fill="#fff" font-weight="500">  شاركت البث</tspan></text></g>
    <g transform="translate(0 924)"><circle cx="1856" cy="-8" r="18" fill="#4dd8ff"/><text x="1826" y="0" text-anchor="end" fill="#4dd8ff" font-weight="700">ماجد<tspan fill="#fff" font-weight="500">  الله يعطيك العافية</tspan></text></g>
    <rect x="1470" y="984" width="330" height="56" rx="28" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".2"/>
    <text x="1776" y="1020" text-anchor="end" fill="#fff" fill-opacity=".6" font-size="20">أضف تعليق…</text>
    <circle cx="1846" cy="1012" r="28" fill="#ff2d55" fill-opacity=".9"/>
    <path d="M1846 1026 l-13 -13 a7.5 7.5 0 0 1 13 -9 a7.5 7.5 0 0 1 13 9z" fill="#fff"/>
  </g>
</svg>
