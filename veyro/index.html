<!DOCTYPE html>
<html lang="ar" dir="rtl" data-agp-studio data-agp-screens>
<head>
<meta charset="utf-8">
<script>
/* الرابط بدون / بالآخر (aymngames.online/veyro) يخلي ملفات الصفحة تنطلب من المجلد الغلط
   (صفحة فاضية وشعار مكسور) — نحوّله لـ/veyro/ قبل ما يحمّل أي شي */
(function () { var p = location.pathname; if (!/\/$/.test(p) && !/\.html?$/i.test(p)) location.replace(p + '/' + location.search + location.hash); })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Veyro — شاشات البث</title>
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="brand/veyro-icon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#14121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* «Veyro فيرو» — منصة الأوفرلي وأدوات البث (من منظومة ألعاب أيمن).
     veyro/index.html = الهيكل والتصميم، veyro/studio.js = المنطق. (النسخة القديمة overlay/ باقية زي ما هي.)
     الهوية: لافندر دخاني — #14121A (الخلفية) #42394F (داكن) #6E617F (متوسط) #A99BB8 (فاتح)،
     أسطح زجاجية، Noto Kufi Arabic للعناوين وIBM Plex Sans Arabic للنصوص.
     التخطيط: قائمة جانبية يسار الشاشة (تنطوي لأيقونات بس)، وجنبها الصفحة:
     الرئيسية ← الشاشات ← أدوات البث (كل أداة قسم) ← الطبقات ← الرابط والإعدادات. */
  :root {
    --bg: #0e0d13; --bg-2: #14121a; --lav-d: #42394f; --lav-m: #6e617f; --lav: #a99bb8; --lav-l: #cfc3dc;
    --text: #f3eff8; --muted: #a99bb8; --muted-2: #857a95;
    --glass: linear-gradient(155deg, rgba(169,155,184,.10), rgba(66,57,79,.10) 60%, rgba(20,18,26,.18));
    --glass-2: linear-gradient(155deg, rgba(169,155,184,.14), rgba(66,57,79,.14));
    --glass-solid: rgba(24,21,31,.72);
    --card: rgba(169,155,184,.05); --card-2: rgba(169,155,184,.09);
    --line: rgba(169,155,184,.14); --line-2: rgba(169,155,184,.28);
    --accent: #6e617f; --accent-2: #cfc3dc; --sky: #d8ccff; --pink: #c9a6d8;
    --grad: linear-gradient(180deg, #8d7fa3, #6e617f);
    --ok: #74d6a1; --warn: #e9c27a; --bad: #ec8f9d;
    --r: 18px; --blur: blur(22px) saturate(140%);
    --nav-w: 252px; --nav-w-mini: 78px; --panel-w: 352px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: var(--lav-l); text-decoration: none; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--lav-l); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- الخلفية العامة: دخان لافندر + زجاج + توهّج يتبع الماوس ---------- */
  .vy-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; contain: strict;
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(110,97,127,.32), transparent 60%),
      radial-gradient(900px 640px at -5% 110%, rgba(110,97,127,.26), transparent 60%),
      radial-gradient(700px 500px at 45% 55%, rgba(66,57,79,.25), transparent 70%),
      linear-gradient(180deg, #121018, #0b0a10); }
  .vy-bg svg.waves { position: absolute; width: 140%; height: 140%; left: -20%; top: -20%; opacity: .5; } /* ثابتة عمداً: أي حركة هنا تخلّي المتصفح يعيد رسم الصفحة كل فريم */
  .vy-bg .grain { position: absolute; inset: 0; opacity: .035; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vy-bg .glow { position: absolute; width: 620px; height: 620px; left: 0; top: 0; border-radius: 50%; background: radial-gradient(circle, rgba(169,155,184,.13), transparent 62%); transform: translate3d(var(--gx, -999px), var(--gy, -999px), 0) translate(-50%, -50%); transition: transform .5s var(--ease); will-change: transform; }

  /* ---------- مكوّنات عامة ---------- */
  /* «زجاج» بدون backdrop-filter: التغبيش الحقيقي على مساحات كبيرة يثقّل التصفح بقوة،
     فالشكل الزجاجي من تدرّج شفاف فوق لون داكن + حد فاتح + لمعة داخلية. */
  .glass { background: var(--glass), rgba(22,19,28,.62); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px -34px rgba(0,0,0,.85); }

  /* أزرار: لمعة تتبع الماوس (--mx/--my من studio.js)، رفعة خفيفة، وضغطة */
  .ob-btn { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: transform .25s var(--ease), border-color .25s, background .25s, box-shadow .25s; }
  .ob-btn::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.22), transparent 60%); transition: opacity .3s; }
  .ob-btn:hover { transform: translateY(-1px); border-color: rgba(207,195,220,.5); }
  .ob-btn:hover::before { opacity: 1; }
  .ob-btn:active { transform: translateY(0) scale(.98); }
  .ob-btn svg { width: 17px; height: 17px; flex: none; }
  .ob-btn.primary, .ob-btn.sky { background: var(--grad); border-color: rgba(207,195,220,.45); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 26px -14px rgba(141,127,163,.9); }
  .ob-btn.primary:hover, .ob-btn.sky:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 14px 32px -14px rgba(169,155,184,.95); }
  .ob-btn.ghost { background: rgba(169,155,184,.04); border-color: var(--line-2); color: var(--lav-l); }
  .ob-btn.danger { background: rgba(236,143,157,.08); border-color: rgba(236,143,157,.4); color: #f4b6c0; }
  .ob-btn.lg { padding: 13px 22px; font-size: 14.5px; border-radius: 15px; }
  .ob-btn.icon { padding: 0; width: 40px; height: 40px; }

  /* ---------- الهيكل: القائمة يسار + الصفحة ---------- */
  .vy-app { position: relative; z-index: 1; direction: ltr; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); height: 100vh; height: 100dvh; padding: 12px; gap: 12px; transition: grid-template-columns .35s var(--ease); }
  .vy-app > * { direction: rtl; }
  .vy-app.mini { grid-template-columns: var(--nav-w-mini) minmax(0, 1fr); }

  .vy-side { display: flex; flex-direction: column; min-height: 0; border-radius: 24px; padding: 14px 10px; overflow: hidden; }
  .vy-brand { display: flex; align-items: center; justify-content: center; height: 78px; flex: none; margin-bottom: 6px; position: relative; }
  .vy-brand img.full { width: 176px; height: auto; transition: opacity .25s, transform .35s var(--ease); filter: drop-shadow(0 6px 18px rgba(110,97,127,.45)); }
  .vy-brand img.mini { position: absolute; width: 44px; height: 44px; opacity: 0; transform: scale(.7); transition: opacity .25s, transform .35s var(--ease); }
  .vy-app.mini .vy-brand img.full { opacity: 0; transform: scale(.85); pointer-events: none; }
  .vy-app.mini .vy-brand img.mini { opacity: 1; transform: none; }

  .vy-nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; display: flex; flex-direction: column; gap: 2px; padding: 2px; }
  .vy-nav::-webkit-scrollbar { display: none; }
  .vy-group { margin: 14px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--muted-2); white-space: nowrap; overflow: hidden; transition: opacity .2s; }
  .vy-app.mini .vy-group { opacity: 0; height: 1px; margin: 10px 14px; background: var(--line); }
  .vy-item { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 13px; border: 1px solid transparent; border-radius: 13px; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; transition: color .2s, background .25s, border-color .25s; }
  .vy-item::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(207,195,220,.16), transparent 65%); transition: opacity .25s; }
  .vy-item:hover { color: var(--text); background: rgba(169,155,184,.05); }
  .vy-item:hover::before { opacity: 1; }
  .vy-item svg { width: 21px; height: 21px; flex: none; }
  .vy-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
  .vy-item .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(169,155,184,.16); color: var(--lav-l); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; transition: opacity .2s; }
  .vy-item.on { color: #fff; background: linear-gradient(180deg, rgba(141,127,163,.42), rgba(110,97,127,.26)); border-color: rgba(207,195,220,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 22px -14px rgba(141,127,163,.9); }
  .vy-item.on::after { content: ""; position: absolute; left: 0; top: 24%; bottom: 24%; width: 3px; border-radius: 0 3px 3px 0; background: var(--lav-l); box-shadow: 0 0 10px rgba(207,195,220,.8); }
  .vy-app.mini .vy-item { justify-content: center; padding: 0; }
  .vy-app.mini .vy-item .lbl, .vy-app.mini .vy-item .badge { opacity: 0; position: absolute; pointer-events: none; }
  /* تلميح الاسم لما القائمة مطوية */
  .vy-tip { position: fixed; z-index: 80; padding: 7px 12px; border-radius: 10px; background: rgba(28,24,36,.96); border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; color: var(--text); pointer-events: none; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .15s; white-space: nowrap; }
  .vy-tip.show { opacity: 1; transform: none; }

  .vy-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; }
  .vy-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); min-width: 0; color: var(--text); }
  .vy-user .av { width: 36px; height: 36px; flex: none; border-radius: 50%; background: linear-gradient(160deg, var(--lav-m), var(--lav-d)); border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; overflow: hidden; }
  .vy-user .av img { width: 100%; height: 100%; object-fit: cover; }
  .vy-user .who { flex: 1; min-width: 0; line-height: 1.35; }
  .vy-user .who b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-user .who small { font-size: 11.5px; color: var(--muted-2); }
  .vy-app.mini .vy-user { justify-content: center; padding: 6px; background: transparent; border-color: transparent; }
  .vy-app.mini .vy-user .who, .vy-app.mini .vy-foot .ob-btn .lbl { display: none; }
  .vy-collapse { width: 100%; justify-content: center; }
  .vy-collapse svg { transition: transform .35s var(--ease); }
  .vy-app.mini .vy-collapse svg { transform: scaleX(-1); }
  .vy-app.mini .vy-foot .ob-btn { padding: 0; height: 40px; }

  .vy-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .vy-view { flex: 1; min-height: 0; }
  .vy-scroll { height: 100%; overflow-y: auto; padding: 4px 6px 28px 4px; scrollbar-width: thin; scrollbar-color: rgba(169,155,184,.25) transparent; }
  .vy-view.enter { animation: vy-in .45s var(--ease); }
  @keyframes vy-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* شريط الجوال */
  .vy-mbar { display: none; }

  /* ---------- الرئيسية ---------- */
  .vy-wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .vy-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 34px 36px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: center; min-height: 300px; }
  .vy-hero::after { content: ""; position: absolute; inset: auto -10% -60% -10%; height: 70%; background: radial-gradient(60% 60% at 50% 0%, rgba(169,155,184,.16), transparent 70%); pointer-events: none; }
  .vy-hero .kicker { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(169,155,184,.08); border: 1px solid var(--line); font-size: 12px; color: var(--lav-l); font-weight: 600; }
  .vy-hero .kicker i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .vy-hero h1 { margin: 16px 0 10px; font-family: "Noto Kufi Arabic", sans-serif; font-weight: 800; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.35; }
  .vy-hero h1 .en { direction: ltr; unicode-bidi: isolate; background: linear-gradient(180deg, #f5f0fb, #a99bb8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .vy-hero h1 .ar { color: var(--lav); }
  .vy-hero p { margin: 0 0 24px; font-size: 16px; line-height: 1.9; color: var(--lav-l); max-width: 460px; }
  .vy-hero .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  /* بطاقة «LIVE» الزجاجية بالهيرو — تتحرك مع الماوس */
  .vy-live { position: relative; aspect-ratio: 16 / 10; border-radius: 22px; border: 1px solid rgba(207,195,220,.3); background: linear-gradient(150deg, rgba(169,155,184,.16), rgba(66,57,79,.12)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 40px 80px -40px rgba(0,0,0,.95), 0 0 0 8px rgba(169,155,184,.03); transform: perspective(900px) rotateY(var(--ry, -8deg)) rotateX(var(--rx, 4deg)); transition: transform .5s var(--ease); display: flex; align-items: center; justify-content: center; }
  .vy-live::before, .vy-live::after { content: ""; position: absolute; width: 34px; height: 34px; border: 2px solid rgba(207,195,220,.55); }
  .vy-live::before { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .vy-live::after { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
  .vy-live img { width: 34%; filter: drop-shadow(0 10px 30px rgba(110,97,127,.7)); }
  .vy-live .tag { position: absolute; top: 18px; left: 18px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(20,18,26,.6); border: 1px solid var(--line-2); font-size: 12px; font-weight: 700; direction: ltr; }
  .vy-live .tag i { width: 7px; height: 7px; border-radius: 50%; background: #ff6b81; box-shadow: 0 0 8px #ff6b81; animation: vy-pulse 1.6s ease-in-out infinite; }
  .vy-live .stat { position: absolute; bottom: 18px; right: 18px; display: flex; gap: 8px; }
  .vy-live .stat span { padding: 6px 10px; border-radius: 10px; background: rgba(20,18,26,.55); border: 1px solid var(--line); font-size: 12px; color: var(--lav-l); }
  @keyframes vy-pulse { 50% { opacity: .35; } }

  .vy-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .vy-stat { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .vy-stat .ic { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: rgba(169,155,184,.1); border: 1px solid var(--line); color: var(--lav-l); }
  .vy-stat .ic svg { width: 21px; height: 21px; }
  .vy-stat b { font-family: "Noto Kufi Arabic", sans-serif; font-size: 24px; font-weight: 700; }
  .vy-stat span { font-size: 12.5px; color: var(--muted); }
  .vy-stat.ok b { color: var(--ok); font-size: 17px; }
  .vy-stat.warn b { color: var(--warn); font-size: 17px; }

  .vy-sechead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .vy-sechead h2 { margin: 0; font-family: "Noto Kufi Arabic", sans-serif; font-size: 19px; font-weight: 700; }
  .vy-sechead p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  /* بطاقات تفاعلية (أدوات / شاشات): لمعة تتبع الماوس + رفعة */
  .vy-card { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--r); transition: transform .35s var(--ease), border-color .3s, box-shadow .3s; }
  .vy-card::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), rgba(207,195,220,.14), transparent 60%); transition: opacity .3s; }
  .vy-card:hover { transform: translateY(-3px); border-color: rgba(207,195,220,.34); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 30px 60px -32px rgba(0,0,0,.9); }
  .vy-card:hover::before { opacity: 1; }

  .vy-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .vy-tool { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px; cursor: pointer; text-align: right; color: var(--text); border: 1px solid var(--line); }
  .vy-tool .ic { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(169,155,184,.18), rgba(66,57,79,.2)); border: 1px solid var(--line-2); color: var(--lav-l); transition: transform .35s var(--ease); }
  .vy-tool:hover .ic { transform: scale(1.06) rotate(-4deg); }
  .vy-tool .ic svg { width: 23px; height: 23px; }
  .vy-tool b { font-size: 15px; }
  .vy-tool small { font-size: 12.5px; color: var(--muted); line-height: 1.7; }

  /* ---------- الشاشات ---------- */
  .vy-screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
  .vy-scr { display: flex; flex-direction: column; border: 1px solid var(--line); }
  .vy-scr .thumb { position: relative; aspect-ratio: 16 / 9; margin: 10px 10px 0; border-radius: 12px; overflow: hidden; cursor: pointer; background: repeating-conic-gradient(rgba(169,155,184,.07) 0 25%, transparent 0 50%) 0 0 / 18px 18px, rgba(12,11,16,.6); border: 1px solid var(--line); }
  .vy-scr .thumb.p { aspect-ratio: auto; height: 0; padding-bottom: 56.25%; }
  .vy-scr .thumb .tf { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden; }
  .vy-scr .thumb .tf.p { background: rgba(10,9,13,.55); border-inline: 1px solid var(--line-2); }
  .vy-scr .thumb .tf .agp-so-item { pointer-events: none; }
  .vy-scr .thumb .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 12.5px; }
  .vy-scr .thumb .badge { position: absolute; top: 8px; right: 8px; z-index: 2; padding: 3px 9px; border-radius: 999px; background: rgba(20,18,26,.75); border: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--lav-l); }
  .vy-scr .thumb .badge.off { color: var(--warn); }
  .vy-scr .info { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 3px; }
  .vy-scr .info b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-scr .info small { font-size: 12px; color: var(--muted); }
  .vy-scr .acts { display: flex; gap: 6px; padding: 10px 14px 14px; flex-wrap: wrap; }
  .vy-scr .acts .ob-btn { padding: 8px 12px; font-size: 12.5px; }
  .vy-scr .acts .ob-btn.icon { width: 36px; height: 36px; padding: 0; }
  .vy-scr .acts .grow { flex: 1; }
  .vy-scr.cur { border-color: rgba(207,195,220,.4); }
  .vy-new { min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1.5px dashed var(--line-2); background: rgba(169,155,184,.03); color: var(--lav-l); cursor: pointer; font-size: 14px; font-weight: 600; }
  .vy-new .plus { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(169,155,184,.1); border: 1px solid var(--line-2); transition: transform .35s var(--ease); }
  .vy-new:hover .plus { transform: rotate(90deg); }
  .vy-new small { color: var(--muted-2); font-weight: 400; }

  .vy-guide { border-radius: var(--r); padding: 20px 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .vy-guide h3 { margin: 0 0 8px; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .vy-guide h3 span { padding: 2px 8px; border-radius: 7px; background: rgba(169,155,184,.12); font-size: 11.5px; direction: ltr; }

  /* ---------- أدوات البث (المحرر) ---------- */
  .ob-editor { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
  .ob-top { display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 12px; border-radius: 18px; min-width: 0; }
  .ob-ttl { flex: none; display: flex; flex-direction: column; line-height: 1.3; padding: 0 4px; }
  .ob-ttl b { font-family: "Noto Kufi Arabic", sans-serif; font-weight: 700; font-size: 15px; }
  .ob-ttl small { font-size: 11.5px; color: var(--muted); }
  .ob-sep { flex: none; width: 1px; height: 28px; background: var(--line); }
  .ob-screens { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .ob-screens::-webkit-scrollbar { display: none; }
  .ob-chip { position: relative; isolation: isolate; overflow: hidden; flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--lav-l); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; max-width: 220px; transition: border-color .25s, background .25s; }
  .ob-chip::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(90px circle at var(--mx, 50%) var(--my, 50%), rgba(207,195,220,.18), transparent 65%); transition: opacity .25s; }
  .ob-chip:hover::before { opacity: 1; }
  .ob-chip span { overflow: hidden; text-overflow: ellipsis; }
  .ob-chip:hover { border-color: var(--line-2); color: #fff; }
  .ob-chip.on { background: linear-gradient(180deg, rgba(141,127,163,.42), rgba(110,97,127,.24)); border-color: rgba(207,195,220,.45); color: #fff; }
  .ob-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); flex: none; }
  .ob-chip.on .dot { background: var(--lav-l); box-shadow: 0 0 8px rgba(207,195,220,.8); }
  .ob-chip.add { border-style: dashed; }
  .ob-status { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 11px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .ob-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px rgba(233,194,122,.6); }
  .ob-status.ok i { background: var(--ok); box-shadow: 0 0 8px rgba(116,214,161,.6); }
  .ob-saved { flex: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 62px; text-align: center; }
  .ob-saved.ok { color: var(--ok); }
  .ob-saved.bad { color: var(--warn); }

  /* شريط أقسام الأدوات — يظهر بالجوال بس (بالكمبيوتر الأقسام بالقائمة الجانبية) */
  .ob-mtabs { display: none; }

  .ob-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); gap: 12px; min-height: 0; transition: grid-template-columns .35s var(--ease); }
  .ob-body.closed { grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
  .ob-body.wide { --panel-w: min(640px, 50vw); }
  .ob-panel { border-radius: 20px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; transition: opacity .25s; }
  .ob-body.closed .ob-panel { opacity: 0; border: 0; }
  .ob-phead { flex: none; display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); min-width: var(--panel-w); }
  .ob-phead div { flex: 1; min-width: 0; }
  .ob-phead h2 { margin: 0; font-family: "Noto Kufi Arabic", sans-serif; font-size: 16.5px; font-weight: 700; }
  .ob-phead p { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.75; }
  .ob-x { flex: none; width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--lav-l); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: border-color .2s, color .2s, transform .25s var(--ease); }
  .ob-x svg { width: 16px; height: 16px; }
  .ob-x:hover { color: #fff; border-color: var(--line-2); transform: rotate(90deg); }
  .ob-pbody { flex: 1; overflow-y: auto; padding: 14px 16px 24px; min-width: var(--panel-w); display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: rgba(169,155,184,.25) transparent; }

  .ob-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ob-tools.one { grid-template-columns: 1fr; }
  .ob-tool { position: relative; isolation: isolate; display: flex; flex-direction: column; padding: 0; border-radius: 16px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: right; overflow: hidden; transition: border-color .25s, transform .35s var(--ease), box-shadow .3s; }
  .ob-tool::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), rgba(207,195,220,.14), transparent 60%); transition: opacity .3s; }
  .ob-tool:hover { border-color: rgba(207,195,220,.4); transform: translateY(-2px); box-shadow: 0 18px 36px -24px rgba(0,0,0,.9); }
  .ob-tool:hover::after { opacity: 1; }
  .ob-tool .pv { position: relative; height: 104px; overflow: hidden; pointer-events: none; background: radial-gradient(circle at 50% 40%, rgba(169,155,184,.14), transparent 70%), repeating-conic-gradient(rgba(169,155,184,.06) 0 25%, transparent 0 50%) 0 0 / 16px 16px, rgba(12,11,16,.55); }
  .ob-tools.one .ob-tool .pv { height: 120px; }
  .ob-pvw { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
  .ob-pvw .agp-so-item { left: 0; top: 0; max-width: none; }
  .ob-tool .pv .agp-so-ghost { opacity: 1; }
  .ob-tool .meta { padding: 9px 11px 10px; }
  .ob-tool b { display: block; font-size: 13.5px; }
  .ob-tool small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  .ob-igrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .ob-ibtn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 13px; border: 1px solid var(--line); background: var(--card); cursor: pointer; color: #ffd54a; padding: 10px; transition: transform .25s var(--ease), border-color .2s, background .2s; }
  .ob-ibtn:hover { border-color: rgba(207,195,220,.5); background: rgba(169,155,184,.1); transform: scale(1.06); }
  .ob-ibtn svg { width: 100%; height: 100%; filter: drop-shadow(0 0 4px currentColor); }
  .ob-ibtn.emo { font-size: 26px; line-height: 1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }

  .ob-seg, .ob-ptabs { display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: rgba(169,155,184,.05); border: 1px solid var(--line); }
  .ob-seg button, .ob-ptabs button { flex: 1; padding: 8px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--lav-l); font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
  .ob-seg button:hover, .ob-ptabs button:hover { color: #fff; }
  .ob-seg button.on, .ob-ptabs button.on { background: var(--grad); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }

  /* صفوف الإعدادات: العنوان يمين والتحكم يسار (قاعدة CLAUDE.md) */
  .ob-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(169,155,184,.06), rgba(169,155,184,.015)); }
  .ob-row > .ob-label { text-align: right; font-size: 13.5px; font-weight: 600; flex: none; }
  .ob-row > .ob-label small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .ob-row.col { flex-direction: column; align-items: stretch; }
  .ob-pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .ob-row.col .ob-pills { justify-content: flex-start; }
  .ob-pill { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(169,155,184,.04); color: var(--lav-l); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: border-color .2s, background .2s, color .2s; }
  .ob-pill:hover { border-color: rgba(207,195,220,.5); color: #fff; }
  .ob-pill.on { background: var(--grad); border-color: rgba(207,195,220,.5); color: #fff; }
  .ob-sw { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; align-items: center; }
  .ob-sw button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); cursor: pointer; padding: 0; transition: transform .2s var(--ease); }
  .ob-sw button:hover { transform: scale(1.12); }
  .ob-sw button.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(207,195,220,.45); }
  .ob-sw input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
  .ob-input { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: #fff; background: rgba(12,11,16,.45); border: 1px solid var(--line-2); border-radius: 11px; padding: 9px 11px; direction: rtl; resize: vertical; transition: border-color .2s, box-shadow .2s; }
  .ob-input:focus { outline: none; border-color: rgba(207,195,220,.7); box-shadow: 0 0 0 3px rgba(169,155,184,.15); }
  .ob-input.num { direction: ltr; text-align: left; max-width: 130px; }
  .ob-range { flex: 1; max-width: 190px; accent-color: var(--lav); }
  .ob-toggle { position: relative; width: 46px; height: 26px; flex: none; }
  .ob-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .ob-toggle span { position: absolute; inset: 0; border-radius: 999px; background: rgba(169,155,184,.18); transition: background .25s; cursor: pointer; }
  .ob-toggle span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .3s var(--ease); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .ob-toggle input:checked + span { background: linear-gradient(180deg, #c3b4d6, #8d7fa3); box-shadow: 0 0 0 1px rgba(207,195,220,.45), 0 0 12px -2px rgba(169,155,184,.6); }
  .ob-toggle input:checked + span::after { transform: translateX(-20px); }
  .ob-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ob-hint { font-size: 12.5px; color: var(--muted); line-height: 1.85; }
  .ob-card { padding: 15px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 10px; }
  .ob-card h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text); }
  .ob-card.link { border-color: rgba(207,195,220,.3); background: linear-gradient(160deg, rgba(169,155,184,.12), rgba(66,57,79,.08)); }
  .ob-url { width: 100%; direction: ltr; text-align: left; font: 12.5px ui-monospace, Menlo, monospace; color: var(--lav-l); background: rgba(12,11,16,.55); border: 1px solid var(--line-2); border-radius: 11px; padding: 10px; }
  .ob-steps { margin: 0; padding: 0 18px 0 0; font-size: 12.5px; color: var(--lav-l); line-height: 1.95; }
  .ob-warn { padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(233,194,122,.38); background: rgba(233,194,122,.07); color: #f1d59e; font-size: 12.5px; line-height: 1.8; }

  .ob-layers { display: flex; flex-direction: column; gap: 6px; }
  .ob-layer { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; transition: border-color .2s, background .2s; }
  .ob-layer:hover { border-color: var(--line-2); }
  .ob-layer.on { border-color: rgba(207,195,220,.55); background: rgba(169,155,184,.12); }
  .ob-layer.off .ob-lname { opacity: .45; text-decoration: line-through; }
  .ob-lic { flex: none; width: 28px; height: 28px; border-radius: 9px; background: rgba(169,155,184,.08); display: flex; align-items: center; justify-content: center; color: var(--lav-l); }
  .ob-lic svg { width: 16px; height: 16px; }
  .ob-lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .ob-ib { width: 30px; height: 30px; flex: none; border-radius: 9px; border: 1px solid var(--line); background: rgba(169,155,184,.04); color: var(--lav-l); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; padding: 0; transition: color .2s, border-color .2s; }
  .ob-ib:hover { color: #fff; border-color: rgba(207,195,220,.5); }
  .ob-ib.danger:hover { color: #f4b6c0; border-color: rgba(236,143,157,.5); }

  .ob-fgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ob-fbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--line); background: rgba(169,155,184,.03); color: #fff; cursor: pointer; transition: border-color .2s; }
  .ob-fbtn:hover { border-color: var(--line-2); }
  .ob-fbtn.on { border-color: rgba(207,195,220,.6); background: rgba(169,155,184,.14); }
  .ob-fbtn span:first-child { font-size: 20px; line-height: 1.5; }
  .ob-fbtn span:last-child { font-size: 11px; color: var(--muted); }

  /* أليرتات الفيديو: خانة الرفع + المكتبة */
  .vy-drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 150px; padding: 18px; border-radius: 18px; border: 1.5px dashed var(--line-2); background: radial-gradient(circle at 50% 0%, rgba(169,155,184,.12), transparent 70%), rgba(169,155,184,.03); text-align: center; cursor: pointer; transition: border-color .25s, background .25s, transform .3s var(--ease); }
  .vy-drop:hover, .vy-drop.over { border-color: rgba(207,195,220,.6); background-color: rgba(169,155,184,.08); }
  .vy-drop.over { transform: scale(1.01); }
  .vy-drop .ic { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--grad); color: #fff; box-shadow: 0 10px 24px -12px rgba(141,127,163,.9); margin-bottom: 4px; }
  .vy-drop .ic svg { width: 24px; height: 24px; }
  .vy-drop b { font-size: 14.5px; }
  .vy-drop small { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .vy-drop.busy { cursor: progress; border-style: solid; }
  .vy-up-bar { width: 100%; height: 8px; border-radius: 99px; background: rgba(169,155,184,.14); overflow: hidden; margin-top: 4px; }
  .vy-up-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--grad); transition: width .2s; }
  .vy-lib-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .vy-lib-head b { font-size: 13.5px; }
  .vy-lib-head span { font-size: 12px; color: var(--muted); }
  .vy-lib { display: flex; flex-direction: column; gap: 8px; }
  .vy-media { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 10px; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .vy-media .th { grid-row: 1 / 3; position: relative; width: 92px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: repeating-conic-gradient(rgba(169,155,184,.08) 0 25%, transparent 0 50%) 0 0 / 12px 12px, #0d0c12; }
  .vy-media .th video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vy-media .th .dur { position: absolute; bottom: 4px; left: 4px; padding: 1px 6px; border-radius: 6px; background: rgba(10,9,13,.8); font-size: 11px; direction: ltr; }
  .vy-media .mi { min-width: 0; }
  .vy-media .mi b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-media .mi small { font-size: 11.5px; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
  .vy-media .acts { display: flex; gap: 6px; align-items: center; }
  .vy-media .acts .ob-btn { padding: 7px 12px; font-size: 12.5px; }
  .vy-media .acts .ob-btn.icon { width: 34px; height: 34px; padding: 0; }
  /* إحصائيات البث (stats-card.js) */
  .vs-wrap { display: grid; grid-template-columns: minmax(0, 1fr) min(460px, 42vw); gap: 16px; min-height: 100%; align-items: start; }
  .vs-stage { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 4px; }
  .vs-frame { position: relative; height: min(76vh, 900px); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 1px var(--line-2); background: #0d0c12; }
  .vs-canvas { width: 100%; height: 100%; display: block; }
  .vs-safe { position: absolute; border: 2px dashed rgba(255,213,74,.55); border-radius: 10px; pointer-events: none; }
  .vs-safe span { position: absolute; top: -22px; right: 0; font-size: 11px; color: rgba(255,213,74,.85); background: rgba(10,9,13,.7); padding: 1px 7px; border-radius: 6px; }
  .vs-sbar { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .vs-gtog { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text, #fff); }
  .vs-acts { display: flex; gap: 8px; }
  .vs-side { border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .vs-side .ob-phead { min-width: 0; }
  .vs-tabs { flex-wrap: wrap; }
  .vs-sec { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .vs-sec.off { opacity: .55; }
  .vs-sec .ic { font-size: 22px; width: 30px; text-align: center; }
  .vs-sec .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .vs-sec .tx b { font-size: 14px; }
  .vs-sec .tx small { font-size: 11.5px; color: var(--muted); }
  .vs-cnt { display: flex; align-items: center; gap: 4px; }
  .vs-cnt .ob-pill { min-width: 30px; padding: 4px 8px; }
  .vs-cnt b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .vs-mv { display: flex; gap: 2px; }
  .vs-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vs-bg { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .vs-bg canvas, .vs-bg img, .vs-bg i { width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; border: 2px solid transparent; object-fit: cover; display: block; box-sizing: border-box; }
  .vs-bg i { display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 26px; color: var(--lav-l); border: 1.5px dashed var(--line-2); }
  .vs-bg.on canvas, .vs-bg.on img { border-color: var(--lav-l); }
  .vs-bg.on span { color: #fff; }
  .vs-fonts { max-height: 260px; overflow-y: auto; }
  .vs-frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vs-fr { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 14px; border: 1px solid var(--line); background: rgba(169,155,184,.04); font-size: 11.5px; color: var(--muted); transition: border-color .2s; }
  .vs-fr canvas { width: 100%; aspect-ratio: 1; }
  .vs-fr.on { border-color: rgba(207,195,220,.7); background: rgba(169,155,184,.14); color: #fff; }
  .vs-frame.can-drag { cursor: grab; }
  .vs-frame.drag { cursor: grabbing; }
  @media (max-width: 900px) {
    .vs-wrap { grid-template-columns: 1fr; }
    .vs-stage { position: static; }
    .vs-frame { height: auto; width: min(100%, 360px); }
  }

  /* كرة القمر */
  .vo-pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vo-pal { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(169,155,184,.04); font-size: 12.5px; }
  .vo-pal i { width: 20px; height: 20px; border-radius: 50%; flex: none; }
  .vo-pal.on { border-color: rgba(207,195,220,.7); background: rgba(169,155,184,.14); }
  .vo-cps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vo-cp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .vo-cp input { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line-2); border-radius: 8px; background: none; cursor: pointer; flex: none; }

  /* مكتبتي */
  .vy-libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .vy-libgrid.sm { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .vy-lcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); min-width: 0; text-align: right; color: inherit; font: inherit; transition: border-color .2s, transform .25s var(--ease); }
