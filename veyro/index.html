<!DOCTYPE html>
<html lang="ar" dir="rtl" data-agp-studio data-agp-screens>
<head>
<meta charset="utf-8">
<script>
/* الرابط بدون / بالآخر (aymngames.online/veyro) يخلي ملفات الصفحة تنطلب من المجلد الغلط
   (صفحة فاضية وشعار مكسور) — نحوّله لـ/veyro/ قبل ما يحمّل أي شي */
(function () { var p = location.pathname; if (!/\/$/.test(p) && !/\.html?$/i.test(p)) location.replace(p + '/' + location.search + location.hash); })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Veyro — شاشات البث</title>
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="brand/veyro-icon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* «Veyro فيرو» — منصة الأوفرلي وأدوات البث (من منظومة ألعاب أيمن).
     veyro/index.html = الهيكل والتصميم، veyro/studio.js = المنطق. (النسخة القديمة overlay/ باقية زي ما هي.)

     التصميم على مبادئ Apple (الوضع الداكن):
     - المحتوى هو البطل: خلفية سادة، أسطح رمادية هادية، بدون توهّج ولا لمعات تلحق الماوس.
     - لون تمييز واحد (لافندر فيرو --tint) للزر الأساسي والعنصر المختار والروابط بس؛ الباقي رمادي محايد.
     - سلّم خطوط ثابت (--t-*) وخط النظام: SF Arabic على أجهزة Apple، وIBM Plex Sans Arabic للباقي.
     - أزرار كبسولة: أساسي معبّى، ثانوي رمادي، ونصي بدون خلفية. الضغط يخفّف اللون بدل ما يرفع الزر.
     - إعدادات «مجمّعة» مثل إعدادات الآيفون: مجموعة مستديرة وصفوف بخط فاصل رفيع.
     - مسافات على شبكة 4/8، وحركة قصيرة وهادية (--ease = منحنى Apple الافتراضي).
     التخطيط: قائمة جانبية يسار الشاشة (تنطوي لأيقونات بس)، وجنبها الصفحة:
     الرئيسية ← الشاشات ← أدوات البث (كل أداة قسم) ← الطبقات ← الرابط والإعدادات. */
  :root {
    color-scheme: dark;
    /* الأسطح (من الأغمق للأفتح) */
    --bg: #000; --bg-1: #121214; --bg-2: #1c1c1e; --bg-3: #2c2c2e; --bg-4: #3a3a3c;
    --fill: rgba(120,120,128,.24); --fill-2: rgba(120,120,128,.34); --fill-3: rgba(120,120,128,.16);
    --sep: rgba(255,255,255,.08); --sep-2: rgba(255,255,255,.14);
    /* النص */
    --text: #f5f5f7; --muted: #a1a1a6; --muted-2: #6e6e73;
    /* لون التمييز الوحيد */
    --tint: #7d6ad8; --tint-h: #8b7ae2; --tint-t: #b9adff; --tint-f: rgba(125,106,216,.2); --tint-r: rgba(125,106,216,.45);
    --ok: #30d158; --warn: #ffd60a; --bad: #ff453a;
    /* أسماء قديمة يستخدمها studio.js/stats-card.js — صارت تشير للألوان الجديدة */
    --lav-d: #3a3a3c; --lav-m: #6e6e73; --lav: #a1a1a6; --lav-l: #d1d1d6;
    --line: var(--sep); --line-2: var(--sep-2); --card: var(--bg-2); --card-2: var(--bg-3);
    --accent: var(--tint); --accent-2: var(--tint-t); --sky: var(--tint-t); --pink: var(--tint-t);
    --grad: var(--tint); --glass: var(--bg-1); --glass-2: var(--bg-2); --glass-solid: rgba(28,28,30,.92);
    --blur: blur(20px) saturate(180%);
    /* سلّم الخطوط */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
    --t-large: clamp(34px, 3.4vw, 56px); --t-title1: 28px; --t-title2: 22px; --t-title3: 19px;
    --t-head: 15px; --t-body: 15px; --t-sub: 14px; --t-foot: 13px; --t-cap: 12px;
    /* الأشكال والحركة */
    --r: 20px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --ease: cubic-bezier(.25,.1,.25,1); --spring: cubic-bezier(.32,.72,0,1);
    --nav-w: clamp(240px, 15vw, 290px); --nav-w-mini: 76px; --panel-w: clamp(360px, 25vw, 460px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-body); line-height: 1.5; -webkit-tap-highlight-color: transparent; overflow: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { font: inherit; color: inherit; }
  a { color: var(--tint-t); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--tint-r); outline-offset: 2px; }
  [hidden] { display: none !important; }
  ::selection { background: var(--tint-r); }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }

  /* ---------- مكوّنات عامة ---------- */
  /* «.glass» = سطح: لون صلب بدون حدود ولا ظل (الفرق بين الطبقات باللون بس) */
  .glass { background: var(--bg-1); border: 0; }

  /* الأزرار: كبسولة. primary = معبّى بلون التمييز، ghost = رمادي، danger = نص أحمر على رمادي */
  .ob-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 8px 18px; border-radius: 980px; border: 0; background: var(--fill); color: var(--text); font-size: var(--t-sub); font-weight: 500; line-height: 1.2; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .2s var(--ease), opacity .2s var(--ease), transform .1s var(--ease); }
  .ob-btn:hover { background: var(--fill-2); text-decoration: none; }
  .ob-btn:active { opacity: .7; transform: scale(.98); }
  .ob-btn svg { width: 16px; height: 16px; flex: none; }
  .ob-btn.primary, .ob-btn.sky { background: var(--tint); color: #fff; }
  .ob-btn.primary:hover, .ob-btn.sky:hover { background: var(--tint-h); }
  .ob-btn.ghost { background: var(--fill); color: var(--text); }
  .ob-btn.danger { background: var(--fill); color: #ff6961; }
  .ob-btn.danger:hover { background: rgba(255,69,58,.18); }
  .ob-btn.lg { min-height: 44px; padding: 11px 24px; font-size: var(--t-body); }
  .ob-btn.icon { padding: 0; width: 36px; height: 36px; min-height: 0; }
  .ob-btn.icon.lg { width: 44px; height: 44px; }
  .ob-btn[disabled] { opacity: .4; cursor: default; }

  /* ---------- الهيكل: القائمة يسار + الصفحة ---------- */
  .vy-app { position: relative; z-index: 1; direction: ltr; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); height: 100vh; height: 100dvh; transition: grid-template-columns .35s var(--spring); }
  .vy-app > * { direction: rtl; }
  .vy-app.mini { grid-template-columns: var(--nav-w-mini) minmax(0, 1fr); }

  /* القائمة الجانبية: مثل الشريط الجانبي بتطبيقات Mac — سطح واحد بخط فاصل، بدون كرت عائم */
  .vy-side { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; overflow: hidden; background: var(--bg-1); border-left: 1px solid var(--sep); }
  .vy-brand { display: flex; align-items: center; justify-content: center; height: 72px; flex: none; margin-bottom: 4px; position: relative; }
  .vy-brand img.full { width: 150px; height: auto; transition: opacity .2s var(--ease), transform .3s var(--spring); }
  .vy-brand img.mini { position: absolute; width: 38px; height: 38px; opacity: 0; transform: scale(.8); transition: opacity .2s var(--ease), transform .3s var(--spring); }
  .vy-app.mini .vy-brand img.full { opacity: 0; transform: scale(.9); pointer-events: none; }
  .vy-app.mini .vy-brand img.mini { opacity: 1; transform: none; }

  .vy-nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; display: flex; flex-direction: column; gap: 1px; padding: 2px; }
  .vy-nav::-webkit-scrollbar { display: none; }
  /* عناصر القائمة ما تنضغط لما المساحة تضيق — القائمة تمرر بدالها */
  .vy-nav > * { flex: none; }
  .vy-group { margin: 18px 12px 6px; font-size: var(--t-cap); font-weight: 600; color: var(--muted-2); white-space: nowrap; overflow: hidden; transition: opacity .2s; }
  .vy-app.mini .vy-group { opacity: 0; height: 1px; margin: 10px 14px; background: var(--sep); }
  .vy-item { position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); cursor: pointer; font-size: var(--t-sub); font-weight: 500; text-align: right; white-space: nowrap; transition: background .15s var(--ease); }
  .vy-item:hover { background: var(--fill-3); }
  .vy-item:active { background: var(--fill); }
  .vy-item svg { width: 18px; height: 18px; flex: none; color: var(--tint-t); }
  .vy-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; transition: opacity .2s; }
  .vy-item .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: none; color: var(--muted); font-size: var(--t-cap); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; justify-content: center; transition: opacity .2s; }
  .vy-item.on { background: var(--tint); color: #fff; }
  .vy-item.on svg, .vy-item.on .badge { color: #fff; }
  .vy-app.mini .vy-item { justify-content: center; padding: 0; height: 40px; }
  .vy-app.mini .vy-item svg { width: 20px; height: 20px; }
  .vy-app.mini .vy-item .lbl, .vy-app.mini .vy-item .badge { opacity: 0; position: absolute; pointer-events: none; }
  /* تلميح الاسم لما القائمة مطوية */
  .vy-tip { position: fixed; z-index: 80; padding: 6px 10px; border-radius: 8px; background: var(--bg-3); box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 .5px var(--sep-2); font-size: var(--t-foot); font-weight: 500; color: var(--text); pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .vy-tip.show { opacity: 1; }

  .vy-foot { flex: none; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--sep); margin-top: 8px; }
  .vy-user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; min-width: 0; color: var(--text); }
  .vy-user .av { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--bg-4); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: var(--t-foot); overflow: hidden; }
  .vy-user .av img { width: 100%; height: 100%; object-fit: cover; }
  .vy-user .who { flex: 1; min-width: 0; line-height: 1.3; }
  .vy-user .who b { display: block; font-size: var(--t-sub); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-user .who small { font-size: var(--t-cap); color: var(--muted); }
  .vy-app.mini .vy-user { justify-content: center; padding: 4px; }
  .vy-app.mini .vy-user .who, .vy-app.mini .vy-foot .ob-btn .lbl { display: none; }
  /* «طي القائمة»: زر نصي هادي */
  .vy-collapse { width: 100%; justify-content: flex-start; background: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; }
  .vy-collapse:hover { background: var(--fill-3); color: var(--text); }
  .vy-collapse svg { transition: transform .35s var(--spring); }
  .vy-app.mini .vy-collapse { justify-content: center; }
  .vy-app.mini .vy-collapse svg { transform: scaleX(-1); }
  .vy-app.mini .vy-foot .ob-btn { padding: 0; height: 36px; }

  .vy-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .vy-view { flex: 1; min-height: 0; }
  .vy-scroll { height: 100%; overflow-y: auto; padding: 32px clamp(20px, 3vw, 56px) 56px; }
  .vy-view.enter { animation: vy-in .3s var(--ease); }
  @keyframes vy-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes vy-fade { from { opacity: 0; } }
  @keyframes vy-pulse { 50% { opacity: .35; } }

  /* شريط الجوال */
  .vy-mbar { display: none; }

  /* ---------- الرئيسية ---------- */
  .vy-wrap { max-width: 1200px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  /* الهيرو: عنوان كبير وسطر واحد وزرين — بدون كرت ولا زخرفة */
  .vy-hero { position: relative; padding: 24px 0 16px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 40px; align-items: center; background: none; }
  .vy-hero .kicker { display: inline-block; font-size: var(--t-head); font-weight: 600; color: var(--tint-t); }
  .vy-hero .kicker i { display: none; }
  .vy-hero h1 { margin: 8px 0 12px; font-weight: 700; font-size: var(--t-large); line-height: 1.12; letter-spacing: -.015em; }
  .vy-hero h1 .en { direction: ltr; unicode-bidi: isolate; color: var(--muted); }
  .vy-hero h1 .ar { color: var(--text); }
  .vy-hero p { margin: 0 0 28px; font-size: clamp(17px, 1.15vw, 21px); line-height: 1.6; color: var(--muted); max-width: 560px; }
  .vy-hero .acts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  /* معاينة «LIVE»: سطح هادي بنسبة الشاشة، ثابت */
  .vy-live { position: relative; aspect-ratio: 16 / 10; border-radius: 22px; background: var(--bg-1); box-shadow: 0 0 0 .5px var(--sep-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .vy-live img { width: 28%; }
  .vy-live .tag { position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 980px; background: var(--fill); font-size: var(--t-cap); font-weight: 600; direction: ltr; }
  .vy-live .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); animation: vy-pulse 2s ease-in-out infinite; }
  .vy-live .stat { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 6px; }
  .vy-live .stat span { padding: 4px 10px; border-radius: 980px; background: var(--fill); font-size: var(--t-cap); color: var(--muted); }

  /* «اتصل بالبث» بالرئيسية: النص يمين والتحكم يسار */
  .vy-connect { border-radius: var(--r-lg); padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .vy-connect .ci { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 280px; }
  .vy-connect .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted-2); }
  .vy-connect.s-connecting .dot { background: var(--warn); animation: vy-pulse 1.2s ease-in-out infinite; }
  .vy-connect.s-connected .dot { background: var(--ok); }
  .vy-connect .ci b { display: block; font-size: var(--t-title3); font-weight: 600; }
  .vy-connect .ci .note { display: block; margin-top: 2px; font-size: var(--t-sub); color: var(--muted); line-height: 1.6; }
  .vy-connect .ci .note.bad { color: #ff6961; }
  .vy-connect .cc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vy-connect .uin { display: flex; align-items: center; gap: 2px; padding: 0 4px 0 12px; border-radius: var(--r-sm); background: var(--bg-2); direction: ltr; }
  .vy-connect .uin:focus-within { box-shadow: 0 0 0 3px var(--tint-r); }
  .vy-connect .uin span { color: var(--muted); font-size: var(--t-body); }
  .vy-connect .uin .ob-input { border: 0; background: transparent; box-shadow: none; width: 200px; padding: 9px 4px; text-align: left; }
  .vy-connect .who { direction: ltr; font-weight: 600; color: var(--text); }
  .vy-connect .ob-btn[disabled] { opacity: .5; cursor: progress; }
  @media (max-width: 600px) { .vy-connect .cc, .vy-connect .uin { width: 100%; } .vy-connect .uin .ob-input { flex: 1; width: auto; } }
  /* Streamlabs (الدونيشن) */
  .vy-sl-home { border-radius: var(--r-lg); padding: 4px; }
  .vy-sl-home .ob-card { background: transparent; }
  .vy-sl-head { display: flex; align-items: center; gap: 10px; }
  .vy-sl-head h3 { flex: 1; margin: 0; }
  .vy-sl-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted-2); flex: none; }
  .vy-sl-head .dot.s-connected { background: var(--ok); }
  .vy-sl-head .dot.s-connecting { background: var(--warn); animation: vy-pulse 1.2s ease-in-out infinite; }
  .vy-sl-head .dot.s-invalid_token, .vy-sl-head .dot.s-error { background: var(--bad); }
  .vy-sl-st { font-size: var(--t-foot); color: var(--muted); }
  .vy-sl-ok { color: var(--ok); }
  .vy-sl-list { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; border-radius: var(--r-md); background: var(--bg-2); }
  .vy-sl-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: var(--t-sub); }
  .vy-sl-row + .vy-sl-row { box-shadow: inset 0 1px 0 var(--sep); }
  .vy-sl-row b { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-sl-row .amt { font-weight: 600; color: var(--text); direction: ltr; font-variant-numeric: tabular-nums; }
  .vy-sl-row .tag { color: var(--warn); }
  .vy-sl-row .when { color: var(--muted); direction: ltr; }
  /* أرقام سريعة: الرقم كبير والوصف تحته — بدون أيقونات ملوّنة */
  .vy-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .vy-stat { border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 4px; }
  .vy-stat .ic { width: 28px; height: 28px; margin-bottom: 8px; display: flex; align-items: center; justify-content: flex-start; color: var(--tint-t); background: none; }
  .vy-stat .ic svg { width: 22px; height: 22px; }
  .vy-stat b { font-size: var(--t-title1); font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .vy-stat span { font-size: var(--t-foot); color: var(--muted); }
  .vy-stat.ok b { color: var(--ok); font-size: var(--t-title3); }
  .vy-stat.warn b { color: var(--warn); font-size: var(--t-title3); }

  .vy-sechead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 24px; }
  .vy-sechead h2 { margin: 0; font-size: var(--t-title2); font-weight: 700; letter-spacing: -.01em; }
  .vy-sechead p { margin: 4px 0 0; font-size: var(--t-body); color: var(--muted); }

  /* بطاقات تفاعلية (أدوات / شاشات): تتفاعل بتغيّر لون السطح بس */
  .vy-card { position: relative; overflow: hidden; border-radius: var(--r-lg); transition: background .2s var(--ease), transform .1s var(--ease); }
  .vy-card:hover { background: var(--bg-2); }
  .vy-card:active { transform: scale(.99); }

  .vy-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .vy-tool { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 20px; cursor: pointer; text-align: right; color: var(--text); border: 0; }
  .vy-tool .ic, .vy-tool > svg { width: 26px; height: 26px; margin-bottom: 10px; color: var(--tint-t); }
  .vy-tool .ic svg { width: 26px; height: 26px; }
  .vy-tool b { font-size: var(--t-head); font-weight: 600; }
  .vy-tool small { font-size: var(--t-foot); color: var(--muted); line-height: 1.55; }

  /* ---------- الشاشات ---------- */
  .vy-screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .vy-scr { display: flex; flex-direction: column; border: 0; }
  .vy-scr:hover { background: var(--bg-1); }
  .vy-scr .thumb { position: relative; aspect-ratio: 16 / 9; margin: 8px 8px 0; border-radius: 12px; overflow: hidden; cursor: pointer; background: repeating-conic-gradient(rgba(255,255,255,.04) 0 25%, transparent 0 50%) 0 0 / 18px 18px, #0a0a0b; }
  .vy-scr .thumb.p { aspect-ratio: auto; height: 0; padding-bottom: 56.25%; }
  .vy-scr .thumb .tf { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden; }
  .vy-scr .thumb .tf.p { background: rgba(0,0,0,.5); box-shadow: 1px 0 0 var(--sep-2), -1px 0 0 var(--sep-2); }
  .vy-scr .thumb .tf .agp-so-item { pointer-events: none; }
  .vy-scr .thumb .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: var(--t-foot); }
  .vy-scr .thumb .badge { position: absolute; top: 8px; right: 8px; z-index: 2; padding: 3px 9px; border-radius: 980px; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 11px; font-weight: 600; color: var(--text); }
  .vy-scr .thumb .badge.off { color: var(--warn); }
  .vy-scr .info { padding: 12px 16px 2px; display: flex; flex-direction: column; gap: 2px; }
  .vy-scr .info b { font-size: var(--t-head); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-scr .info small { font-size: var(--t-foot); color: var(--muted); }
  .vy-scr .acts { display: flex; gap: 8px; padding: 12px 16px 16px; flex-wrap: wrap; }
  .vy-scr .acts .ob-btn { min-height: 32px; padding: 6px 14px; font-size: var(--t-foot); }
  .vy-scr .acts .ob-btn.icon { width: 32px; height: 32px; padding: 0; }
  .vy-scr .acts .ob-btn.icon svg { width: 15px; height: 15px; }
  .vy-scr .acts .grow { flex: 1; }
  /* زر واحد ملوّن بالصفحة: «تعديل» بالبطاقات رمادي، والملوّن «شاشة جديدة» فوق */
  .vy-scr .acts .ob-btn.primary { background: var(--fill); color: var(--text); }
  .vy-scr .acts .ob-btn.primary:hover { background: var(--fill-2); }
  .vy-scr.cur { box-shadow: inset 0 0 0 2px var(--tint); }
  .vy-new { min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--sep-2); background: transparent; color: var(--tint-t); cursor: pointer; font-size: var(--t-body); font-weight: 500; }
  .vy-new:hover { background: var(--bg-1); }
  .vy-new .plus { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 300; background: var(--tint-f); }
  .vy-new small { color: var(--muted); font-weight: 400; }

  .vy-guide { border-radius: var(--r-lg); padding: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
  .vy-guide h3 { margin: 0 0 8px; font-size: var(--t-head); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .vy-guide h3 span { padding: 2px 8px; border-radius: 6px; background: var(--fill); font-size: 11px; font-weight: 600; color: var(--muted); direction: ltr; }

  /* ---------- أدوات البث (المحرر) ---------- */
  .ob-editor { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  /* شريط الأدوات: مثل شريط نوافذ Mac — سطح واحد بخط فاصل تحته */
  .ob-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-width: 0; background: var(--bg-1); border-bottom: 1px solid var(--sep); }
  .ob-ttl { flex: none; display: flex; flex-direction: column; line-height: 1.25; padding: 0 2px; }
  .ob-ttl b { font-weight: 600; font-size: var(--t-head); }
  .ob-ttl small { font-size: var(--t-cap); color: var(--muted); }
  .ob-sep { flex: none; width: 1px; height: 24px; background: var(--sep-2); }
  /* أسماء الشاشات: «تحكم مقسّم» مثل Safari/Finder */
  .ob-screens { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .ob-screens::-webkit-scrollbar { display: none; }
  .ob-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: var(--t-foot); font-weight: 500; cursor: pointer; white-space: nowrap; max-width: 220px; transition: background .15s var(--ease), color .15s var(--ease); }
  .ob-chip span { overflow: hidden; text-overflow: ellipsis; }
  .ob-chip:hover { background: var(--fill-3); color: var(--text); }
  .ob-chip.on { background: var(--fill-2); color: var(--text); }
  .ob-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); flex: none; }
  .ob-chip.on .dot { background: var(--tint-t); }
  .ob-chip.add { color: var(--tint-t); }
  .ob-status { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; font-size: var(--t-cap); color: var(--muted); white-space: nowrap; }
  .ob-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .ob-status.ok i { background: var(--ok); }
  .ob-saved { flex: none; font-size: var(--t-cap); color: var(--muted); white-space: nowrap; min-width: 56px; text-align: center; }
  .ob-saved.ok { color: var(--muted); }
  .ob-saved.bad { color: var(--warn); }
  #ob-copy { min-height: 32px; padding: 6px 14px; font-size: var(--t-foot); }

  /* شريط أقسام الأدوات — يظهر بالجوال بس (بالكمبيوتر الأقسام بالقائمة الجانبية) */
  .ob-mtabs { display: none; }

  .ob-body { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: 0; transition: grid-template-columns .35s var(--spring); }
  .ob-body.closed { grid-template-columns: minmax(0, 1fr) 0; }
  .ob-body.wide { --panel-w: min(640px, 50vw); }
  /* لوحة الخصائص: مثل «المفتش» بتطبيقات Mac — عمود بخط فاصل */
  .ob-panel { overflow: hidden; min-width: 0; display: flex; flex-direction: column; background: var(--bg-1); border-right: 1px solid var(--sep); transition: opacity .2s var(--ease); }
  .ob-body.closed .ob-panel { opacity: 0; border: 0; }
  .ob-phead { flex: none; display: flex; align-items: flex-start; gap: 10px; padding: 20px 20px 12px; min-width: var(--panel-w); }
  .ob-phead div { flex: 1; min-width: 0; }
  .ob-phead h2 { margin: 0; font-size: var(--t-title2); font-weight: 700; letter-spacing: -.01em; }
  .ob-phead p { margin: 4px 0 0; font-size: var(--t-foot); color: var(--muted); line-height: 1.55; }
  /* زر الإغلاق: دائرة رمادية صغيرة مثل iOS */
  .ob-x { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s var(--ease), color .15s var(--ease); }
  .ob-x svg { width: 13px; height: 13px; }
  .ob-x:hover { color: var(--text); background: var(--fill-2); }
  .ob-pbody { flex: 1; overflow-y: auto; padding: 8px 16px 32px; min-width: var(--panel-w); display: flex; flex-direction: column; gap: 16px; }

  .ob-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ob-tools.one { grid-template-columns: 1fr; }
  .ob-tool { position: relative; display: flex; flex-direction: column; padding: 0; border-radius: var(--r-md); border: 0; background: var(--bg-2); cursor: pointer; text-align: right; overflow: hidden; transition: background .2s var(--ease), box-shadow .2s var(--ease), transform .1s var(--ease); }
  .ob-tool:hover { background: var(--bg-3); }
  .ob-tool:active { transform: scale(.98); }
  .ob-tool .pv { position: relative; height: 112px; overflow: hidden; pointer-events: none; background: repeating-conic-gradient(rgba(255,255,255,.035) 0 25%, transparent 0 50%) 0 0 / 16px 16px, #0a0a0b; }
  .ob-tools.one .ob-tool .pv { height: 130px; }
  .ob-pvw { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
  .ob-pvw .agp-so-item { left: 0; top: 0; max-width: none; }
  .ob-tool .pv .agp-so-ghost { opacity: 1; }
  .ob-tool .meta { padding: 10px 12px 12px; }
  .ob-tool b { display: block; font-size: var(--t-sub); font-weight: 600; }
  .ob-tool small { display: block; margin-top: 2px; font-size: var(--t-cap); color: var(--muted); line-height: 1.45; }

  .ob-igrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .ob-ibtn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 0; background: var(--bg-2); cursor: pointer; color: #ffd54a; padding: 10px; transition: background .15s var(--ease), transform .1s var(--ease); }
  .ob-ibtn:hover { background: var(--bg-3); }
  .ob-ibtn:active { transform: scale(.95); }
  .ob-ibtn svg { width: 100%; height: 100%; }
  .ob-igrid.sm { grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
  .ob-igrid.sm .ob-ibtn { padding: 7px; border-radius: 10px; color: var(--text); background: var(--fill-3); border: 2px solid transparent; }
  .ob-igrid.sm .ob-ibtn.on { border-color: var(--tint); background: var(--tint-f); }
  .ob-igrid.sm .ob-ibtn.txt { font-size: 11px; font-weight: 600; aspect-ratio: auto; grid-column: span 1; }
  .ob-ibtn.emo { font-size: 26px; line-height: 1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }

  /* التحكم المقسّم (Segmented Control) مثل iOS: مسار رمادي والمختار «قرص» أفتح */
  .ob-seg, .ob-ptabs { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill-3); }
  .ob-seg button, .ob-ptabs button { flex: 1; min-height: 30px; padding: 5px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font-size: var(--t-foot); font-weight: 500; cursor: pointer; transition: background .2s var(--ease); }
  .ob-seg button:hover, .ob-ptabs button:hover { background: rgba(255,255,255,.04); }
  .ob-seg button.on, .ob-ptabs button.on { background: var(--bg-4); color: #fff; font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.24), 0 0 0 .5px rgba(0,0,0,.2); }

  /* صفوف الإعدادات: العنوان يمين والتحكم يسار (قاعدة CLAUDE.md) — مثل صف بإعدادات iOS */
  .ob-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; border-radius: var(--r-md); border: 0; background: var(--bg-2); }
  .ob-row > .ob-label { text-align: right; font-size: var(--t-body); font-weight: 400; flex: none; }
  .ob-row > .ob-label small { display: block; font-size: var(--t-cap); font-weight: 400; color: var(--muted); margin-top: 1px; }
  .ob-row.col { flex-direction: column; align-items: stretch; gap: 10px; }
  .ob-pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .ob-row.col .ob-pills { justify-content: flex-start; }
  /* الخيارات (pill): كبسولة رمادية، والمختار بلون التمييز */
  .ob-pill { min-height: 30px; padding: 5px 13px; border-radius: 980px; border: 0; background: var(--fill); color: var(--text); font-size: var(--t-foot); font-weight: 500; cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
  .ob-pill:hover { background: var(--fill-2); }
  .ob-pill.on { background: var(--tint); color: #fff; }
  .ob-sw { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
  .ob-sw button { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); cursor: pointer; padding: 0; transition: transform .15s var(--ease); }
  .ob-sw button:active { transform: scale(.9); }
  .ob-sw button.on { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--text); }
  .ob-sw input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; }
  .ob-input { flex: 1; min-width: 0; font: inherit; font-size: var(--t-body); color: var(--text); background: var(--bg-3); border: 0; border-radius: var(--r-sm); padding: 9px 12px; direction: rtl; resize: vertical; transition: box-shadow .15s var(--ease); }
  .ob-input::placeholder { color: var(--muted-2); }
  .ob-input:focus { outline: none; box-shadow: 0 0 0 3px var(--tint-r); }
  .ob-input.num { direction: ltr; text-align: left; max-width: 130px; font-variant-numeric: tabular-nums; }
  .ob-range { flex: 1; max-width: 200px; accent-color: var(--tint); }
  /* مفتاح التبديل: مقاس iOS (51×31) والمفعّل بلون التمييز */
  .ob-toggle { position: relative; width: 51px; height: 31px; flex: none; }
  .ob-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .ob-toggle span { position: absolute; inset: 0; border-radius: 999px; background: var(--fill-2); transition: background .25s var(--ease); cursor: pointer; }
  .ob-toggle span::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .3s var(--spring); box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); }
  .ob-toggle input:checked + span { background: var(--tint); }
  .ob-toggle input:checked + span::after { transform: translateX(-20px); }
  .ob-toggle input:focus-visible + span { box-shadow: 0 0 0 3px var(--tint-r); }
  .ob-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- وضوح الإعدادات ---------- */
  /* الخيارات تحت العنوان: أعمدة متساوية بدل أزرار متكسّرة على السطر */
  .ob-row.col .ob-pills { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .ob-row.col .ob-pills .ob-pill { text-align: center; line-height: 1.35; padding-inline: 8px; border-radius: 8px; }
  .ob-row.col .ob-pills .ob-input.num { width: 100%; max-width: none !important; text-align: center; padding: 6px 8px; }

  /* الألوان: علامة ✓ على المختار، و«الأصلي» زر عادي مو دائرة */
  .ob-sw button.on:not(.ob-pill)::after { content: ""; position: absolute; inset: 0; margin: auto; width: 50%; height: 50%; background: #fff; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9)); -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/></svg>") center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/></svg>") center / contain no-repeat; }
  .ob-sw .ob-pill { width: auto; height: auto; border-radius: 980px; box-shadow: none; padding: 5px 13px; }
  .ob-sw .ob-pill:active { transform: none; }
  .ob-sw .ob-pill.on { box-shadow: none; }
  .ob-row.col .ob-sw { justify-content: flex-start; }
  /* اللون المخصص: دائرة بألوان قوس قزح */
  .ob-sw input[type=color] { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; padding: 3px; background: conic-gradient(#ff453a, #ffd60a, #30d158, #64d2ff, #bf5af2, #ff453a); }
  .ob-sw input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .ob-sw input[type=color]::-webkit-color-swatch { border: 2px solid var(--bg-2); border-radius: 50%; }
  .ob-sw input[type=color]::-moz-color-swatch { border: 2px solid var(--bg-2); border-radius: 50%; }
  .ob-sw input[type=color].on { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--text); }

  /* شريط التمرير + قيمته */
  .ob-rng { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 240px; min-width: 0; }
  .ob-rng .ob-range { flex: 1; max-width: none; min-width: 0; }
  .ob-rval { flex: none; min-width: 40px; font-size: var(--t-foot); font-weight: 500; color: var(--muted); text-align: center; direction: ltr; font-variant-numeric: tabular-nums; }
  .ob-row.col .ob-rng { max-width: none; }

  /* مجموعات الإعدادات = «قائمة مجمّعة» بإعدادات iOS: عنوان صغير فوق، والصفوف بسطح واحد بخطوط فاصلة رفيعة */
  .ob-grp { flex: none; border-radius: var(--r-md); background: transparent; overflow: visible; }
  .ob-grp-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 4px 16px 8px; border: 0; background: none; cursor: pointer; text-align: right; }
  .ob-grp-t { font-size: var(--t-foot); font-weight: 600; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
  .ob-grp-t small { font-size: var(--t-cap); font-weight: 400; color: var(--muted-2); }
  .ob-grp-h:hover .ob-grp-t { color: var(--text); }
  .ob-grp-c { flex: none; width: 14px; height: 14px; color: var(--muted-2); transform: rotate(-90deg); transition: transform .3s var(--spring); }
  .ob-grp-c svg { width: 100%; height: 100%; }
  .ob-grp.shut .ob-grp-c { transform: rotate(0deg); }
  .ob-grp.shut .ob-grp-b { display: none; }
  .ob-grp-b { display: flex; flex-direction: column; border-radius: var(--r-md); background: var(--bg-2); overflow: hidden; }
  .ob-grp-b > .ob-row { border: 0; border-radius: 0; background: none; padding: 10px 16px; }
  /* الخط الفاصل يبدأ من بعد الحافة (inset) مثل iOS */
  .ob-grp-b > * + * { border-top: 0 !important; box-shadow: inset 0 1px 0 var(--sep); }
  .ob-grp-b > .ob-hint, .ob-grp-b > .ob-warn, .ob-grp-b > .ob-actions, .ob-grp-b > .ob-fgrid, .ob-grp-b > .ob-igrid { margin: 0; padding: 12px 16px; }
  .ob-grp-b > .ob-warn { border-radius: 0; }
  .ob-grp-b .ob-input { background: var(--bg-3); }

  /* عناصر أليرت الفيديو (الصورة والاسم والرسالة): الاسم يمين، والحجم والمفتاح يسار */
  .va-el { gap: 12px; }
  .va-el-n { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; text-align: right; }
  .va-el-n b { font-size: var(--t-body); font-weight: 500; }
  .va-el-n small { font-size: var(--t-cap); color: var(--muted); }
  .va-el.sel .va-el-n b { color: var(--tint-t); }
  .va-el.sel { background: var(--tint-f) !important; }
  .va-el.off .va-el-n b { color: var(--muted); }
  .va-el-c { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .va-el-c .ob-rng { max-width: 200px; }
  .ob-rng.dis { opacity: .35; pointer-events: none; }
  .ob-card > .ob-row { padding: 10px 0 0; border: 0; background: none; }

  /* اختيار هدايا تيك توك لأليرت هدية معيّنة */
  .vg-chosen { display: flex; flex-wrap: wrap; gap: 6px; }
  .vg-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 980px; border: 0; background: var(--tint-f); color: var(--text); cursor: pointer; text-align: right; transition: background .15s var(--ease); }
  .vg-chip:hover { background: rgba(255,69,58,.18); }
  .vg-chip img { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .vg-chip span { display: flex; flex-direction: column; line-height: 1.2; }
  .vg-chip b { font-size: var(--t-cap); font-weight: 600; }
  .vg-chip small { font-size: 10.5px; color: var(--muted); }
  .vg-chip i { font-style: normal; font-size: 15px; color: var(--muted); padding: 0 2px; }
  .vg-pick { display: flex; flex-direction: column; gap: 8px; }
  .vg-tools { display: flex; gap: 8px; align-items: center; }
  .vg-tools .ob-input { flex: 1; font-size: var(--t-sub); padding: 8px 12px; }
  .ob-row.col .vg-tools .ob-pills { display: flex; flex: none; flex-wrap: nowrap; }
  .vg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-height: 340px; overflow-y: auto; padding: 2px; }
  .vg-gift { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: 12px; border: 2px solid transparent; background: var(--bg-3); color: var(--text); cursor: pointer; min-width: 0; transition: background .15s var(--ease); }
  .vg-gift:hover { background: var(--bg-4); }
  .vg-gift img { width: 40px; height: 40px; object-fit: contain; }
  .vg-gift b { font-size: 11.5px; font-weight: 500; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vg-gift i { font-style: normal; font-size: 10px; color: var(--muted-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; margin-top: -2px; }
  .vg-gift small { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #ffd54a; direction: ltr; }
  .vg-gift small::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc93a 55%, #c98a00); }
  .vg-gift.on { border-color: var(--tint); background: var(--tint-f); }
  .vg-gift.on::after { content: "✓"; position: absolute; top: 4px; left: 5px; width: 17px; height: 17px; border-radius: 50%; background: var(--tint); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* أزرار العنصر (فوق اللوحة): أيقونة ونص صغير تحتها، مثل شريط أدوات Mac */
  .ob-ibar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px 16px 12px; border-bottom: 1px solid var(--sep); min-width: var(--panel-w); }
  .ob-ibar-b { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 10px; border: 0; background: transparent; color: var(--text); font-size: 11px; font-weight: 500; cursor: pointer; transition: background .15s var(--ease); }
  .ob-ibar-b svg { width: 18px; height: 18px; color: var(--tint-t); }
  .ob-ibar-b:hover { background: var(--fill-3); }
  .ob-ibar-b:active { background: var(--fill); }
  .ob-ibar-b.on, .ob-ibar-b.on svg { color: var(--warn); }
  .ob-ibar-b.bad, .ob-ibar-b.bad svg { color: #ff6961; }
  .ob-ibar-b.bad:hover { background: rgba(255,69,58,.14); }
  .ob-hint { font-size: var(--t-foot); color: var(--muted); line-height: 1.65; }
  .ob-card { padding: 16px; border-radius: var(--r-md); border: 0; background: var(--bg-2); display: flex; flex-direction: column; gap: 10px; }
  .ob-card h3 { margin: 0; font-size: var(--t-head); font-weight: 600; color: var(--text); }
  .ob-card.link { background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--tint-r); }
  .ob-url { width: 100%; direction: ltr; text-align: left; font: 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); background: var(--bg-3); border: 0; border-radius: var(--r-sm); padding: 10px 12px; }
  .ob-url:focus { outline: none; box-shadow: 0 0 0 3px var(--tint-r); }
  .ob-steps { margin: 0; padding: 0 18px 0 0; font-size: var(--t-sub); color: var(--muted); line-height: 1.9; }
  .ob-steps li::marker { color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .ob-warn { padding: 10px 14px; border-radius: var(--r-sm); border: 0; background: rgba(255,214,10,.1); color: #ffe57a; font-size: var(--t-foot); line-height: 1.65; }

  /* الطبقات: قائمة مثل قوائم Finder */
  .ob-layers { display: flex; flex-direction: column; gap: 0; border-radius: var(--r-md); background: var(--bg-2); overflow: hidden; }
  .ob-layer { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border: 0; background: transparent; cursor: pointer; transition: background .15s var(--ease); }
  .ob-layer + .ob-layer { box-shadow: inset 0 1px 0 var(--sep); }
  .ob-layer:hover { background: var(--fill-3); }
  .ob-layer.on { background: var(--tint); color: #fff; }
  .ob-layer.on .ob-lic, .ob-layer.on .ob-ib { color: #fff; }
  .ob-layer.off .ob-lname { opacity: .45; text-decoration: line-through; }
  .ob-lic { flex: none; width: 26px; height: 26px; border-radius: 7px; background: none; display: flex; align-items: center; justify-content: center; color: var(--tint-t); }
  .ob-lic svg { width: 17px; height: 17px; }
  .ob-lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-sub); }
  .ob-ib { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: var(--t-foot); padding: 0; transition: background .15s var(--ease), color .15s var(--ease); }
  .ob-ib:hover { color: var(--text); background: var(--fill); }
  .ob-ib.danger:hover { color: #ff6961; background: rgba(255,69,58,.14); }

  .ob-fgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ob-fbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; border: 2px solid transparent; background: var(--fill-3); color: var(--text); cursor: pointer; transition: background .15s var(--ease); }
  .ob-fbtn:hover { background: var(--fill); }
  .ob-fbtn.on { border-color: var(--tint); background: var(--tint-f); }
  .ob-fbtn span:first-child { font-size: 20px; line-height: 1.5; }
  .ob-fbtn span:last-child { font-size: 11px; color: var(--muted); }
  /* أشكال صورة أليرت الفيديو: زر فيه معاينة الشكل */
  .ob-shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ob-shape { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 10px; border: 2px solid transparent; background: var(--fill-3); color: var(--muted); font: inherit; font-size: 11.5px; cursor: pointer; transition: background .15s var(--ease); }
  .ob-shape:hover { background: var(--fill); }
  .ob-shape.on { border-color: var(--tint); background: var(--tint-f); color: var(--text); }
  .ob-shape-i { width: 30px; height: 30px; background: linear-gradient(135deg, #c7c7cc, #636366); }
  /* أداة التفريغ: زر «خيارات متقدمة» */
  .vk-adv { width: 100%; margin-top: 6px; justify-content: flex-start; }

  /* أليرتات الفيديو: خانة الرفع + المكتبة */
  .vy-drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 150px; padding: 20px; border-radius: var(--r-lg); border: 1.5px dashed var(--sep-2); background: transparent; text-align: center; cursor: pointer; transition: border-color .2s var(--ease), background .2s var(--ease); }
  .vy-drop:hover, .vy-drop.over { border-color: var(--tint); background: var(--tint-f); }
  .vy-drop .ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--tint-f); color: var(--tint-t); margin-bottom: 6px; }
  .vy-drop .ic svg { width: 22px; height: 22px; }
  .vy-drop b { font-size: var(--t-head); font-weight: 600; }
  .vy-drop small { font-size: var(--t-cap); color: var(--muted); line-height: 1.6; }
  .vy-drop.busy { cursor: progress; border-style: solid; }
  .vy-up-bar { width: 100%; height: 4px; border-radius: 99px; background: var(--fill); overflow: hidden; margin-top: 6px; }
  .vy-up-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--tint); transition: width .2s; }
  .vy-lib-head { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
  .vy-lib-head b { font-size: var(--t-head); font-weight: 600; }
  .vy-lib-head span { font-size: var(--t-cap); color: var(--muted); }
  .vy-lib { display: flex; flex-direction: column; gap: 8px; }
  .vy-media { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 12px; padding: 8px; border-radius: var(--r-md); border: 0; background: var(--bg-2); }
  .vy-media .th { grid-row: 1 / 3; position: relative; width: 92px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: repeating-conic-gradient(rgba(255,255,255,.05) 0 25%, transparent 0 50%) 0 0 / 12px 12px, #0a0a0b; }
  .vy-media .th video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vy-media .th .dur { position: absolute; bottom: 4px; left: 4px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.7); font-size: 11px; direction: ltr; font-variant-numeric: tabular-nums; }
  .vy-media .mi { min-width: 0; }
  .vy-media .mi b { display: block; font-size: var(--t-sub); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-media .mi small { font-size: var(--t-cap); color: var(--muted); direction: ltr; unicode-bidi: isolate; }
  .vy-media .acts { display: flex; gap: 6px; align-items: center; }
  .vy-media .acts .ob-btn { min-height: 30px; padding: 5px 12px; font-size: var(--t-foot); }
  .vy-media .acts .ob-btn.icon { width: 30px; height: 30px; padding: 0; }
  /* إحصائيات البث (stats-card.js) */
  .vs-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 30vw, 540px); gap: 24px; min-height: 100%; align-items: start; }
  .vs-stage { position: sticky; top: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px; }
  .vs-frame { position: relative; height: min(78vh, 1100px); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,.9), 0 0 0 .5px var(--sep-2); background: #0a0a0b; }
  .vs-canvas { width: 100%; height: 100%; display: block; }
  .vs-safe { position: absolute; border: 2px dashed rgba(255,214,10,.55); border-radius: 10px; pointer-events: none; }
  .vs-safe span { position: absolute; top: -22px; right: 0; font-size: 11px; color: rgba(255,214,10,.9); background: rgba(0,0,0,.7); padding: 1px 7px; border-radius: 6px; }
  .vs-sbar { display: flex; gap: 14px; align-items: center; font-size: var(--t-foot); color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .vs-gtog { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text); }
  .vs-acts { display: flex; gap: 8px; }
  .vs-side { border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .vs-side .ob-phead { min-width: 0; }
  .vs-tabs { flex-wrap: wrap; margin: 0 16px; }
  .vs-tabs button { flex: 1 1 auto; white-space: nowrap; }
  .vs-sec { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border-radius: var(--r-md); border: 0; background: var(--bg-2); }
  .vs-sec.off { opacity: .5; }
  .vs-sec .ic { font-size: 22px; width: 30px; text-align: center; }
  .vs-sec .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .vs-sec .tx b { font-size: var(--t-sub); font-weight: 600; }
  .vs-sec .tx small { font-size: var(--t-cap); color: var(--muted); }
  .vs-cnt { display: flex; align-items: center; gap: 4px; }
  .vs-cnt .ob-pill { min-width: 30px; padding: 4px 8px; }
  .vs-cnt b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .vs-mv { display: flex; gap: 2px; }
  .vs-bgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vs-bg { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .vs-bg canvas, .vs-bg img, .vs-bg i { width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; border: 2px solid transparent; object-fit: cover; display: block; box-sizing: border-box; }
  .vs-bg i { display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 26px; color: var(--tint-t); border: 1.5px dashed var(--sep-2); }
  .vs-bg.on canvas, .vs-bg.on img { border-color: var(--tint); }
  .vs-bg.on span { color: var(--text); }
  .vs-fonts { max-height: 260px; overflow-y: auto; }
  .vs-frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vs-fr { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 12px; border: 2px solid transparent; background: var(--fill-3); font-size: 11.5px; color: var(--muted); transition: background .15s; }
  .vs-fr canvas { width: 100%; aspect-ratio: 1; }
  .vs-fr.on { border-color: var(--tint); background: var(--tint-f); color: var(--text); }
  .vs-frame.can-drag { cursor: grab; }
  .vs-frame.drag { cursor: grabbing; }
  @media (max-width: 900px) {
    .vs-wrap { grid-template-columns: 1fr; }
    .vs-stage { position: static; }
    .vs-frame { height: auto; width: min(100%, 360px); }
  }

  /* بيانات المثال بالمحرر (قبل البث) تبان واضحة كاملة — مو باهتة */
  .ob-frame .agp-so-ghost, .ob-tools .agp-so-ghost { opacity: 1; }

  /* كرة القمر */
  .vo-pals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vo-pal { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; border: 2px solid transparent; background: var(--fill-3); font-size: var(--t-cap); }
  .vo-pal i { width: 20px; height: 20px; border-radius: 50%; flex: none; }
  .vo-pal.on { border-color: var(--tint); background: var(--tint-f); }
  .vo-cps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .vo-cp { display: flex; align-items: center; gap: 6px; font-size: var(--t-cap); color: var(--muted); cursor: pointer; }
  .vo-cp input { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: none; cursor: pointer; flex: none; }

  /* مكتبتي */
  .vy-libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .vy-libgrid.sm { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .vy-lcard { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: var(--r-md); border: 0; background: var(--bg-2); min-width: 0; text-align: right; color: inherit; font: inherit; transition: background .15s var(--ease), transform .1s var(--ease); }
  .vy-lcard.pick { cursor: pointer; }
  .vy-lcard.pick:hover { background: var(--bg-3); }
  .vy-lcard.pick:active { transform: scale(.98); }
  .vy-lcard .th { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: repeating-conic-gradient(rgba(255,255,255,.05) 0 25%, transparent 0 50%) 0 0 / 14px 14px, #0a0a0b; }
  .vy-lcard .th video, .vy-lcard .th canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .vy-lcard .th.keyed video { opacity: 0; }
  .vy-lcard .th .dur { position: absolute; bottom: 5px; left: 5px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.7); font-size: 11px; direction: ltr; font-variant-numeric: tabular-nums; }
  .vy-lcard .th .kb { position: absolute; top: 5px; right: 5px; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.65); font-size: 10.5px; color: var(--muted); }
  .vy-lcard .th .kb.on { color: var(--ok); }
  .vy-lcard .mi { min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 0 4px; }
  .vy-lcard .mi b, .vy-lcard .mi .nm { display: block; font-size: var(--t-sub); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-lcard .mi .nm { all: unset; cursor: text; font-size: var(--t-sub); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vy-lcard .mi .nm:hover { text-decoration: underline dotted; }
  .vy-lcard .mi small { font-size: var(--t-cap); color: var(--muted); }
  .vy-lcard .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .vy-lcard .acts .ob-btn { min-height: 30px; padding: 5px 10px; font-size: var(--t-foot); flex: 1 1 auto; justify-content: center; }
  .vy-lcard .acts .ob-btn.icon { flex: none; width: 30px; height: 30px; padding: 0; }
  .ob-gtitle { font-size: var(--t-foot); font-weight: 600; color: var(--muted); margin: 8px 16px -6px; }
  .va-rules { display: flex; flex-direction: column; gap: 0; border-radius: var(--r-md); background: var(--bg-2); overflow: hidden; }
  .va-rule { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border: 0; background: transparent; cursor: pointer; transition: background .15s var(--ease), opacity .2s; }
  .va-rule + .va-rule { box-shadow: inset 0 1px 0 var(--sep); }
  .va-rule:hover { background: var(--fill-3); }
  .va-rule.off { opacity: .5; }
  .va-rule .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .va-rule .tx b { font-size: var(--t-sub); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .va-rule .tx small { font-size: var(--t-cap); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .va-range { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .va-range span { font-size: var(--t-foot); color: var(--muted); }
  .vk-sum { display: flex; align-items: center; gap: 10px; }
  .vk-sum .ic { width: 36px; height: 36px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--tint-f); color: var(--tint-t); }
  .vk-sum .ic svg { width: 18px; height: 18px; }

  /* ترتيب الصورة والاسم والرسالة فوق فيديو الأليرت */
  .va-lay { position: relative; width: 100%; max-width: 100%; margin: 2px auto 0; border-radius: 12px; overflow: hidden; touch-action: none; background: repeating-conic-gradient(#2c2c2e 0 25%, #1c1c1e 0 50%) 0 0 / 16px 16px; box-shadow: 0 0 0 .5px var(--sep-2); }
  .va-lay video, .va-lay canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .va-lay canvas { display: none; }
  .va-lay.keyed canvas { display: block; }
  .va-lay.keyed video { opacity: 0; }
  /* عناصر الأليرت نفسها بخطها الأصلي (Noto Kufi) لأنها معاينة لشكلها بالبث */
  .va-chip { position: absolute; z-index: 2; transform: translate(-50%, -50%); cursor: grab; white-space: nowrap; font-family: "Noto Kufi Arabic", sans-serif; font-weight: 800; line-height: 1.3; text-shadow: 0 1px 4px rgba(0,0,0,.95); outline: 1.5px dashed rgba(255,255,255,.55); outline-offset: 3px; border-radius: 6px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .va-chip.drag { cursor: grabbing; outline-color: var(--tint-t); outline-style: solid; }
  .va-chip:hover { outline-color: #fff; }
  .va-avatar { color: #fff; font-size: 13px; }
  .va-avatar .va-av-f { position: absolute; inset: 0; }
  .va-avatar .va-av-i { position: absolute; inset: 2px; background: linear-gradient(160deg, #6e6e73, #3a3a3c); display: flex; align-items: center; justify-content: center; }
  .va-msg { font-weight: 700; }
  .va-chip.sel { outline-color: var(--tint-t); outline-style: solid; }
  .va-chip.va-off { opacity: .12; }
  .va-play { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .va-clock { font-size: var(--t-cap); color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
  .va-tl { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .va-tlr { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--t-cap); color: var(--muted); }
  .va-tlr.sel { color: var(--text); }
  .va-tlr.off { opacity: .4; }
  .va-tln { width: 48px; flex: none; }
  .va-tlt { position: relative; flex: 1; height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
  .va-tlt i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: var(--tint); opacity: .5; }
  .va-tlr.sel .va-tlt i { opacity: 1; }
  .va-dur { display: flex; align-items: center; gap: 8px; width: 100%; }
  .va-dur .ob-range { flex: 1; min-width: 0; }
  .va-durv { min-width: 44px; text-align: center; font-size: var(--t-foot); color: var(--muted); font-variant-numeric: tabular-nums; }
  .va-nudge { display: flex; flex-wrap: wrap; gap: 6px; }
  .va-nudge .ob-pill { min-width: 40px; }
  .vk-stage.bg-mine { background-size: cover; background-position: center; }

  /* أداة التفريغ: شاشة كاملة، المعاينة كبيرة والخيارات كلها ظاهرة بعمود عريض */
  .vk-modal { position: fixed; inset: 0; z-index: 75; display: flex; background: var(--bg); animation: vy-fade .25s var(--ease); }
  .vk-box { width: 100%; height: 100%; display: flex; flex-direction: column; border-radius: 0; border: 0; overflow: hidden; background: var(--bg); }
  .vk-head { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; background: var(--bg-1); border-bottom: 1px solid var(--sep); }
  .vk-head div { flex: 1; min-width: 0; }
  .vk-head h2 { margin: 0; font-size: var(--t-title3); font-weight: 700; }
  .vk-head p { margin: 2px 0 0; font-size: var(--t-foot); color: var(--muted); }
  .vk-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(380px, 28vw, 500px); }
  .vk-view { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .vk-stage { position: relative; flex: 1; min-height: 0; border-radius: var(--r-md); overflow: hidden; box-shadow: 0 0 0 .5px var(--sep-2); }
  .vk-stage.bg-checker { background: repeating-conic-gradient(#2c2c2e 0 25%, #1c1c1e 0 50%) 0 0 / 24px 24px; }
  .vk-stage.bg-dark { background: #000; }
  .vk-stage.bg-light { background: #f2f2f7; }

  /* مساحة التصميم: سطح أسود هادي والشاشة بالوسط */

  /* الأليرت وهو ما يشتغل: الشاشة تبان كأنه مو موجود — يبان بس لما تختاره (أو تمر عليه بالماوس) عشان تحركه */
  .ob-frame .agp-so-alert .agp-so-astage > .agp-so-vslot, .ob-frame .agp-so-alert .agp-so-astage > .agp-so-ghost { opacity: 0; transition: opacity .2s; }

  .ob-handle { position: absolute; left: -12px; bottom: -12px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--tint), 0 2px 6px rgba(0,0,0,.4); cursor: nesw-resize; touch-action: none; z-index: 3; }
  /* شريط التكبير وخلفية المعاينة: شريط عائم بزجاج حقيقي (صغير، فالتغبيش ما يثقّل) */

  /* ---------- بوابة الدخول ---------- */

  .ob-toast { position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 60; padding: 10px 18px; border-radius: 980px; background: rgba(44,44,46,.88); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 0 0 .5px var(--sep-2), 0 16px 40px rgba(0,0,0,.5); font-size: var(--t-sub); font-weight: 500; transition: opacity .25s var(--ease), transform .35s var(--spring); }

</style>
