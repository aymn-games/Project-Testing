<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0814">
<title>لوحة التحكم — ألعاب أيمن</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<!--
  «لوحة التحكم» — شاشة جوال/آيباد المتحكم (التحكم عن بعد).
  الستريمر يعطي يوزر تيك توك صلاحية من بروفايله، وصاحب الحساب الموثّق بنفس
  اليوزر يفتح هالصفحة من زر «لوحة التحكم» ببروفايله (control.html?s=<رقم الستريمر>).
  المنطق كله في js/agp-control-app.js، والاتصال عبر /ws/remote
  (backend/remote-control/remote-control-server.js).
-->
<style>
  :root{
    --bg:#0b0814; --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.02); --line:rgba(255,255,255,.08);
    --text:#f4f2f8; --muted:#9a94ab; --dim:#6f6a7c; --accent:#8b5cf6; --accent-2:#a855f7;
    --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:500 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;direction:rtl;min-height:100vh;
    background:radial-gradient(900px 500px at 80% -10%,rgba(124,58,237,.22),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(168,85,247,.12),transparent 60%),var(--bg);
    background-attachment:fixed;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:12px 16px}

  /* الهيدر */
  .top{position:sticky;top:0;z-index:20;padding:10px 16px;background:rgba(11,8,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .ava{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
  .ava img{width:100%;height:100%;object-fit:cover}
  .who-t{min-width:0}
  .who-t small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
  .who-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card)}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill.on{border-color:rgba(52,211,153,.35);color:#a7f3d0}.pill.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .pill.off{border-color:rgba(248,113,113,.35);color:#fecaca}.pill.off i{background:var(--bad)}

  .banner{margin:12px 0 0;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.7;text-align:right;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.07);color:#fde68a}

  /* بطاقة اللعبة الحالية */
  .now{margin-top:14px;padding:16px;border-radius:20px;border:1px solid rgba(167,139,250,.28);background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(139,92,246,.04))}
  .now-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .now-name{font:700 19px "Noto Kufi Arabic",sans-serif;display:flex;align-items:center;gap:8px;min-width:0}
  .now-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{flex:none;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;color:#ddd6fe;font-weight:600}
  .status{margin-top:8px;color:#c9c3d8;font-size:13.5px;line-height:1.7;text-align:right}

  /* عناوين الأقسام */
  .h{margin:22px 2px 10px;font-size:13.5px;font-weight:700;color:var(--muted);text-align:right;display:flex;align-items:center;justify-content:space-between;gap:10px}

  /* شبكة الأزرار والألعاب: عنصرين بكل صف */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{min-height:64px;padding:12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card-2));
    font-weight:700;font-size:15px;line-height:1.4;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;transition:transform .12s,filter .2s}
  .act:active{transform:scale(.97)}
  .act small{font-weight:500;font-size:11.5px;color:var(--muted)}
  .act.primary{border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 10px 26px -10px rgba(124,58,237,.8)}
  .act.primary small{color:rgba(255,255,255,.8)}
  .act.danger{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fecaca}
  .act.wide{grid-column:1 / -1}

  .game{position:relative;aspect-ratio:1 / .82;padding:12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card-2));
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s,border-color .2s}
  .game:active{transform:scale(.97)}
  .game .ic{font-size:38px;line-height:1}
  .game b{font-size:15px;line-height:1.35}
  .game em{position:absolute;top:8px;right:8px;font-style:normal;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .game.cur{border-color:rgba(52,211,153,.55);background:linear-gradient(180deg,rgba(52,211,153,.12),rgba(52,211,153,.03))}
  .game.cur em{background:rgba(52,211,153,.18);color:#a7f3d0}
  .game.soon{opacity:.45;cursor:default}
  .game.soon em{background:rgba(255,255,255,.08);color:var(--muted)}

  /* صفوف الإعدادات: العنوان يمين والعنصر يسار */
  .card{border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card-2));overflow:hidden}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;flex-wrap:wrap}
  .row + .row{border-top:1px solid rgba(255,255,255,.05)}
  .lbl{text-align:right;font-weight:600;font-size:14.5px;flex:1 1 120px;min-width:0}
  .pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;direction:rtl}
  .opt{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c9c3d8;font-weight:600;font-size:14px;cursor:pointer}
  .opt.on{border-color:transparent;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 18px -6px rgba(139,92,246,.8)}
  .tg{width:56px;height:32px;border-radius:999px;border:none;position:relative;cursor:pointer;background:rgba(255,255,255,.14);transition:background .2s;flex:none}
  .tg::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .tg.on{background:linear-gradient(90deg,#7c3aed,#a855f7)}.tg.on::after{left:28px}
  .num{display:flex;align-items:center;gap:6px;direction:ltr}
  .num button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:20px;font-weight:700;cursor:pointer}
  .num output{min-width:52px;text-align:center;font-weight:700;font-size:17px}
  .txt{display:flex;gap:6px;flex:1 1 220px;justify-content:flex-end}
  .txt input{flex:1;min-width:0;max-width:220px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:0 12px;font:600 15px "IBM Plex Sans Arabic",sans-serif;outline:none}
  .txt input:focus{border-color:rgba(167,139,250,.6)}
  .txt button,.btn{height:42px;padding:0 16px;border-radius:12px;border:none;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;font-weight:700;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#ddd6fe}

  /* الأوامر */
  details.cmds{margin-top:22px;border-radius:16px;border:1px solid var(--line);background:var(--card-2)}
  details.cmds summary{cursor:pointer;padding:14px;font-weight:700;color:#ddd6fe;list-style:none;text-align:right}
  details.cmds summary::-webkit-details-marker{display:none}
  .cmd{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.04);font-size:13px}
  .cmd b{color:#c4b5fd;white-space:nowrap}
  .cmd span{color:var(--muted);text-align:left}

  .foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

  /* النافذة السفلية (اختيار لاعب/هدية، كتابة، تأكيد) */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,3,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:min(760px,100%);max-height:80vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#151021;border:1px solid rgba(167,139,250,.25);border-bottom:none}
  .sheet h3{margin:0 0 4px;font-size:17px;text-align:right}
  .sheet p{margin:0 0 12px;color:var(--muted);font-size:13px;text-align:right}
  .sheet .list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .sheet .list button{min-height:46px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:600;cursor:pointer;word-break:break-word}
  .sheet .row2{display:flex;gap:8px;margin-bottom:10px}
  .sheet .row2 input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:0 12px;font:600 15px "IBM Plex Sans Arabic",sans-serif;outline:none}

  /* الرسائل */
  .toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px));pointer-events:none}
  .toast{padding:12px 16px;border-radius:16px;background:rgba(21,16,33,.96);border:1px solid rgba(52,211,153,.45);font-weight:600;font-size:14px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .25s ease both}
  .toast.err{border-color:rgba(248,113,113,.5)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
  .center h2{margin:0;font:700 20px "Noto Kufi Arabic",sans-serif}
  .center p{margin:0;color:var(--muted);max-width:420px;line-height:1.8}
  .center a{color:#fff;text-decoration:none}
  .pick-streamer{display:grid;gap:10px;width:min(420px,100%)}
  .pick-streamer a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#a855f7;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="auth/auth-client.js"></script>
<script>window.AymanGamesPlatform = window.AymanGamesPlatform || {};</script>
<script src="js/agp-remote-games.js"></script>
<script src="js/agp-control-app.js"></script>
</body>
</html>
