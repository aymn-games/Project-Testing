<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0814">
<title>لوحة التحكم — ألعاب أيمن</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<!--
  «لوحة التحكم» — شاشة جوال/آيباد المتحكم (التحكم عن بعد).
  الستريمر يعطي يوزر تيك توك صلاحية من بروفايله، وصاحب الحساب الموثّق بنفس
  اليوزر يفتح هالصفحة من زر «لوحة التحكم» ببروفايله (control.html?s=<رقم الستريمر>).
  المنطق كله في js/agp-control-app.js، والاتصال عبر /ws/remote
  (backend/remote-control/remote-control-server.js).
-->
<style>
  :root{
    --bg:#07050d; --bg-2:#0d0918;
    --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.025); --hair:rgba(255,255,255,.075); --hair-2:rgba(255,255,255,.12);
    --text:#f6f4fb; --muted:#a39db4; --dim:#6e6880;
    --v1:#8b5cf6; --v2:#c084fc; --v3:#6d28d9;
    --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --r-lg:26px; --r-md:20px; --r-sm:14px;
    --shadow:0 18px 40px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:500 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 85% -10%,rgba(139,92,246,.28),transparent 60%),
      radial-gradient(90% 50% at -10% 105%,rgba(192,132,252,.14),transparent 60%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 40%);
    background-attachment:fixed}
  button{font:inherit;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:6px 16px 0}
  .fade{animation:fade .45s var(--ease) both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== الهيدر ===== */
  .top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(180deg,rgba(7,5,13,.92),rgba(7,5,13,.72));backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    border-bottom:1px solid var(--hair)}
  .top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .who{display:flex;align-items:center;gap:11px;min-width:0}
  .ava{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;
    background:linear-gradient(140deg,var(--v3),var(--v2));box-shadow:0 8px 20px -8px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.25)}
  .ava img{width:100%;height:100%;object-fit:cover}
  .who-t{min-width:0}
  .who-t small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;letter-spacing:.2px}
  .who-t b{display:block;font:700 15.5px "Noto Kufi Arabic",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;
    border:1px solid var(--hair);background:var(--glass);color:var(--muted)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .pill.on{color:#bff5df;border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.08)}
  .pill.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18),0 0 12px var(--ok);animation:pulse 2s ease-in-out infinite}
  .pill.off{color:#ffd0d8;border-color:rgba(251,113,133,.28);background:rgba(251,113,133,.07)}
  .pill.off i{background:var(--bad)}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(52,211,153,0),0 0 12px var(--ok)}}

  .banner{margin:14px 0 0;padding:13px 15px;border-radius:var(--r-md);font-size:13px;line-height:1.75;text-align:right;
    border:1px solid rgba(251,191,36,.22);background:linear-gradient(180deg,rgba(251,191,36,.09),rgba(251,191,36,.03));color:#fde9b0}

  /* ===== بطاقة اللعبة الحالية ===== */
  .hero{position:relative;margin-top:16px;padding:18px;border-radius:var(--r-lg);overflow:hidden;
    background:linear-gradient(150deg,hsla(var(--h),70%,55%,.30),hsla(var(--h),70%,40%,.08) 60%),var(--glass);
    border:1px solid hsla(var(--h),80%,70%,.25);box-shadow:var(--shadow)}
  .hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(closest-side,hsla(var(--h),90%,70%,.35),transparent);pointer-events:none}
  .hero-head{position:relative;display:flex;align-items:center;gap:13px}
  .tile{flex:none;width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:linear-gradient(145deg,hsl(var(--h),75%,62%),hsl(var(--h),70%,38%));box-shadow:0 10px 24px -10px hsla(var(--h),80%,55%,.9),inset 0 1px 0 rgba(255,255,255,.3)}
  .hero-t{min-width:0;flex:1}
  .hero-t b{display:block;font:700 19px/1.35 "Noto Kufi Arabic",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;margin-top:4px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:11.5px;color:#e9e3ff;font-weight:600}
  .status{position:relative;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);background:rgba(0,0,0,.22);border:1px solid var(--hair);
    color:#ddd8ea;font-size:13.5px;line-height:1.75;text-align:right}

  /* ===== عناوين الأقسام ===== */
  .h{margin:26px 4px 11px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;display:flex;align-items:center;justify-content:space-between;gap:10px;letter-spacing:.2px}
  .h small{font-weight:500;color:var(--dim)}

  /* ===== الأزرار ===== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .act{position:relative;min-height:70px;padding:13px 12px;border-radius:var(--r-md);border:1px solid var(--hair);cursor:pointer;
    background:linear-gradient(180deg,var(--glass),var(--glass-2));box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
    font-weight:700;font-size:14.5px;line-height:1.4;transition:transform .18s var(--ease),background .25s,border-color .25s}
  .act:active{transform:scale(.965)}
  .act .ai{font-size:18px;line-height:1;opacity:.95}
  .act small{font-weight:500;font-size:11.5px;color:var(--muted)}
  .act.primary{grid-column:1 / -1;min-height:62px;flex-direction:row;gap:10px;border:none;color:#fff;font-size:16px;
    background:linear-gradient(135deg,#7c3aed 0%,#a855f7 55%,#c084fc 100%);
    box-shadow:0 16px 34px -14px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.35)}
  .act.primary small{color:rgba(255,255,255,.82)}
  .act.primary::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 50%);pointer-events:none}
  .act.danger{color:#ffd3dc;border-color:rgba(251,113,133,.22);background:linear-gradient(180deg,rgba(251,113,133,.12),rgba(251,113,133,.04))}
  .act.screen{min-height:56px;font-size:13.5px;font-weight:600}

  /* ===== الإعدادات: العنوان يمين والعنصر يسار ===== */
  .card{border-radius:var(--r-lg);border:1px solid var(--hair);background:linear-gradient(180deg,var(--glass),var(--glass-2));box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;flex-wrap:wrap}
  .row + .row{border-top:1px solid rgba(255,255,255,.05)}
  .lbl{flex:1 1 130px;min-width:0;text-align:right}
  .lbl span{display:block;font-weight:600;font-size:14.5px}
  .lbl small{display:block;margin-top:2px;color:var(--dim);font-size:11.5px;line-height:1.6}
  .seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--hair);justify-content:flex-end}
  .opt{min-height:38px;padding:6px 15px;border-radius:12px;border:none;background:transparent;color:#bdb6cf;font-weight:600;font-size:13.5px;cursor:pointer;
    transition:background .25s var(--ease),color .2s,transform .15s}
  .opt:active{transform:scale(.95)}
  .opt.on{color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 6px 16px -6px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.25)}
  .opt.multi.on{background:rgba(139,92,246,.22);color:#ece4ff;box-shadow:inset 0 0 0 1px rgba(192,132,252,.5)}
  .tg{flex:none;width:58px;height:34px;border-radius:999px;border:none;position:relative;cursor:pointer;
    background:rgba(255,255,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);transition:background .3s var(--ease)}
  .tg::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,.35);transition:left .3s var(--ease)}
  .tg.on{background:linear-gradient(90deg,#7c3aed,#a855f7)}.tg.on::after{left:28px}
  .num{display:flex;align-items:center;gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--hair);direction:ltr}
  .num button{width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.07);font-size:20px;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
  .num button:active{transform:scale(.9);background:rgba(139,92,246,.35)}
  .num output{min-width:54px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .txt{display:flex;gap:6px;flex:1 1 230px;justify-content:flex-end}
  .txt input,.field{flex:1;min-width:0;max-width:240px;height:44px;border-radius:14px;border:1px solid var(--hair);background:rgba(0,0,0,.28);color:var(--text);
    padding:0 14px;font:600 15px "IBM Plex Sans Arabic",sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
  .txt input:focus,.field:focus{border-color:rgba(192,132,252,.6);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
  .btn{height:44px;padding:0 18px;border-radius:14px;border:none;cursor:pointer;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 10px 22px -12px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--glass);border:1px solid var(--hair-2);color:#e7e0fb;box-shadow:none}
  .btn.red{background:linear-gradient(135deg,#e11d48,#fb7185)}
  a.btn{display:inline-flex;align-items:center;text-decoration:none}

  /* ===== الألعاب: لعبتين بكل صف ===== */
  .grid.games{gap:12px}
  .game{position:relative;padding:16px 12px 14px;border-radius:var(--r-lg);border:1px solid var(--hair);cursor:pointer;
    background:linear-gradient(170deg,hsla(var(--h),70%,55%,.16),transparent 65%),linear-gradient(180deg,var(--glass),var(--glass-2));
    box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    transition:transform .2s var(--ease),border-color .25s}
  .game:active{transform:scale(.965)}
  .game .tile{width:62px;height:62px;border-radius:20px;font-size:31px}
  .game b{font-size:14.5px;line-height:1.4;font-weight:700}
  .game em{position:absolute;top:10px;left:10px;font-style:normal;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
  .game.cur{border-color:rgba(52,211,153,.45);box-shadow:0 0 0 1px rgba(52,211,153,.25),var(--shadow)}
  .game.cur em{background:rgba(52,211,153,.16);color:#a7f3d0}
  .game.soon{opacity:.42;cursor:default}
  .game.soon em{background:rgba(255,255,255,.08);color:var(--muted)}

  /* ===== أوامر الشات ===== */
  details.cmds{margin-top:26px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--glass-2)}
  details.cmds summary{cursor:pointer;padding:15px 16px;font-weight:700;font-size:13.5px;color:#e2d9ff;list-style:none;text-align:right;display:flex;justify-content:space-between}
  details.cmds summary::-webkit-details-marker{display:none}
  details.cmds summary::after{content:"⌄";color:var(--muted);transition:transform .25s}
  details.cmds[open] summary::after{transform:rotate(180deg)}
  .cmd{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid rgba(255,255,255,.04);font-size:12.5px}
  .cmd b{color:#d8c8ff;white-space:nowrap;font-weight:600}
  .cmd span{color:var(--muted);text-align:left}

  /* ===== الشريط السفلي ===== */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(7,5,13,.96),rgba(7,5,13,.8));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--hair)}
  .tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:5px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
  .tab{height:48px;border-radius:15px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .25s var(--ease),color .2s}
  .tab i{font-style:normal;font-size:17px;line-height:1.1}
  .tab.on{color:#fff;background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(168,85,247,.9));box-shadow:0 8px 18px -10px rgba(139,92,246,.9)}
  .tab:disabled{opacity:.35}

  /* ===== النافذة السفلية ===== */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(4,2,8,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .25s ease both}
  @keyframes fadeBg{from{opacity:0}to{opacity:1}}
  .sheet{width:min(720px,100%);max-height:82vh;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;
    background:linear-gradient(180deg,#1a1329,#110c1c);border:1px solid rgba(192,132,252,.2);border-bottom:none;box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:up .35s var(--ease) both}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font:700 17px "Noto Kufi Arabic",sans-serif;text-align:right}
  .sheet p{margin:0 0 14px;color:var(--muted);font-size:13px;text-align:right}
  .sheet .list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .sheet .list button{min-height:48px;padding:8px 10px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);font-weight:600;cursor:pointer;word-break:break-word;transition:transform .15s,background .2s}
  .sheet .list button:active{transform:scale(.96);background:rgba(139,92,246,.25)}
  .sheet .row2{display:flex;gap:8px;margin-bottom:10px}
  .sheet .field{max-width:none;height:48px}

  /* ===== الرسائل ===== */
  .toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(500px,calc(100% - 32px));pointer-events:none}
  .toast{padding:12px 16px;border-radius:16px;background:rgba(22,16,34,.94);backdrop-filter:blur(14px);border:1px solid rgba(52,211,153,.35);
    font-weight:600;font-size:13.5px;text-align:center;box-shadow:0 16px 36px rgba(0,0,0,.55);animation:tin .35s var(--ease) both}
  .toast.err{border-color:rgba(251,113,133,.45)}
  @keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
  .center .big{font-size:44px}
  .center h2{margin:0;font:700 20px "Noto Kufi Arabic",sans-serif}
  .center p{margin:0;color:var(--muted);max-width:400px;line-height:1.85}
  .pick-streamer{display:grid;gap:10px;width:min(420px,100%)}
  .pick-streamer a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--hair);background:var(--glass);color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--v2);animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="auth/auth-client.js"></script>
<script>window.AymanGamesPlatform = window.AymanGamesPlatform || {};</script>
<script src="js/agp-remote-games.js"></script>
<script src="js/agp-control-app.js"></script>
</body>
</html>
